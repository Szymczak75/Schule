<style>
  :root{
    --ink:#22303f;
    --card:#ffffff;
    --green:#1e7d32;
    --red:#c1272d;
    --amber:#b8860b;
    --amber-light:#fdf3d9;
    --amber-dark:#96690a;
    --blue:#2f5fa6;
    --blue-dark:#1f4680;
    --blue-light:#e6eefb;
    --bg:#f6f8fb;
    --line:#dbe3ee;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Segoe UI',Verdana,'Helvetica Neue',sans-serif;
    font-size:1rem;line-height:1.5;padding-bottom:5rem;
  }
  header{
    background:linear-gradient(135deg,var(--blue),var(--blue-dark));
    color:#fff;padding:1.3rem 1.2rem;box-shadow:0 3px 10px rgba(0,0,0,.12);
  }
  header .typ{
    display:inline-block;background:rgba(255,255,255,.25);padding:.2rem .7rem;
    border-radius:1rem;font-size:.85rem;font-weight:700;letter-spacing:.04em;margin-bottom:.5rem;
  }
  header h1{margin:0;font-size:1.55rem;line-height:1.2;}
  header p{margin:.4rem 0 0;font-size:1rem;opacity:.95;}

  .tabs{display:flex;flex-wrap:wrap;gap:.5rem;padding:1rem 1rem 0;max-width:1024px;margin:0 auto;}
  .tab{
    flex:1 1 auto;min-width:7rem;min-height:44px;border:2px solid var(--line);
    background:#fff;color:var(--ink);font-size:.98rem;font-weight:600;
    border-radius:.7rem .7rem 0 0;padding:.6rem .5rem;cursor:pointer;
    transition:background .15s,border-color .15s,transform .05s;
  }
  .tab:active{transform:scale(.97);}
  .tab.aktiv{background:var(--blue);color:#fff;border-color:var(--blue-dark);}
  .tab .done{margin-left:.3rem;color:#fff;}

  main{max-width:1024px;margin:0 auto;padding:0 1rem;}
  .karte{
    display:none;background:var(--card);border:2px solid var(--line);
    border-radius:0 .9rem .9rem .9rem;padding:1.3rem 1.2rem;margin-top:-2px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);animation:einblenden .25s ease;
  }
  .karte.aktiv{display:block;}
  @keyframes einblenden{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .karte h2{margin-top:0;font-size:1.3rem;color:var(--blue-dark);}
  p{margin:.7rem 0;}
  .frage{font-weight:700;margin:1rem 0 .6rem;}

  .wdh-badge{
    display:inline-block;background:var(--amber-light);color:var(--amber-dark);
    border:1px solid var(--amber-dark);border-radius:1rem;padding:.15rem .7rem;
    font-size:.8rem;font-weight:700;margin-bottom:.4rem;
  }

  /* Niveaustufen */
  .stufen{display:flex;flex-wrap:wrap;gap:.5rem;margin:.2rem 0 1rem;}
  .stufe-btn{
    flex:1 1 auto;min-width:8rem;min-height:44px;border:2px solid var(--blue);
    background:#fff;color:var(--blue-dark);font-weight:700;font-size:.95rem;
    border-radius:.6rem;cursor:pointer;transition:transform .05s;
  }
  .stufe-btn:active{transform:scale(.97);}
  .stufe-btn.aktiv{background:var(--blue);color:#fff;}

  /* Hinweisbox */
  .hinweis{background:var(--blue-light);border-left:5px solid var(--blue);padding:.7rem .9rem;border-radius:.4rem;margin:1rem 0;}

  /* Buttons */
  button{font-family:inherit;}
  .btn{min-height:44px;border:none;border-radius:.6rem;padding:.6rem 1.1rem;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .05s,filter .15s;}
  .btn:active{transform:scale(.97);}
  .btn-blau{background:var(--blue);color:#fff;}
  .btn-grau{background:#eef1f6;color:var(--ink);border:1px solid var(--line);}
  .btn-leeren{background:#fff;color:var(--red);border:2px solid var(--red);}
  .btnzeile{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.7rem;}

  /* Eingaben */
  .aufg{border:1px solid var(--line);border-radius:.7rem;padding:1rem;margin:1rem 0;background:#fff;}
  .aufg .nr{font-weight:700;color:var(--blue-dark);}
  input[type=text]{
    font-size:1.05rem;padding:.5rem .6rem;border:2px solid var(--line);border-radius:.5rem;
    min-height:44px;width:6rem;max-width:100%;
  }
  input:focus{outline:none;border-color:var(--blue);}
  select{font-size:1.05rem;min-height:44px;padding:.4rem;border:2px solid var(--line);border-radius:.5rem;}

  /* MC / Wahr-Falsch / Auswahl-Buttons */
  .optionen{display:flex;flex-direction:column;gap:.5rem;margin:.6rem 0;}
  .opt{
    min-height:44px;border:2px solid var(--line);background:#fff;border-radius:.6rem;
    padding:.6rem .8rem;text-align:left;font-size:1rem;cursor:pointer;color:var(--ink);
    transition:transform .05s,border-color .15s,background .15s;
  }
  .opt:active{transform:scale(.99);}
  .opt.gewaehlt{border-color:var(--blue);background:var(--blue-light);}
  .opt.correct{border-color:var(--green);background:var(--green);color:#fff;}
  .opt.wrong{border-color:var(--red);background:var(--red);color:#fff;}
  .opt.loesung{border-color:var(--green);background:#eaf6ec;color:var(--green);font-weight:700;}
  .opt[disabled]{cursor:default;}

  /* Zuordnung: Chips + Ziele */
  .vorrat{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0;}
  .chip{
    min-height:44px;border:2px solid var(--blue);background:#fff;color:var(--blue-dark);
    border-radius:.6rem;padding:.5rem .8rem;font-weight:700;cursor:pointer;font-size:1rem;
    display:inline-flex;align-items:center;transition:transform .05s;
  }
  .chip:active{transform:scale(.97);}
  .chip.markiert{background:var(--blue);color:#fff;}
  .chip.platziert{opacity:.35;pointer-events:none;}
  .ziele{display:flex;flex-direction:column;gap:.6rem;margin:.8rem 0;}
  .ziel{
    border:2px dashed var(--blue);border-radius:.6rem;padding:.6rem .8rem;min-height:52px;
    background:#fbfdff;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;
  }
  .ziel .zlabel{font-weight:700;color:var(--blue-dark);margin-right:.4rem;}
  .ziel .gelegt{
    background:var(--blue-light);border:1px solid var(--blue);border-radius:.5rem;
    padding:.35rem .6rem;font-weight:700;cursor:pointer;
  }
  .ziel.gesperrt{border-style:solid;cursor:default;background:#f4f6fa;}
  .ziel.gesperrt .gelegt{cursor:default;}
  .gelegt.correct{background:var(--green);color:#fff;border-color:var(--green);}
  .gelegt.wrong{background:var(--red);color:#fff;border-color:var(--red);}
  .ziel .richtighint{width:100%;font-size:.9rem;color:var(--green);font-weight:700;}

  /* Feedback */
  .fb{margin-top:.7rem;padding:.7rem .9rem;border-radius:.5rem;font-weight:700;display:none;}
  .fb.show{display:block;}
  .fb.ok{background:var(--green);color:#fff;}
  .fb.no{background:var(--red);color:#fff;}

  details.tipp,details.mlsg{
    background:var(--amber-light);border:1px solid var(--amber-dark);
    border-radius:.5rem;padding:.2rem .3rem;margin:.7rem 0;
  }
  details.tipp summary,details.mlsg summary{
    min-height:44px;display:flex;align-items:center;gap:.5rem;padding:.6rem .7rem;
    cursor:pointer;font-weight:700;color:var(--amber-dark);list-style:none;
  }
  details summary::-webkit-details-marker{display:none;}
  details.tipp summary::before{content:"💡";}
  details.mlsg summary::before{content:"📝";}
  details .inhalt{padding:.2rem .8rem .8rem;}

  .zahl{font-weight:700;}
  .neg{color:var(--blue-dark);}
  .pos{color:var(--amber-dark);}

  /* Auswertung */
  .ergrow{display:flex;justify-content:space-between;padding:.5rem .2rem;border-bottom:1px solid var(--line);}
  .ergrow .gut{color:var(--green);font-weight:700;}
  .ergrow .schlecht{color:var(--red);font-weight:700;}
  .score{font-size:1.4rem;font-weight:800;text-align:center;margin:1rem 0;}

  .rex{position:fixed;right:.8rem;bottom:.8rem;font-size:1.6rem;cursor:pointer;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));z-index:50;}
  .rex span{position:absolute;right:2rem;bottom:.2rem;white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:.5rem;padding:.2rem .5rem;font-size:.8rem;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .15s;}
  .rex:hover span,.rex.zeig span{opacity:1;}

  .stufe-inhalt{display:none;}
  .stufe-inhalt.aktiv{display:block;}

  /* Zahlengerade in Übung */
  .zg-wrap{border:1px solid var(--line);border-radius:.7rem;background:#fff;padding:.7rem .5rem;margin:.6rem 0;}
  .zg-wrap svg.zahlengerade-svg{display:block;width:100%;height:auto;touch-action:none;overscroll-behavior:contain;}
  /* MathJax-SVGs im Hinweis nie aufblasen */
  .zg-wrap mjx-container{max-width:100%;}
  .zg-wrap mjx-container svg{width:auto !important;height:auto !important;display:inline;}
  .zg-info{text-align:center;font-weight:700;margin-top:.3rem;color:var(--blue-dark);min-height:1.3rem;}
  /* Zeichen-Buttons < = > */
  .zeichenreihe{display:flex;gap:.5rem;justify-content:center;margin:.6rem 0;}
  .zbtn{
    flex:1 1 4rem;min-height:52px;font-size:1.4rem;font-weight:800;
    border:2px solid var(--blue);background:#fff;color:var(--blue-dark);border-radius:.6rem;cursor:pointer;
    transition:transform .05s;
  }
  .zbtn:active{transform:scale(.96);}
  .zbtn.gewaehlt{background:var(--blue);color:#fff;}
  .zbtn.correct{background:var(--green);border-color:var(--green);color:#fff;}
  .zbtn.wrong{background:var(--red);border-color:var(--red);color:#fff;}
  .zbtn[disabled]{cursor:default;}
  .vergleichszeile{display:flex;align-items:center;justify-content:center;gap:1rem;font-size:1.3rem;font-weight:700;margin:.5rem 0;}
</style>

<header>
  <span class="typ">✏️ Übung · Doppelstunde 3</span>
  <h1>Betrag &amp; Gegenzahl</h1>
  <p>Gegenzahl finden, Betrag bestimmen, sicher vergleichen. Sofort-Rückmeldung nach dem Prüfen.</p>

<nav class="tabs" id="tabs"></nav>
<main id="main"></main>

<div class="rex" onclick="this.classList.toggle('zeig')">🦖<span>Made by ASzym</span></div>

<script>
/* ============================================================
   Aufgaben-Daten. Jede Themenkarte hat drei Stufen mit
   inhaltlich unterschiedlichen Aufgaben.
   ============================================================ */

const KARTEN = [
  {
    id:'k1', titel:'1 · Gegenzahl finden', wdh:false,
    stufen:{
      grund:{ typ:'zuordnung',
        frage:'Ordne jeder Zahl ihre <b>Gegenzahl</b> zu (gleiche Zahl, anderes Vorzeichen).',
        chips:[{id:'a',t:'\\(-6\\)'},{id:'b',t:'\\(+2\\)'},{id:'c',t:'\\(-9\\)'}],
        ziele:[
          {id:'z1',label:'Gegenzahl von \\(+6\\)',correct:'a'},
          {id:'z2',label:'Gegenzahl von \\(-2\\)',correct:'b'},
          {id:'z3',label:'Gegenzahl von \\(+9\\)',correct:'c'}
        ]},
      fort:{ typ:'zuordnung',
        frage:'Ordne jeder Zahl ihre Gegenzahl zu.',
        chips:[{id:'a',t:'\\(+7\\)'},{id:'b',t:'\\(-1{,}5\\)'},{id:'c',t:'\\(+4\\)'},{id:'d',t:'\\(0\\)'}],
        ziele:[
          {id:'z1',label:'Gegenzahl von \\(-7\\)',correct:'a'},
          {id:'z2',label:'Gegenzahl von \\(+1{,}5\\)',correct:'b'},
          {id:'z3',label:'Gegenzahl von \\(-4\\)',correct:'c'},
          {id:'z4',label:'Gegenzahl von \\(0\\)',correct:'d'}
        ]},
      profi:{ typ:'mc',
        frage:'Welche Aussage über Gegenzahlen ist <b>richtig</b>?',
        optionen:[
          {t:'Eine Zahl und ihre Gegenzahl liegen gleich weit von der 0 entfernt.',ok:true},
          {t:'Die Gegenzahl ist immer negativ.',ok:false},
          {t:'Die Gegenzahl von \\(0\\) ist \\(1\\).',ok:false}
        ]}
    }
  },
  {
    id:'k2', titel:'2 · Betrag bestimmen', wdh:false,
    stufen:{
      grund:{ typ:'zuordnung',
        frage:'Der <b>Betrag</b> ist der Abstand von der 0. Ordne jeder Zahl ihren Betrag zu.',
        chips:[{id:'a',t:'\\(3\\)'},{id:'b',t:'\\(5\\)'},{id:'c',t:'\\(1\\)'}],
        ziele:[
          {id:'z1',label:'\\(|-3|\\)',correct:'a'},
          {id:'z2',label:'\\(|+5|\\)',correct:'b'},
          {id:'z3',label:'\\(|-1|\\)',correct:'c'}
        ]},
      fort:{ typ:'zeichen',
        frage:'Vergleiche die <b>Beträge</b>. Setze \\(<\\), \\(=\\) oder \\(>\\).',
        paare:[
          {l:'\\(|-4|\\)',r:'\\(|+2|\\)',a:'>'},
          {l:'\\(|-3|\\)',r:'\\(|+3|\\)',a:'='},
          {l:'\\(|+1|\\)',r:'\\(|-6|\\)',a:'<'},
          {l:'\\(|-5|\\)',r:'\\(|-2|\\)',a:'>'}
        ]},
      profi:{ typ:'mehr',
        frage:'Welche Aussagen stimmen?',
        optionen:[
          {t:'\\(|-8| = 8\\)',ok:true},
          {t:'Ein Betrag kann negativ sein.',ok:false},
          {t:'\\(|+8| = |-8|\\)',ok:true},
          {t:'\\(|0| = 0\\)',ok:true},
          {t:'\\(|-2| = -2\\)',ok:false}
        ]}
    }
  },
  {
    id:'k3', titel:'3 · Betrag & Vergleichen', wdh:false,
    stufen:{
      grund:{ typ:'wf',
        frage:'Bei negativen Zahlen gilt: großer Betrag = kleine Zahl. Stimmt die Aussage?',
        items:[
          {text:'\\(-5\\) ist kleiner als \\(-2\\).', a:'plus'},
          {text:'\\(-1\\) ist kleiner als \\(-4\\).', a:'minus'},
          {text:'\\(-9\\) liegt weiter links als \\(-3\\).', a:'plus'}
        ], links:'falsch', rechts:'richtig'},
      fort:{ typ:'ordnen',
        frage:'Ordne von klein nach groß (Platz 1 = kleinste). Denk an „weiter links = kleiner".',
        zahlen:[{id:'a',t:'\\(-5\\)',v:-5},{id:'b',t:'\\(-1\\)',v:-1},{id:'c',t:'\\(-8\\)',v:-8},{id:'d',t:'\\(0\\)',v:0}] },
      profi:{ typ:'zeichen',
        frage:'Vergleiche die <b>Zahlen</b> (nicht die Beträge!). Setze das Zeichen.',
        paare:[
          {l:'\\(-6\\)',r:'\\(-3\\)',a:'<'},
          {l:'\\(-2\\)',r:'\\(-2{,}5\\)',a:'>'},
          {l:'\\(-4\\)',r:'\\(4\\)',a:'<'},
          {l:'\\(-1{,}5\\)',r:'\\(-1{,}5\\)',a:'='}
        ]}
    }
  },
  {
    id:'wdh', titel:'4 · 🔁 Wiederholung', wdh:true,
    stufen:{
      grund:{ typ:'zeichen',
        frage:'<b>Aus Doppelstunde 2:</b> Setze das richtige Zeichen zwischen die Zahlen.',
        paare:[
          {l:'\\(-3\\)',r:'\\(1\\)',a:'<'},
          {l:'\\(0\\)',r:'\\(-5\\)',a:'>'},
          {l:'\\(-2\\)',r:'\\(-2\\)',a:'='}
        ]},
      fort:{ typ:'zahlengerade',
        frage:'<b>Aus Doppelstunde 2:</b> Setze den Punkt auf die genannte Zahl.',
        items:[
          {ziel:-2, text:'Setze den Punkt auf \\(-2\\).'},
          {ziel:1.5, text:'Setze den Punkt auf \\(1{,}5\\).'}
        ], min:-4, max:4 },
      profi:{ typ:'ordnen',
        frage:'<b>Aus Doppelstunde 2:</b> Ordne von klein nach groß.',
        zahlen:[{id:'a',t:'\\(-2{,}5\\)',v:-2.5},{id:'b',t:'\\(1\\)',v:1},{id:'c',t:'\\(-0{,}5\\)',v:-0.5},{id:'d',t:'\\(-3\\)',v:-3}] }
    }
  }
];

/* ============================================================
   Zustand: state[kartenId][stufe] = {…}
   ============================================================ */
const STUFEN=['grund','fort','profi'];
const STUFEN_LABEL={grund:'Grundlagen',fort:'Fortgeschritten',profi:'Profi'};
let aktuelleStufe='grund';
const state={};
KARTEN.forEach(k=>{ state[k.id]={}; STUFEN.forEach(s=>state[k.id][s]={init:false,geprueft:false,richtig:false,data:{}}); });

// Fisher-Yates einmalig pro Karte×Stufe für Optionsreihenfolge
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

const main=document.getElementById('main');
const tabs=document.getElementById('tabs');

// Tabs
KARTEN.forEach((k,i)=>{
  const b=document.createElement('button');
  b.className='tab'+(i===0?' aktiv':'');
  b.id='tab_'+k.id;
  b.innerHTML=k.titel+'<span class="done" id="done_'+k.id+'"></span>';
  b.onclick=()=>zeigeKarte(i);
  tabs.appendChild(b);
});
// Auswertungstab
const bA=document.createElement('button');
bA.className='tab'; bA.id='tab_erg'; bA.textContent='★ Auswertung';
bA.onclick=()=>{ renderAuswertung(); zeigeKarte(KARTEN.length); };
tabs.appendChild(bA);

// Karten-Container bauen
KARTEN.forEach((k,i)=>{
  const sec=document.createElement('section');
  sec.className='karte'+(i===0?' aktiv':'');
  sec.id='karte_'+k.id;
  main.appendChild(sec);
});
const secErg=document.createElement('section');
secErg.className='karte'; secErg.id='karte_erg';
main.appendChild(secErg);

function zeigeKarte(i){
  const alle=[...document.querySelectorAll('.karte')];
  alle.forEach((c,j)=>c.classList.toggle('aktiv',i===j));
  [...tabs.children].forEach((t,j)=>t.classList.toggle('aktiv',i===j));
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- Rendering einer Themenkarte (mit Stufen) ---------- */
function renderKarte(k){
  const sec=document.getElementById('karte_'+k.id);
  let html='';
  if(k.wdh) html+='<span class="wdh-badge">🔁 Wiederholung – früheres Thema</span>';
  html+='<h2>'+k.titel.replace(/^\d+ · /,'')+'</h2>';
  if(k.einstufig){
    // nur eine Ausführung, kein Stufenumschalter
    html+='<div class="stufe-inhalt aktiv" id="si_'+k.id+'_grund"></div>';
  } else {
    // Stufenumschalter
    html+='<div class="stufen">';
    STUFEN.forEach(s=>{
      if(k.stufen[s]) html+='<button class="stufe-btn'+(s===aktuelleStufe?' aktiv':'')+'" data-k="'+k.id+'" data-s="'+s+'">'+STUFEN_LABEL[s]+'</button>';
    });
    html+='</div>';
    // Stufeninhalte
    STUFEN.forEach(s=>{
      if(!k.stufen[s])return;
      html+='<div class="stufe-inhalt'+(s===aktuelleStufe?' aktiv':'')+'" id="si_'+k.id+'_'+s+'"></div>';
    });
  }
  sec.innerHTML=html;
  sec.querySelectorAll('.stufe-btn').forEach(b=>{
    b.onclick=()=>wechsleStufe(b.dataset.s);
  });
  if(k.einstufig){ renderStufe(k,'grund'); }
  else { STUFEN.forEach(s=>{ if(k.stufen[s]) renderStufe(k,s); }); }
}

function wechsleStufe(s){
  aktuelleStufe=s;
  KARTEN.forEach(k=>{
    if(k.einstufig) return; // einstufige Karten nicht umschalten
    const sec=document.getElementById('karte_'+k.id);
    sec.querySelectorAll('.stufe-btn').forEach(b=>b.classList.toggle('aktiv',b.dataset.s===s));
    sec.querySelectorAll('.stufe-inhalt').forEach(si=>si.classList.toggle('aktiv',si.id==='si_'+k.id+'_'+s));
  });
}

/* ---------- Stufeninhalt rendern (aus Zustand!) ---------- */
function renderStufe(k,s){
  const cont=document.getElementById('si_'+k.id+'_'+s);
  const cfg=k.stufen[s];
  const st=state[k.id][s];
  if(!st.init){ initStufe(k,s); }
  if(cfg.typ==='wf'){ renderWF(k,s,cont,cfg,st); }
  else if(cfg.typ==='mc'){ renderMC(k,s,cont,cfg,st,false); }
  else if(cfg.typ==='mehr'){ renderMC(k,s,cont,cfg,st,true); }
  else if(cfg.typ==='zuordnung'){ renderZuordnung(k,s,cont,cfg,st); }
  else if(cfg.typ==='zeichen'){ renderZeichen(k,s,cont,cfg,st); }
  else if(cfg.typ==='ordnen'){ renderOrdnen(k,s,cont,cfg,st); }
  else if(cfg.typ==='zahlengerade'){ renderZG(k,s,cont,cfg,st); }
  if(window.MathJax&&MathJax.typesetPromise) MathJax.typesetPromise([cont]);
}

function initStufe(k,s){
  const cfg=k.stufen[s]; const st=state[k.id][s];
  if(cfg.typ==='wf'){ st.data.antworten=cfg.items.map(()=>null); }
  else if(cfg.typ==='mc'){ st.data.wahl=null; st.data.order=shuffle(cfg.optionen.map((_,i)=>i)); }
  else if(cfg.typ==='mehr'){ st.data.wahl=new Set(); st.data.order=shuffle(cfg.optionen.map((_,i)=>i)); }
  else if(cfg.typ==='zuordnung'){ st.data.zuord={}; st.data.markiert=null; cfg.ziele.forEach(z=>st.data.zuord[z.id]=null); }
  else if(cfg.typ==='zeichen'){ st.data.antworten=cfg.paare.map(()=>null); }
  else if(cfg.typ==='ordnen'){
    st.data.plaetze={}; st.data.markiert=null;
    const n=cfg.zahlen.length; for(let i=1;i<=n;i++) st.data.plaetze['p'+i]=null;
    st.data.reihenfolge=shuffle(cfg.zahlen.map(z=>z.id)); // Vorrat-Reihenfolge zufällig
  }
  else if(cfg.typ==='zahlengerade'){ st.data.werte=cfg.items.map(()=>null); }
  st.init=true;
}

/* ---------- Wahr/Falsch bzw. Zwei-/Dreirichtung ---------- */
function renderWF(k,s,cont,cfg,st){
  let h='<p class="frage">'+cfg.frage+'</p>';
  cfg.items.forEach((it,idx)=>{
    h+='<div class="aufg" style="padding:.7rem .8rem">';
    h+='<div>'+it.text+'</div>';
    h+='<div class="optionen" style="flex-direction:row;flex-wrap:wrap;margin-top:.5rem">';
    const opts = cfg.drei ? [['minus',cfg.links],['null',cfg.mitte],['plus',cfg.rechts]] : [['minus',cfg.links],['plus',cfg.rechts]];
    opts.forEach(([val,lab])=>{
      const sel=st.data.antworten[idx]===val?' gewaehlt':'';
      let cls='opt'+sel;
      if(st.geprueft){
        if(val===it.a) cls='opt correct';
        else if(st.data.antworten[idx]===val) cls='opt wrong';
      }
      h+='<button class="'+cls+'" style="flex:1;min-width:6rem" '+(st.geprueft?'disabled':'')+' data-idx="'+idx+'" data-val="'+val+'">'+lab+'</button>';
    });
    h+='</div></div>';
  });
  h+=fbUndButtons(k,s,st);
  cont.innerHTML=h;
  if(!st.geprueft){
    cont.querySelectorAll('.opt').forEach(b=>{
      b.onclick=()=>{ st.data.antworten[+b.dataset.idx]=b.dataset.val; renderStufe(k,s); };
    });
  }
  bindButtons(k,s,cont,st,()=>{
    // Prüfen
    let alle=true,ok=true;
    cfg.items.forEach((it,idx)=>{ if(st.data.antworten[idx]===null)alle=false; if(st.data.antworten[idx]!==it.a)ok=false;});
    if(!alle){ return {leer:true}; }
    return {richtig:ok};
  });
}

/* ---------- MC / Mehrfachauswahl ---------- */
function renderMC(k,s,cont,cfg,st,mehr){
  let h='<p class="frage">'+cfg.frage+'</p><div class="optionen">';
  st.data.order.forEach(oi=>{
    const o=cfg.optionen[oi];
    let cls='opt';
    const gewaehlt = mehr ? st.data.wahl.has(oi) : st.data.wahl===oi;
    if(!st.geprueft){ if(gewaehlt)cls+=' gewaehlt'; }
    else{
      if(o.ok) cls+=' correct';
      else if(gewaehlt) cls+=' wrong';
    }
    h+='<button class="'+cls+'" '+(st.geprueft?'disabled':'')+' data-oi="'+oi+'">'+o.t+'</button>';
  });
  h+='</div>';
  h+=fbUndButtons(k,s,st);
  cont.innerHTML=h;
  if(!st.geprueft){
    cont.querySelectorAll('.opt').forEach(b=>{
      b.onclick=()=>{
        const oi=+b.dataset.oi;
        if(mehr){ st.data.wahl.has(oi)?st.data.wahl.delete(oi):st.data.wahl.add(oi); }
        else { st.data.wahl=oi; }
        renderStufe(k,s);
      };
    });
  }
  bindButtons(k,s,cont,st,()=>{
    if(mehr){
      if(st.data.wahl.size===0) return {leer:true};
      let ok=true;
      cfg.optionen.forEach((o,i)=>{ if(o.ok!==st.data.wahl.has(i))ok=false; });
      return {richtig:ok};
    } else {
      if(st.data.wahl===null) return {leer:true};
      return {richtig:cfg.optionen[st.data.wahl].ok};
    }
  });
}

/* ---------- Zuordnung (Antippen, bleibt sichtbar) ---------- */
function renderZuordnung(k,s,cont,cfg,st){
  let h='<p class="frage">'+cfg.frage+'</p>';
  // Vorrat
  h+='<div class="vorrat">';
  cfg.chips.forEach(c=>{
    const platziert=Object.values(st.data.zuord).includes(c.id);
    let cls='chip'+(platziert?' platziert':'')+(st.data.markiert===c.id?' markiert':'');
    h+='<button class="'+cls+'" '+(st.geprueft?'disabled':'')+' data-chip="'+c.id+'">'+c.t+'</button>';
  });
  h+='</div>';
  // Ziele
  h+='<div class="ziele">';
  cfg.ziele.forEach(z=>{
    const gelegt=st.data.zuord[z.id];
    let zcls='ziel'+(st.geprueft?' gesperrt':'');
    h+='<div class="'+zcls+'" data-ziel="'+z.id+'"><span class="zlabel">'+z.label+'</span>';
    if(gelegt){
      const chip=cfg.chips.find(c=>c.id===gelegt);
      let gcls='gelegt';
      if(st.geprueft){ gcls+=(gelegt===z.correct?' correct':' wrong'); }
      h+='<span class="'+gcls+'" data-loesen="'+z.id+'">'+chip.t+'</span>';
      if(st.geprueft && gelegt!==z.correct){
        const richtig=cfg.chips.find(c=>c.id===z.correct);
        h+='<span class="richtighint">richtig wäre: '+richtig.t+'</span>';
      }
    }
    h+='</div>';
  });
  h+='</div>';
  h+=fbUndButtons(k,s,st);
  cont.innerHTML=h;

  if(!st.geprueft){
    cont.querySelectorAll('.chip:not(.platziert)').forEach(b=>{
      b.onclick=()=>{ st.data.markiert = st.data.markiert===b.dataset.chip?null:b.dataset.chip; renderStufe(k,s); };
    });
    cont.querySelectorAll('.ziel').forEach(z=>{
      z.onclick=(e)=>{
        if(e.target.dataset.loesen){ // gelegtes Element zurückholen
          st.data.zuord[e.target.dataset.loesen]=null; renderStufe(k,s); return;
        }
        if(st.data.markiert){
          // markierten Chip evtl. aus altem Ziel entfernen
          for(const zid in st.data.zuord){ if(st.data.zuord[zid]===st.data.markiert) st.data.zuord[zid]=null; }
          st.data.zuord[z.dataset.ziel]=st.data.markiert;
          st.data.markiert=null; renderStufe(k,s);
        }
      };
    });
  }
  bindButtons(k,s,cont,st,()=>{
    const alle=cfg.ziele.every(z=>st.data.zuord[z.id]!==null);
    if(!alle) return {leer:true};
    const ok=cfg.ziele.every(z=>st.data.zuord[z.id]===z.correct);
    return {richtig:ok};
  });
}

  });

/* ---------- Ordnen (klein → groß) über Positionsplätze ---------- */
function renderOrdnen(k,s,cont,cfg,st){
  const n=cfg.zahlen.length;
  let h='<p class="frage">'+cfg.frage+'</p>';
  // Vorrat
  h+='<div class="vorrat">';
  st.data.reihenfolge.forEach(zid=>{
    const z=cfg.zahlen.find(x=>x.id===zid);
    const platziert=Object.values(st.data.plaetze).includes(zid);
    let cls='chip'+(platziert?' platziert':'')+(st.data.markiert===zid?' markiert':'');
    h+='<button class="'+cls+'" '+(st.geprueft?'disabled':'')+' data-chip="'+zid+'">'+z.t+'</button>';
  });
  h+='</div>';
  // Plätze
  h+='<div class="ziele">';
  const soll=[...cfg.zahlen].sort((a,b)=>a.v-b.v).map(z=>z.id); // korrekte Reihenfolge
  for(let i=1;i<=n;i++){
    const pid='p'+i;
    const gelegt=st.data.plaetze[pid];
    let zcls='ziel'+(st.geprueft?' gesperrt':'');
    const label = i===1?'Platz 1 (kleinste)':(i===n?'Platz '+i+' (größte)':'Platz '+i);
    h+='<div class="'+zcls+'" data-ziel="'+pid+'"><span class="zlabel">'+label+'</span>';
    if(gelegt){
      const z=cfg.zahlen.find(x=>x.id===gelegt);
      let gcls='gelegt';
      if(st.geprueft){ gcls+=(soll[i-1]===gelegt?' correct':' wrong'); }
      h+='<span class="'+gcls+'" data-loesen="'+pid+'">'+z.t+'</span>';
      if(st.geprueft && soll[i-1]!==gelegt){
        const rz=cfg.zahlen.find(x=>x.id===soll[i-1]);
        h+='<span class="richtighint">hier gehört: '+rz.t+'</span>';
      }
    }
    h+='</div>';
  }
  h+='</div>';
  h+=fbUndButtons(k,s,st);
  cont.innerHTML=h;
  if(!st.geprueft){
    cont.querySelectorAll('.chip:not(.platziert)').forEach(b=>{
      b.onclick=()=>{ st.data.markiert=st.data.markiert===b.dataset.chip?null:b.dataset.chip; renderStufe(k,s); };
    });
    cont.querySelectorAll('.ziel').forEach(z=>{
      z.onclick=(e)=>{
        if(e.target.dataset.loesen){ st.data.plaetze[e.target.dataset.loesen]=null; renderStufe(k,s); return; }
        if(st.data.markiert){
          for(const pid in st.data.plaetze){ if(st.data.plaetze[pid]===st.data.markiert) st.data.plaetze[pid]=null; }
          st.data.plaetze[z.dataset.ziel]=st.data.markiert; st.data.markiert=null; renderStufe(k,s);
        }
      };
    });
  }
  bindButtons(k,s,cont,st,()=>{
    const alle=Object.values(st.data.plaetze).every(v=>v!==null);
    if(!alle) return {leer:true};
    const ok=soll.every((zid,i)=>st.data.plaetze['p'+(i+1)]===zid);
    return {richtig:ok};
  });
}

/* ---------- Zahlengerade: Punkt auf Zielwert setzen ---------- */
function renderZG(k,s,cont,cfg,st){
  let h='<p class="frage">'+cfg.frage+'</p>';
  cfg.items.forEach((it,idx)=>{
    h+='<div class="aufg" style="padding:.8rem .8rem">';
    h+='<div>'+it.text+'</div>';
    h+='<div class="zg-wrap" id="zgw_'+k.id+'_'+s+'_'+idx+'"></div>';
    h+='<div class="zg-info" id="zgi_'+k.id+'_'+s+'_'+idx+'"></div>';
    h+='</div>';
  });
  h+=fbUndButtons(k,s,st);
  cont.innerHTML=h;
  // Zahlengeraden montieren
  cfg.items.forEach((it,idx)=>{
    const wrap=cont.querySelector('#zgw_'+k.id+'_'+s+'_'+idx);
    const info=cont.querySelector('#zgi_'+k.id+'_'+s+'_'+idx);
    const startWert = st.data.werte[idx]!==null ? st.data.werte[idx] : 0;
    const ctrl=zahlengeradeUE(wrap,{
      min:cfg.min,max:cfg.max,interaktiv:!st.geprueft,start:startWert,
      geprueftWert: st.geprueft?st.data.werte[idx]:null,
      zielWert: st.geprueft?it.ziel:null,
      onChange:(v)=>{ st.data.werte[idx]=v; info.innerHTML='Punkt bei <b>'+fmtZ(v)+'</b>'; }
    });
    if(st.data.werte[idx]!==null){ info.innerHTML='Punkt bei <b>'+fmtZ(st.data.werte[idx])+'</b>'; }
    if(st.geprueft){
      const ok=Math.abs(st.data.werte[idx]-it.ziel)<1e-9;
      info.innerHTML = (st.data.werte[idx]===null?'kein Punkt gesetzt':'Dein Punkt: <b>'+fmtZ(st.data.werte[idx])+'</b>')+
        ' · '+(ok?'<span style="color:var(--green)">✅ richtig</span>':'<span style="color:var(--red)">❌ Ziel war '+fmtZ(it.ziel)+'</span>');
    }
  });
  bindButtons(k,s,cont,st,()=>{
    const alle=st.data.werte.every(v=>v!==null);
    if(!alle) return {leer:true};
    const ok=cfg.items.every((it,idx)=>Math.abs(st.data.werte[idx]-it.ziel)<1e-9);
    return {richtig:ok};
  });
}
function fmtZ(v){ if(v===null)return '–'; if(Math.abs(v-Math.round(v))<1e-9)return ''+Math.round(v); return (''+v).replace('.',','); }

/* ---------- Zahlengerade-Komponente (Übung) ---------- */
function zahlengeradeUE(container,opt){
  const min=opt.min,max=opt.max,W=680,H=100,padL=28,padR=28,y=55;
  const innerW=W-padL-padR, snap=0.5, svgNS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('class','zahlengerade-svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);
  const xOf=v=>padL+(v-min)/(max-min)*innerW;
  const vOf=x=>min+(x-padL)/innerW*(max-min);
  const snapV=v=>Math.max(min,Math.min(max,Math.round(v/snap)*snap));
  // Achse
  const ax=document.createElementNS(svgNS,'line');
  ax.setAttribute('x1',padL-10);ax.setAttribute('y1',y);ax.setAttribute('x2',W-padR+14);ax.setAttribute('y2',y);
  ax.setAttribute('stroke','#22303f');ax.setAttribute('stroke-width','2.5');svg.appendChild(ax);
  const arr=document.createElementNS(svgNS,'polygon');
  arr.setAttribute('points',(W-padR+14)+','+y+' '+(W-padR+4)+','+(y-5)+' '+(W-padR+4)+','+(y+5));
  arr.setAttribute('fill','#22303f');svg.appendChild(arr);
  for(let v=min;v<=max+1e-9;v+=0.5){
    const gx=xOf(v),ganz=Math.abs(v-Math.round(v))<1e-9;
    const t=document.createElementNS(svgNS,'line');
    t.setAttribute('x1',gx);t.setAttribute('x2',gx);t.setAttribute('y1',y-(ganz?9:5));t.setAttribute('y2',y+(ganz?9:5));
    t.setAttribute('stroke','#22303f');t.setAttribute('stroke-width',ganz?'2':'1');svg.appendChild(t);
    if(ganz){
      const lab=document.createElementNS(svgNS,'text');
      lab.setAttribute('x',gx);lab.setAttribute('y',y+24);lab.setAttribute('font-size','14');
      lab.setAttribute('text-anchor','middle');lab.setAttribute('fill','#22303f');
      lab.textContent=Math.round(v);svg.appendChild(lab);
    }
  }
  const n0=document.createElementNS(svgNS,'line');
  n0.setAttribute('x1',xOf(0));n0.setAttribute('x2',xOf(0));n0.setAttribute('y1',y-13);n0.setAttribute('y2',y+13);
  n0.setAttribute('stroke','#1f4680');n0.setAttribute('stroke-width','2.5');svg.appendChild(n0);
  // Zielmarke nach Prüfen
  if(opt.zielWert!==null && opt.zielWert!==undefined){
    const zx=xOf(opt.zielWert);
    const zt=document.createElementNS(svgNS,'line');
    zt.setAttribute('x1',zx);zt.setAttribute('x2',zx);zt.setAttribute('y1',y-20);zt.setAttribute('y2',y+20);
    zt.setAttribute('stroke','#1e7d32');zt.setAttribute('stroke-width','2');zt.setAttribute('stroke-dasharray','4 3');svg.appendChild(zt);
  }
  container.appendChild(svg);

  let wert=(opt.start!==undefined)?snapV(opt.start):0;
  let gesetzt=(opt.geprueftWert!==null&&opt.geprueftWert!==undefined)||opt.interaktiv;
  const punkt=document.createElementNS(svgNS,'circle');
  punkt.setAttribute('cy',y);punkt.setAttribute('r','11');
  const farbe = opt.interaktiv? '#2f5fa6' : (Math.abs((opt.geprueftWert)-(opt.zielWert))<1e-9?'#1e7d32':'#c1272d');
  punkt.setAttribute('fill',farbe);punkt.setAttribute('stroke','#fff');punkt.setAttribute('stroke-width','3');
  if(opt.interaktiv)punkt.style.cursor='grab';
  function place(){ punkt.setAttribute('cx',xOf(wert)); }
  place(); 
  if(opt.geprueftWert!==null&&opt.geprueftWert!==undefined){ wert=opt.geprueftWert; place(); svg.appendChild(punkt); }
  else if(opt.interaktiv){ svg.appendChild(punkt); if(opt.onChange)opt.onChange(wert); }

  if(opt.interaktiv){
    let ziehen=false,raf=null,pend=null;
    const cx=cl=>{const r=svg.getBoundingClientRect();return (cl-r.left)/r.width*W;};
    const apply=()=>{raf=null; if(pend!==null){ wert=snapV(vOf(pend)); place(); if(opt.onChange)opt.onChange(wert); pend=null; }};
    svg.addEventListener('pointerdown',e=>{ziehen=true;try{svg.setPointerCapture(e.pointerId);}catch(_){}pend=cx(e.clientX);if(!raf)raf=requestAnimationFrame(apply);});
    svg.addEventListener('pointermove',e=>{if(!ziehen)return;pend=cx(e.clientX);if(!raf)raf=requestAnimationFrame(apply);});
    const ende=()=>{ziehen=false;};
    svg.addEventListener('pointerup',ende);svg.addEventListener('pointercancel',ende);
    svg.addEventListener('touchmove',e=>{if(ziehen)e.preventDefault();},{passive:false});
  }
  return {get:()=>wert};
}

/* ---------- gemeinsame Feedback-/Button-Zeile ---------- */
function fbUndButtons(k,s,st){
  let h='<div class="fb'+(st.geprueft?' show '+(st.richtig?'ok':'no'):'')+'" id="fb_'+k.id+'_'+s+'">';
  if(st.geprueft) h+= st.richtig?'✅ Richtig! Gut erkannt.':'❌ Noch nicht ganz. Schau dir die richtigen Antworten oben an.';
  h+='</div>';
  // Musterlösung bei mehrschrittigen Aufgaben nach Fehler
  const cfg=k.stufen[s];
  const mehrschritt = (cfg.typ==='zuordnung'||cfg.typ==='wf'||cfg.typ==='mehr'||cfg.typ==='zeichen'||cfg.typ==='ordnen'||cfg.typ==='zahlengerade');
  if(st.geprueft && !st.richtig && mehrschritt){
    h+='<details class="mlsg"><summary>Musterlösung ansehen</summary><div class="inhalt">'+musterloesung(cfg)+'</div></details>';
  }
  h+='<div class="btnzeile">';
  if(!st.geprueft){
    h+='<button class="btn btn-blau" data-akt="pruefen">Prüfen</button>';
  } else if(!st.richtig){
    h+='<button class="btn btn-leeren" data-akt="leeren">Leeren</button>';
  }
  h+='</div>';
  return h;
}

function musterloesung(cfg){
  if(cfg.typ==='zuordnung'){
    let l='<p>So gehört es zusammen:</p><ul>';
    cfg.ziele.forEach(z=>{ const c=cfg.chips.find(x=>x.id===z.correct); l+='<li>'+z.label+' → '+c.t+'</li>'; });
    return l+'</ul>';
  }
  if(cfg.typ==='wf'){
    let l='<ul>';
    cfg.items.forEach(it=>{ const lab={minus:cfg.links,plus:cfg.rechts,null:cfg.mitte}[it.a]; l+='<li>'+it.text+' → <b>'+lab+'</b></li>'; });
    return l+'</ul>';
  }
  if(cfg.typ==='mehr'){
    let l='<p>Richtig sind:</p><ul>';
    cfg.optionen.forEach(o=>{ if(o.ok) l+='<li>'+o.t+'</li>'; });
    return l+'</ul>';
  }
  if(cfg.typ==='zeichen'){
    let l='<ul>';
    cfg.paare.forEach(p=>{ l+='<li>'+p.l+' '+p.a+' '+p.r+'</li>'; });
    return l+'</ul><p>Merke: Von zwei Zahlen ist die kleinere die, die auf der Zahlengeraden weiter links liegt.</p>';
  }
  if(cfg.typ==='ordnen'){
    const soll=[...cfg.zahlen].sort((a,b)=>a.v-b.v);
    let l='<p>Von klein nach groß:</p><p>'+soll.map(z=>z.t).join(' &lt; ')+'</p>';
    return l;
  }
  if(cfg.typ==='zahlengerade'){
    let l='<ul>';
    cfg.items.forEach(it=>{ l+='<li>'+it.text.replace(/Setze den Punkt (genau )?auf /,'')+' liegt bei '+fmtZ(it.ziel)+'</li>'; });
    return l+'</ul>';
  }
  return '';
}

function bindButtons(k,s,cont,st,pruefFn){
  cont.querySelectorAll('[data-akt]').forEach(b=>{
    b.onclick=()=>{
      if(b.dataset.akt==='pruefen'){
        const r=pruefFn();
        if(r.leer){ flashLeer(k,s); return; }
        st.geprueft=true; st.richtig=r.richtig;
        renderStufe(k,s); updateDone(k);
      } else if(b.dataset.akt==='leeren'){
        st.geprueft=false; st.richtig=false; st.init=false; initStufe(k,s);
        renderStufe(k,s); updateDone(k);
      }
    };
  });
}

function flashLeer(k,s){
  const fb=document.getElementById('fb_'+k.id+'_'+s);
  if(fb){ fb.className='fb show no'; fb.textContent='Bitte zuerst alle Felder ausfüllen bzw. auswählen.'; }
}

function updateDone(k){
  const anyGeprueft = k.einstufig
    ? state[k.id]['grund'].geprueft
    : STUFEN.some(s=>k.stufen[s]&&state[k.id][s].geprueft);
  const d=document.getElementById('done_'+k.id);
  if(anyGeprueft){ d.textContent=' ✓'; } else { d.textContent=''; }
  checkWeiter();
}

/* ---------- Auswertungskarte ---------- */
function renderAuswertung(){
  const sec=document.getElementById('karte_erg');
  let ok=0,total=0,rows='';
  KARTEN.forEach(k=>{
    // Für die Wertung zählt die aktuell aktive Stufe; einstufige Karten immer 'grund'
    const s = k.einstufig ? 'grund' : aktuelleStufe;
    if(!k.stufen[s]) return;
    total++;
    const st=state[k.id][s];
    const status = !st.geprueft ? 'offen' : (st.richtig?'gut':'schlecht');
    if(st.richtig) ok++;
    rows+='<div class="ergrow"><span>'+k.titel.replace(/🔁 /,'')+'</span>'+
      (status==='offen'?'<span>– noch offen –</span>':
       status==='gut'?'<span class="gut">✅ richtig</span>':'<span class="schlecht">❌ falsch</span>')+'</div>';
  });
  sec.innerHTML='<h2>★ Auswertung ('+STUFEN_LABEL[aktuelleStufe]+')</h2>'+
    '<p>So sieht dein aktueller Stand auf der Stufe <b>'+STUFEN_LABEL[aktuelleStufe]+'</b> aus:</p>'+
    rows+'<div class="score">'+ok+' von '+total+' richtig</div>'+
    '<div class="hinweis">Wechsle oben die Niveaustufe, um auch die anderen Stufen zu bearbeiten. '+
    'Dein Stand je Stufe bleibt erhalten.</div>'+
    '<a class="btn btn-blau" style="display:inline-block;text-decoration:none;text-align:center;width:100%" '+
    'href="rationale_zahlen_test.html">Weiter zum Abschlusstest →</a>';
}

/* ---------- Weiter-Button-Logik: erscheint erst, wenn alle Karten in aktueller Stufe geprüft ---------- */
function checkWeiter(){ /* Weiter liegt in der Auswertungskarte; kein separater Button nötig */ }

/* ---------- Start ---------- */
KARTEN.forEach(k=>renderKarte(k));
</script>
