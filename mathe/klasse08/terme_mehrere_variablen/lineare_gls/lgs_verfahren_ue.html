<style>
:root{
  --ink:#22303f; --card:#ffffff; --green:#1e7d32; --red:#c1272d;
  --amber:#b8860b; --amber-light:#fdf3d9; --amber-dark:#96690a;
  --blue:#2f5fa6; --blue-dark:#1f4680; --blue-light:#e6eefb;
  --bg:#f6f8fb; --line:#dbe3ee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
[hidden]{display:none !important;}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  font-size:1.0625rem;line-height:1.6;padding-bottom:80px;}
mjx-container{max-width:100%;overflow-x:auto;}

.kopf{background:var(--blue);color:#fff;padding:18px 16px 14px;text-align:center;}
.kopf h1{margin:0;font-size:1.45rem;font-weight:900;}
.kopf p{margin:4px 0 0;font-size:1rem;}

.tabs{display:flex;gap:6px;overflow-x:auto;background:var(--blue-dark);padding:6px 8px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;position:sticky;top:0;z-index:50;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;min-height:44px;padding:8px 14px;border:none;border-radius:10px;background:transparent;
  color:#fff;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;white-space:nowrap;}
.tab.aktiv{background:#fff;color:var(--blue-dark);}
.tab:active{transform:scale(.97);}

main{max-width:860px;margin:0 auto;padding:16px;}
.karte{display:none;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px 18px;}
.karte.aktiv{display:block;}
.karte h2{margin:0 0 4px;font-size:1.3rem;color:var(--blue-dark);}
.unter{margin:0 0 16px;font-size:1rem;}

.stufen{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.stufe{min-height:44px;min-width:44px;padding:8px 16px;border:2px solid var(--blue);border-radius:999px;background:#fff;
  color:var(--blue);font-family:inherit;font-size:1rem;font-weight:800;cursor:pointer;}
.stufe.aktiv{background:var(--blue);color:#fff;}
.stufe:active{transform:scale(.97);}
.panel{display:none;}
.panel.aktiv{display:block;}

.vorgehen,.beispiel{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:18px;}
.vorgehen ol,.beispiel ol{margin:6px 0 0;padding-left:1.4rem;}
.beispiel{border-color:var(--blue);}

.aufgabe{background:var(--blue-light);border-left:5px solid var(--blue);border-radius:12px;padding:14px 16px;margin-bottom:20px;}
.aufgabe h3{margin:0 0 8px;font-size:1.1rem;color:var(--blue-dark);}
.aufgabe p{margin:0 0 8px;}
.gls{background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 14px;display:inline-block;}

.felder{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:12px 0 4px;}
.feld{display:inline-flex;align-items:center;gap:8px;font-weight:700;}
.eingabe{width:100px;min-height:44px;border:2px solid var(--line);border-radius:10px;text-align:center;
  font-family:inherit;font-size:1.1rem;font-weight:700;background:#fff;color:var(--ink);}
.eingabe:focus{outline:none;border-color:var(--blue);}
.eingabe.ok{border:3px solid var(--green);}
.eingabe.nok{border:3px solid var(--red);}

.knoepfe{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
.btn{min-height:44px;padding:10px 20px;border:none;border-radius:12px;font-family:inherit;font-size:1rem;font-weight:800;cursor:pointer;}
.btn:active{transform:scale(.97);}
.btn-pruefen{background:var(--blue);color:#fff;}
.btn-leeren{background:#fff;color:var(--red);border:2px solid var(--red);}

.fb{display:none;margin-top:10px;padding:10px 14px;border-radius:10px;font-weight:700;color:#fff;}
.fb.ok{display:block;background:var(--green);}
.fb.nok{display:block;background:var(--red);}

.hilfe{display:none;margin-top:12px;}
.hilfe-btn{display:block;width:100%;text-align:left;min-height:44px;margin-top:8px;padding:10px 14px;
  background:var(--amber-light);border:2px solid var(--amber);border-radius:10px;color:var(--amber-dark);
  font-family:inherit;font-size:1rem;font-weight:800;cursor:pointer;}
.hilfe-btn:active{border-color:var(--amber-dark);}
.hilfe-inhalt{display:none;background:var(--amber-light);border:2px solid var(--amber);border-top:none;
  border-radius:0 0 10px 10px;padding:10px 14px;}
.hilfe-inhalt.offen{display:block;}

.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;}
.frac > span:first-child{border-bottom:2px solid currentColor;padding:0 4px;line-height:1.35;}
.frac > span:last-child{padding:0 4px;line-height:1.35;}

.aw-score{font-size:2.4rem;font-weight:900;text-align:center;color:var(--blue-dark);margin:8px 0 2px;}
.aw-text{text-align:center;margin:0 0 16px;}
.aw-titel{margin:18px 0 6px;font-size:1.05rem;color:var(--blue-dark);}
.aw-zeile{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 12px;margin-bottom:6px;
  border-radius:10px;background:var(--bg);border-left:5px solid var(--line);}
.aw-zeile.ok{border-left-color:var(--green);}
.aw-zeile.nok{border-left-color:var(--red);}

.dino{position:fixed;bottom:12px;right:14px;z-index:60;background:none;border:none;font-size:1.7rem;
  min-width:44px;min-height:44px;cursor:pointer;}
.dino-tip{display:none;position:fixed;bottom:62px;right:12px;z-index:61;background:var(--ink);color:#fff;
  padding:6px 12px;border-radius:8px;font-size:1rem;font-weight:700;}
.dino:hover + .dino-tip,.dino-tip.zeigen{display:block;}

@media (max-width:480px){ .karte{padding:16px 12px;} }
</style>

.dino-tipp-fest{right:96px!important;bottom:34px!important;left:auto!important;top:auto!important}
</style>

<script>
// ============================================================
// INHALT
// ============================================================
const R = String.raw;
const fr = (z, n) => `<span class="frac"><span>${z}</span><span>${n}</span></span>`;
const xy = (sx, sy) => [
  {k:'x', label:R`\(x =\)`, name:R`\(x\)`, sol:sx},
  {k:'y', label:R`\(y =\)`, name:R`\(y\)`, sol:sy}
];
const gls = (i, ii) => R`<p class="gls">I: \(${i}\)<br>II: \(${ii}\)</p>`;

const TIPPS_GLEICH = [
  R`Löse I und II jeweils nach derselben Variable auf, sodass beide Gleichungen z. B. mit \(y = \ldots\) beginnen.`,
  R`Setze die beiden rechten Seiten gleich. Sammle die \(x\)-Terme auf einer Seite und die Zahlen auf der anderen.`,
  R`Setze dein \(x\) in eine der umgeformten Gleichungen ein. Die Probe in I <i>und</i> II zeigt dir, ob alles stimmt.`
];
const TIPPS_EINSETZ = [
  R`Suche eine Gleichung, in der eine Variable schon allein steht – oder sich leicht freistellen lässt.`,
  R`Setze den Term für diese Variable <i>mit Klammer</i> in die andere Gleichung ein. Dann kommt dort nur noch eine Variable vor.`,
  R`Löse diese Gleichung, setze das Ergebnis in den freigestellten Term ein und mache die Probe in beiden Gleichungen.`
];
const TIPPS_ADD = [
  R`Vergleiche die Vorfaktoren einer Variable in I und II. Mit welchem Faktor musst du eine (oder beide) Gleichungen multiplizieren, damit diese Vorfaktoren Gegenzahlen werden?`,
  R`Multipliziere <i>jeden</i> Term der Gleichung mit diesem Faktor und addiere dann die Gleichungen. Eine Variable fällt weg.`,
  R`Löse nach der übrigen Variable, setze in eine Ausgangsgleichung ein und mache die Probe.`
];

const VG_GLEICH = R`<div class="vorgehen"><b>So gehst du vor:</b><ol>
  <li>Beide Gleichungen nach derselben Variable auflösen.</li>
  <li>Die beiden rechten Seiten gleichsetzen.</li>
  <li>Die entstandene Gleichung lösen.</li>
  <li>Einsetzen und die zweite Variable berechnen.</li>
  <li>Probe in beiden Gleichungen.</li></ol></div>`;
const VG_EINSETZ = R`<div class="vorgehen"><b>So gehst du vor:</b><ol>
  <li>Eine Gleichung nach einer Variable auflösen (oder eine schon aufgelöste nehmen).</li>
  <li>Diesen Term mit Klammer in die <i>andere</i> Gleichung einsetzen.</li>
  <li>Die entstandene Gleichung lösen.</li>
  <li>Zurückeinsetzen und die zweite Variable berechnen.</li>
  <li>Probe in beiden Gleichungen.</li></ol></div>`;
const VG_ADD = R`<div class="vorgehen"><b>So gehst du vor:</b><ol>
  <li>Eine Variable wählen, die wegfallen soll.</li>
  <li>Gleichungen so multiplizieren, dass ihre Vorfaktoren Gegenzahlen sind.</li>
  <li>Die Gleichungen addieren und die übrige Variable berechnen.</li>
  <li>In eine Ausgangsgleichung einsetzen, zweite Variable berechnen.</li>
  <li>Probe in beiden Gleichungen.</li></ol></div>`;

const KARTEN = [
// ---------- 1 Gleichsetzung ----------
{ id:'gleich', tab:'① Gleichsetzung', titel:'🔄 Gleichsetzungsverfahren',
  unter:'Beide Gleichungen nach derselben Variable auflösen, dann gleichsetzen.',
  stufen:{
    G:{ intro:VG_GLEICH, aufgaben:[
      { id:'gs-g', titel:'Aufgabe', felder:xy(3,2), tipps:TIPPS_GLEICH,
        text:R`<p>Löse das Gleichungssystem mit dem Gleichsetzungsverfahren.</p>` + gls('3x + y = 11','x + y = 5'),
        loesung:R`Aus I: \(y = 11 - 3x\) · aus II: \(y = 5 - x\)<br>
          Gleichsetzen: \(11 - 3x = 5 - x \quad | +3x - 5\)<br>
          \(6 = 2x \quad | :2\) &nbsp;⇒&nbsp; \(x = 3\)<br>
          In II: \(y = 5 - 3 = 2\)<br>
          Probe: I \(3 \cdot 3 + 2 = 11\) ✓ · II \(3 + 2 = 5\) ✓<br>
          <b>Lösung: \(x = 3,\ y = 2\)</b>` } ]},
    F:{ aufgaben:[
      { id:'gs-f', titel:'Aufgabe', felder:xy(2,5), tipps:TIPPS_GLEICH,
        text:R`<p>Löse mit dem Gleichsetzungsverfahren.</p>` + gls('2x + y = 9','4x - y = 3'),
        loesung:R`Aus I: \(y = 9 - 2x\) · aus II: \(y = 4x - 3\)<br>
          Gleichsetzen: \(9 - 2x = 4x - 3 \quad | +2x + 3\)<br>
          \(12 = 6x \quad | :6\) &nbsp;⇒&nbsp; \(x = 2\)<br>
          In I: \(y = 9 - 4 = 5\)<br>
          Probe: I \(4 + 5 = 9\) ✓ · II \(8 - 5 = 3\) ✓<br>
          <b>Lösung: \(x = 2,\ y = 5\)</b>` } ]},
    P:{ aufgaben:[
      { id:'gs-p', titel:'Aufgabe', felder:xy(4,4),
        text:R`<p>Löse mit dem Gleichsetzungsverfahren. Beide Gleichungen müssen zuerst umgeformt werden.</p>` + gls('3x - 2y = 4','x + 3y = 16'),
        tipps:[
          R`Löse beide Gleichungen nach \(x\) auf. Bei I entsteht dabei ein Bruch – das ist in Ordnung.`,
          R`Setze gleich und multipliziere die ganze Gleichung mit dem Nenner, damit der Bruch verschwindet.`,
          R`Berechne \(y\), dann \(x\) – und mache die Probe in beiden Gleichungen.` ],
        loesung:R`Aus II: \(x = 16 - 3y\)<br>
          Aus I: \(3x = 4 + 2y \quad | :3\) &nbsp;⇒&nbsp; \(x =\) ${fr(R`\(4 + 2y\)`,R`\(3\)`)}<br>
          Gleichsetzen: ${fr(R`\(4 + 2y\)`,R`\(3\)`)} \(= 16 - 3y \quad | \cdot 3\)<br>
          \(4 + 2y = 48 - 9y \quad | +9y - 4\)<br>
          \(11y = 44 \quad | :11\) &nbsp;⇒&nbsp; \(y = 4\)<br>
          In II: \(x = 16 - 12 = 4\)<br>
          Probe: I \(12 - 8 = 4\) ✓ · II \(4 + 12 = 16\) ✓<br>
          <b>Lösung: \(x = 4,\ y = 4\)</b>` } ]}
  }},
// ---------- 2 Einsetzung ----------
{ id:'einsetz', tab:'② Einsetzung', titel:'🔁 Einsetzungsverfahren',
  unter:'Eine Gleichung nach einer Variable auflösen und in die andere einsetzen.',
  stufen:{
    G:{ intro:VG_EINSETZ, aufgaben:[
      { id:'es-g1', titel:'Aufgabe 1', felder:xy(3,5), tipps:TIPPS_EINSETZ,
        text:R`<p>Löse mit dem Einsetzungsverfahren.</p>` + gls('y = 2x - 1','3x + 2y = 19'),
        loesung:R`I ist schon nach \(y\) aufgelöst. Einsetzen in II:<br>
          \(3x + 2 \cdot (2x - 1) = 19\)<br>
          \(3x + 4x - 2 = 19 \quad | +2\)<br>
          \(7x = 21 \quad | :7\) &nbsp;⇒&nbsp; \(x = 3\)<br>
          In I: \(y = 2 \cdot 3 - 1 = 5\)<br>
          Probe II: \(9 + 10 = 19\) ✓<br>
          <b>Lösung: \(x = 3,\ y = 5\)</b>` },
      { id:'es-g2', titel:'Aufgabe 2', felder:xy(7,2), tipps:TIPPS_EINSETZ,
        text:R`<p>Löse mit dem Einsetzungsverfahren.</p>` + gls('x = 3y + 1','2x - y = 12'),
        loesung:R`I ist schon nach \(x\) aufgelöst. Einsetzen in II:<br>
          \(2 \cdot (3y + 1) - y = 12\)<br>
          \(6y + 2 - y = 12 \quad | -2\)<br>
          \(5y = 10 \quad | :5\) &nbsp;⇒&nbsp; \(y = 2\)<br>
          In I: \(x = 3 \cdot 2 + 1 = 7\)<br>
          Probe II: \(14 - 2 = 12\) ✓<br>
          <b>Lösung: \(x = 7,\ y = 2\)</b>` } ]},
    F:{ aufgaben:[
      { id:'es-f1', titel:'Aufgabe 1', felder:xy(2,3), tipps:TIPPS_EINSETZ,
        text:R`<p>Löse mit dem Einsetzungsverfahren. Eine Gleichung muss zuerst umgeformt werden.</p>` + gls('5x - y = 7','2x + 3y = 13'),
        loesung:R`Aus I: \(y = 5x - 7\)<br>
          In II: \(2x + 3 \cdot (5x - 7) = 13\)<br>
          \(2x + 15x - 21 = 13 \quad | +21\)<br>
          \(17x = 34 \quad | :17\) &nbsp;⇒&nbsp; \(x = 2\)<br>
          \(y = 5 \cdot 2 - 7 = 3\)<br>
          Probe: I \(10 - 3 = 7\) ✓ · II \(4 + 9 = 13\) ✓<br>
          <b>Lösung: \(x = 2,\ y = 3\)</b>` },
      { id:'es-f2', titel:'Aufgabe 2', felder:xy(3,1), tipps:TIPPS_EINSETZ,
        text:R`<p>Löse mit dem Einsetzungsverfahren.</p>` + gls('4x + y = 13','x - 2y = 1'),
        loesung:R`Aus II: \(x = 2y + 1\)<br>
          In I: \(4 \cdot (2y + 1) + y = 13\)<br>
          \(8y + 4 + y = 13 \quad | -4\)<br>
          \(9y = 9 \quad | :9\) &nbsp;⇒&nbsp; \(y = 1\)<br>
          \(x = 2 \cdot 1 + 1 = 3\)<br>
          Probe: I \(12 + 1 = 13\) ✓ · II \(3 - 2 = 1\) ✓<br>
          <b>Lösung: \(x = 3,\ y = 1\)</b>` } ]},
    P:{ aufgaben:[
      { id:'es-p', titel:'Aufgabe', felder:xy(2,3),
        text:R`<p>Löse mit dem Einsetzungsverfahren. Keine Variable lässt sich ohne Bruch freistellen.</p>` + gls('3x + 4y = 18','2x - 3y = -5'),
        tipps:[
          R`Stelle \(x\) in II frei. Dabei entsteht ein Bruch.`,
          R`Setze den Bruchterm in I ein und multipliziere die ganze Gleichung mit dem Nenner.`,
          R`Berechne \(y\), dann \(x\) – und mache die Probe in beiden Gleichungen.` ],
        loesung:R`Aus II: \(2x = 3y - 5 \quad | :2\) &nbsp;⇒&nbsp; \(x =\) ${fr(R`\(3y - 5\)`,R`\(2\)`)}<br>
          In I: \(3 \cdot\) ${fr(R`\(3y - 5\)`,R`\(2\)`)} \(+\ 4y = 18 \quad | \cdot 2\)<br>
          \(9y - 15 + 8y = 36 \quad | +15\)<br>
          \(17y = 51 \quad | :17\) &nbsp;⇒&nbsp; \(y = 3\)<br>
          \(x =\) ${fr(R`\(9 - 5\)`,R`\(2\)`)} \(= 2\)<br>
          Probe: I \(6 + 12 = 18\) ✓ · II \(4 - 9 = -5\) ✓<br>
          <b>Lösung: \(x = 2,\ y = 3\)</b>` } ]}
  }},
// ---------- 3 Addition ----------
{ id:'add', tab:'③ Addition', titel:'➕ Additionsverfahren',
  unter:'Gleichungen so multiplizieren, dass eine Variable wegfällt – dann addieren.',
  stufen:{
    G:{ intro:VG_ADD, aufgaben:[
      { id:'ad-g', titel:'Aufgabe', felder:xy(3.5,3), tipps:TIPPS_ADD,
        text:R`<p>Löse mit dem Additionsverfahren. Kommazahlen gibst du mit Komma ein.</p>` + gls('2x + 3y = 16','2x - y = 4'),
        loesung:R`II \(\cdot (-1)\) ⇒ II': \(-2x + y = -4\)<br>
          I + II': \(4y = 12 \quad | :4\) &nbsp;⇒&nbsp; \(y = 3\)<br>
          In II: \(2x - 3 = 4 \quad | +3\) &nbsp;⇒&nbsp; \(2x = 7 \quad | :2\) &nbsp;⇒&nbsp; \(x = 3{,}5\)<br>
          Probe: I \(7 + 9 = 16\) ✓ · II \(7 - 3 = 4\) ✓<br>
          <b>Lösung: \(x = 3{,}5,\ y = 3\)</b>` } ]},
    F:{ aufgaben:[
      { id:'ad-f', titel:'Aufgabe', felder:xy(3,2), tipps:TIPPS_ADD,
        text:R`<p>Löse mit dem Additionsverfahren. Eine Gleichung muss mit einem Faktor multipliziert werden.</p>` + gls('3x + 2y = 13','x - 4y = -5'),
        loesung:R`II \(\cdot (-3)\) ⇒ II': \(-3x + 12y = 15\)<br>
          I + II': \(14y = 28 \quad | :14\) &nbsp;⇒&nbsp; \(y = 2\)<br>
          In II: \(x - 8 = -5 \quad | +8\) &nbsp;⇒&nbsp; \(x = 3\)<br>
          Probe: I \(9 + 4 = 13\) ✓ · II \(3 - 8 = -5\) ✓<br>
          <b>Lösung: \(x = 3,\ y = 2\)</b>` } ]},
    P:{ aufgaben:[
      { id:'ad-p', titel:'Aufgabe', felder:xy(3,2), tipps:TIPPS_ADD,
        text:R`<p>Löse mit dem Additionsverfahren. Beide Gleichungen müssen mit Faktoren multipliziert werden.</p>` + gls('4x + 3y = 18','3x + 2y = 13'),
        loesung:R`I \(\cdot 3\) ⇒ I': \(12x + 9y = 54\)<br>
          II \(\cdot (-4)\) ⇒ II': \(-12x - 8y = -52\)<br>
          I' + II': \(y = 2\)<br>
          In II: \(3x + 4 = 13 \quad | -4\) &nbsp;⇒&nbsp; \(3x = 9 \quad | :3\) &nbsp;⇒&nbsp; \(x = 3\)<br>
          Probe: I \(12 + 6 = 18\) ✓ · II \(9 + 4 = 13\) ✓<br>
          <b>Lösung: \(x = 3,\ y = 2\)</b>` } ]}

// ---------- 4 Zahlenrätsel ----------
{ id:'zahl', tab:'🔢 Zahlenrätsel', titel:'🔢 Zahlenrätsel',
  unter:'Stelle ein Gleichungssystem auf und löse das Rätsel.',
  stufen:{
    G:{ intro:R`<div class="beispiel"><b>📖 Beispiel – so geht's</b>
        <p><i>„Die Summe zweier Zahlen ist 13. Eine Zahl ist um 3 größer als die andere.“</i></p><ol>
        <li>Variablen festlegen: kleinere Zahl \(x\), größere Zahl \(y\).</li>
        <li>Gleichungen aufstellen: I: \(x + y = 13\), II: \(y = x + 3\)</li>
        <li>Lösen (Einsetzungsverfahren): \(x + (x + 3) = 13\) ⇒ \(2x = 10\) ⇒ \(x = 5\), also \(y = 8\)</li>
        <li>Probe und Antwortsatz: \(5 + 8 = 13\) ✓, \(8 = 5 + 3\) ✓ – die Zahlen sind 5 und 8.</li></ol></div>`,
      aufgaben:[
      { id:'zr-g', titel:'Jetzt du!',
        felder:[{k:'x',label:R`kleinere Zahl \(x =\)`,name:'die kleinere Zahl',sol:11},
                {k:'y',label:R`größere Zahl \(y =\)`,name:'die größere Zahl',sol:17}],
        text:R`<p>Die Summe zweier Zahlen ist 28. Die größere Zahl ist um 6 größer als die kleinere. Welche Zahlen sind gemeint?</p>
          <p>Kleinere Zahl \(x\), größere Zahl \(y\):</p>` + gls('x + y = 28','y = x + 6'),
        tipps:[ R`II ist schon nach \(y\) aufgelöst – setze den Term mit Klammer in I ein.`,
                R`Fasse die \(x\)-Terme zusammen und löse nach \(x\). Mit II bekommst du dann \(y\).` ],
        loesung:R`II in I: \(x + (x + 6) = 28\)<br>
          \(2x + 6 = 28 \quad | -6\)<br>
          \(2x = 22 \quad | :2\) &nbsp;⇒&nbsp; \(x = 11\)<br>
          In II: \(y = 11 + 6 = 17\)<br>
          Probe: \(11 + 17 = 28\) ✓ · \(17 = 11 + 6\) ✓<br>
          <b>Die Zahlen sind 11 und 17.</b>` } ]},
    F:{ aufgaben:[
      { id:'zr-f', titel:'Rätsel', felder:xy(15,20),
        text:R`<p>Das Doppelte einer ersten Zahl \(x\) ist um 10 größer als eine zweite Zahl \(y\). Zusammen ergeben beide Zahlen 35. Stelle ein Gleichungssystem auf und bestimme beide Zahlen.</p>`,
        tipps:[ R`Übersetze Satz für Satz: „das Doppelte von \(x\)“ ist \(2x\), „um 10 größer als \(y\)“ ist \(y + 10\).`,
                R`Die Summe beider Zahlen liefert die zweite Gleichung. Löse dann z. B. die erste Gleichung nach \(y\) auf und setze in die zweite ein.`,
                R`Mache die Probe: Passen deine Zahlen zu <i>beiden</i> Sätzen des Rätsels?` ],
        loesung:R`I: \(2x = y + 10\) · II: \(x + y = 35\)<br>
          Aus I: \(y = 2x - 10\)<br>
          In II: \(x + 2x - 10 = 35 \quad | +10\)<br>
          \(3x = 45 \quad | :3\) &nbsp;⇒&nbsp; \(x = 15\)<br>
          \(y = 30 - 10 = 20\)<br>
          Probe: \(30 = 20 + 10\) ✓ · \(15 + 20 = 35\) ✓<br>
          <b>Die Zahlen sind \(x = 15\) und \(y = 20\).</b>` } ]},
    P:{ aufgaben:[
      { id:'zr-p', titel:'Rätsel', felder:xy(13,8),
        text:R`<p>Addiert man zum Dreifachen einer ersten Zahl \(x\) eine zweite Zahl \(y\), erhält man 47. Subtrahiert man vom Fünffachen der zweiten Zahl die erste, erhält man 27. Welche Zahlen sind gemeint?</p>`,
        tipps:[ R`Übersetze jeden Satz in eine Gleichung: „das Dreifache der ersten Zahl“ ist \(3x\), „das Fünffache der zweiten“ ist \(5y\).`,
                R`In der ersten Gleichung lässt sich \(y\) leicht freistellen. Setze den Term mit Klammer in die zweite ein.`,
                R`Mache die Probe mit beiden Sätzen des Rätsels.` ],
        loesung:R`I: \(3x + y = 47\) · II: \(5y - x = 27\)<br>
          Aus I: \(y = 47 - 3x\)<br>
          In II: \(5 \cdot (47 - 3x) - x = 27\)<br>
          \(235 - 15x - x = 27 \quad | -235\)<br>
          \(-16x = -208 \quad | :(-16)\) &nbsp;⇒&nbsp; \(x = 13\)<br>
          \(y = 47 - 39 = 8\)<br>
          Probe: I \(39 + 8 = 47\) ✓ · II \(40 - 13 = 27\) ✓<br>
          <b>Die Zahlen sind \(x = 13\) und \(y = 8\).</b>` } ]}
  }},
// ---------- 5 Altersrätsel ----------
{ id:'alter', tab:'🎂 Altersrätsel', titel:'🎂 Altersrätsel',
  unter:'Stelle ein Gleichungssystem auf und löse das Rätsel.',
  stufen:{
    G:{ aufgaben:[
      { id:'al-g', titel:'Aufgabe',
        felder:[{k:'m',label:'Mia ist',name:'Mias Alter',sol:15,einheit:'Jahre alt'},
                {k:'l',label:'Leon ist',name:'Leons Alter',sol:11,einheit:'Jahre alt'}],
        text:R`<p>Mia ist 4 Jahre älter als ihr Bruder Leon. Zusammen sind sie 26 Jahre alt. Wie alt sind Mia und Leon?</p>
          <p>Mias Alter \(m\), Leons Alter \(l\) (in Jahren):</p>` + gls('m + l = 26','m = l + 4'),
        tipps:[ R`Setze II (\(m = l + 4\)) mit Klammer in I ein.`,
                R`Löse nach \(l\) auf und berechne dann mit II das Alter von Mia.` ],
        loesung:R`II in I: \((l + 4) + l = 26\)<br>
          \(2l + 4 = 26 \quad | -4\)<br>
          \(2l = 22 \quad | :2\) &nbsp;⇒&nbsp; \(l = 11\)<br>
          \(m = 11 + 4 = 15\)<br>
          Probe: \(15 + 11 = 26\) ✓ · \(15 = 11 + 4\) ✓<br>
          <b>Mia ist 15 Jahre, Leon 11 Jahre alt.</b>` } ]},
    F:{ aufgaben:[
      { id:'al-f', titel:'Aufgabe',
        felder:[{k:'l',label:'Lehrerin:',name:'das Alter der Lehrerin',sol:30,einheit:'Jahre'},
                {k:'s',label:'Schülerin:',name:'das Alter der Schülerin',sol:10,einheit:'Jahre'}],
        text:R`<p>Eine Lehrerin ist heute dreimal so alt wie ihre Schülerin. In 10 Jahren ist sie nur noch doppelt so alt. Wie alt sind beide heute?</p>`,
        tipps:[ R`Bezeichne das heutige Alter mit \(l\) (Lehrerin) und \(s\) (Schülerin). „Heute dreimal so alt“ liefert die erste Gleichung.`,
                R`In 10 Jahren sind beide 10 Jahre älter: Ersetze \(l\) durch \(l + 10\) und \(s\) durch \(s + 10\).`,
                R`Setze die erste Gleichung in die zweite ein und mache am Ende die Probe für heute und in 10 Jahren.` ],
        loesung:R`I: \(l = 3s\) · II: \(l + 10 = 2 \cdot (s + 10)\)<br>
          I in II: \(3s + 10 = 2s + 20 \quad | -2s - 10\)<br>
          \(s = 10\) &nbsp;⇒&nbsp; \(l = 30\)<br>
          Probe: heute \(30 = 3 \cdot 10\) ✓ · in 10 Jahren \(40 = 2 \cdot 20\) ✓<br>
          <b>Lehrerin 30 Jahre, Schülerin 10 Jahre.</b>` } ]},
    P:{ aufgaben:[
      { id:'al-p', titel:'Aufgabe',
        felder:[{k:'t',label:'Tante:',name:'das Alter der Tante',sol:29,einheit:'Jahre'},
                {k:'n',label:'Neffe:',name:'das Alter des Neffen',sol:11,einheit:'Jahre'}],
        text:R`<p>Vor 5 Jahren war eine Tante viermal so alt wie ihr Neffe. In 7 Jahren wird sie nur noch doppelt so alt sein wie er. Wie alt sind beide heute?</p>`,
        tipps:[ R`Vor 5 Jahren waren beide 5 Jahre jünger: \(t - 5\) und \(n - 5\). Stelle für „in 7 Jahren“ die zweite Gleichung genauso auf.`,
                R`Löse beide Gleichungen nach \(t\) auf und setze sie gleich.`,
                R`Mache die Probe für „vor 5 Jahren“ und für „in 7 Jahren“.` ],
        loesung:R`I: \(t - 5 = 4 \cdot (n - 5)\) &nbsp;⇒&nbsp; \(t = 4n - 15\)<br>
          II: \(t + 7 = 2 \cdot (n + 7)\) &nbsp;⇒&nbsp; \(t = 2n + 7\)<br>
          Gleichsetzen: \(4n - 15 = 2n + 7 \quad | -2n + 15\)<br>
          \(2n = 22 \quad | :2\) &nbsp;⇒&nbsp; \(n = 11\), \(t = 2 \cdot 11 + 7 = 29\)<br>
          Probe: vor 5 Jahren \(24 = 4 \cdot 6\) ✓ · in 7 Jahren \(36 = 2 \cdot 18\) ✓<br>
          <b>Tante 29 Jahre, Neffe 11 Jahre.</b>` } ]}
  }},
// ---------- 6 Mischung ----------
{ id:'misch', tab:'🧪 Mischung', titel:'🧪 Mischungsaufgaben',
  unter:'Mengen und Anteile mit Gleichungssystemen berechnen.',
  stufen:{
    G:{ intro:R`<div class="vorgehen"><b>💡 Das Grundprinzip</b>
        <p style="margin:6px 0 0">Bei Mischungsaufgaben stellt man immer zwei Gleichungen auf:</p><ol>
        <li><b>Gesamtmenge:</b> Menge A + Menge B = Gesamtmenge</li>
        <li><b>Anteil:</b> Anteil · Menge A + Anteil · Menge B = Anteil · Gesamtmenge</li></ol></div>`,
      aufgaben:[
      { id:'mi-g', titel:'Aufgabe',
        felder:[{k:'a',label:R`Saft A: \(a =\)`,name:'die Menge von Saft A',sol:2,einheit:'Liter'},
                {k:'b',label:R`Saft B: \(b =\)`,name:'die Menge von Saft B',sol:4,einheit:'Liter'}],
        text:R`<p>Zwei Apfelsäfte werden gemischt. Saft A enthält <b>20 % Fruchtanteil</b>, Saft B <b>80 %</b>. Es sollen <b>6 Liter</b> Mischung mit <b>60 % Fruchtanteil</b> entstehen. Wie viel Liter von jedem Saft werden benötigt?</p>
          <p>\(a\) = Menge Saft A, \(b\) = Menge Saft B (jeweils in Litern):</p>` + gls(R`a + b = 6`, R`0{,}2 \cdot a + 0{,}8 \cdot b = 0{,}6 \cdot 6 = 3{,}6`),
        tipps:[ R`Multipliziere II mit 10, damit keine Kommazahlen mehr vorkommen.`,
                R`Löse I nach \(a\) auf und setze den Term mit Klammer in die neue Gleichung II ein – oder nutze das Additionsverfahren.`,
                R`Mache die Probe in beiden Gleichungen.` ],
        loesung:R`II \(\cdot 10\): \(2a + 8b = 36\)<br>
          Aus I: \(a = 6 - b\)<br>
          Einsetzen: \(2 \cdot (6 - b) + 8b = 36\)<br>
          \(12 + 6b = 36 \quad | -12\) &nbsp;⇒&nbsp; \(6b = 24 \quad | :6\) &nbsp;⇒&nbsp; \(b = 4\)<br>
          \(a = 6 - 4 = 2\)<br>
          Probe: I \(2 + 4 = 6\) ✓ · II \(0{,}4 + 3{,}2 = 3{,}6\) ✓<br>
          <b>2 Liter Saft A und 4 Liter Saft B.</b>` } ]},
    F:{ aufgaben:[
      { id:'mi-f', titel:'Aufgabe',
        felder:[{k:'a',label:'Saft A:',name:'die Menge von Saft A',sol:5,einheit:'Liter'},
                {k:'b',label:'Saft B:',name:'die Menge von Saft B',sol:5,einheit:'Liter'}],
        text:R`<p>Für eine Schulparty werden 10 Liter Fruchtsaft-Bowle gemischt. Saft A enthält 30 % Fruchtanteil, Saft B 70 %. Die Mischung soll 50 % Fruchtanteil haben. Wie viel Liter von jedem Saft werden benötigt?</p>`,
        tipps:[ R`Stelle eine Gleichung für die Gesamtmenge und eine für den Fruchtanteil auf (Anteil · Menge, z. B. \(0{,}3 \cdot a\)).`,
                R`Löse die Mengen-Gleichung nach einer Variable auf und setze in die Anteils-Gleichung ein.`,
                R`Mache die Probe in beiden Gleichungen.` ],
        loesung:R`I: \(a + b = 10\) · II: \(0{,}3a + 0{,}7b = 0{,}5 \cdot 10 = 5\)<br>
          Aus I: \(b = 10 - a\)<br>
          In II: \(0{,}3a + 0{,}7 \cdot (10 - a) = 5\)<br>
          \(0{,}3a + 7 - 0{,}7a = 5 \quad | -7\)<br>
          \(-0{,}4a = -2 \quad | :(-0{,}4)\) &nbsp;⇒&nbsp; \(a = 5\), \(b = 5\)<br>
          Probe: \(1{,}5 + 3{,}5 = 5\) ✓<br>
          <b>Je 5 Liter Saft A und Saft B.</b>` } ]},
    P:{ aufgaben:[
      { id:'mi-p', titel:'Aufgabe',
        felder:[{k:'a',label:'Legierung I:',name:'die Masse von Legierung I',sol:360,einheit:'g'},
                {k:'b',label:'Legierung II:',name:'die Masse von Legierung II',sol:240,einheit:'g'}],
        text:R`<p>Legierung I enthält 40 % Silber, Legierung II enthält 75 % Silber. Wie viel Gramm von jeder Legierung werden benötigt, um 600 g einer Legierung mit 54 % Silberanteil herzustellen?</p>`,
        tipps:[ R`Eine Gleichung für die Gesamtmasse, eine für die Silbermasse (Anteil · Masse).`,
                R`Multipliziere die Massen-Gleichung so, dass sich beim Addieren \(a\) aufhebt.`,
                R`Mache die Probe: Ergibt sich insgesamt die richtige Silbermasse?` ],
        loesung:R`I: \(a + b = 600\) · II: \(0{,}4a + 0{,}75b = 0{,}54 \cdot 600 = 324\)<br>
          I \(\cdot (-0{,}4)\) ⇒ I': \(-0{,}4a - 0{,}4b = -240\)<br>
          I' + II: \(0{,}35b = 84 \quad | :0{,}35\) &nbsp;⇒&nbsp; \(b = 240\)<br>
          \(a = 600 - 240 = 360\)<br>
          Probe: \(0{,}4 \cdot 360 + 0{,}75 \cdot 240 = 144 + 180 = 324\) ✓<br>
          <b>360 g von Legierung I und 240 g von Legierung II.</b>` } ]}
  }},
// ---------- 7 Bewegung ----------
{ id:'beweg', tab:'🚗 Bewegung', titel:'🚗 Bewegungsaufgaben',
  unter:'Geschwindigkeit, Zeit und Weg mit Gleichungssystemen berechnen.',
  stufen:{
    G:{ aufgaben:[
      { id:'be-g', titel:'Aufgabe',
        felder:[{k:'k',label:R`Kai \(v_K =\)`,name:'Kais Geschwindigkeit',sol:10.5,einheit:'km/h'},
                {k:'m',label:R`Mia \(v_M =\)`,name:'Mias Geschwindigkeit',sol:7.5,einheit:'km/h'}],
        text:R`<p>Kai und Mia radeln aufeinander zu. Sie starten gleichzeitig und sind zu Beginn <b>36 km</b> voneinander entfernt. Nach <b>2 Stunden</b> treffen sie sich. Kai ist <b>3 km/h</b> schneller als Mia. Wie schnell fährt jeder?</p>
          <p>\(v_K\), \(v_M\) = Geschwindigkeiten in km/h:</p>` + gls(R`2 \cdot v_K + 2 \cdot v_M = 36`, R`v_K = v_M + 3`),
        tipps:[ R`Setze II mit Klammer in I ein.`,
                R`Multipliziere die Klammer aus, fasse zusammen und löse nach \(v_M\). Kommazahlen sind möglich.`,
                R`Mache die Probe in beiden Gleichungen.` ],
        loesung:R`II in I: \(2 \cdot (v_M + 3) + 2v_M = 36\)<br>
          \(4v_M + 6 = 36 \quad | -6\)<br>
          \(4v_M = 30 \quad | :4\) &nbsp;⇒&nbsp; \(v_M = 7{,}5\)<br>
          \(v_K = 7{,}5 + 3 = 10{,}5\)<br>
          Probe I: \(21 + 15 = 36\) ✓<br>
          <b>Kai fährt 10,5 km/h, Mia 7,5 km/h.</b>` } ]},
    F:{ aufgaben:[
      { id:'be-f', titel:'Aufgabe',
        felder:[{k:'b',label:R`Boot \(b =\)`,name:'die Eigengeschwindigkeit',sol:16,einheit:'km/h'},
                {k:'s',label:R`Strömung \(s =\)`,name:'die Strömungsgeschwindigkeit',sol:4,einheit:'km/h'}],
        text:R`<p>Ein Boot fährt auf einem Fluss. <b>Stromabwärts</b> legt es in 3 Stunden 60 km zurück, <b>stromaufwärts</b> braucht es für dieselbe Strecke 5 Stunden. Berechne die Eigengeschwindigkeit \(b\) des Bootes und die Strömungsgeschwindigkeit \(s\).</p>`,
        tipps:[ R`Mit der Strömung addieren sich die Geschwindigkeiten (\(b + s\)), gegen die Strömung wird subtrahiert (\(b - s\)). Weg = Geschwindigkeit · Zeit.`,
                R`Teile beide Gleichungen durch die jeweilige Zeit – dann hilft das Additionsverfahren.`,
                R`Mache die Probe für beide Fahrtrichtungen.` ],
        loesung:R`I: \(3 \cdot (b + s) = 60\) &nbsp;⇒&nbsp; \(b + s = 20\)<br>
          II: \(5 \cdot (b - s) = 60\) &nbsp;⇒&nbsp; \(b - s = 12\)<br>
          I + II: \(2b = 32 \quad | :2\) &nbsp;⇒&nbsp; \(b = 16\), \(s = 4\)<br>
          Probe: \(3 \cdot 20 = 60\) ✓ · \(5 \cdot 12 = 60\) ✓<br>
          <b>Boot 16 km/h, Strömung 4 km/h.</b>` } ]},
    P:{ aufgaben:[
      { id:'be-p', titel:'Aufgabe',
        felder:[{k:'a',label:R`Auto A \(v_A =\)`,name:R`\(v_A\)`,sol:72,einheit:'km/h'},
                {k:'b',label:R`Auto B \(v_B =\)`,name:R`\(v_B\)`,sol:68,einheit:'km/h'}],
        text:R`<p>Zwei Autos starten gleichzeitig in zwei Städten, die <b>350 km</b> voneinander entfernt sind, und fahren aufeinander zu. Nach <b>2,5 Stunden</b> begegnen sie sich. Bis dahin hat Auto A <b>10 km mehr</b> zurückgelegt als Auto B. Berechne \(v_A\) und \(v_B\).</p>`,
        tipps:[ R`Bis zum Treffen fahren beide 2,5 h. Zusammen legen sie die ganze Strecke zurück; die Differenz ihrer Wege beträgt 10 km.`,
                R`Teile beide Gleichungen durch 2,5 und nutze dann das Additionsverfahren.`,
                R`Mache die Probe mit beiden Angaben aus dem Text.` ],
        loesung:R`I: \(2{,}5v_A + 2{,}5v_B = 350\) &nbsp;⇒&nbsp; \(v_A + v_B = 140\)<br>
          II: \(2{,}5v_A - 2{,}5v_B = 10\) &nbsp;⇒&nbsp; \(v_A - v_B = 4\)<br>
          I + II: \(2v_A = 144 \quad | :2\) &nbsp;⇒&nbsp; \(v_A = 72\), \(v_B = 68\)<br>
          Probe: \(180 + 170 = 350\) ✓ · \(180 - 170 = 10\) ✓<br>
          <b>Auto A 72 km/h, Auto B 68 km/h.</b>` } ]}
  }},
// ---------- 8 Wiederholung ----------
{ id:'wdh', tab:'🔁 Wiederholung', titel:'🔁 Wiederholung: Lineare Gleichungen',
  unter:'Gleichungen mit einer Unbekannten aus Klasse 7 – die Grundlage aller Verfahren.',
  stufen:{
    G:{ aufgaben:[
      { id:'w-g1', titel:'Aufgabe 1', felder:[{k:'x',label:R`\(x =\)`,name:R`\(x\)`,sol:5}],
        text:R`<p>Löse die Gleichung: \(3x + 7 = 22\)</p>`,
        tipps:[ R`Bringe zuerst die Zahl ohne \(x\) auf die andere Seite.`, R`Teile dann durch den Vorfaktor von \(x\).` ],
        loesung:R`\(3x + 7 = 22 \quad | -7\)<br>\(3x = 15 \quad | :3\)<br>\(x = 5\)<br>Probe: \(15 + 7 = 22\) ✓` },
      { id:'w-g2', titel:'Aufgabe 2', felder:[{k:'x',label:R`\(x =\)`,name:R`\(x\)`,sol:9}],
        text:R`<p>Löse die Gleichung: \(2 \cdot (x - 4) = 10\)</p>`,
        tipps:[ R`Teile beide Seiten durch den Faktor vor der Klammer – oder löse zuerst die Klammer auf.`, R`Bringe dann die Zahl auf die andere Seite.` ],
        loesung:R`\(2 \cdot (x - 4) = 10 \quad | :2\)<br>\(x - 4 = 5 \quad | +4\)<br>\(x = 9\)<br>Probe: \(2 \cdot 5 = 10\) ✓` } ]},
    F:{ aufgaben:[

const STUFEN_NAME = {G:'📖 Grundlagen', F:'🎯 Fortgeschritten', P:'🏆 Profi'};
const TASK = {}, zustand = {}, aktStufe = {};

function aufgabeHTML(a){
  const felder = a.felder.map(f =>
    `<label class="feld"><span>${f.label}</span><input class="eingabe" id="${a.id}-${f.k}" type="text" inputmode="decimal" autocomplete="off">${f.einheit ? `<span>${f.einheit}</span>` : ''}</label>`
  ).join('');
  const tipps = a.tipps.map((t,i) =>
    `<button class="hilfe-btn" data-tipp="${a.id}" data-i="${i}" ${i>0?'hidden':''}>💡 Tipp ${i+1}</button><div class="hilfe-inhalt" id="tipp-${a.id}-${i}">${t}</div>`
  ).join('');
  return `<div class="aufgabe" id="auf-${a.id}">
    <h3>${a.titel}</h3>${a.text}
    <div class="felder">${felder}</div>
    <div class="knoepfe">
      <button class="btn btn-pruefen" data-pruefe="${a.id}">Prüfen ✔</button>
      <button class="btn btn-leeren" data-leeren="${a.id}" hidden>Leeren ↺</button>
    </div>
    <div class="fb" id="fb-${a.id}" role="status"></div>
    <div class="hilfe" id="hilfe-${a.id}">${tipps}
      <button class="hilfe-btn" data-ml="${a.id}">📝 Musterlösung</button>
      <div class="hilfe-inhalt" id="ml-${a.id}">${a.loesung}</div>
    </div>
  </div>`;
}

function render(){
  const tabs = document.getElementById('tabs'), main = document.getElementById('karten');
  KARTEN.forEach((k, ki) => {
    tabs.insertAdjacentHTML('beforeend', `<button class="tab" data-tab="${ki}">${k.tab}</button>`);
    let html = `<section class="karte" id="karte-${ki}"><h2>${k.titel}</h2><p class="unter">${k.unter}</p>`;
    if (k.stufen){
      const keys = Object.keys(k.stufen);
      aktStufe[k.id] = keys[0];
      if (keys.length > 1)
        html += `<div class="stufen">` + keys.map(s =>
          `<button class="stufe${s===keys[0]?' aktiv':''}" data-karte="${k.id}" data-s="${s}">${STUFEN_NAME[s]}</button>`).join('') + `</div>`;
      keys.forEach(s => {
        const st = k.stufen[s];
        html += `<div class="panel${s===keys[0]?' aktiv':''}" id="panel-${k.id}-${s}">${st.intro||''}` +
          st.aufgaben.map(a => {
            a.karte = k.id; a.stufe = s; TASK[a.id] = a;
            zustand[a.id] = {status:'offen', jeFalsch:false};
            return aufgabeHTML(a);
          }).join('') + `</div>`;
      });
    } else html += k.html || '';
    main.insertAdjacentHTML('beforeend', html + '</section>');
  });
}

function typeset(el){ if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]); }

function lese(v){
  v = v.replace(/\s/g,'').replace(/[−–]/g,'-').replace(',','.');
  if (v === '' ) return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

function setFb(id, art, html){
  const el = document.getElementById('fb-'+id);
  el.className = 'fb ' + art;
  el.innerHTML = html;
  typeset(el);
}

function pruefe(id){
  const a = TASK[id], z = zustand[id];
  if (z.status !== 'offen') return;
  const inp = a.felder.map(f => document.getElementById(`${id}-${f.k}`));
  const w = inp.map(i => lese(i.value));
  if (w.some(v => v === null)){ setFb(id, 'nok', '✏️ Bitte jedes Feld mit einer Zahl ausfüllen.'); return; }
  const gleich = (p, q) => Math.abs(p - q) < 1e-6;
  const ok = a.felder.map((f,i) => gleich(w[i], f.sol));
  inp.forEach((el,i) => { el.classList.add(ok[i] ? 'ok' : 'nok'); el.readOnly = true; });
  if (ok.every(Boolean)){
    z.status = 'richtig';
    setFb(id, 'ok', z.jeFalsch ? '✅ Richtig – gut korrigiert!' : '✅ Richtig! Sehr gut.');
    return;
  }
  z.status = 'falsch'; z.jeFalsch = true;
  let msg;
  if (a.felder.length === 2 && gleich(w[0], a.felder[1].sol) && gleich(w[1], a.felder[0].sol))
    msg = 'Deine Zahlen passen – aber stehen sie im richtigen Feld?';
  else if (a.felder.length === 1)
    msg = 'Noch nicht. Setze deinen Wert zur Probe in die Gleichung ein.';
  else {
    const falsch = a.felder.filter((f,i) => !ok[i]).map(f => f.name);
    msg = (falsch.length === a.felder.length ? 'Beide Werte stimmen noch nicht.' : `Der Wert für ${falsch[0]} stimmt noch nicht.`)
        + ' Mache die Probe in beiden Gleichungen.';
  }
  setFb(id, 'nok', '❌ ' + msg);
  document.querySelector(`[data-leeren="${id}"]`).hidden = false;
  document.getElementById('hilfe-'+id).style.display = 'block';
}

function leere(id){
  const a = TASK[id];
  a.felder.forEach(f => {
    const el = document.getElementById(`${id}-${f.k}`);
    el.value = ''; el.classList.remove('ok','nok'); el.readOnly = false;
  });
  const fb = document.getElementById('fb-'+id); fb.className = 'fb'; fb.innerHTML = '';
  document.querySelector(`[data-leeren="${id}"]`).hidden = true;
  zustand[id].status = 'offen';
}

function zeigeTipp(id, i){
  const el = document.getElementById(`tipp-${id}-${i}`);
  el.classList.toggle('offen');
  const naechster = document.querySelector(`[data-tipp="${id}"][data-i="${i+1}"]`);
  if (naechster && el.classList.contains('offen')) naechster.hidden = false;
}

function zeigeKarte(n){
  document.querySelectorAll('.karte').forEach((c,i) => c.classList.toggle('aktiv', i === n));
  document.querySelectorAll('.tab').forEach((b,i) => b.classList.toggle('aktiv', i === n));
  if (KARTEN[n].id === 'ausw') baueAuswertung();
  const t = document.querySelectorAll('.tab')[n];
  if (t && t.scrollIntoView) t.scrollIntoView({block:'nearest', inline:'center'});
}

function setzeStufe(kid, s){
  aktStufe[kid] = s;
  document.querySelectorAll(`[id^="panel-${kid}-"]`).forEach(p => p.classList.toggle('aktiv', p.id === `panel-${kid}-${s}`));
  document.querySelectorAll(`.stufe[data-karte="${kid}"]`).forEach(b => b.classList.toggle('aktiv', b.dataset.s === s));
}

function baueAuswertung(){
  let ges = 0, richtig = 0, html = '';
  KARTEN.filter(k => k.stufen).forEach(k => {
    const s = aktStufe[k.id];
    html += `<h3 class="aw-titel">${k.titel} – ${STUFEN_NAME[s]}</h3>`;
    k.stufen[s].aufgaben.forEach(a => {
      const z = zustand[a.id]; ges++;
      let cls = '', txt = '○ noch nicht bearbeitet';
      if (z.status === 'richtig'){ richtig++; cls = 'ok'; txt = z.jeFalsch ? '✅ richtig (nach Korrektur)' : '✅ richtig'; }
      else if (z.jeFalsch){ cls = 'nok'; txt = '❌ noch nicht gelöst'; }
      html += `<div class="aw-zeile ${cls}"><span>${a.titel}</span><span>${txt}</span></div>`;
    });
  });
  document.getElementById('aw-score').textContent = `${richtig} von ${ges}`;
  const q = ges ? richtig / ges : 0;
  document.getElementById('aw-text').textContent =
    q === 1 ? '🌟 Alles gelöst – hervorragend!' :
    q >= 0.7 ? '👍 Schon sehr gut! Schau dir die offenen Aufgaben noch an.' :
    q >= 0.4 ? '🙂 Guter Anfang – die Tipps helfen dir bei den übrigen Aufgaben.' :
               '💪 Bearbeite die Karten nacheinander – mit Tipps und Musterlösung.';
  const liste = document.getElementById('aw-liste');
  liste.innerHTML = html;
  typeset(liste);
}

render();

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.tab !== undefined) zeigeKarte(+d.tab);
  else if (d.s) setzeStufe(d.karte, d.s);
  else if (d.pruefe) pruefe(d.pruefe);
  else if (d.leeren) leere(d.leeren);
  else if (d.tipp) zeigeTipp(d.tipp, +d.i);
  else if (d.ml) document.getElementById('ml-'+d.ml).classList.toggle('offen');
  else if (b.id === 'dino'){
    const t = document.getElementById('dinoTip');
    t.classList.add('zeigen'); setTimeout(() => t.classList.remove('zeigen'), 2500);
  }
});

zeigeKarte(0);
</script>

      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(t);
      melde(ok ? 'Kopiert! Jetzt in eine Mail einfügen.' : 'Kopieren ging nicht – bitte Text markieren und kopieren.', ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ganz).then(function(){
        melde('Kopiert! Jetzt in eine Mail einfügen.', true);
      }, ersatz);
    } else ersatz();
  });
})();
</script>
