<nav class="tabs" id="tabs"></nav>

<script>
// ============================================================
// INHALT
// ============================================================
const R = String.raw;
const fr = (z, n) => `<span class="frac"><span>${z}</span><span>${n}</span></span>`;
const xy = (sx, sy) => [
  {k:'x', label:R`\(x =\)`, name:R`\(x\)`, sol:sx},
  {k:'y', label:R`\(y =\)`, name:R`\(y\)`, sol:sy}
];
const nurX = s => [{k:'x', label:R`\(x =\)`, name:R`\(x\)`, sol:s}];
const gls = (i, ii) => R`<p class="gls">I: \(${i}\)<br>II: \(${ii}\)</p>`;

const TIPPS_EINSETZ = [
  R`Suche eine Gleichung, in der eine Variable schon allein steht – oder sich leicht freistellen lässt.`,
  R`Setze den Term für diese Variable <i>mit Klammer</i> in die andere Gleichung ein. Dann kommt dort nur noch eine Variable vor.`,
  R`Löse diese Gleichung, setze das Ergebnis in den freigestellten Term ein und mache die Probe in beiden Gleichungen.`
];
const TIPPS_GLEICH = [
  R`Forme beide Gleichungen nach demselben Ausdruck um, z. B. beide nach \(x = \ldots\) oder beide nach \(3y = \ldots\).`,
  R`Setze die beiden rechten Seiten gleich. Sammle die Terme mit der Variablen auf einer Seite und die Zahlen auf der anderen.`,
  R`Setze dein Ergebnis in eine umgeformte Gleichung ein und mache die Probe in I <i>und</i> II.`
];
const TIPPS_WDH = [
  R`Löse zuerst Klammern auf. Bringe dann alle \(x\)-Terme auf eine Seite und alle Zahlen auf die andere.`,
  R`Teile zum Schluss durch den Vorfaktor von \(x\) – und mache die Probe.`
];

const SCHRITT_HTML = R`
<div class="les"><b>Gegeben:</b><br>I: \(2x + y = 9\)<br>II: \(x - y = 3\)</div>

<div class="schritt" id="schritt-1">
  <div class="schritt-kopf"><span class="schritt-nr">1</span><b>Variable freistellen</b></div>
  <p>Beim <span class="fachwort" tabindex="0" data-tip="Verfahren, bei dem man eine Variable freistellt und den Term in die andere Gleichung einsetzt.">Einsetzungsverfahren</span> stellt man zuerst eine Variable frei. Hier bietet sich Gleichung II an, weil \(y\) dort keinen Vorfaktor hat:</p>
  <p>\(x - y = 3 \quad | +y - 3\) &nbsp;⇒&nbsp; \(y = x - 3\)</p>
  <p class="frage">Was bedeutet „eine Variable freistellen“?</p>
  <div class="mc">
    <button class="option" data-opt="1" data-ok="0">Beide Variablen auf eine Seite bringen</button>
    <button class="option" data-opt="1" data-ok="1">Eine Variable allein auf eine Seite bringen, z. B. \(y = \ldots\)</button>
    <button class="option" data-opt="1" data-ok="0">Beide Gleichungen addieren</button>
  </div>
</div>

<div class="schritt gesperrt" id="schritt-2">
  <div class="schritt-kopf"><span class="schritt-nr">2</span><b>In die andere Gleichung einsetzen</b></div>
  <p>Jetzt wird der Term für \(y\) aus Schritt 1 in Gleichung I eingesetzt – in Klammern.</p>
  <p class="frage">Welche Gleichung entsteht durch das Einsetzen?</p>
  <div class="mc">
    <button class="option" data-opt="2" data-ok="1">\(2x + (x - 3) = 9\)</button>
    <button class="option" data-opt="2" data-ok="0">\(2x + 3 = 9\)</button>
    <button class="option" data-opt="2" data-ok="0">\(x - (x - 3) = 3\)</button>
    <button class="option" data-opt="2" data-ok="0">\(2x + (x + 3) = 9\)</button>
  </div>
</div>

<div class="schritt gesperrt" id="schritt-3">
  <div class="schritt-kopf"><span class="schritt-nr">3</span><b>Gleichung lösen</b></div>
  <p>Löse die Gleichung aus Schritt 2 nach \(x\) auf.</p>
  <div class="felder"><label class="feld"><span>\(x =\)</span><input class="eingabe" id="sin-3" type="text" inputmode="decimal" autocomplete="off"></label></div>
</div>

<div class="schritt gesperrt" id="schritt-4">
  <div class="schritt-kopf"><span class="schritt-nr">4</span><b>Zweite Variable berechnen</b></div>
  <p>Setze dein \(x\) in den freigestellten Term \(y = x - 3\) ein.</p>
  <div class="felder"><label class="feld"><span>\(y =\)</span><input class="eingabe" id="sin-4" type="text" inputmode="decimal" autocomplete="off"></label></div>
</div>

<div class="schritt gesperrt" id="schritt-5">
  <div class="schritt-kopf"><span class="schritt-nr">5</span><b>Probe und Lösungsmenge</b></div>
  <p class="frage">Wie prüft man das Ergebnis richtig?</p>
  <div class="mc">
    <button class="option" data-opt="5" data-ok="0">Einsetzen in nur eine Gleichung</button>
    <button class="option" data-opt="5" data-ok="1">Einsetzen in beide Gleichungen und prüfen, ob beide stimmen</button>
    <button class="option" data-opt="5" data-ok="0">Die Probe ist nicht nötig</button>
  </div>
</div>`;

const SCHRITTE = {
  1:{ typ:'mc', hinweis:'Lies die Erklärung oben noch einmal genau.',
      tipp:R`Freistellen heißt: Am Ende steht die Variable ganz allein auf einer Seite des Gleichheitszeichens.`,
      erg:'' },
  2:{ typ:'mc', hinweis:'Überlege, in welche Gleichung eingesetzt wird und was genau eingesetzt wird.',
      tipp:R`Ersetze in Gleichung I das \(y\) durch den Term aus Schritt 1 – in Klammern. Gleichung II wurde in Schritt 1 schon benutzt.`,
      erg:R`Eingesetzt: \(2x + (x - 3) = 9\)` },
  3:{ typ:'zahl', sol:4, hinweis:'Prüfe deine Umformungen noch einmal.',
      tipp:R`Lass die Klammer weg (davor steht ein Plus), fasse die \(x\)-Terme zusammen und bringe dann die Zahl auf die andere Seite.`,
      erg:R`\(2x + (x - 3) = 9\) ⇒ \(3x - 3 = 9 \quad | +3\) ⇒ \(3x = 12 \quad | :3\) ⇒ \(x = 4\)` },
  4:{ typ:'zahl', sol:1, hinweis:'Setze dein Ergebnis aus Schritt 3 noch einmal ein.',
      tipp:R`Ersetze in \(y = x - 3\) das \(x\) durch dein Ergebnis aus Schritt 3 und rechne aus.`,
      erg:R`\(y = 4 - 3 = 1\)` },
  5:{ typ:'mc', hinweis:'Denke daran: Die Lösung gehört zum ganzen System.',
      tipp:R`Eine Lösung muss beide Gleichungen gleichzeitig erfüllen.`,
      erg:R`Probe I: \(2 \cdot 4 + 1 = 9\) ✓ · II: \(4 - 1 = 3\) ✓<br><b>Lösungsmenge: \(\mathbb{L} = \{(4 \mid 1)\}\)</b>` }
};

const KARTEN = [
// ---------- 1 Schritt für Schritt ----------
{ id:'schritte', tab:'🎯 Schritt für Schritt', titel:'🎯 Schritt für Schritt: Einsetzungsverfahren',
  unter:'Löse das Gleichungssystem Schritt für Schritt. Der nächste Schritt öffnet sich, sobald der vorige stimmt.',
  html:SCHRITT_HTML },
// ---------- 2 Einsetzung ----------
{ id:'einsetz', tab:'➕ Einsetzung', titel:'➕ Einsetzungsverfahren – Übungen',
  unter:'Löse die Gleichungssysteme mit dem Einsetzungsverfahren.',
  stufen:{
    G:{ intro:R`<div class="vorgehen"><b>💡 Erinnerung: Einsetzungsverfahren</b><ol>
        <li>Eine Variable freistellen (z. B. \(y = \ldots\)).</li>
        <li>Den Term mit Klammer in die andere Gleichung einsetzen.</li>
        <li>Lösen und zurückeinsetzen für die zweite Variable.</li></ol></div>`,
      aufgaben:[
      { id:'e1a', titel:'Aufgabe 1', felder:xy(2,4), tipps:TIPPS_EINSETZ,
        text:gls('y = 2x','x + y = 6'),
        loesung:R`I in II: \(x + 2x = 6\)<br>\(3x = 6 \quad | :3\) &nbsp;⇒&nbsp; \(x = 2\)<br>In I: \(y = 2 \cdot 2 = 4\)<br>Probe II: \(2 + 4 = 6\) ✓<br><b>Lösung: \(x = 2,\ y = 4\)</b>` },
      { id:'e1b', titel:'Aufgabe 2', felder:xy(3,2), tipps:TIPPS_EINSETZ,
        text:gls('x = y + 1','2x + y = 8'),
        loesung:R`I in II: \(2 \cdot (y + 1) + y = 8\)<br>\(2y + 2 + y = 8 \quad | -2\)<br>\(3y = 6 \quad | :3\) &nbsp;⇒&nbsp; \(y = 2\)<br>In I: \(x = 2 + 1 = 3\)<br>Probe II: \(6 + 2 = 8\) ✓<br><b>Lösung: \(x = 3,\ y = 2\)</b>` } ]},
    F:{ intro:R`<div class="vorgehen"><b>🔥 Fortgeschritten</b><p style="margin:6px 0 0">Hier musst du erst selbst eine Variable freistellen, bevor du einsetzen kannst.</p></div>`,
      aufgaben:[
      { id:'e2a', titel:'Aufgabe 1', felder:xy(3,2), tipps:TIPPS_EINSETZ,
        text:gls('3x + y = 11','2x - y = 4'),
        loesung:R`Aus II: \(y = 2x - 4\)<br>In I: \(3x + (2x - 4) = 11\)<br>\(5x - 4 = 11 \quad | +4\)<br>\(5x = 15 \quad | :5\) &nbsp;⇒&nbsp; \(x = 3\)<br>\(y = 6 - 4 = 2\)<br>Probe: I \(9 + 2 = 11\) ✓ · II \(6 - 2 = 4\) ✓<br><b>Lösung: \(x = 3,\ y = 2\)</b>` },
      { id:'e2b', titel:'Aufgabe 2', felder:xy(2,3), tipps:TIPPS_EINSETZ,
        text:gls('4x - 2y = 2','x + 3y = 11'),
        loesung:R`Aus II: \(x = 11 - 3y\)<br>In I: \(4 \cdot (11 - 3y) - 2y = 2\)<br>\(44 - 12y - 2y = 2 \quad | -44\)<br>\(-14y = -42 \quad | :(-14)\) &nbsp;⇒&nbsp; \(y = 3\)<br>\(x = 11 - 9 = 2\)<br>Probe: I \(8 - 6 = 2\) ✓ · II \(2 + 9 = 11\) ✓<br><b>Lösung: \(x = 2,\ y = 3\)</b>` } ]},
    P:{ intro:R`<div class="vorgehen"><b>⚡ Profi</b><p style="margin:6px 0 0">Negative Vorfaktoren – Vorsicht beim Auflösen der Klammer!</p></div>`,
      aufgaben:[
      { id:'e3a', titel:'Aufgabe 1', felder:xy(2,4), tipps:TIPPS_EINSETZ,
        text:gls('5x - 3y = -2','2x + y = 8'),
        loesung:R`Aus II: \(y = 8 - 2x\)<br>In I: \(5x - 3 \cdot (8 - 2x) = -2\)<br>\(5x - 24 + 6x = -2 \quad | +24\)<br>\(11x = 22 \quad | :11\) &nbsp;⇒&nbsp; \(x = 2\)<br>\(y = 8 - 4 = 4\)<br>Probe: I \(10 - 12 = -2\) ✓ · II \(4 + 4 = 8\) ✓<br><b>Lösung: \(x = 2,\ y = 4\)</b>` },
      { id:'e3b', titel:'Aufgabe 2', felder:xy(2,1), tipps:TIPPS_EINSETZ,
        text:gls('3x - 2y = 4','6x + y = 13'),
        loesung:R`Aus II: \(y = 13 - 6x\)<br>In I: \(3x - 2 \cdot (13 - 6x) = 4\)<br>\(3x - 26 + 12x = 4 \quad | +26\)<br>\(15x = 30 \quad | :15\) &nbsp;⇒&nbsp; \(x = 2\)<br>\(y = 13 - 12 = 1\)<br>Probe: I \(6 - 2 = 4\) ✓ · II \(12 + 1 = 13\) ✓<br><b>Lösung: \(x = 2,\ y = 1\)</b>` } ]}
  }},
// ---------- 3 Gleichsetzung ----------
{ id:'gleich', tab:'⚖️ Gleichsetzung', titel:'⚖️ Gleichsetzungsverfahren – Übungen',
  unter:'Stelle beide Gleichungen nach demselben Ausdruck um und setze sie gleich.',
  stufen:{
    G:{ intro:R`<div class="vorgehen"><b>💡 Erinnerung: Gleichsetzungsverfahren</b><ol>
        <li>Beide Gleichungen nach derselben Variable umstellen (z. B. \(y = \ldots\)).</li>
        <li>Die rechten Seiten gleichsetzen und lösen.</li>
        <li>Einsetzen, zweite Variable berechnen, Probe.</li></ol></div>`,
      aufgaben:[
      { id:'g1a', titel:'Aufgabe 1', felder:xy(2,5), tipps:TIPPS_GLEICH,
        text:gls('y = 3x - 1','y = x + 3'),
        loesung:R`Gleichsetzen: \(3x - 1 = x + 3 \quad | -x + 1\)<br>\(2x = 4 \quad | :2\) &nbsp;⇒&nbsp; \(x = 2\)<br>In II: \(y = 2 + 3 = 5\)<br>Probe I: \(6 - 1 = 5\) ✓<br><b>Lösung: \(x = 2,\ y = 5\)</b>` },
      { id:'g1b', titel:'Aufgabe 2', felder:xy(2,8), tipps:TIPPS_GLEICH,
        text:gls('y = 2x + 4','y = 5x - 2'),
        loesung:R`Gleichsetzen: \(2x + 4 = 5x - 2 \quad | -2x + 2\)<br>\(6 = 3x \quad | :3\) &nbsp;⇒&nbsp; \(x = 2\)<br>In I: \(y = 4 + 4 = 8\)<br>Probe II: \(10 - 2 = 8\) ✓<br><b>Lösung: \(x = 2,\ y = 8\)</b>` } ]},
    F:{ intro:R`<div class="vorgehen"><b>🔥 Fortgeschritten</b><p style="margin:6px 0 0">Beide Gleichungen müssen erst umgeformt werden, bevor du gleichsetzen kannst.</p></div>`,
      aufgaben:[

// LOGIK
// ============================================================
const STUFEN_NAME = {G:'📖 Grundlagen', F:'🎯 Fortgeschritten', P:'🏆 Profi'};
const TASK = {}, zustand = {}, aktStufe = {};

function aufgabeHTML(a){
  const felder = a.felder.map(f =>
    `<label class="feld"><span>${f.label}</span><input class="eingabe" id="${a.id}-${f.k}" type="text" inputmode="decimal" autocomplete="off">${f.einheit ? `<span>${f.einheit}</span>` : ''}</label>`
  ).join('');
  const tipps = a.tipps.map((t,i) =>
    `<button class="hilfe-btn" data-tipp="${a.id}" data-i="${i}" ${i>0?'hidden':''}>💡 Tipp ${i+1}</button><div class="hilfe-inhalt" id="tipp-${a.id}-${i}">${t}</div>`
  ).join('');
  return `<div class="aufgabe" id="auf-${a.id}">
    <h3>${a.titel}</h3>${a.text}
    <div class="felder">${felder}</div>
    <div class="knoepfe">
      <button class="btn btn-pruefen" data-pruefe="${a.id}">Prüfen ✔</button>
      <button class="btn btn-leeren" data-leeren="${a.id}" hidden>Leeren ↺</button>
    </div>
    <div class="fb" id="fb-${a.id}" role="status"></div>
    <div class="hilfe" id="hilfe-${a.id}">${tipps}
      <button class="hilfe-btn" data-ml="${a.id}">📝 Musterlösung</button>
      <div class="hilfe-inhalt" id="ml-${a.id}">${a.loesung}</div>
    </div>
  </div>`;
}

function render(){
  const tabs = document.getElementById('tabs'), main = document.getElementById('karten');
  KARTEN.forEach((k, ki) => {
    tabs.insertAdjacentHTML('beforeend', `<button class="tab" data-tab="${ki}">${k.tab}</button>`);
    let html = `<section class="karte" id="karte-${ki}"><h2>${k.titel}</h2><p class="unter">${k.unter}</p>`;
    if (k.stufen){
      const keys = Object.keys(k.stufen);
      aktStufe[k.id] = keys[0];
      if (keys.length > 1)
        html += `<div class="stufen">` + keys.map(s =>
          `<button class="stufe${s===keys[0]?' aktiv':''}" data-karte="${k.id}" data-s="${s}">${STUFEN_NAME[s]}</button>`).join('') + `</div>`;
      keys.forEach(s => {
        const st = k.stufen[s];
        html += `<div class="panel${s===keys[0]?' aktiv':''}" id="panel-${k.id}-${s}">${st.intro||''}` +
          st.aufgaben.map(a => {
            a.karte = k.id; a.stufe = s; TASK[a.id] = a;
            zustand[a.id] = {status:'offen', jeFalsch:false};
            return aufgabeHTML(a);
          }).join('') + `</div>`;
      });
    } else html += k.html || '';
    main.insertAdjacentHTML('beforeend', html + '</section>');
  });
}

function typeset(el){ if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]); }

function lese(v){
  v = v.replace(/\s/g,'').replace(/[−–]/g,'-').replace(',','.');
  if (v === '' ) return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

function setFb(id, art, html){
  const el = document.getElementById('fb-'+id);
  el.className = 'fb ' + art;
  el.innerHTML = html;
  typeset(el);
}

function pruefe(id){
  const a = TASK[id], z = zustand[id];
  if (z.status !== 'offen') return;
  const inp = a.felder.map(f => document.getElementById(`${id}-${f.k}`));
  const w = inp.map(i => lese(i.value));
  if (w.some(v => v === null)){ setFb(id, 'nok', '✏️ Bitte jedes Feld mit einer Zahl ausfüllen.'); return; }
  const gleich = (p, q) => Math.abs(p - q) < 1e-6;
  const ok = a.felder.map((f,i) => gleich(w[i], f.sol));
  inp.forEach((el,i) => { el.classList.add(ok[i] ? 'ok' : 'nok'); el.readOnly = true; });
  if (ok.every(Boolean)){
    z.status = 'richtig';
    setFb(id, 'ok', z.jeFalsch ? '✅ Richtig – gut korrigiert!' : '✅ Richtig! Sehr gut.');
    return;
  }
  z.status = 'falsch'; z.jeFalsch = true;
  let msg;
  if (a.felder.length === 2 && gleich(w[0], a.felder[1].sol) && gleich(w[1], a.felder[0].sol))
    msg = 'Deine Zahlen passen – aber stehen sie im richtigen Feld?';
  else if (a.felder.length === 1)
    msg = 'Noch nicht. Setze deinen Wert zur Probe in die Gleichung ein.';
  else {
    const falsch = a.felder.filter((f,i) => !ok[i]).map(f => f.name);
    msg = (falsch.length === a.felder.length ? 'Beide Werte stimmen noch nicht.' : `Der Wert für ${falsch[0]} stimmt noch nicht.`)
        + ' Mache die Probe in beiden Gleichungen.';
  }
  setFb(id, 'nok', '❌ ' + msg);
  document.querySelector(`[data-leeren="${id}"]`).hidden = false;
  document.getElementById('hilfe-'+id).style.display = 'block';
}

function leere(id){
  const a = TASK[id];
  a.felder.forEach(f => {
    const el = document.getElementById(`${id}-${f.k}`);
    el.value = ''; el.classList.remove('ok','nok'); el.readOnly = false;
  });
  const fb = document.getElementById('fb-'+id); fb.className = 'fb'; fb.innerHTML = '';
  document.querySelector(`[data-leeren="${id}"]`).hidden = true;
  zustand[id].status = 'offen';
}

function zeigeTipp(id, i){
  const el = document.getElementById(`tipp-${id}-${i}`);
  el.classList.toggle('offen');
  const naechster = document.querySelector(`[data-tipp="${id}"][data-i="${i+1}"]`);
  if (naechster && el.classList.contains('offen')) naechster.hidden = false;
}

function zeigeKarte(n){
  document.querySelectorAll('.karte').forEach((c,i) => c.classList.toggle('aktiv', i === n));
  document.querySelectorAll('.tab').forEach((b,i) => b.classList.toggle('aktiv', i === n));
  if (KARTEN[n].id === 'ausw') baueAuswertung();
  const t = document.querySelectorAll('.tab')[n];
  if (t && t.scrollIntoView) t.scrollIntoView({block:'nearest', inline:'center'});
}

function setzeStufe(kid, s){
  aktStufe[kid] = s;
  document.querySelectorAll(`[id^="panel-${kid}-"]`).forEach(p => p.classList.toggle('aktiv', p.id === `panel-${kid}-${s}`));
  document.querySelectorAll(`.stufe[data-karte="${kid}"]`).forEach(b => b.classList.toggle('aktiv', b.dataset.s === s));
}

function baueAuswertung(){
  let ges = 0, richtig = 0, html = '';
  KARTEN.filter(k => k.stufen).forEach(k => {
    const s = aktStufe[k.id];
    html += `<h3 class="aw-titel">${k.titel} – ${STUFEN_NAME[s]}</h3>`;
    k.stufen[s].aufgaben.forEach(a => {
      const z = zustand[a.id]; ges++;
      let cls = '', txt = '○ noch nicht bearbeitet';
      if (z.status === 'richtig'){ richtig++; cls = 'ok'; txt = z.jeFalsch ? '✅ richtig (nach Korrektur)' : '✅ richtig'; }
      else if (z.jeFalsch){ cls = 'nok'; txt = '❌ noch nicht gelöst'; }
      html += `<div class="aw-zeile ${cls}"><span>${a.titel}</span><span>${txt}</span></div>`;
    });
  });
  if (typeof schrittAuswertung === 'function'){ const r = schrittAuswertung(); ges += r.ges; richtig += r.richtig; html = r.html + html; }
  document.getElementById('aw-score').textContent = `${richtig} von ${ges}`;
  const q = ges ? richtig / ges : 0;
  document.getElementById('aw-text').textContent =
    q === 1 ? '🌟 Alles gelöst – hervorragend!' :
    q >= 0.7 ? '👍 Schon sehr gut! Schau dir die offenen Aufgaben noch an.' :
    q >= 0.4 ? '🙂 Guter Anfang – die Tipps helfen dir bei den übrigen Aufgaben.' :
               '💪 Bearbeite die Karten nacheinander – mit Tipps und Musterlösung.';
  const liste = document.getElementById('aw-liste');
  liste.innerHTML = html;
  typeset(liste);
}

// SCHRITT-FÜR-SCHRITT
// ============================================================
const sz = {};
Object.keys(SCHRITTE).forEach(n => sz[n] = {status:'offen', jeFalsch:false});

function baueSchritte(){
  // Einmal beim Laden: MC-Optionen mischen (Fisher-Yates), danach Zusatz-Elemente anhängen
  document.querySelectorAll('.schritt .mc').forEach(box => {
    const opts = Array.from(box.children);
    for (let i = opts.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [opts[i], opts[j]] = [opts[j], opts[i]];
    }
    opts.forEach(o => box.appendChild(o));
  });
  Object.keys(SCHRITTE).forEach(n => {
    const s = SCHRITTE[n];
    document.getElementById('schritt-'+n).insertAdjacentHTML('beforeend',
      `<div class="knoepfe">
         <button class="btn btn-pruefen" data-spruef="${n}">Prüfen ✔</button>
         <button class="btn btn-leeren" data-sleer="${n}" hidden>Leeren ↺</button>
       </div>
       <div class="fb" id="sfb-${n}" role="status"></div>
       <div class="hilfe" id="shilfe-${n}">
         <button class="hilfe-btn" data-stipp="${n}">💡 Tipp</button>
         <div class="hilfe-inhalt" id="stipp-${n}">${s.tipp}</div>
       </div>
       ${s.erg ? `<div class="ergebnis" id="serg-${n}" hidden>${s.erg}</div>` : ''}`);
  });
}

function sFb(n, art, html){
  const el = document.getElementById('sfb-'+n);
  el.className = 'fb ' + art; el.innerHTML = html; typeset(el);
}

function pruefeSchritt(n){
  const s = SCHRITTE[n], z = sz[n];
  if (z.status !== 'offen') return;
  let ok;
  if (s.typ === 'mc'){
    const wahl = document.querySelector(`#schritt-${n} .option.gewaehlt`);
    if (!wahl){ sFb(n, 'nok', '👆 Bitte zuerst eine Antwort antippen.'); return; }
    ok = wahl.dataset.ok === '1';
    wahl.classList.add(ok ? 'richtig' : 'falsch');
  } else {
    const inp = document.getElementById('sin-'+n);
    const v = lese(inp.value);
    if (v === null){ sFb(n, 'nok', '✏️ Bitte eine Zahl eingeben.'); return; }
    ok = Math.abs(v - s.sol) < 1e-6;
    inp.classList.add(ok ? 'ok' : 'nok'); inp.readOnly = true;
  }
  if (ok){
    z.status = 'richtig';
    sFb(n, 'ok', '✅ Richtig!');
    document.getElementById('schritt-'+n).classList.add('fertig');
    const erg = document.getElementById('serg-'+n);
    if (erg){ erg.hidden = false; typeset(erg); }
    const next = document.getElementById('schritt-'+(+n+1));
    if (next) next.classList.remove('gesperrt');
    else sFb(n, 'ok', '✅ Richtig! 🎉 Du hast das Einsetzungsverfahren Schritt für Schritt gelöst.');
  } else {
    z.status = 'falsch'; z.jeFalsch = true;
    sFb(n, 'nok', '❌ Noch nicht. ' + s.hinweis);
    document.querySelector(`[data-sleer="${n}"]`).hidden = false;
    document.getElementById('shilfe-'+n).style.display = 'block';
  }
}

function leereSchritt(n){
  if (sz[n].status !== 'falsch') return;
  document.querySelectorAll(`#schritt-${n} .option`).forEach(o => o.classList.remove('gewaehlt','richtig','falsch'));
  const inp = document.getElementById('sin-'+n);
  if (inp){ inp.value = ''; inp.classList.remove('ok','nok'); inp.readOnly = false; }
  const fb = document.getElementById('sfb-'+n); fb.className = 'fb'; fb.innerHTML = '';
  document.querySelector(`[data-sleer="${n}"]`).hidden = true;
  sz[n].status = 'offen';
}

function schrittAuswertung(){
  const alle = Object.keys(sz);
  const fertig = alle.every(n => sz[n].status === 'richtig');
  const fehler = alle.some(n => sz[n].jeFalsch);
  const angefangen = alle.some(n => sz[n].status !== 'offen' || sz[n].jeFalsch);
  let cls = '', txt = '○ noch nicht bearbeitet';
  if (fertig){ cls = 'ok'; txt = fehler ? '✅ geschafft (nach Korrektur)' : '✅ geschafft'; }
  else if (angefangen){ cls = fehler ? 'nok' : ''; txt = `◐ ${alle.filter(n => sz[n].status === 'richtig').length} von ${alle.length} Schritten`; }
  return { ges:1, richtig: fertig ? 1 : 0,
    html:`<h3 class="aw-titel">🎯 Schritt für Schritt</h3><div class="aw-zeile ${cls}"><span>Geführtes Beispiel (5 Schritte)</span><span>${txt}</span></div>` };
}

render();
baueSchritte();

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  const fw = e.target.closest('.fachwort');
  if (fw){ fw.classList.toggle('zeigen'); return; }
  if (!b) return;
  const d = b.dataset;
  if (d.tab !== undefined) zeigeKarte(+d.tab);
  else if (d.s) setzeStufe(d.karte, d.s);
  else if (d.pruefe) pruefe(d.pruefe);
  else if (d.leeren) leere(d.leeren);
  else if (d.tipp) zeigeTipp(d.tipp, +d.i);
  else if (d.ml) document.getElementById('ml-'+d.ml).classList.toggle('offen');
  else if (d.opt){
    if (sz[d.opt].status !== 'offen') return;
    b.parentElement.querySelectorAll('.option').forEach(o => o.classList.toggle('gewaehlt', o === b));
  }
  else if (d.spruef) pruefeSchritt(d.spruef);
  else if (d.sleer) leereSchritt(d.sleer);
  else if (d.stipp) document.getElementById('stipp-'+d.stipp).classList.toggle('offen');
  else if (b.id === 'dino'){
    const t = document.getElementById('dinoTip');
    t.classList.add('zeigen'); setTimeout(() => t.classList.remove('zeigen'), 2500);
  }
});

zeigeKarte(0);
</script>
