<script>
const M = String.raw;

/* =====================================================================
   DATEN
   Richtung: 's' = Preis senken, 'e' = Preis erhöhen, n = Anzahl Schritte
   ===================================================================== */
const LVLINFO = {
  G:'Grundlagen: Die Hauptbedingung ist vorgegeben, ein Hinweis und eine Wertetabelle helfen dir bei den Nebenbedingungen.',
  F:'Fortgeschritten: Du stellst Haupt- und Nebenbedingungen selbst auf und deutest deine Ergebnisse.',
  P:'Profi (LK): Die Nachfrage hängt nicht mehr linear von der Anzahl der Preisschritte ab. Definitionsbereich und GeoGebra sind gefragt.'
};

const CTX = [
/* ---------------------------------------------------------------- SHIRT */
{ id:'shirt', tab:'👕 T-Shirts', title:'👕 Frau Hollands T-Shirt-Laden', xUnit:'Shirts', xName:'verkauften Shirts',
  lin:{
    story: M`<p>Frau Holland verkaufte im letzten Jahr \(250\) T-Shirts zu je \(30\) €. Sie rechnet damit, dass sie pro \(0{,}50\) € Preissenkung \(2\) T-Shirts mehr verkauft. Im Einkauf kostet sie jedes Shirt \(10\) €.</p>`,
    hb: M`<p><b>Einnahmen:</b> \(E = p \cdot x\) &nbsp; &nbsp; <b>Gewinn:</b> \(G = (p - 10) \cdot x\)</p><p>\(p\): Preis pro Shirt in €, \(x\): Anzahl verkaufter Shirts</p>`,
    nb: M`<p><b>Hinweis zu den Nebenbedingungen:</b> Führe \(k\) = Anzahl der \(0{,}50\)-€-Preissenkungen ein. Schreibe den Preis \(p(k)\) und die Anzahl \(x(k)\) als lineare Funktionen von \(k\). Die Wertetabelle unten hilft dir.</p><p>Kommt für \(k\) ein <b>negativer</b> Wert heraus, bedeutet das: Der Preis wird <b>erhöht</b> statt gesenkt.</p>`,
    kText:'Anzahl der 0,50-€-Senkungen',
    row0:[30,250], rows:[[1,29.5,252],[2,29,254],[3,28.5,256]],
    tableSol: M`<p>Jede Senkung macht das Shirt \(0{,}50\) € billiger und bringt \(2\) Shirts mehr: \(k=1\): \(29{,}50\) € und \(252\) Shirts, \(k=2\): \(29\) € und \(254\), \(k=3\): \(28{,}50\) € und \(256\).</p><p>Allgemein: \(p(k)=30-0{,}5k\) und \(x(k)=250+2k\).</p>`,
    E:{dir:'e', n:32.5, p:46.25, x:185, v:8556.25},
    G:{dir:'e', n:42.5, p:51.25, x:165, v:6806.25},
    solE: M`<p><b>Variable:</b> \(k\) = Anzahl der \(0{,}50\)-€-Senkungen (negativ heißt Erhöhung).</p>
      <p><b>Nebenbedingungen:</b> \(p(k)=30-0{,}5k\) und \(x(k)=250+2k\)</p>
      <p><b>Zielfunktion:</b> \(E(k)=(30-0{,}5k)(250+2k)=-k^2-65k+7500\)</p>
      <p><b>Maximum:</b> \(E'(k)=-2k-65=0 \Rightarrow k=-32{,}5\); \(E''(k)=-2 \lt 0\), also Maximum.</p>
      <p><b>Deutung:</b> \(k\) ist negativ. Der Preis wird also \(32{,}5\)-mal um \(0{,}50\) € <b>erhöht</b>, insgesamt um \(16{,}25\) €.</p>
      <p><b>Ergebnis:</b> \(p=46{,}25\) €, \(x=185\) Shirts, \(E=46{,}25\cdot 185=8556{,}25\) €</p>`,
    solG: M`<p><b>Zielfunktion:</b> Pro Shirt bleiben \(p-10\) € übrig: \(G(k)=(30-0{,}5k-10)(250+2k)=(20-0{,}5k)(250+2k)=-k^2-85k+5000\)</p>
      <p><b>Maximum:</b> \(G'(k)=-2k-85=0 \Rightarrow k=-42{,}5\); \(G''(k)=-2 \lt 0\), also Maximum.</p>
      <p><b>Deutung:</b> \(42{,}5\) Erhöhungen um je \(0{,}50\) €, also \(21{,}25\) € teurer.</p>
      <p><b>Ergebnis:</b> \(p=51{,}25\) €, \(x=165\) Shirts, \(G=(51{,}25-10)\cdot 165=6806{,}25\) €</p>`,
    deut:[
      { q:M`Dein \(k\) ist negativ. Was bedeutet das für Frau Holland – und ist die Annahme „\(2\) Shirts pro \(0{,}50\) €“ auch für Preiserhöhungen plausibel?`,
        a:M`Negatives \(k\) heißt: Das Modell rät zu einer deutlichen <b>Preiserhöhung</b>. Der Grund: Laut Annahme reagieren die Kund*innen kaum auf den Preis (nur \(2\) Shirts pro \(0{,}50\) €). Ob bei \(46\) € statt \(30\) € wirklich nur \(65\) Kund*innen wegbleiben, ist fraglich – die Annahme wurde für Senkungen getroffen und wird hier weit über ihren Bereich hinaus benutzt. Das Ergebnis muss also kritisch geprüft werden.` },
      { q:M`Warum liegt der gewinnoptimale Preis höher als der einnahmenoptimale?`,
        a:M`Jedes verkaufte Shirt kostet \(10\) € im Einkauf. Zusätzliche Verkäufe bringen Einnahmen, aber eben auch Kosten. Für den Gewinn lohnt es sich deshalb, weniger Shirts zu einem höheren Preis zu verkaufen.` }
    ]
  },
  pro:{
    story: M`<p>Frau Holland hat genauer nachgeforscht – diesmal nur für <b>Preissenkungen</b>. Die ersten Senkungen locken viele neue Kund*innen an, weitere Senkungen immer weniger. Die Marktanalyse liefert für \(k\) Senkungen um je \(0{,}50\) € (Startpreis \(30\) €):</p>
      <p>\(x(k) = 250 + 8k - 0{,}1k^2\)</p><p>Einkauf weiterhin \(10\) € pro Shirt.</p>`,
    mc:{ q:M`Für welche \(k\) ist dieses Modell sinnvoll?`,
      opts:[ {t:M`\(0 \le k \le 40\)`, ok:1}, {t:M`\(0 \le k \le 60\)`, ok:0}, {t:M`\(0 \le k \le 84{,}2\)`, ok:0}, {t:M`\(k \ge 0\)`, ok:0} ],
      tip: M`Überlege: Soll eine weitere Preissenkung wirklich dazu führen, dass <b>weniger</b> Shirts verkauft werden? Untersuche, bis wohin \(x(k)\) wächst.`,
      sol: M`<p>\(x(k)\) ist eine nach unten geöffnete Parabel mit \(x'(k)=8-0{,}2k=0 \Rightarrow k=40\). Danach würden weitere Preissenkungen zu <b>weniger</b> Käufer*innen führen – das ist unrealistisch. Also \(D=[0;40]\). (Bei \(k=60\) wäre der Preis \(0\) €.)</p>` },
    E:{dir:'s', n:9.10, p:25.45, x:314.53, v:8004.51},
    G:{dir:'s', n:3.03, p:28.48, x:273.33, v:5052.36},
    solE: M`<p><b>Zielfunktion:</b> \(E(k)=(30-0{,}5k)(250+8k-0{,}1k^2)=0{,}05k^3-7k^2+115k+7500\), \(D=[0;40]\)</p>
      <p><b>GeoGebra:</b> <code>E(x)=Funktion((30-0.5x)(250+8x-0.1x^2),0,40)</code>, dann <code>Extremum(E,0,40)</code> liefert den Hochpunkt bei \(k\approx 9{,}10\).</p>
      <p><b>Randwerte:</b> \(E(0)=7500\), \(E(40)=4100\) – beide kleiner, also ist der Hochpunkt das globale Maximum.</p>
      <p><b>Ergebnis:</b> etwa \(9{,}1\) Senkungen, \(p\approx 25{,}45\) €, \(x\approx 314{,}5\), also rund \(315\) Shirts, \(E\approx 8004{,}51\) €</p>
      <p>Auch rechnerisch möglich: \(E'(k)=0{,}15k^2-14k+115=0\) liefert \(k\approx 9{,}10\). Die zweite Lösung \(k\approx 84{,}2\) liegt außerhalb von \(D\).</p>`,
    solG: M`<p><b>Zielfunktion:</b> \(G(k)=(20-0{,}5k)(250+8k-0{,}1k^2)=0{,}05k^3-6k^2+35k+5000\), \(D=[0;40]\)</p>
      <p><b>GeoGebra:</b> <code>Extremum(G,0,40)</code> liefert den Hochpunkt bei \(k\approx 3{,}03\).</p>
      <p><b>Randwerte:</b> \(G(0)=5000\), \(G(40)=0\).</p>
      <p><b>Ergebnis:</b> etwa \(3\) Senkungen, \(p\approx 28{,}48\) €, \(x\approx 273\) Shirts, \(G\approx 5052{,}36\) €</p>
      <p><b>Vergleich:</b> Mit dem genaueren Modell lohnt sich plötzlich eine <b>Senkung</b> – das lineare Modell hatte eine Erhöhung empfohlen. Das Ergebnis hängt stark von der Modellannahme ab.</p>`
  }
},
/* ---------------------------------------------------------------- ABIBALL */
{ id:'abi', tab:'🎓 Abiball', title:'🎓 Tickets für den Abiball', xUnit:'Tickets', xName:'verkauften Tickets',
  lin:{
    story: M`<p>Das Abiball-Komitee verkauft Tickets. Bei einem Preis von \(60\) € pro Ticket haben sich \(220\) Gäste angemeldet. Eine Umfrage ergibt: Pro \(2\) € Preissenkung kämen \(10\) Gäste mehr. Pro Gast kostet das Catering \(24\) €.</p>`,
    hb: M`<p><b>Einnahmen:</b> \(E = p \cdot x\) &nbsp; &nbsp; <b>Gewinn:</b> \(G = (p - 24) \cdot x\)</p><p>\(p\): Ticketpreis in €, \(x\): Anzahl verkaufter Tickets</p>`,
    nb: M`<p><b>Hinweis zu den Nebenbedingungen:</b> Führe \(k\) = Anzahl der \(2\)-€-Preissenkungen ein. Schreibe den Preis \(p(k)\) und die Anzahl \(x(k)\) als lineare Funktionen von \(k\). Die Wertetabelle unten hilft dir.</p><p>Kommt für \(k\) ein <b>negativer</b> Wert heraus, bedeutet das: Der Preis wird <b>erhöht</b> statt gesenkt.</p>`,
    kText:'Anzahl der 2-€-Senkungen',
    row0:[60,220], rows:[[1,58,230],[2,56,240],[3,54,250]],
    tableSol: M`<p>Jede Senkung macht das Ticket \(2\) € billiger und bringt \(10\) Gäste mehr: \(k=1\): \(58\) € und \(230\), \(k=2\): \(56\) € und \(240\), \(k=3\): \(54\) € und \(250\).</p><p>Allgemein: \(p(k)=60-2k\) und \(x(k)=220+10k\).</p>`,
    E:{dir:'s', n:4, p:52, x:260, v:13520},
    G:{dir:'e', n:2, p:64, x:200, v:8000},
    solE: M`<p><b>Variable:</b> \(k\) = Anzahl der \(2\)-€-Senkungen.</p>
      <p><b>Nebenbedingungen:</b> \(p(k)=60-2k\) und \(x(k)=220+10k\)</p>
      <p><b>Zielfunktion:</b> \(E(k)=(60-2k)(220+10k)=-20k^2+160k+13200\)</p>
      <p><b>Maximum:</b> \(E'(k)=-40k+160=0 \Rightarrow k=4\); \(E''(k)=-40 \lt 0\), also Maximum.</p>
      <p><b>Ergebnis:</b> \(4\) Senkungen um je \(2\) €: \(p=52\) €, \(x=260\) Tickets, \(E=52\cdot 260=13520\) €</p>`,
    solG: M`<p><b>Zielfunktion:</b> \(G(k)=(60-2k-24)(220+10k)=(36-2k)(220+10k)=-20k^2-80k+7920\)</p>
      <p><b>Maximum:</b> \(G'(k)=-40k-80=0 \Rightarrow k=-2\); \(G''(k)=-40 \lt 0\), also Maximum.</p>
      <p><b>Deutung:</b> \(k=-2\): Der Preis wird \(2\)-mal um \(2\) € <b>erhöht</b>.</p>
      <p><b>Ergebnis:</b> \(p=64\) €, \(x=200\) Tickets, \(G=(64-24)\cdot 200=8000\) €</p>`,
    deut:[
      { q:M`Für maximale Einnahmen soll der Preis sinken, für maximalen Gewinn steigen. Wie passt das zusammen?`,
        a:M`Jeder zusätzliche Gast bringt zwar Ticketgeld, kostet aber \(24\) € Catering. Bei den Einnahmen zählen die Kosten nicht – deshalb lohnen sich dort viele Gäste. Beim Gewinn lohnt sich jeder zusätzliche Gast nur, wenn er deutlich mehr als \(24\) € einbringt. Deshalb ist dort ein höherer Preis mit weniger Gästen besser.` },
      { q:M`Sollte das Komitee überhaupt den Gewinn maximieren?`,
        a:M`Das ist eine Frage der Ziele, nicht der Mathematik. Muss der Ball Saalmiete, DJ und Deko bezahlen, ist Gewinn wichtig. Soll aber möglichst der ganze Jahrgang mit Familie kommen, ist ein niedriger Preis mit vielen Gästen sinnvoller – auch wenn der Gewinn kleiner ausfällt. Das Modell liefert Entscheidungsgrundlagen, keine Entscheidung.` }
    ]
  },
  pro:{
    story: M`<p>Eine genauere Umfrage (nur für <b>Preissenkungen</b>) ergibt für \(k\) Senkungen um je \(2\) € (Startpreis \(60\) €):</p>

/* Wiederholung: Scheitelpunkt quadratischer Funktionen */
const WDH = {
  G:{ task:M`<p>Gib den Scheitelpunkt der Parabel \(f(x) = -(x-2)^2 + 7\) an. Handelt es sich um einen Hoch- oder Tiefpunkt?</p>`,
      f:[{lab:'x-Koordinate', v:2},{lab:'y-Koordinate', v:7}],
      tips:[M`Die Scheitelpunktform lautet \(f(x)=a(x-d)^2+e\). Lies \(d\) und \(e\) ab – Vorsicht beim Vorzeichen von \(d\).`],
      sol:M`<p>Vergleich mit \(a(x-d)^2+e\): \(d=2\), \(e=7\), also \(S(2|7)\). Wegen \(a=-1 \lt 0\) ist die Parabel nach unten geöffnet: \(S\) ist ein <b>Hochpunkt</b>.</p>` },
  F:{ task:M`<p>Bestimme den Scheitelpunkt von \(f(x) = -2x^2 + 12x - 7\) mit quadratischer Ergänzung (oder über \(f'(x)=0\)).</p>`,
      f:[{lab:'x-Koordinate', v:3},{lab:'y-Koordinate', v:11}],
      tips:[M`Klammere zuerst \(-2\) aus den Termen mit \(x\) aus. Ergänze dann in der Klammer zu einem Binom.`,
            M`Alternative: Beim Scheitelpunkt ist die Steigung null. Setze \(f'(x)=0\).`],
      sol:M`<p>\(f(x)=-2(x^2-6x)-7=-2(x^2-6x+9-9)-7=-2(x-3)^2+18-7=-2(x-3)^2+11\)</p><p>Also \(S(3|11)\), ein Hochpunkt. (Kontrolle: \(f'(x)=-4x+12=0 \Rightarrow x=3\), \(f(3)=11\).)</p>` },
  P:{ task:M`<p>Die Parabel \(f(x) = -0{,}5x^2 + 4x + c\) hat als größten Funktionswert \(10\). Bestimme die Stelle des Maximums und den Parameter \(c\).</p>`,
      f:[{lab:'Stelle des Maximums x', v:4},{lab:'Parameter c', v:2}],
      tips:[M`Die Stelle des Maximums hängt nicht von \(c\) ab. Bestimme sie über \(f'(x)=0\).`,
            M`Setze die gefundene Stelle in \(f\) ein und fordere, dass der Funktionswert \(10\) ist.`],
      sol:M`<p>\(f'(x)=-x+4=0 \Rightarrow x=4\). Dann \(f(4)=-8+16+c=8+c\stackrel{!}{=}10 \Rightarrow c=2\).</p>` }

const LV = ['G','F','P'];

let curTab = 'shirt', curLvl = 'G';
const STATUS = {};   // STATUS[key] = 'ok' | 'no'
const PARTLABEL = {};

function num(s){
  if(typeof s!=='string') return NaN;
  s = s.trim().replace(/\s/g,'').replace(/[€]/g,'');
  if(s.indexOf(',')>=0) s = s.replace(/\./g,'').replace(',', '.');
  s = s.replace(/[^0-9.\-−]/g,'').replace('−','-');
  return s==='' || s==='-' ? NaN : parseFloat(s);
}
function near(a,b,t){ return Math.abs(a-b) <= t + 1e-9; }
function typeset(el){ if(window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(()=>{}); }
function setFb(el, ok, html){ el.innerHTML = html; el.className = 'fb show ' + (ok ? 'ok':'no'); typeset(el); }
function helpBlock(id, tips, sol){
  let h = `<div class="help" id="${id}">`;
  tips.forEach((t,i)=>{ h += `<details class="amber"><summary>Tipp ${i+1}</summary><div class="body"><p>${t}</p></div></details>`; });
  h += `<details class="amber"><summary>Musterlösung</summary><div class="body">${sol}</div></details></div>`;
  return h;
}
function tipsLin(kind, c){
  const Z = kind==='E' ? 'E' : 'G';
  const t1 = kind==='E'
    ? M`Stelle zuerst die Nebenbedingungen auf: Wie hängen Preis \(p\) und Anzahl \(x\) von der Schrittzahl \(k\) ab? Setze beides dann in \(E = p \cdot x\) ein.`
    : M`Für den Gewinn zählt pro Stück nur, was nach Abzug der Kosten übrig bleibt: \(G = (p - \text{Kosten pro Stück}) \cdot x\). Setze \(p(k)\) und \(x(k)\) ein.`;
  const t2 = M`Deine Zielfunktion \(${Z}(k)\) ist quadratisch. Setze \(${Z}'(k)=0\) und prüfe mit \(${Z}''(k)\), dass ein Maximum vorliegt.`;
  const t3 = M`Achte auf das Vorzeichen von \(k\): Es entscheidet, ob der Preis gesenkt oder erhöht wird – die Anzahl der Schritte ist der Betrag. Mit diesem \(k\) berechnest du \(p(k)\), \(x(k)\) und zum Schluss \(${Z}\).`;
  return [t1,t2,t3];
}
function tipsPro(kind){
  const Z = kind==='E' ? 'E' : 'G';
  return [
    M`Setze \(p(k)\) und \(x(k)\) in die Hauptbedingung ein. Gib die Zielfunktion \(${Z}\) in GeoGebra ein – eingeschränkt auf den Definitionsbereich mit <code>Funktion( ..., a, b)</code>.`,
    M`Bestimme mit <code>Extremum(${Z}, a, b)</code> den Hochpunkt. Liegt er im Definitionsbereich? Vergleiche außerdem mit den Funktionswerten an den Rändern.`,
    M`Rechne mit dem ungerundeten \(k\) weiter und runde erst am Ende: Preis und ${kind==='E'?'Einnahmen':'Gewinn'} auf Cent, die Anzahl auf ganze Stück.`
  ];
}

    <div class="fields">
      <div class="fld"><label for="${key}-dir">Richtung</label>
        <select class="in" id="${key}-dir"><option value="">– wählen –</option><option value="s">Preis senken</option><option value="e">Preis erhöhen</option></select></div>
      <div class="fld"><label for="${key}-n">Anzahl der Schritte${rnd}</label><input class="in" id="${key}-n" type="text" inputmode="decimal" autocomplete="off"></div>
      <div class="fld"><label for="${key}-p">Preis</label><input class="in" id="${key}-p" type="text" inputmode="decimal" autocomplete="off"><span class="unit">€</span></div>
      <div class="fld"><label for="${key}-x">Anzahl ${c.xUnit}</label><input class="in" id="${key}-x" type="text" inputmode="decimal" autocomplete="off"></div>
      <div class="fld"><label for="${key}-v">${Zname}</label><input class="in" id="${key}-v" type="text" inputmode="decimal" autocomplete="off"><span class="unit">€</span></div>
    </div>
    <div class="btnrow"><button class="btn check" data-act="checkPart" data-key="${key}">Prüfen</button>
      <button class="btn clear" data-act="clearPart" data-key="${key}" style="display:none">Leeren</button></div>
    <div class="fb" id="${key}-fb"></div>
    ${helpBlock(key+'-help', lvl==='P' ? tipsPro(kind) : tipsLin(kind,c), sol)}
  </div>`;
}

function tableHTML(c){
  const key = `${c.id}-G-T`;
  const L = c.lin;
  PARTLABEL[key] = `${c.tab} · Grundlagen · Wertetabelle`;
  let rows = `<tr><td>0</td><td>${String(L.row0[0]).replace('.',',')}</td><td>${L.row0[1]}</td></tr>`;
  L.rows.forEach(r=>{ rows += `<tr><td>${r[0]}</td>
    <td><input class="in" id="${key}-p${r[0]}" type="text" inputmode="decimal" autocomplete="off" aria-label="Preis bei k=${r[0]}"></td>
    <td><input class="in" id="${key}-x${r[0]}" type="text" inputmode="decimal" autocomplete="off" aria-label="Anzahl bei k=${r[0]}"></td></tr>`; });
  return `<div class="part" id="${key}">
    <p class="frage">a) Fülle die Wertetabelle aus.</p>
    <div class="tablewrap"><table class="wt"><tr><th>k (${L.kText})</th><th>Preis in €</th><th>Anzahl ${c.xUnit}</th></tr>${rows}</table></div>
    <div class="btnrow"><button class="btn check" data-act="checkTable" data-key="${key}">Prüfen</button>
      <button class="btn clear" data-act="clearTable" data-key="${key}" style="display:none">Leeren</button></div>
    <div class="fb" id="${key}-fb"></div>
    ${helpBlock(key+'-help', [M`Lies im Text ab: Um wie viel Euro ändert sich der Preis pro Schritt – und um wie viele Stück die Anzahl? Gehe von der Zeile \(k=0\) aus Schritt für Schritt weiter.`], L.tableSol)}
  </div>`;
}

function mcHTML(c){
  const key = `${c.id}-P-D`;
  const m = c.pro.mc;
  PARTLABEL[key] = `${c.tab} · Profi (LK) · Definitionsbereich`;
  let opts = m.opts.map(o=>`<button class="opt" data-ok="${o.ok}">${o.t}</button>`).join('');
  return `<div class="part" id="${key}">
    <p class="frage">a) ${m.q}</p>
    <div class="mc" id="${key}-mc">${opts}</div>
    <div class="btnrow"><button class="btn check" data-act="checkMC" data-key="${key}">Prüfen</button>
      <button class="btn clear" data-act="clearMC" data-key="${key}" style="display:none">Leeren</button></div>
    <div class="fb" id="${key}-fb"></div>
    ${helpBlock(key+'-help', [m.tip], m.sol)}
  </div>`;
}

function build(){
  const tabs = document.getElementById('tabs');
  const main = document.getElementById('main');
  let tb = '', mh = '';
  CTX.forEach((c,i)=>{
    tb += `<button data-t="${c.id}" class="${i===0?'active':''}">${c.tab}</button>`;
    let card = `<section class="card ${i===0?'active':''}" id="card-${c.id}"><div class="cardbox"><h2>${c.title}</h2>`;
    /* Grundlagen */
    card += `<div class="variant" data-lvl="G">
      <div class="op-tags"><span class="op-tag">ohne Hilfsmittel</span><span class="op-tag">rechnerisch</span></div>
      <div class="story">${c.lin.story}</div>
      <div class="hbbox"><p><b>Hauptbedingungen (vorgegeben):</b></p>${c.lin.hb}</div>
      <div class="hbbox">${c.lin.nb}</div>
      ${tableHTML(c)}
      ${partHTML(c,'G','E',c.lin.E,c.lin.solE)}
      ${partHTML(c,'G','G',c.lin.G,c.lin.solG)}
    </div>`;
    /* Fortgeschritten */
    let deut = c.lin.deut.map((d,j)=>`<div class="deut"><p><b>c${j+1})</b> ${d.q}</p>
      <button class="btn reveal" data-act="reveal" data-key="${c.id}-F-d${j}">Lösungsvorschlag aufdecken</button>
      <div class="amberbox" id="${c.id}-F-d${j}"><p>${d.a}</p></div></div>`).join('');
    card += `<div class="variant" data-lvl="F">
      <div class="op-tags"><span class="op-tag">ohne Hilfsmittel</span><span class="op-tag">rechnerisch</span></div>
      <div class="story">${c.lin.story}</div>
      <p>Stelle Haupt- und Nebenbedingungen selbst auf. Führe dazu eine geeignete Variable für die Anzahl der Preisschritte ein.</p>
      ${partHTML(c,'F','E',c.lin.E,c.lin.solE)}
      ${partHTML(c,'F','G',c.lin.G,c.lin.solG)}
      <h3>c) Deuten – zur Selbstkontrolle</h3>
      <p>Besprecht die Fragen zu zweit, bevor ihr den Lösungsvorschlag aufdeckt.</p>
      ${deut}
    </div>`;
    /* Profi */
    card += `<div class="variant" data-lvl="P">
      <div class="op-tags"><span class="op-tag">mit GeoGebra</span><span class="op-tag">Extremum mit GeoGebra, Definitionsbereich rechnerisch</span></div>
      <div class="story">${c.pro.story}</div>
      ${mcHTML(c)}
      ${partHTML(c,'P','E',c.pro.E,c.pro.solE)}
      ${partHTML(c,'P','G',c.pro.G,c.pro.solG)}
    </div>`;
    card += `</div></section>`;
    mh += card;
  });
  /* Wiederholung */
  tb += `<button data-t="wdh">🔁 Wiederholung</button><button data-t="ausw">📊 Auswertung</button>`;
  let w = `<section class="card" id="card-wdh"><div class="cardbox"><h2>🔁 Wiederholung: Scheitelpunkt einer Parabel</h2>
    <p>Die Zielfunktionen der Grundlagen- und Fortgeschrittenen-Aufgaben sind Parabeln – ihr Maximum ist der Scheitelpunkt. Frische das hier noch einmal auf.</p>`;
  LV.forEach(l=>{
    const d = WDH[l], key = `wdh-${l}`;
    PARTLABEL[key] = `🔁 Wiederholung · ${LVNAME[l]}`;
    let f = d.f.map((x,i)=>`<div class="fld"><label for="${key}-f${i}">${x.lab}</label><input class="in" id="${key}-f${i}" type="text" inputmode="decimal" autocomplete="off"></div>`).join('');
    w += `<div class="variant" data-lvl="${l}">
      <div class="op-tags"><span class="op-tag">ohne Hilfsmittel</span><span class="op-tag">rechnerisch</span></div>
      <div class="part" id="${key}">${d.task}<div class="fields">${f}</div>
      <div class="btnrow"><button class="btn check" data-act="checkWdh" data-key="${key}">Prüfen</button>
        <button class="btn clear" data-act="clearWdh" data-key="${key}" style="display:none">Leeren</button></div>
      <div class="fb" id="${key}-fb"></div>
      ${helpBlock(key+'-help', d.tips, d.sol)}</div></div>`;
  });
  w += `</div></section>`;
  /* Auswertung */
  w += `<section class="card" id="card-ausw"><div class="cardbox"><h2>📊 Auswertung</h2>
    <p>Hier siehst du den aktuellen Stand aller Teilaufgaben, die du bereits geprüft hast – über alle Niveaustufen hinweg.</p>
    <div id="auswOut"></div></div></section>`;
  mh += w;
  tabs.innerHTML = tb;
  main.innerHTML = mh;
}

/* MC-Optionen einmal beim Laden mischen (Fisher-Yates) – VOR den Klick-Bindungen */
function shuffleMC(){
  document.querySelectorAll('.mc').forEach(box=>{
    const items = Array.from(box.children);
    for(let i=items.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [items[i],items[j]]=[items[j],items[i]]; }
    items.forEach(it=>box.appendChild(it));
  });
}

/* =====================================================================
   PRÜFEN
   ===================================================================== */
function findAns(key){
  const [id,lvl,kind] = key.split('-');
  const c = CTX.find(x=>x.id===id);
  const m = lvl==='P' ? c.pro : c.lin;
  return { c, lvl, kind, a: m[kind], other: m[kind==='E'?'G':'E'] };
}
function mark(el, ok){ el.classList.remove('ok','no'); el.classList.add(ok?'ok':'no'); }

function checkPart(key){
  const {c,lvl,kind,a,other} = findAns(key);
  const P = lvl==='P';
  const tol = { n: P?0.03:0.01, p: P?0.02:0.01, x: P?1:0.5, v: P?Math.max(2,a.v*0.002):0.5 };
  const g = f=>document.getElementById(`${key}-${f}`);
  const dir = g('dir').value, n = num(g('n').value), p = num(g('p').value), x = num(g('x').value), v = num(g('v').value);
  const fb = g('fb');
  if(!dir || [n,p,x,v].some(isNaN)){ setFb(fb,false,'Bitte fülle alle fünf Felder aus (Richtung auswählen, Zahlen eintragen).'); showClear(key,true); return; }
  const okD = dir===a.dir, okN = near(Math.abs(n),a.n,tol.n), okP = near(p,a.p,tol.p), okX = near(x,a.x,tol.x), okV = near(v,a.v,tol.v);
  mark(g('dir'),okD); mark(g('n'),okN); mark(g('p'),okP); mark(g('x'),okX); mark(g('v'),okV);
  const all = okD&&okN&&okP&&okX&&okV;
  STATUS[key] = all ? 'ok' : 'no';
  const Z = kind==='E' ? 'E' : 'G';
  if(all){
    setFb(fb,true,`✓ Alles richtig! ${kind==='E'?'Maximale Einnahmen':'Maximaler Gewinn'} gefunden.`);
    showClear(key,false);
    return;
  }
  let msg = '✗ ';
  const trap = (a.traps||[]).find(t=>t.dir===dir && near(Math.abs(n),t.n,t.tol));
  if(trap) msg += trap.msg;
  else if(!okN && dir===other.dir && near(Math.abs(n),other.n,tol.n))
    msg += (kind==='G' ? M`Das ist das Optimum für die <b>Einnahmen</b>. Beim Gewinn musst du die Kosten pro Stück abziehen.` : M`Das ist das Optimum für den <b>Gewinn</b>. Bei den Einnahmen spielen die Kosten keine Rolle.`);
  else if(okN && !okD) msg += M`Die Anzahl der Schritte stimmt – aber die Richtung nicht. Was bedeutet das Vorzeichen deines \(k\)?`;
  else if(!okN) msg += M`Die Anzahl der Schritte stimmt noch nicht. Überprüfe deine Zielfunktion \(${Z}(k)\)${P?' und den Definitionsbereich':''}.`;
  else if(!okP || !okX) msg += M`Das \(k\) stimmt. Setze es noch einmal sorgfältig in \(p(k)\) und \(x(k)\) ein.`;
  else msg += M`Fast alles richtig – prüfe noch den Wert von \(${Z}\).`;
  setFb(fb,false,msg + ' Die Tipps unten helfen dir weiter.');
  document.getElementById(key+'-help').classList.add('show');
  showClear(key,true);
}
function clearPart(key){
  ['dir','n','p','x','v'].forEach(f=>{ const el=document.getElementById(`${key}-${f}`);
    if(el.classList.contains('no') || !el.classList.contains('ok')){ el.value=''; }
    el.classList.remove('ok','no'); });
  resetFb(key);
}
function showClear(key,on){ const b=document.querySelector(`[data-act^="clear"][data-key="${key}"]`); if(b) b.style.display = on?'':'none'; }
function resetFb(key){ const fb=document.getElementById(key+'-fb'); fb.className='fb'; fb.innerHTML=''; showClear(key,false); delete STATUS[key]; }

function checkTable(key){
  const id = key.split('-')[0];
  const L = CTX.find(x=>x.id===id).lin;
  let all = true, empty = false;
  L.rows.forEach(r=>{
    const ep=document.getElementById(`${key}-p${r[0]}`), ex=document.getElementById(`${key}-x${r[0]}`);
    const vp=num(ep.value), vx=num(ex.value);
    if(isNaN(vp)||isNaN(vx)) empty = true;
    const op = near(vp,r[1],0.001), ox = near(vx,r[2],0.001);
    mark(ep,op); mark(ex,ox); if(!op||!ox) all=false;
  });
  const fb = document.getElementById(key+'-fb');
  STATUS[key] = all ? 'ok':'no';
  if(all){ setFb(fb,true,'✓ Richtig! Erkennst du, wie sich Preis und Anzahl pro Schritt ändern? Genau das brauchst du für die Nebenbedingungen.'); showClear(key,false); return; }
  setFb(fb,false, empty ? '✗ Bitte fülle alle Felder aus.' : '✗ Einige Werte stimmen noch nicht. Prüfe, um wie viel sich Preis und Anzahl pro Schritt ändern.');
  document.getElementById(key+'-help').classList.add('show');
  showClear(key,true);
}
function clearTable(key){
  document.querySelectorAll(`#${key} input.in`).forEach(el=>{ if(!el.classList.contains('ok')) el.value=''; el.classList.remove('ok','no'); });
  resetFb(key);
}

let MCSEL = {};
function checkMC(key){
  const box = document.getElementById(key+'-mc');
  const sel = box.querySelector('.opt.sel');
  const fb = document.getElementById(key+'-fb');
  if(!sel){ setFb(fb,false,'Bitte wähle zuerst eine Antwort aus.'); return; }
  const ok = sel.dataset.ok === '1';
  sel.classList.add(ok?'ok':'no');
  box.dataset.locked = '1';
  STATUS[key] = ok ? 'ok':'no';
  if(ok){ setFb(fb,true,'✓ Richtig! Diesen Definitionsbereich brauchst du gleich für die Suche nach dem Maximum.'); showClear(key,false);
    document.getElementById(key+'-help').classList.add('show'); return; }
  setFb(fb,false,'✗ Das passt noch nicht. Schau dir den Tipp an und versuche es nach dem Leeren noch einmal.');
  document.getElementById(key+'-help').classList.add('show');
  showClear(key,true);
}
function clearMC(key){
  const box = document.getElementById(key+'-mc');
  box.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel','ok','no'));
  delete box.dataset.locked;
  resetFb(key);
}

function checkWdh(key){
  const l = key.split('-')[1], d = WDH[l];
  let all = true, empty = false;
  d.f.forEach((x,i)=>{ const el=document.getElementById(`${key}-f${i}`); const v=num(el.value);
    if(isNaN(v)) empty=true; const ok=near(v,x.v,0.001); mark(el,ok); if(!ok) all=false; });
  const fb=document.getElementById(key+'-fb');
  STATUS[key] = all?'ok':'no';
  if(all){ setFb(fb,true,'✓ Richtig!'); showClear(key,false); return; }
  setFb(fb,false, empty ? '✗ Bitte fülle beide Felder aus.' : '✗ Noch nicht ganz. Schau dir die Tipps an.');
  document.getElementById(key+'-help').classList.add('show');
  showClear(key,true);
}
function clearWdh(key){
  document.querySelectorAll(`#${key} input.in`).forEach(el=>{ if(!el.classList.contains('ok')) el.value=''; el.classList.remove('ok','no'); });
  resetFb(key);
}

/* =====================================================================
   AUSWERTUNG
   ===================================================================== */
function renderAusw(){
  const out = document.getElementById('auswOut');
  const keys = Object.keys(PARTLABEL).filter(k=>STATUS[k]);
  if(!keys.length){ out.innerHTML = '<p>Du hast noch keine Teilaufgabe geprüft. Wähle oben einen Sachzusammenhang und leg los!</p>'; return; }
  const ok = keys.filter(k=>STATUS[k]==='ok').length;
  let h = `<p class="sum">${ok} von ${keys.length} geprüften Teilaufgaben richtig</p>`;
  h += '<table class="ausw"><tr><th>Teilaufgabe</th><th>Stand</th></tr>';
  keys.forEach(k=>{ const s=STATUS[k];
    h += `<tr><td>${PARTLABEL[k]}</td><td class="${s==='ok'?'st-ok':'st-no'}">${s==='ok'?'✓ richtig':'✗ noch falsch'}</td></tr>`; });
  h += '</table>';
  const wrong = keys.filter(k=>STATUS[k]==='no').length;
  h += wrong ? `<p>Bei den rot markierten Aufgaben findest du nach dem Prüfen Tipps und eine Musterlösung. Mit „Leeren“ kannst du es erneut versuchen.</p>`
             : `<p>Stark! Probiere doch noch einen anderen Sachzusammenhang oder die nächste Niveaustufe.</p>`;
  const untouched = CTX.filter(c=>!Object.keys(STATUS).some(k=>k.startsWith(c.id+'-')));
  if(untouched.length) h += `<p>Noch nicht bearbeitet: ${untouched.map(c=>c.tab).join(', ')}</p>`;
  out.innerHTML = h;
}

/* =====================================================================
   NAVIGATION & EVENTS
   ===================================================================== */
function showLevel(){
  document.querySelectorAll('.variant').forEach(v=>v.classList.toggle('active', v.dataset.lvl===curLvl));
  document.querySelectorAll('#levels button').forEach(b=>b.classList.toggle('active', b.dataset.l===curLvl));
  document.getElementById('lvlInfo').textContent = curTab==='wdh'
    ? 'Die Wiederholung gibt es ebenfalls in drei Niveaustufen.' : LVLINFO[curLvl];
  document.getElementById('levels').style.display = curTab==='ausw' ? 'none' : '';
}
function showTab(t){
  curTab = t;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.t===t));
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active', c.id==='card-'+t));
  if(t==='ausw') renderAusw();
  showLevel();
}

build();
shuffleMC();   // erst mischen ...

/* ... dann binden */
document.getElementById('tabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) showTab(b.dataset.t); });
document.getElementById('levels').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; curLvl=b.dataset.l; showLevel(); });
document.getElementById('main').addEventListener('click', e=>{
  const opt = e.target.closest('.opt');
  if(opt){ const box=opt.parentElement; if(box.dataset.locked) return;
    box.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel', o===opt && !opt.classList.contains('sel'))); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const k = b.dataset.key;
  switch(b.dataset.act){
    case 'checkPart': checkPart(k); break;   case 'clearPart': clearPart(k); break;
    case 'checkTable': checkTable(k); break; case 'clearTable': clearTable(k); break;
    case 'checkMC': checkMC(k); break;       case 'clearMC': clearMC(k); break;
    case 'checkWdh': checkWdh(k); break;     case 'clearWdh': clearWdh(k); break;
    case 'reveal': { const box=document.getElementById(k); const on=!box.classList.contains('show');
      box.classList.toggle('show',on); b.textContent = on ? 'Lösungsvorschlag verbergen' : 'Lösungsvorschlag aufdecken'; typeset(box); break; }
  }
});
showTab('shirt');

const trex=document.getElementById('trex'), tn=document.getElementById('trexNote');
trex.addEventListener('click',()=>{ tn.classList.toggle('show'); });
</script>
