const L3 = ['cm','cm²','cm³'];
const CARDS = [
/* ---------------- DOSE ---------------- */
{ id:'dose', tab:'🥫 Dose', title:'Die Dose – Materialverbrauch minimieren', fig:FIG.dose, levels:{
 g:{ tags:['mit GTR / GeoGebra','rechnerisch (mit Rechenweg)'],
  intro:R`Ein Getränkehersteller möchte eine zylinderförmige Limonadendose produzieren, die genau 500 ml fasst. Der Materialverbrauch (Gesamtoberfläche aus Deckel, Boden und Mantel) soll minimal sein. Hinweis: \(1\,\text{ml}=1\,\text{cm}^3\).`,
  parts:[
   {type:'mc', q:R`Stelle die Nebenbedingung nach \(h\) um. Welcher Term ist richtig?`,
    opts:[[R`\(h=\dfrac{500}{\pi r^2}\)`,1],[R`\(h=\dfrac{500}{2\pi r}\)`,0],[R`\(h=\dfrac{500\pi}{r^2}\)`,0],[R`\(h=500-\pi r^2\)`,0]],
    hint:R`Die Nebenbedingung ist das feste Volumen \(V=\pi r^2 h\). Teile durch alle Faktoren vor \(h\).`},
   {type:'mc', q:R`Welche Zielfunktion \(O(r)\) beschreibt die Gesamtoberfläche?`,
    opts:[[R`\(O(r)=2\pi r^2+\dfrac{1000}{r}\)`,1],[R`\(O(r)=2\pi r^2+\dfrac{500}{r}\)`,0],[R`\(O(r)=\pi r^2+\dfrac{1000}{r}\)`,0],[R`\(O(r)=2\pi r^2+\dfrac{1000}{r^2}\)`,0]],
    hint:R`Deckel und Boden zählen beide. Beim Einsetzen in \(2\pi r h\) kürzt sich ein Faktor \(r\).`},
   {type:'mc', q:R`Nenne den sinnvollen Definitionsbereich der Zielfunktion.`,
    opts:[[R`\(D=\,]0;\infty[\)`,1],[R`\(D=[0;\infty[\)`,0],[R`\(D=[1;500]\)`,0],[R`\(D=\mathbb{R}\)`,0]],
    hint:R`Für \(r=0\) gibt es keine Dose – und eine Obergrenze für \(r\) liefert die Nebenbedingung nicht.`},
   {type:'num', q:R`Berechne Radius und Höhe der materialoptimalen Dose sowie die minimale Oberfläche.`,
    fields:[{lab:R`\(r\approx\)`,val:4.30,tol:0.011,unit:'cm'},{lab:R`\(h\approx\)`,val:8.60,tol:0.021,unit:'cm'},{lab:R`\(O_{\min}\approx\)`,val:348.73,tol:0.1,unit:'cm²'}],
    hint:R`Löse \(O'(r)=0\). Du erhältst eine Gleichung für \(r^3\). Rechne mit dem ungerundeten \(r\) weiter.`},
   {type:'mc', q:R`Wie weist du nach, dass an dieser Stelle ein Minimum vorliegt?`,
    opts:[[R`\(O''(r)=4\pi+\dfrac{2000}{r^3}\gt 0\) für alle \(r\gt 0\), also Minimum`,1],[R`\(O''(r)=4\pi-\dfrac{2000}{r^3}\lt 0\), also Minimum`,0],[R`\(O'(r)=0\) allein reicht als Nachweis aus`,0],[R`\(O''(r)=4\pi+\dfrac{1000}{r^2}\gt 0\), also Minimum`,0]],
    hint:R`Leite \(O'(r)=4\pi r-1000\cdot r^{-2}\) noch einmal ab und achte auf das Vorzeichen.`}
  ],
  tips:[R`Fertige eine Skizze an: Welche Größe ist fest vorgegeben (Nebenbedingung), welche soll minimal werden (Zielfunktion)?`,
        R`Die Oberfläche besteht aus zwei Kreisen und einem Rechteck mit den Seiten \(2\pi r\) und \(h\). Setze dort den nach \(h\) umgestellten Term ein.`,

  sol:R`<p><b>Nebenbedingung:</b> \(\pi r^2 h=500 \Rightarrow h=\dfrac{500}{\pi r^2}\)</p>
<p><b>Zielfunktion:</b> \(O(r)=2\pi r^2+2\pi r\cdot\dfrac{500}{\pi r^2}=2\pi r^2+\dfrac{1000}{r}\) mit \(D=\,]0;\infty[\)</p>
<p><b>Ableitungen:</b> \(O'(r)=4\pi r-\dfrac{1000}{r^2}\) und \(O''(r)=4\pi+\dfrac{2000}{r^3}\)</p>
<p><b>Notwendige Bedingung:</b> \(O'(r)=0 \Leftrightarrow 4\pi r^3=1000 \Leftrightarrow r=\sqrt[3]{\dfrac{250}{\pi}}\approx 4{,}30\)</p>
<p><b>Hinreichende Bedingung:</b> \(O''(r)\gt 0\) für alle \(r\gt 0\), also liegt ein Minimum vor.</p>
<p><b>Randwerte:</b> Für \(r\to 0^+\) gilt \(\dfrac{1000}{r}\to\infty\), für \(r\to\infty\) gilt \(2\pi r^2\to\infty\). Das lokale Minimum ist also global.</p>
<p><b>Werte:</b> \(h=\dfrac{500}{\pi r^2}\approx 8{,}60\), \(O_{\min}=O(4{,}30)\approx 348{,}73\)</p>
<p><b>Antwort:</b> Die Dose mit \(r\approx 4{,}30\) cm und \(h\approx 8{,}60\) cm hat mit etwa 348,73 cm² die kleinste Oberfläche.</p>`},
 f:{ tags:['mit GTR / GeoGebra','rechnerisch (mit Rechenweg)'],
  intro:R`Eine Standard-Getränkedose fasst 330 ml. Echte Dosen haben (vereinfacht als Zylinder) etwa den Durchmesser 6,6 cm und die Höhe 11,5 cm.`,
  parts:[
   {type:'num', q:R`Berechne die Maße der materialoptimalen 330-ml-Dose und ihre minimale Oberfläche.`,
    fields:[{lab:R`\(r\approx\)`,val:3.74,tol:0.011,unit:'cm'},{lab:R`\(h\approx\)`,val:7.49,tol:0.021,unit:'cm'},{lab:R`\(O_{\min}\approx\)`,val:264.36,tol:0.15,unit:'cm²'}],
    hint:R`Gehe vor wie bei der 500-ml-Dose: Nebenbedingung, Zielfunktion, \(O'(r)=0\) – nur mit \(V=330\).`},
   {type:'mc', q:R`Begründe: Warum ist das lokale Minimum auch das globale Minimum auf \(D=\,]0;\infty[\)?`,
    opts:[[R`Für \(r\to 0^+\) und \(r\to\infty\) gilt jeweils \(O(r)\to\infty\), und es gibt nur eine Extremstelle.`,1],[R`Für \(r\to\infty\) gilt \(O(r)\to 0\), also fällt \(O\) nach dem Minimum nur noch.`,0],[R`Weil \(O(0)=0\) gilt und \(O\) danach steigt.`,0],[R`Weil der Graph von \(O\) achsensymmetrisch zur \(y\)-Achse ist.`,0]],
    hint:R`Untersuche getrennt, was mit den beiden Summanden der Zielfunktion an den Rändern von \(D\) passiert.`},
   {type:'num', q:R`Berechne die Oberfläche der echten Dose und gib an, wie viel Prozent mehr Material sie im Vergleich zur optimalen Dose benötigt.`,
    fields:[{lab:R`\(O_{\text{echt}}\approx\)`,val:306.87,tol:0.15,unit:'cm²'},{lab:'Mehrverbrauch ≈',val:16.08,tol:0.12,unit:'%'}],
    hint:R`Der Radius ist der halbe Durchmesser. Der Mehrverbrauch bezieht sich auf die <i>minimale</i> Oberfläche als Grundwert.`},
   {type:'mc', q:R`Welche Begründung erklärt aus Sicht der Modellkritik am besten, warum echte Dosen nicht die optimale Form haben?`,
    opts:[[R`Deckel und Boden bestehen aus dickerem Blech; das Modell zählt aber jeden cm² gleich.`,1],[R`Die Rechnung ist ungenau, weil \(\pi\) gerundet wird.`,0],[R`Die optimale Dose würde mehr als 330 ml fassen.`,0],[R`Die Ableitung einer Oberfläche ist physikalisch nicht sinnvoll.`,0]],
    hint:R`Überlege, welche Annahme des Modells in der Realität nicht stimmt.`}
  ],
  tips:[R`Stelle die Zielfunktion allgemein mit \(V=330\) auf und leite sie ab.`,
        R`Für die echte Dose brauchst du nur die Oberflächenformel \(O=2\pi r^2+2\pi r h\) mit den gegebenen Maßen.`,
        R`Prozentualer Mehrverbrauch: Differenz der Oberflächen geteilt durch die minimale Oberfläche, mal 100.`],
  sol:R`<p><b>Zielfunktion:</b> \(h=\dfrac{330}{\pi r^2} \Rightarrow O(r)=2\pi r^2+\dfrac{660}{r}\), \(D=\,]0;\infty[\)</p>
<p>\(O'(r)=4\pi r-\dfrac{660}{r^2}=0 \Leftrightarrow r^3=\dfrac{165}{\pi} \Leftrightarrow r\approx 3{,}74\); \(O''(r)=4\pi+\dfrac{1320}{r^3}\gt 0\), also Minimum.</p>
<p>\(h=\dfrac{330}{\pi r^2}\approx 7{,}49\), \(O_{\min}\approx 264{,}36\)</p>
<p><b>Randwerte:</b> \(r\to0^+\): \(\dfrac{660}{r}\to\infty\); \(r\to\infty\): \(2\pi r^2\to\infty\) – das Minimum ist global.</p>
<p><b>Echte Dose:</b> \(r=3{,}3\), \(h=11{,}5\): \(O=2\pi\cdot 3{,}3^2+2\pi\cdot 3{,}3\cdot 11{,}5\approx 306{,}87\)</p>
<p><b>Mehrverbrauch:</b> \(\dfrac{306{,}87-264{,}36}{264{,}36}\cdot 100\approx 16{,}08\) %</p>
<p><b>Modellkritik:</b> Deckel und Boden sind dicker (Druck, Öffnungslasche, Falz). Wird dickeres Material teurer gewichtet, lohnt sich eine schlankere Dose.</p>`},
 p:{ tags:['mit GTR (a) · ohne Hilfsmittel (c–e)','rechnerisch + allgemeiner Nachweis'],
  intro:R`Untersuche, ob das Verhältnis \(h:r\) der materialoptimalen (geschlossenen) Dose vom Volumen \(V\) abhängt.`,
  parts:[
   {type:'num', q:R`Berechne für die angegebenen Volumina jeweils den optimalen Radius und das Verhältnis \(\dfrac{h}{r}\) (mit ungerundeten Werten rechnen).`,
    fields:[{lab:R`\(V=250\): \(r\approx\)`,val:3.41,tol:0.011,unit:'cm'},{lab:R`\(\dfrac{h}{r}\approx\)`,val:2,tol:0.011,unit:''},
            {lab:R`\(V=1000\): \(r\approx\)`,val:5.42,tol:0.011,unit:'cm'},{lab:R`\(\dfrac{h}{r}\approx\)`,val:2,tol:0.011,unit:''},
            {lab:R`\(V=2000\): \(r\approx\)`,val:6.83,tol:0.011,unit:'cm'},{lab:R`\(\dfrac{h}{r}\approx\)`,val:2,tol:0.011,unit:''}],
    hint:R`Bestimme für jedes Volumen zuerst \(r\) wie bei der 500-ml-Dose, dann \(h\) über die Nebenbedingung, dann den Quotienten.`},
   {type:'mc', q:R`Welche Vermutung legen deine Ergebnisse nahe?`,
    opts:[[R`Das Verhältnis \(h:r\) ist für alle Volumina gleich.`,1],[R`Das Verhältnis \(h:r\) wächst mit dem Volumen.`,0],[R`Das Verhältnis \(h:r\) fällt mit dem Volumen.`,0],[R`Das Verhältnis \(h:r\) ist nur zufällig bei diesen Volumina gleich.`,0]],
    hint:R`Vergleiche die drei Quotienten aus Teil a.`},
   {type:'order', q:R`Bringe die Schritte des allgemeinen Nachweises (für beliebiges \(V\gt 0\)) in die richtige Reihenfolge.`,
    items:[R`Nebenbedingung: \(h=\dfrac{V}{\pi r^2}\)`,R`Zielfunktion: \(O(r)=2\pi r^2+\dfrac{2V}{r}\)`,R`Ableitung null setzen: \(4\pi r-\dfrac{2V}{r^2}=0\)`,R`Umformen: \(r^3=\dfrac{V}{2\pi}\)`,R`Quotient bilden: \(\dfrac{h}{r}=\dfrac{V}{\pi r^3}\)`,R`\(r^3\) einsetzen: \(\dfrac{h}{r}=\dfrac{V}{\pi}\cdot\dfrac{2\pi}{V}\) – \(V\) kürzt sich heraus`],
    hint:R`Ein Nachweis beginnt immer mit dem, was fest vorgegeben ist, und endet mit der Aussage über das Verhältnis.`},
   {type:'mc', q:R`Welche geometrische Folgerung ergibt sich für jede materialoptimale Dose?`,
    opts:[[R`Die Höhe ist genauso groß wie der Durchmesser.`,1],[R`Die Höhe ist genauso groß wie der Radius.`,0],[R`Die Höhe ist doppelt so groß wie der Durchmesser.`,0],[R`Die Höhe ist genauso groß wie der Umfang des Bodens.`,0]],
    hint:R`Übersetze das gefundene Verhältnis in eine Aussage über Radius und Durchmesser.`},
   {type:'mc', q:R`Deckel und Boden werden aus doppelt so dickem Blech hergestellt und kosten pro cm² doppelt so viel wie der Mantel. Welches Verhältnis \(h:r\) minimiert nun die Materialkosten?`,
    opts:[[R`\(h:r=4\)`,1],[R`\(h:r=2\)`,0],[R`\(h:r=1\)`,0],[R`\(h:r=8\)`,0]],
    hint:R`Stelle die neue Kostenfunktion auf (Kreisflächen doppelt gewichtet) und wiederhole den allgemeinen Nachweis.`}
  ],
  tips:[R`Arbeite in Teil a zunächst mit konkreten Zahlen. Für den Nachweis ersetzt du die Zahl einfach durch den Buchstaben \(V\).`,
        R`Für den Quotienten \(\dfrac{h}{r}\) setzt du die Nebenbedingung ein. Dann steht dort ein Term mit \(r^3\) – und für \(r^3\) kennst du aus \(O'(r)=0\) einen Ausdruck.`,
        R`Bei doppelt gewichtetem Deckel und Boden lautet der erste Summand der Kostenfunktion \(2\cdot 2\pi r^2\). Der Rest des Nachweises verläuft genauso.`],
  sol:R`<p><b>a)</b> Mit \(r=\sqrt[3]{\dfrac{V}{2\pi}}\) und \(h=\dfrac{V}{\pi r^2}\): \(V=250\): \(r\approx 3{,}41\); \(V=1000\): \(r\approx 5{,}42\); \(V=2000\): \(r\approx 6{,}83\) – jeweils \(\dfrac{h}{r}=2\).</p>
<p><b>b)</b> Vermutung: Das Verhältnis hängt nicht von \(V\) ab.</p>
<p><b>c) Nachweis:</b> \(h=\dfrac{V}{\pi r^2}\Rightarrow O(r)=2\pi r^2+\dfrac{2V}{r}\). \(O'(r)=4\pi r-\dfrac{2V}{r^2}=0\Leftrightarrow r^3=\dfrac{V}{2\pi}\). \(O''(r)=4\pi+\dfrac{4V}{r^3}\gt 0\) – Minimum.</p>
<p>\(\dfrac{h}{r}=\dfrac{V}{\pi r^2\cdot r}=\dfrac{V}{\pi r^3}=\dfrac{V}{\pi}\cdot\dfrac{2\pi}{V}=2\). Das Verhältnis ist für jedes Volumen 2.</p>
<p><b>d)</b> \(h=2r=d\): Die optimale Dose ist genauso hoch wie breit (quadratischer Achsenschnitt).</p>
<p><b>e)</b> \(K(r)=4\pi r^2+\dfrac{2V}{r}\), \(K'(r)=8\pi r-\dfrac{2V}{r^2}=0\Leftrightarrow r^3=\dfrac{V}{4\pi}\), also \(\dfrac{h}{r}=\dfrac{V}{\pi r^3}=\dfrac{V}{\pi}\cdot\dfrac{4\pi}{V}=4\). Die Dose wird schlanker – ein Grund, warum echte Dosen höher als breit sind.</p>`}
}},
/* ---------------- SCHACHTEL ---------------- */
{ id:'schachtel', tab:'📦 Schachtel', title:'Offene Schachtel – Volumen maximieren', fig:FIG.schachtel, levels:{
 g:{ tags:['mit GeoGebra','Bestimmen mit GeoGebra (Extremum)'],
  intro:R`Aus einem rechteckigen Karton, der 30 cm lang und 20 cm breit ist, werden an den Ecken Quadrate mit der Seitenlänge \(x\) ausgeschnitten. Die Ränder werden zu einer oben offenen Schachtel hochgeklappt. Das Volumen soll maximal werden.`,
  parts:[
   {type:'mc', q:R`Welche Zielfunktion beschreibt das Volumen der Schachtel?`,
    opts:[[R`\(V(x)=(30-2x)\cdot(20-2x)\cdot x\)`,1],[R`\(V(x)=(30-x)\cdot(20-x)\cdot x\)`,0],[R`\(V(x)=(30-2x)\cdot(20-2x)\)`,0],[R`\(V(x)=2x\cdot(30-x)\cdot(20-x)\)`,0]],
    hint:R`Von jeder Seite werden an <i>beiden</i> Enden Quadrate abgeschnitten. Die Höhe der Schachtel ist \(x\).`},
   {type:'mc', q:R`Gib den Definitionsbereich an.`,
    opts:[[R`\(0\lt x\lt 10\)`,1],[R`\(0\lt x\lt 15\)`,0],[R`\(0\lt x\lt 20\)`,0],[R`\(0\lt x\lt 30\)`,0]],
    hint:R`Beide Seitenlängen des Bodens müssen positiv bleiben – welche Bedingung ist strenger?`},
   {type:'num', q:R`Bestimme mit dem GeoGebra-Befehl <i>Extremum</i> die optimale Einschnitttiefe und das maximale Volumen.`,
    fields:[{lab:R`\(x\approx\)`,val:2.32,tol:0.011,unit:'cm'},{lab:R`\(V_{\max}\approx\)`,val:904.53,tol:0.2,unit:'cm³'}],
    hint:R`Gib die Funktion ein und nutze Extremum mit den Grenzen des Definitionsbereichs. Achte auf die Einheit eines Volumens.`},
   {type:'mc', q:R`Die Gleichung \(V'(x)=0\) hat zwei Lösungen. Warum ist nur eine davon die Lösung des Problems?`,
    opts:[[R`Die zweite Lösung liegt außerhalb des Definitionsbereichs.`,1],[R`Die zweite Lösung ist ein Minimum innerhalb des Definitionsbereichs.`,0],[R`Die zweite Lösung ist negativ.`,0],[R`GeoGebra rundet die zweite Lösung falsch.`,0]],
    hint:R`Lass dir den Graphen von \(V\) ohne Einschränkung zeichnen und vergleiche mit \(D\).`}
  ],
  tips:[R`Länge und Breite des Bodens werden jeweils um zwei Quadratseiten kürzer.`,
        R`Eingabe in GeoGebra z. B. als <code>V(x)=(30-2x)*(20-2x)*x</code>. Der Befehl <code>Extremum(V, a, b)</code> sucht im Intervall von a bis b.`],
  sol:R`<p><b>Zielfunktion:</b> Boden \((30-2x)\) mal \((20-2x)\), Höhe \(x\): \(V(x)=(30-2x)(20-2x)x\)</p>
<p><b>Definitionsbereich:</b> \(20-2x\gt 0\Leftrightarrow x\lt 10\), also \(D=\,]0;10[\)</p>
<p><b>GeoGebra:</b> <code>Extremum(V, 0, 10)</code> liefert den Hochpunkt \(H(2{,}32\,|\,904{,}53)\).</p>
<p>Die zweite Nullstelle von \(V'\) liegt bei \(x\approx 14{,}34\) und damit außerhalb von \(D\).</p>
<p><b>Antwort:</b> Bei einer Einschnitttiefe von etwa 2,32 cm hat die Schachtel das maximale Volumen von etwa 904,53 cm³.</p>`},
 f:{ tags:['ohne Hilfsmittel','rechnerisch (mit Rechenweg)'],
  intro:R`Aus einem quadratischen Karton mit der Seitenlänge 24 cm soll eine oben offene Schachtel mit maximalem Volumen entstehen. Die Zielfunktion lautet \(V(x)=(24-2x)^2\cdot x\) mit \(D=\,]0;12[\).`,
  parts:[
   {type:'mc', q:R`Multipliziere aus und leite ab. Welche Ableitung ist richtig?`,
    opts:[[R`\(V'(x)=12x^2-192x+576\)`,1],[R`\(V'(x)=12x^2-96x+576\)`,0],[R`\(V'(x)=4x^2-192x+576\)`,0],[R`\(V'(x)=12x^2-192x+24\)`,0]],
    hint:R`Multipliziere zuerst \((24-2x)^2\) aus, dann mit \(x\). Erst danach ableiten.`},
   {type:'num', q:R`Berechne die Extremstelle im Definitionsbereich und das maximale Volumen.`,
    fields:[{lab:R`\(x=\)`,val:4,tol:0.001,unit:'cm'},{lab:R`\(V_{\max}=\)`,val:1024,tol:0.5,unit:'cm³'}],
    hint:R`Klammere in \(V'(x)=0\) den Faktor 12 aus und nutze die \(pq\)-Formel. Prüfe, welche Lösung in \(D\) liegt.`},
   {type:'mc', q:R`Wie lautet der Nachweis mit der hinreichenden Bedingung?`,
    opts:[[R`\(V''(x)=24x-192\), \(V''(4)=-96\lt 0\), also Maximum`,1],[R`\(V''(x)=24x-192\), \(V''(4)=96\gt 0\), also Maximum`,0],[R`\(V''(x)=24x-96\), \(V''(4)=0\), also kein Extremum`,0],[R`\(V''(x)=12x-192\), \(V''(4)=-144\lt 0\), also Minimum`,0]],
    hint:R`Leite \(V'\) noch einmal ab und setze die Extremstelle ein. Negatives Vorzeichen bedeutet …?`}
  ],
  tips:[R`\((24-2x)^2=576-96x+4x^2\). Multipliziere das Ergebnis mit \(x\).`,
        R`\(V'(x)=0\): Teile durch 12. Du erhältst eine quadratische Gleichung in Normalform.`],
  sol:R`<p>\(V(x)=(576-96x+4x^2)\cdot x=4x^3-96x^2+576x\)</p>
<p>\(V'(x)=12x^2-192x+576=12(x^2-16x+48)\)</p>
<p>\(x^2-16x+48=0 \Leftrightarrow x=8\pm\sqrt{64-48}=8\pm 4\), also \(x_1=4\), \(x_2=12\notin D\)</p>
<p>\(V''(x)=24x-192\), \(V''(4)=-96\lt 0\): Maximum. Randwerte: \(V(0)=V(12)=0\), also globales Maximum.</p>
<p>\(V(4)=16^2\cdot 4=1024\)</p>
<p><b>Antwort:</b> Bei \(x=4\) cm beträgt das maximale Volumen 1024 cm³.</p>`},
 p:{ tags:['ohne Hilfsmittel','rechnerisch + allgemeiner Nachweis'],
  intro:R`Betrachte allgemein einen quadratischen Karton mit der Seitenlänge \(a\). Die Schachtel ist oben offen, das Volumen soll maximal werden.`,
  parts:[
   {type:'mc', q:R`Bestimme die optimale Einschnitttiefe \(x\) in Abhängigkeit von \(a\).`,
    opts:[[R`\(x=\dfrac{a}{6}\)`,1],[R`\(x=\dfrac{a}{4}\)`,0],[R`\(x=\dfrac{a}{3}\)`,0],[R`\(x=\dfrac{a}{8}\)`,0]],
    hint:R`Leite \(V(x)=(a-2x)^2 x\) mit der Produkt- und Kettenregel ab und klammere \((a-2x)\) aus.`},
   {type:'num', q:R`Berechne für \(a=36\) cm die Einschnitttiefe und das maximale Volumen.`,
    fields:[{lab:R`\(x=\)`,val:6,tol:0.001,unit:'cm'},{lab:R`\(V_{\max}=\)`,val:3456,tol:0.5,unit:'cm³'}],
    hint:R`Nutze dein Ergebnis aus Teil a und setze in \(V\) ein.`},
   {type:'mc', q:R`Die Seitenlänge des Kartons wird verdoppelt. Mit welchem Faktor ändert sich das maximale Volumen?`,
    opts:[[R`Faktor 8`,1],[R`Faktor 2`,0],[R`Faktor 4`,0],[R`Faktor 16`,0]],
    hint:R`Stelle \(V_{\max}\) als Term in \(a\) dar. Welche Potenz von \(a\) tritt auf?`}
  ],
  tips:[R`\(V'(x)=(a-2x)^2+x\cdot 2(a-2x)\cdot(-2)\). Klammere den gemeinsamen Faktor aus.`,
        R`Ein Faktor wird null für \(x=\dfrac{a}{2}\) – liegt das im Definitionsbereich? Der andere Faktor liefert die Lösung.`],
  sol:R`<p>\(V(x)=(a-2x)^2 x\), \(D=\,]0;\dfrac{a}{2}[\)</p>
<p>\(V'(x)=(a-2x)^2-4x(a-2x)=(a-2x)(a-6x)\)</p>
<p>\(V'(x)=0\Leftrightarrow x=\dfrac{a}{2}\notin D\) oder \(x=\dfrac{a}{6}\). Vorzeichenwechsel von \(+\) nach \(-\) bei \(\dfrac{a}{6}\): Maximum.</p>
<p>\(V_{\max}=\left(\dfrac{2a}{3}\right)^2\cdot\dfrac{a}{6}=\dfrac{2a^3}{27}\)</p>
<p>\(a=36\): \(x=6\), \(V_{\max}=24^2\cdot 6=3456\) cm³</p>
<p>Verdopplung von \(a\): \(\dfrac{2(2a)^3}{27}=8\cdot\dfrac{2a^3}{27}\), also Faktor 8.</p>`}
}},
/* ---------------- PAKET ---------------- */
{ id:'paket', tab:'📮 Paket', title:'Quader mit quadratischer Grundfläche – Oberfläche minimieren', fig:FIG.paket, levels:{
 g:{ tags:['ohne Hilfsmittel','rechnerisch (mit Rechenweg)'],
  intro:R`Ein geschlossenes Paket mit quadratischer Grundfläche soll ein Volumen von 1000 cm³ haben. Der Kartonverbrauch (Oberfläche) soll minimal sein.`,
  parts:[
   {type:'mc', q:R`Welche Zielfunktion beschreibt die Oberfläche in Abhängigkeit von \(a\)?`,
    opts:[[R`\(O(a)=2a^2+\dfrac{4000}{a}\)`,1],[R`\(O(a)=2a^2+\dfrac{1000}{a}\)`,0],[R`\(O(a)=a^2+\dfrac{4000}{a}\)`,0],[R`\(O(a)=2a^2+\dfrac{4000}{a^2}\)`,0]],
    hint:R`Oberfläche: zwei Quadrate und vier Rechtecke. Ersetze \(h\) mithilfe von \(a^2 h=1000\).`},
   {type:'num', q:R`Berechne die optimalen Maße und die minimale Oberfläche.`,
    fields:[{lab:R`\(a=\)`,val:10,tol:0.01,unit:'cm'},{lab:R`\(h=\)`,val:10,tol:0.01,unit:'cm'},{lab:R`\(O_{\min}=\)`,val:600,tol:0.5,unit:'cm²'}],
    hint:R`Löse \(O'(a)=0\) nach \(a^3\) auf. Die Zahl lässt sich ohne Taschenrechner auflösen.`},
   {type:'mc', q:R`Welche Form hat das optimale Paket?`,
    opts:[[R`Einen Würfel`,1],[R`Eine Säule, doppelt so hoch wie breit`,0],[R`Einen flachen Quader, halb so hoch wie breit`,0],[R`Die Form hängt von der Kartondicke ab`,0]],
    hint:R`Vergleiche \(a\) und \(h\).`}
  ],
  tips:[R`\(O=2a^2+4ah\). Die Nebenbedingung \(a^2h=1000\) liefert einen Term für \(h\).`,
        R`\(O'(a)=0\) führt nach Multiplikation mit \(a^2\) auf eine Gleichung der Form \(a^3=\ldots\)`],
  sol:R`<p><b>Nebenbedingung:</b> \(a^2h=1000\Rightarrow h=\dfrac{1000}{a^2}\)</p>
<p><b>Zielfunktion:</b> \(O(a)=2a^2+4a\cdot\dfrac{1000}{a^2}=2a^2+\dfrac{4000}{a}\), \(D=\,]0;\infty[\)</p>
<p>\(O'(a)=4a-\dfrac{4000}{a^2}=0\Leftrightarrow a^3=1000\Leftrightarrow a=10\)</p>
<p>\(O''(a)=4+\dfrac{8000}{a^3}\gt 0\): Minimum; Randwerte gehen gegen \(\infty\).</p>
<p>\(h=\dfrac{1000}{100}=10\), \(O_{\min}=200+400=600\)</p>
<p><b>Antwort:</b> Das optimale Paket ist ein Würfel mit 10 cm Kantenlänge und 600 cm² Oberfläche.</p>`},
 f:{ tags:['ohne Hilfsmittel','rechnerisch (mit Rechenweg)'],
  intro:R`Ein oben offenes Aquarium mit quadratischer Grundfläche soll 32 Liter fassen (\(1\,\ell=1000\,\text{cm}^3\)). Der Glasverbrauch soll minimal sein.`,
  parts:[
   {type:'mc', q:R`Welche Zielfunktion beschreibt die Glasfläche?`,
    opts:[[R`\(O(a)=a^2+\dfrac{128000}{a}\)`,1],[R`\(O(a)=2a^2+\dfrac{128000}{a}\)`,0],[R`\(O(a)=a^2+\dfrac{32000}{a}\)`,0],[R`\(O(a)=a^2+\dfrac{128000}{a^2}\)`,0]],
    hint:R`Oben offen bedeutet: nur ein Quadrat. Rechne das Volumen in cm³ um.`},
   {type:'num', q:R`Berechne die optimalen Maße und den minimalen Glasverbrauch.`,
    fields:[{lab:R`\(a=\)`,val:40,tol:0.01,unit:'cm'},{lab:R`\(h=\)`,val:20,tol:0.01,unit:'cm'},{lab:R`\(O_{\min}=\)`,val:4800,tol:1,unit:'cm²'}],
    hint:R`\(O'(a)=0\) liefert \(a^3=\ldots\). Suche eine Zahl, deren dritte Potenz das Ergebnis ist.`},
   {type:'mc', q:R`Welche Beziehung zwischen Höhe und Kantenlänge hat das optimale Aquarium?`,

    hint:R`Vergleiche deine Werte für \(h\) und \(a\).`}
  ],
  tips:[R`\(O=a^2+4ah\) und \(a^2h=32000\).`,
        R`Nach dem Nullsetzen der Ableitung multiplizierst du mit \(a^2\) und teilst durch 2.`],
  sol:R`<p>\(h=\dfrac{32000}{a^2}\), \(O(a)=a^2+4a\cdot\dfrac{32000}{a^2}=a^2+\dfrac{128000}{a}\)</p>
<p>\(O'(a)=2a-\dfrac{128000}{a^2}=0\Leftrightarrow a^3=64000\Leftrightarrow a=40\)</p>
<p>\(O''(a)=2+\dfrac{256000}{a^3}\gt 0\): Minimum.</p>
<p>\(h=\dfrac{32000}{1600}=20\), \(O_{\min}=1600+3200=4800\)</p>
<p><b>Antwort:</b> Kantenlänge 40 cm, Höhe 20 cm, Glasfläche 4800 cm². Die Höhe ist halb so groß wie die Kante.</p>`},
 p:{ tags:['ohne Hilfsmittel','rechnerisch + allgemeiner Nachweis'],
  intro:R`Eine Faltschachtel mit quadratischer Grundfläche und Volumen 2000 cm³ wird so gefaltet, dass Boden und Deckel aus je <b>zwei</b> Lagen Karton bestehen (die Klappen überlappen vollständig). Die Seitenwände sind einlagig.`,
  parts:[
   {type:'num', q:R`Berechne die Maße mit minimalem Kartonverbrauch und den Kartonverbrauch.`,
    fields:[{lab:R`\(a=\)`,val:10,tol:0.01,unit:'cm'},{lab:R`\(h=\)`,val:20,tol:0.01,unit:'cm'},{lab:R`\(M_{\min}=\)`,val:1200,tol:0.5,unit:'cm²'}],
    hint:R`Boden und Deckel zählen jeweils doppelt: \(M=4a^2+4ah\).`},
   {type:'mc', q:R`Weise allgemein (für beliebiges \(V\)) nach: Welches Verhältnis \(h:a\) hat die optimale Faltschachtel?`,
    opts:[[R`\(h:a=2\) – unabhängig von \(V\)`,1],[R`\(h:a=1\) – unabhängig von \(V\)`,0],[R`\(h:a=4\) – unabhängig von \(V\)`,0],[R`\(h:a\) wächst mit \(V\)`,0]],
    hint:R`Allgemein: \(h=\dfrac{V}{a^2}\). Bilde \(\dfrac{h}{a}=\dfrac{V}{a^3}\) und setze den Ausdruck für \(a^3\) aus \(M'(a)=0\) ein.`},
   {type:'mc', q:R`Vergleiche mit dem einlagigen Paket. Welche Aussage stimmt?`,
    opts:[[R`Teureres (doppeltes) Material bei Boden und Deckel macht die optimale Form höher und schmaler.`,1],[R`Doppeltes Material bei Boden und Deckel macht die optimale Form flacher.`,0],[R`Die optimale Form ändert sich nicht, nur der Verbrauch steigt.`,0],[R`Die optimale Form ist wieder ein Würfel.`,0]],
    hint:R`Vergleiche \(h:a\) beim einlagigen Paket mit deinem Ergebnis.`}
  ],
  tips:[R`\(M(a)=4a^2+4a\cdot\dfrac{2000}{a^2}\). Vereinfache und leite ab.`,
        R`Allgemein gilt nach dem Nullsetzen \(a^3=\dfrac{V}{2}\). Nutze das für den Quotienten \(\dfrac{h}{a}\).`],
  sol:R`<p>\(M(a)=4a^2+\dfrac{8000}{a}\), \(M'(a)=8a-\dfrac{8000}{a^2}=0\Leftrightarrow a^3=1000\Leftrightarrow a=10\)</p>
<p>\(M''(a)=8+\dfrac{16000}{a^3}\gt 0\): Minimum. \(h=\dfrac{2000}{100}=20\), \(M_{\min}=400+800=1200\)</p>
<p><b>Allgemein:</b> \(M(a)=4a^2+\dfrac{4V}{a}\), \(M'(a)=8a-\dfrac{4V}{a^2}=0\Leftrightarrow a^3=\dfrac{V}{2}\)</p>
<p>\(\dfrac{h}{a}=\dfrac{V}{a^3}=V\cdot\dfrac{2}{V}=2\) – unabhängig vom Volumen.</p>
<p><b>Vergleich:</b> Einlagig ist der Würfel optimal (\(h:a=1\)). Wird die Grundfläche teurer, lohnt es sich, sie zu verkleinern und dafür in die Höhe zu bauen – genau wie bei der Dose.</p>`}
}},
/* ---------------- KEGEL ---------------- */
{ id:'kegel', tab:'🍦 Kegelbecher', title:'Kegelförmiger Trinkbecher – Volumen maximieren', fig:FIG.kegel, levels:{
 g:{ tags:['mit GeoGebra','Bestimmen mit GeoGebra (Extremum)'],
  intro:R`Ein kegelförmiger Trinkbecher (Spitze unten, oben offen) soll aus Papier gerollt werden. Die Mantellinie ist \(s=12\) cm lang. Das Volumen soll maximal sein.`,
  parts:[
   {type:'mc', q:R`Welche Nebenbedingung verbindet \(r\) und \(h\)?`,
    opts:[[R`\(r^2=144-h^2\)`,1],[R`\(r=12-h\)`,0],[R`\(r^2=144+h^2\)`,0],[R`\(r=144-h^2\)`,0]],
    hint:R`In der Skizze siehst du ein rechtwinkliges Dreieck. Welche Seite ist die Hypotenuse?`},
   {type:'mc', q:R`Welche Zielfunktion beschreibt das Volumen in Abhängigkeit von \(h\)?`,
    opts:[[R`\(V(h)=\dfrac{\pi}{3}\cdot(144-h^2)\cdot h\)`,1],[R`\(V(h)=\dfrac{\pi}{3}\cdot(12-h)^2\cdot h\)`,0],[R`\(V(h)=\pi\cdot(144-h^2)\cdot h\)`,0],[R`\(V(h)=\dfrac{\pi}{3}\cdot(144-h)\cdot h\)`,0]],
    hint:R`Kegelvolumen: \(V=\dfrac{1}{3}\pi r^2 h\). Ersetze \(r^2\), nicht \(r\).`},
   {type:'mc', q:R`Gib den Definitionsbereich an.`,
    opts:[[R`\(0\lt h\lt 12\)`,1],[R`\(0\lt h\lt 144\)`,0],[R`\(0\lt h\lt 6\)`,0],[R`\(h\gt 0\)`,0]],
    hint:R`Die Höhe ist eine Kathete – sie kann nicht länger als die Hypotenuse sein.`},
   {type:'num', q:R`Bestimme mit GeoGebra die optimale Höhe, den zugehörigen Radius und das maximale Volumen.`,
    fields:[{lab:R`\(h\approx\)`,val:6.93,tol:0.011,unit:'cm'},{lab:R`\(r\approx\)`,val:9.80,tol:0.011,unit:'cm'},{lab:R`\(V_{\max}\approx\)`,val:696.50,tol:0.3,unit:'cm³'}],
    hint:R`Nutze Extremum mit den Grenzen des Definitionsbereichs. Den Radius erhältst du über die Nebenbedingung.`}
  ],
  tips:[R`Satz des Pythagoras: Die Mantellinie liegt dem rechten Winkel gegenüber.`,
        R`In GeoGebra z. B. <code>V(x)=pi*(144-x^2)*x/3</code> und dann <code>Extremum(V, 0, 12)</code>.`],
  sol:R`<p><b>Nebenbedingung:</b> \(r^2+h^2=12^2\Rightarrow r^2=144-h^2\)</p>
<p><b>Zielfunktion:</b> \(V(h)=\dfrac{1}{3}\pi(144-h^2)h\), \(D=\,]0;12[\)</p>
<p><b>GeoGebra:</b> Extremum liefert den Hochpunkt \(H(6{,}93\,|\,696{,}50)\).</p>
<p>\(r=\sqrt{144-6{,}93^2}\approx 9{,}80\) (mit ungerundetem \(h\) gerechnet)</p>
<p><b>Antwort:</b> Bei \(h\approx 6{,}93\) cm und \(r\approx 9{,}80\) cm fasst der Becher maximal etwa 696,50 cm³.</p>`},
 f:{ tags:['ohne Hilfsmittel','rechnerisch (exakt)'],
  intro:R`Gleicher Becher wie in den Grundlagen: \(s=12\) cm, Zielfunktion \(V(h)=\dfrac{\pi}{3}(144h-h^3)\), \(D=\,]0;12[\). Rechne nun exakt ohne Taschenrechner.`,
  parts:[
   {type:'mc', q:R`Welche Ableitung ist richtig?`,
    opts:[[R`\(V'(h)=\dfrac{\pi}{3}(144-3h^2)\)`,1],[R`\(V'(h)=\dfrac{\pi}{3}(144-h^2)\)`,0],[R`\(V'(h)=\pi(144-3h^2)\)`,0],[R`\(V'(h)=\dfrac{\pi}{3}(144h-3h^2)\)`,0]],
    hint:R`Der konstante Faktor \(\dfrac{\pi}{3}\) bleibt stehen, die Klammer wird summandenweise abgeleitet.`},
   {type:'mc', q:R`Gib die exakten Werte der optimalen Höhe und des Radius an.`,
    opts:[[R`\(h=4\sqrt{3}\), \(r=4\sqrt{6}\)`,1],[R`\(h=4\sqrt{2}\), \(r=4\sqrt{7}\)`,0],[R`\(h=6\), \(r=6\sqrt{3}\)`,0],[R`\(h=2\sqrt{3}\), \(r=2\sqrt{33}\)`,0]],
    hint:R`Aus \(V'(h)=0\) folgt eine Gleichung für \(h^2\). Zerlege die Wurzel teilweise.`},
   {type:'mc', q:R`Gib das exakte maximale Volumen an.`,
    opts:[[R`\(V_{\max}=128\sqrt{3}\,\pi\)`,1],[R`\(V_{\max}=384\sqrt{3}\,\pi\)`,0],[R`\(V_{\max}=64\sqrt{3}\,\pi\)`,0],[R`\(V_{\max}=128\sqrt{6}\,\pi\)`,0]],
    hint:R`Setze in \(V=\dfrac{1}{3}\pi r^2 h\) ein; \(r^2\) ist eine ganze Zahl.`},
   {type:'mc', q:R`Wie lautet die hinreichende Bedingung?`,
    opts:[[R`\(V''(h)=-2\pi h\lt 0\) für \(h\gt 0\), also Maximum`,1],[R`\(V''(h)=2\pi h\gt 0\), also Maximum`,0],[R`\(V''(h)=48\pi\gt 0\), also Minimum`,0],[R`\(V''(h)=-6\pi h^2\lt 0\), also Maximum`,0]],
    hint:R`Schreibe \(V'(h)=48\pi-\pi h^2\) und leite noch einmal ab.`}
  ],
  tips:[R`\(V'(h)=0\Leftrightarrow 144=3h^2\). Teile durch 3.`,
        R`\(\sqrt{48}=\sqrt{16\cdot 3}\). Für den Radius: \(r^2=144-h^2\).`],
  sol:R`<p>\(V'(h)=\dfrac{\pi}{3}(144-3h^2)=48\pi-\pi h^2\)</p>
<p>\(V'(h)=0\Leftrightarrow h^2=48\Leftrightarrow h=\sqrt{48}=4\sqrt{3}\) (da \(h\gt 0\))</p>
<p>\(V''(h)=-2\pi h\), \(V''(4\sqrt{3})\lt 0\): Maximum. Randwerte \(V(0)=V(12)=0\).</p>
<p>\(r^2=144-48=96\Rightarrow r=\sqrt{96}=4\sqrt{6}\)</p>
<p>\(V_{\max}=\dfrac{1}{3}\pi\cdot 96\cdot 4\sqrt{3}=128\sqrt{3}\,\pi\approx 696{,}50\)</p>`},
 p:{ tags:['mit GTR','rechnerisch + Begründung'],
  intro:R`Der optimale Becher wird aus einer Kreisscheibe mit dem Radius \(s=12\) cm hergestellt: Ein Kreisausschnitt mit dem Mittelpunktswinkel \(\alpha\) wird ausgeschnitten und zum Kegelmantel gerollt (ohne Klebezugabe). Nutze \(h=4\sqrt{3}\) und \(r=4\sqrt{6}\).`,
  parts:[
   {type:'num', q:R`Berechne den Mittelpunktswinkel \(\alpha\) des Kreisausschnitts.`,
    fields:[{lab:R`\(\alpha\approx\)`,val:293.94,tol:0.1,unit:'°'}],
    hint:R`Der Kreisbogen des Ausschnitts wird zum Umfang des Becherrands.`},
   {type:'num', q:R`Wie viel Prozent der Kreisscheibe werden weggeschnitten?`,
    fields:[{lab:'Anteil ≈',val:18.35,tol:0.1,unit:'%'}],
    hint:R`Der Anteil eines Kreisausschnitts an der Kreisfläche ist \(\dfrac{\alpha}{360^\circ}\).`},
   {type:'mc', q:R`Hängt der optimale Winkel \(\alpha\) von der Länge der Mantellinie \(s\) ab?`,
    opts:[[R`Nein: \(\alpha=360^\circ\cdot\sqrt{\dfrac{2}{3}}\) für jedes \(s\).`,1],[R`Ja: \(\alpha\) wächst proportional zu \(s\).`,0],[R`Ja: \(\alpha\) wird mit wachsendem \(s\) kleiner.`,0],[R`Nein: \(\alpha=360^\circ\cdot\dfrac{2}{3}\) für jedes \(s\).`,0]],
    hint:R`Rechne allgemein: Aus \(V'(h)=0\) folgt \(h^2=\dfrac{s^2}{3}\). Bestimme damit \(\dfrac{r}{s}\).`}
  ],
  tips:[R`Bogenlänge: \(b=\dfrac{\alpha}{360^\circ}\cdot 2\pi s\). Diese muss gleich \(2\pi r\) sein.`,
        R`Allgemein: \(r^2=s^2-h^2\). Setze das Ergebnis für \(h^2\) ein und bilde \(\dfrac{r}{s}\).`],
  sol:R`<p><b>Bogen = Umfang:</b> \(\dfrac{\alpha}{360^\circ}\cdot 2\pi\cdot 12=2\pi\cdot 4\sqrt{6}\Rightarrow\alpha=360^\circ\cdot\dfrac{4\sqrt{6}}{12}\approx 293{,}94^\circ\)</p>
<p><b>Weggeschnitten:</b> \(\dfrac{360^\circ-293{,}94^\circ}{360^\circ}\cdot 100\approx 18{,}35\) %</p>
<p><b>Allgemein:</b> \(V(h)=\dfrac{\pi}{3}(s^2h-h^3)\), \(V'(h)=0\Leftrightarrow h^2=\dfrac{s^2}{3}\), \(r^2=s^2-\dfrac{s^2}{3}=\dfrac{2}{3}s^2\Rightarrow\dfrac{r}{s}=\sqrt{\dfrac{2}{3}}\)</p>
<p>\(\alpha=360^\circ\cdot\dfrac{r}{s}=360^\circ\cdot\sqrt{\dfrac{2}{3}}\) – unabhängig von \(s\). Jeder volumenoptimale Kegelbecher hat dieselbe Form.</p>`}
}},
/* ---------------- ZYLINDER IM KEGEL ---------------- */
{ id:'zylkegel', tab:'🔺 Zylinder im Kegel', title:'Zylinder im Kegel – Volumen maximieren', fig:FIG.zylkegel, levels:{
 g:{ tags:['mit GeoGebra','Bestimmen mit GeoGebra (Extremum)'],
  intro:R`Einem Kegel mit dem Radius \(R=6\) cm und der Höhe \(H=12\) cm wird ein Zylinder einbeschrieben (Zylinderboden liegt auf der Kegelgrundfläche). Das Zylindervolumen soll maximal sein.`,
  parts:[
   {type:'mc', q:R`Welche Nebenbedingung liefert der Strahlensatz?`,
    opts:[[R`\(h=12-2r\)`,1],[R`\(h=12-\dfrac{r}{2}\)`,0],[R`\(h=6-2r\)`,0],[R`\(h=2r\)`,0]],
    hint:R`Vergleiche im Achsenschnitt das kleine Dreieck über dem Zylinder mit dem ganzen halben Kegel: \(\dfrac{12-h}{12}=\dfrac{r}{6}\).`},
   {type:'mc', q:R`Welche Zielfunktion beschreibt das Zylindervolumen?`,
    opts:[[R`\(V(r)=\pi r^2(12-2r)\)`,1],[R`\(V(r)=\dfrac{\pi}{3}r^2(12-2r)\)`,0],[R`\(V(r)=2\pi r(12-2r)\)`,0],[R`\(V(r)=\pi r(12-2r)^2\)`,0]],
    hint:R`Es geht um das Volumen des Zylinders, nicht des Kegels.`},
   {type:'mc', q:R`Gib den Definitionsbereich an.`,
    opts:[[R`\(0\lt r\lt 6\)`,1],[R`\(0\lt r\lt 12\)`,0],[R`\(0\lt r\lt 3\)`,0],[R`\(r\gt 0\)`,0]],
    hint:R`Der Zylinder muss in den Kegel passen und eine positive Höhe haben.`},
   {type:'num', q:R`Bestimme mit GeoGebra die Maße des größten Zylinders und sein Volumen.`,
    fields:[{lab:R`\(r\approx\)`,val:4,tol:0.011,unit:'cm'},{lab:R`\(h\approx\)`,val:4,tol:0.021,unit:'cm'},{lab:R`\(V_{\max}\approx\)`,val:201.06,tol:0.2,unit:'cm³'}],
    hint:R`Extremum im Intervall des Definitionsbereichs. Die Höhe folgt aus der Nebenbedingung.`}
  ],
  tips:[R`Zeichne den Achsenschnitt: ein gleichschenkliges Dreieck mit einem einbeschriebenen Rechteck.`,
        R`In GeoGebra z. B. <code>V(x)=pi*x^2*(12-2x)</code> und <code>Extremum(V, 0, 6)</code>.`],
  sol:R`<p><b>Strahlensatz:</b> \(\dfrac{12-h}{12}=\dfrac{r}{6}\Rightarrow h=12-2r\)</p>
<p><b>Zielfunktion:</b> \(V(r)=\pi r^2(12-2r)\), \(D=\,]0;6[\)</p>
<p><b>GeoGebra:</b> Hochpunkt \(H(4\,|\,201{,}06)\)</p>
<p>\(h=12-8=4\), \(V_{\max}=64\pi\approx 201{,}06\)</p>
<p><b>Antwort:</b> Der größte Zylinder hat \(r=4\) cm, \(h=4\) cm und etwa 201,06 cm³ Volumen.</p>`},
 f:{ tags:['ohne Hilfsmittel','rechnerisch (mit Rechenweg)'],
  intro:R`Nun hat der Kegel den Radius \(R=9\) cm und die Höhe \(H=15\) cm. Bestimme den Zylinder mit maximalem Volumen rechnerisch.`,
  parts:[
   {type:'mc', q:R`Welche Nebenbedingung gilt?`,
    opts:[[R`\(h=15-\dfrac{5}{3}r\)`,1],[R`\(h=15-\dfrac{3}{5}r\)`,0],[R`\(h=9-\dfrac{5}{3}r\)`,0],[R`\(h=15-5r\)`,0]],
    hint:R`Strahlensatz: \(\dfrac{15-h}{15}=\dfrac{r}{9}\). Löse nach \(h\) auf.`},
   {type:'num', q:R`Berechne Radius, Höhe und maximales Volumen (Volumen auf zwei Nachkommastellen).`,
    fields:[{lab:R`\(r=\)`,val:6,tol:0.01,unit:'cm'},{lab:R`\(h=\)`,val:5,tol:0.01,unit:'cm'},{lab:R`\(V_{\max}\approx\)`,val:565.49,tol:0.2,unit:'cm³'}],
    hint:R`Multipliziere die Zielfunktion aus, bevor du ableitest. Klammere in \(V'(r)=0\) aus.`},
   {type:'mc', q:R`Gib das maximale Volumen exakt an.`,
    opts:[[R`\(V_{\max}=180\pi\)`,1],[R`\(V_{\max}=540\pi\)`,0],[R`\(V_{\max}=60\pi\)`,0],[R`\(V_{\max}=225\pi\)`,0]],
    hint:R`\(V=\pi r^2 h\) mit deinen Werten – ohne zu runden.`}
  ],
  tips:[R`\(V(r)=\pi r^2\left(15-\dfrac{5}{3}r\right)=15\pi r^2-\dfrac{5\pi}{3}r^3\)`,
        R`\(V'(r)=0\): Klammere \(5\pi r\) aus. Eine Lösung liegt nicht in \(D\).`],
  sol:R`<p>\(\dfrac{15-h}{15}=\dfrac{r}{9}\Rightarrow h=15-\dfrac{5}{3}r\), \(D=\,]0;9[\)</p>
<p>\(V(r)=15\pi r^2-\dfrac{5\pi}{3}r^3\), \(V'(r)=30\pi r-5\pi r^2=5\pi r(6-r)\)</p>
<p>\(V'(r)=0\Leftrightarrow r=0\notin D\) oder \(r=6\)</p>
<p>\(V''(r)=30\pi-10\pi r\), \(V''(6)=-30\pi\lt 0\): Maximum</p>
<p>\(h=15-10=5\), \(V_{\max}=\pi\cdot 36\cdot 5=180\pi\approx 565{,}49\)</p>`},
 p:{ tags:['ohne Hilfsmittel','allgemeiner Nachweis'],
  intro:R`Betrachte allgemein einen Kegel mit Radius \(R\) und Höhe \(H\). Für den einbeschriebenen Zylinder gilt \(h=H\left(1-\dfrac{r}{R}\right)\).`,
  parts:[
   {type:'mc', q:R`Bestimme die Maße des volumengrößten Zylinders allgemein.`,
    opts:[[R`\(r=\dfrac{2}{3}R\), \(h=\dfrac{1}{3}H\)`,1],[R`\(r=\dfrac{1}{2}R\), \(h=\dfrac{1}{2}H\)`,0],[R`\(r=\dfrac{2}{3}R\), \(h=\dfrac{2}{3}H\)`,0],[R`\(r=\dfrac{1}{3}R\), \(h=\dfrac{2}{3}H\)`,0]],
    hint:R`\(V(r)=\pi H\left(r^2-\dfrac{r^3}{R}\right)\). Leite nach \(r\) ab; \(R\) und \(H\) sind Konstanten.`},
   {type:'num', q:R`Wie viel Prozent des Kegelvolumens nimmt der größte Zylinder ein?`,
    fields:[{lab:'Anteil ≈',val:44.44,tol:0.06,unit:'%'}],
    hint:R`Setze die allgemeinen Maße in \(V_Z=\pi r^2h\) ein und teile durch \(V_K=\dfrac{1}{3}\pi R^2H\).`},
   {type:'mc', q:R`Statt des Volumens soll nun die <b>Mantelfläche</b> des Zylinders maximal werden. Welcher Radius ist optimal?`,
    opts:[[R`\(r=\dfrac{1}{2}R\)`,1],[R`\(r=\dfrac{2}{3}R\)`,0],[R`\(r=\dfrac{1}{3}R\)`,0],[R`\(r=\dfrac{3}{4}R\)`,0]],
    hint:R`\(M(r)=2\pi r h\) mit der Nebenbedingung – das ist eine nach unten geöffnete Parabel in \(r\).`}
  ],
  tips:[R`\(V'(r)=\pi H\left(2r-\dfrac{3r^2}{R}\right)\). Klammere \(r\) aus.`,
        R`Beim Quotienten \(\dfrac{V_Z}{V_K}\) kürzen sich \(\pi\), \(R^2\) und \(H\) vollständig heraus.`],
  sol:R`<p>\(V(r)=\pi r^2H\left(1-\dfrac{r}{R}\right)=\pi H\left(r^2-\dfrac{r^3}{R}\right)\)</p>
<p>\(V'(r)=\pi H\,r\left(2-\dfrac{3r}{R}\right)=0\Leftrightarrow r=\dfrac{2}{3}R\) (da \(r\gt 0\)); Vorzeichenwechsel von \(+\) nach \(-\): Maximum</p>
<p>\(h=H\left(1-\dfrac{2}{3}\right)=\dfrac{1}{3}H\)</p>
<p>\(V_Z=\pi\cdot\dfrac{4}{9}R^2\cdot\dfrac{1}{3}H=\dfrac{4}{27}\pi R^2H\), \(\dfrac{V_Z}{V_K}=\dfrac{4}{27}\cdot 3=\dfrac{4}{9}\approx 44{,}44\) % – für jeden Kegel gleich.</p>
<p><b>Mantel:</b> \(M(r)=2\pi H\left(r-\dfrac{r^2}{R}\right)\), \(M'(r)=2\pi H\left(1-\dfrac{2r}{R}\right)=0\Leftrightarrow r=\dfrac{R}{2}\)</p>`}
}},
/* ---------------- PAPIERBECHER ---------------- */
{ id:'papier', tab:'📜 Papierbecher', title:'Zylinderbecher aus Papier – mit Klebezugaben', fig:FIG.papier, levels:{
 g:{ tags:['mit GTR','rechnerisch (mit Rechenweg)'],
  intro:R`Aus 500 cm² Papier soll ein oben offener, zylinderförmiger Becher (Boden + Mantel) mit maximalem Volumen entstehen. Zunächst wird <b>ohne</b> Klebezugaben gerechnet (Idealfall).`,
  parts:[
   {type:'mc', q:R`Welche Nebenbedingung gilt?`,
    opts:[[R`\(500=2\pi r h+\pi r^2\)`,1],[R`\(500=2\pi r h+2\pi r^2\)`,0],[R`\(500=\pi r^2 h\)`,0],[R`\(500=\pi r h+\pi r^2\)`,0]],
    hint:R`Der Becher ist oben offen – wie viele Kreisflächen gibt es?`},
   {type:'mc', q:R`Welche Zielfunktion \(V(r)\) ergibt sich?`,
    opts:[[R`\(V(r)=250r-\dfrac{\pi}{2}r^3\)`,1],[R`\(V(r)=500r-\pi r^3\)`,0],[R`\(V(r)=250r-\pi r^3\)`,0],[R`\(V(r)=250r^2-\dfrac{\pi}{2}r^3\)`,0]],
    hint:R`Löse die Nebenbedingung nach \(h\) auf, setze in \(V=\pi r^2h\) ein und kürze.`},
   {type:'num', q:R`Berechne die Maße des Bechers mit maximalem Volumen und das Volumen.`,
    fields:[{lab:R`\(r\approx\)`,val:7.28,tol:0.011,unit:'cm'},{lab:R`\(h\approx\)`,val:7.28,tol:0.011,unit:'cm'},{lab:R`\(V_{\max}\approx\)`,val:1213.94,tol:0.5,unit:'cm³'}],
    hint:R`\(V'(r)=0\) liefert eine Gleichung für \(r^2\). Rechne mit dem ungerundeten \(r\) weiter.`}
  ],
  tips:[R`\(h=\dfrac{500-\pi r^2}{2\pi r}\). Beim Einsetzen kürzt sich ein \(\pi r\).`,
        R`Die Ableitung von \(\dfrac{\pi}{2}r^3\) ist \(\dfrac{3\pi}{2}r^2\).`],
  sol:R`<p><b>Nebenbedingung:</b> \(500=2\pi rh+\pi r^2\Rightarrow h=\dfrac{500-\pi r^2}{2\pi r}\)</p>
<p><b>Zielfunktion:</b> \(V(r)=\pi r^2\cdot\dfrac{500-\pi r^2}{2\pi r}=\dfrac{r(500-\pi r^2)}{2}=250r-\dfrac{\pi}{2}r^3\), \(D=\,]0;\sqrt{\dfrac{500}{\pi}}[\)</p>
<p>\(V'(r)=250-\dfrac{3\pi}{2}r^2=0\Leftrightarrow r^2=\dfrac{500}{3\pi}\Leftrightarrow r\approx 7{,}28\)</p>
<p>\(V''(r)=-3\pi r\lt 0\): Maximum</p>
<p>\(h=\dfrac{500-\pi r^2}{2\pi r}\approx 7{,}28\) – im Idealfall gilt \(h=r\).</p>
<p>\(V_{\max}=\pi r^3\approx 1213{,}94\)</p>`},

const LEVELS = [['g','Grundlagen'],['f','Fortgeschritten'],['p','Profi']];
let curLevel = 'g', curTab = 'dose';
const ALLPARTS = []; // {card, lvl, idx, status, everWrong}

/* ============ Hilfsfunktionen ============ */
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function typeset(node){ if(window.MathJax && MathJax.typesetPromise){ MathJax.typesetPromise([node]).catch(()=>{}); } }
function parseNum(s){ s=String(s).trim().replace(/\s/g,'').replace(',', '.'); if(s==='' || !/^[-+]?\d*\.?\d+$/.test(s)) return NaN; return parseFloat(s); }
function setFb(fb, kind, html){ fb.className='fb '+kind; fb.innerHTML=html; typeset(fb); }
function unitList(u){ if(u==='°') return ['°','cm','cm²']; if(['cm','cm²','cm³'].includes(u)) return L3; return null; }
function unitKind(u){ return {'cm':'eine Länge','cm²':'eine Fläche','cm³':'ein Volumen','°':'ein Winkel'}[u]||''; }

/* ============ Teil-Aufgaben bauen ============ */
function buildPart(p, idx, ctx){
  const wrap = el('div','part');
  const letter = String.fromCharCode(97+idx);
  wrap.appendChild(el('p','q', '<b class="nr">'+letter+')</b> '+p.q));
  const rec = {card:ctx.card, lvl:ctx.lvl, idx, label:letter, status:null, everWrong:false};
  ALLPARTS.push(rec);
  const fb = el('div','fb');
  const row = el('div','btnrow');
  const bCheck = el('button','btn','Prüfen');
  const bClear = el('button','btn clear','Leeren');
  row.appendChild(bCheck); row.appendChild(bClear);

  function fail(html){ rec.status='bad'; rec.everWrong=true; setFb(fb,'bad','❌ '+html+'<br>'+p.hint); bClear.style.display='inline-block'; bCheck.disabled=true; ctx.showHelp(); }
  function success(){ rec.status='ok'; setFb(fb,'ok','✅ Richtig!'); bCheck.disabled=true; bClear.style.display='none'; }

  if(p.type==='mc'){
    const box = el('div','opts');
    const opts = shuffle(p.opts.map(o=>({t:o[0], ok:o[1]})));   // erst mischen …
    const btns = opts.map(o=>{ const b=el('button','opt',o.t); b.dataset.ok = o.ok ? '1':'0'; box.appendChild(b); return b; });
    let locked=false;
    btns.forEach(b=>b.addEventListener('click',()=>{            // … dann binden
      if(locked) return; btns.forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
    }));
    wrap.appendChild(box);
    bCheck.addEventListener('click',()=>{
      const sel = btns.find(b=>b.classList.contains('sel'));
      if(!sel){ setFb(fb,'info','Wähle zuerst eine Antwort aus.'); return; }
      locked=true; btns.forEach(b=>b.disabled=true);
      if(sel.dataset.ok==='1'){ sel.classList.add('right'); success(); }
      else { sel.classList.add('wrong'); fail('Diese Antwort stimmt noch nicht.'); }
    });
    bClear.addEventListener('click',()=>{
      locked=false; btns.forEach(b=>{ b.disabled=false; b.classList.remove('sel','right','wrong'); });
      fb.className='fb'; fb.innerHTML=''; bClear.style.display='none'; bCheck.disabled=false; rec.status=null;
    });
  }

  if(p.type==='num'){
    const box = el('div','fields');
    const items = p.fields.map(f=>{
      const fw = el('div','field');
      fw.appendChild(el('span','lab',f.lab));
      const inp = el('input','inp'); inp.type='text'; inp.setAttribute('inputmode','decimal'); inp.setAttribute('autocomplete','off');
      fw.appendChild(inp);
      let sel=null; const ul=unitList(f.unit);
      if(ul){ sel=el('select','unit'); sel.appendChild(new Option('Einheit','')); ul.forEach(u=>sel.appendChild(new Option(u,u))); fw.appendChild(sel); }
      else if(f.unit==='%'){ fw.appendChild(el('span','fixunit','%')); }
      box.appendChild(fw);
      return {f, inp, sel, okNum:false, okUnit:false};
    });
    wrap.appendChild(box);
    bCheck.addEventListener('click',()=>{
      if(items.some(it=>it.inp.value.trim()==='')){ setFb(fb,'info','Fülle bitte alle Felder aus.'); return; }
      const msgs=[]; let allOk=true;
      items.forEach(it=>{
        const v=parseNum(it.inp.value);
        it.okNum = !isNaN(v) && Math.abs(v-it.f.val) <= it.f.tol;
        it.okUnit = !it.sel || it.sel.value===it.f.unit;
        it.inp.classList.remove('okb','badb'); it.inp.classList.add(it.okNum?'okb':'badb');
        if(it.sel){ it.sel.classList.remove('okb','badb'); it.sel.classList.add(it.okUnit?'okb':'badb'); }
        it.inp.readOnly=true; if(it.sel) it.sel.disabled=true;
        if(isNaN(v)){ msgs.push('Bei '+it.f.lab+' steht keine gültige Zahl.'); allOk=false; return; }
        if(!it.okNum && !it.okUnit){ msgs.push('Bei '+it.f.lab+' stimmen Zahl und Einheit noch nicht.'); allOk=false; }
        else if(!it.okNum){ msgs.push('Bei '+it.f.lab+' stimmt die Zahl noch nicht.'); allOk=false; }
        else if(!it.okUnit){ allOk=false; msgs.push(it.sel.value==='' ? 'Wähle bei '+it.f.lab+' eine Einheit.' : 'Die Zahl bei '+it.f.lab+' stimmt, aber die Einheit passt nicht – ist das '+unitKind(it.f.unit)+'?'); }
      });
      if(allOk) success(); else fail(msgs.join('<br>'));
    });
    bClear.addEventListener('click',()=>{
      items.forEach(it=>{
        if(!it.okNum){ it.inp.value=''; }
        if(it.sel && (!it.okNum || !it.okUnit)){ it.sel.value=''; it.sel.classList.remove('okb'); }
        it.inp.readOnly=false; if(it.sel) it.sel.disabled=false;
        it.inp.classList.remove('badb'); if(it.sel) it.sel.classList.remove('badb');
        if(!it.okNum) it.inp.classList.remove('okb');
        if(it.sel && !it.okUnit) it.sel.classList.remove('okb');
      });
      fb.className='fb'; fb.innerHTML=''; bClear.style.display='none'; bCheck.disabled=false; rec.status=null;
    });
  }

  if(p.type==='order'){
    const pool = el('div','ord-zone'); pool.appendChild(el('div','ord-title','Bausteine (antippen zum Einordnen):'));
    const pl = el('div','ord-list'); pool.appendChild(pl);
    const tgt = el('div','ord-zone target'); tgt.appendChild(el('div','ord-title','Deine Reihenfolge (antippen zum Zurücklegen):'));
    const tl = el('div','ord-list'); tgt.appendChild(tl);
    let order = p.items.map((t,i)=>i);
    do { shuffle(order); } while(order.filter((v,i)=>v===i).length > Math.floor(order.length/3) || order.some((v,i)=>i>0 && v===order[i-1]+1 && v===i));
    let locked=false;
    const nodes = order.map(i=>{
      const b=el('button','ord-item'); b.dataset.pos=String(i);
      b.innerHTML='<span class="num"></span><span class="txt">'+p.items[i]+'</span><span class="corr"></span>';
      pl.appendChild(b); return b;
    });
    function renum(){ [...tl.children].forEach((b,k)=>b.querySelector('.num').textContent=(k+1)+'.'); [...pl.children].forEach(b=>b.querySelector('.num').textContent=''); }
    nodes.forEach(b=>b.addEventListener('click',()=>{
      if(locked) return;
      if(b.parentNode===pl) tl.appendChild(b); else pl.appendChild(b);
      renum();
    }));
    wrap.appendChild(pool); wrap.appendChild(tgt);
    bCheck.addEventListener('click',()=>{
      if(pl.children.length>0){ setFb(fb,'info','Ordne zuerst alle Bausteine ein.'); return; }
      locked=true; let ok=true;
      [...tl.children].forEach((b,k)=>{
        b.classList.add('locked'); b.disabled=true;
        const correct = Number(b.dataset.pos);
        if(correct===k){ b.classList.add('right'); }
        else { ok=false; b.classList.add('wrong'); b.querySelector('.corr').textContent='→ gehört an Platz '+(correct+1); }
      });
      if(ok) success(); else fail('Einige Schritte stehen noch an der falschen Stelle.');
    });
    bClear.addEventListener('click',()=>{
      locked=false;
      nodes.forEach(b=>{ b.classList.remove('locked','right','wrong'); b.disabled=false; b.querySelector('.corr').textContent=''; pl.appendChild(b); });
      renum(); fb.className='fb'; fb.innerHTML=''; bClear.style.display='none'; bCheck.disabled=false; rec.status=null;
    });
  }

  wrap.appendChild(row); wrap.appendChild(fb);
  return wrap;
}

function buildHelp(tips, sol){
  const h = el('div','help');
  h.appendChild(el('h3','', '💡 Hilfe'));
  const tipBtns=[], tipBoxes=[];
  tips.forEach((t,i)=>{
    const b=el('button','hbtn','Tipp '+(i+1)+' anzeigen'); const box=el('div','tip','<b>Tipp '+(i+1)+':</b> '+t);
    if(i>0) b.style.display='none';
    b.addEventListener('click',()=>{ box.style.display='block'; b.classList.add('on'); b.disabled=true; typeset(box); if(tipBtns[i+1]) tipBtns[i+1].style.display='inline-block'; });
    tipBtns.push(b); tipBoxes.push(box);
  });
  const tipRow = el('div',''); tipBtns.forEach(b=>tipRow.appendChild(b)); h.appendChild(tipRow);
  tipBoxes.forEach(b=>h.appendChild(b));
  const sb=el('button','hbtn','📘 Musterlösung anzeigen'); const sbox=el('div','sol',sol);
  sb.addEventListener('click',()=>{ const on = sbox.style.display==='block'; sbox.style.display=on?'none':'block'; sb.classList.toggle('on',!on); sb.textContent = on ? '📘 Musterlösung anzeigen' : '📘 Musterlösung ausblenden'; if(!on) typeset(sbox); });
  h.appendChild(sb); h.appendChild(sbox);
  return h;
}

function buildLevelPanel(card, lvl, data){
  const panel = el('div','lvl-panel'); panel.dataset.lvl=lvl;
  const tags = el('div','op-tags'); data.tags.forEach(t=>tags.appendChild(el('span','op-tag',t))); panel.appendChild(tags);
  panel.appendChild(el('div','intro',data.intro));
  const help = buildHelp(data.tips, data.sol);
  const ctx = {card, lvl, showHelp:()=>{ help.style.display='block'; }};
  data.parts.forEach((p,i)=>panel.appendChild(buildPart(p,i,ctx)));
  panel.appendChild(help);
  return panel;
}

const TABS = [];

function addTab(id, label){
  const b=el('button','tab-btn',label); b.dataset.tab=id; b.addEventListener('click',()=>showTab(id)); tabBar.appendChild(b); TABS.push(b);
}

CARDS.forEach(c=>{
  addTab(c.id, c.tab);
  const card = el('section','card'); card.id='card-'+c.id;
  card.appendChild(el('h2','',c.title));
  // Kartenkopf: op-tags der aktiven Stufe stehen als erstes Element jedes Stufen-Panels direkt unter dem Titel
  const panels = LEVELS.map(([k])=>buildLevelPanel(c.id, k, c.levels[k]));
  // Reihenfolge: Titel → (op-tags im Panel) – Abbildung nach den Tags einfügen
  panels.forEach(pn=>{
    const figHolder = el('div','fig-slot');
    pn.insertBefore(figHolder, pn.children[1]);
  });
  const fig = el('div','', c.fig);
  panels.forEach(pn=>card.appendChild(pn));
  card._fig = fig; card._panels = panels;
  cardsEl.appendChild(card);
});

// Wiederholung
addTab(REVIEW.id, REVIEW.tab);
(function(){
  const card = el('section','card'); card.id='card-'+REVIEW.id;
  card.appendChild(el('h2','',REVIEW.title));
  const tags = el('div','op-tags'); REVIEW.tags.forEach(t=>tags.appendChild(el('span','op-tag',t))); card.appendChild(tags);
  card.appendChild(el('div','intro',REVIEW.intro));
  const help = buildHelp(REVIEW.tips, REVIEW.sol);
  const ctx = {card:REVIEW.id, lvl:'-', showHelp:()=>{ help.style.display='block'; }};
  REVIEW.parts.forEach((p,i)=>card.appendChild(buildPart(p,i,ctx)));
  card.appendChild(help);
  cardsEl.appendChild(card);
})();

// Auswertung
addTab('auswertung','📊 Auswertung');
const evalCard = el('section','card'); evalCard.id='card-auswertung';
evalCard.appendChild(el('h2','','Auswertung'));
const evalBody = el('div',''); evalCard.appendChild(evalBody);
cardsEl.appendChild(evalCard);

function partChip(r){
  if(r.status==='ok' && !r.everWrong) return '<span class="chip g">'+r.label+') ✅</span>';
  if(r.status==='ok' && r.everWrong) return '<span class="chip k">'+r.label+') ✅ nach Korrektur</span>';
  if(r.status==='bad' || r.everWrong) return '<span class="chip r">'+r.label+') ❌</span>';
  return '<span class="chip o">'+r.label+') offen</span>';
}
function renderEval(){
  let first=0, later=0, wrong=0, open=0;
  ALLPARTS.forEach(r=>{ if(r.status==='ok'&&!r.everWrong) first++; else if(r.status==='ok') later++; else if(r.everWrong) wrong++; else open++; });
  const total = ALLPARTS.length;
  let html = '<div class="sumbox"><b>Gesamt:</b> '+total+' Teilaufgaben · <span class="chip g">✅ '+first+' im ersten Versuch</span><span class="chip k">✅ '+later+' nach Korrektur</span><span class="chip r">❌ '+wrong+' noch falsch</span><span class="chip o">'+open+' offen</span></div>';
  html += '<table class="eval"><tr><th>Karte</th>'+LEVELS.map(l=>'<th>'+l[1]+'</th>').join('')+'</tr>';
  CARDS.forEach(c=>{
    html += '<tr><td><button class="goto" data-goto="'+c.id+'">'+c.tab+'</button></td>';
    LEVELS.forEach(([k])=>{ html += '<td>'+ALLPARTS.filter(r=>r.card===c.id&&r.lvl===k).map(partChip).join(' ')+'</td>'; });
    html += '</tr>';
  });
  html += '<tr><td><button class="goto" data-goto="'+REVIEW.id+'">'+REVIEW.tab+'</button></td><td colspan="3">'+ALLPARTS.filter(r=>r.card===REVIEW.id).map(partChip).join(' ')+'</td></tr></table>';
  const done = first+later;
  let msg;
  if(done===0) msg='Du hast noch keine Teilaufgabe gelöst. Starte mit den Grundlagen einer Karte.';
  else if(wrong>0) msg='Rote Felder: Öffne die Karte, nutze „Leeren“ und versuche es mit den Tipps erneut.';
  else if(open>0) msg='Gut gemacht! Probiere als Nächstes eine höhere Niveaustufe.';
  else msg='Hervorragend – alle Aufgaben sind gelöst!';
  html += '<p class="intro" style="margin-top:12px">'+msg+'</p>';
  evalBody.innerHTML = html;
  evalBody.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.goto)));
}

/* ============ Umschalten (Zustand bleibt erhalten) ============ */
function placeFigure(){
  CARDS.forEach(c=>{
    const card = document.getElementById('card-'+c.id);
    const pn = card._panels.find(p=>p.dataset.lvl===curLevel);
    pn.querySelector('.fig-slot').appendChild(card._fig); // Knoten wird verschoben, nicht neu erzeugt
  });
}
function applyLevel(){
  document.querySelectorAll('.lvl-btn').forEach(b=>b.classList.toggle('active', b.dataset.lvl===curLevel));
  document.querySelectorAll('.lvl-panel').forEach(p=>p.style.display = p.dataset.lvl===curLevel ? 'block':'none');
  placeFigure();
}
function showTab(id){
  curTab=id;
  TABS.forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active', c.id==='card-'+id));
  const single = (id===REVIEW.id || id==='auswertung');
  document.querySelectorAll('.lvl-btn').forEach(b=>b.disabled=single);
  document.getElementById('lvlNote').style.display = single ? 'block':'none';
  document.getElementById('lvlNote').textContent = id==='auswertung' ? 'Die Auswertung zeigt alle Niveaustufen gleichzeitig.' : 'Diese Karte hat nur eine Stufe – die Niveaustufe spielt hier keine Rolle.';
  if(id==='auswertung') renderEval();
  window.scrollTo({top:0, behavior:'smooth'});
}
document.querySelectorAll('.lvl-btn').forEach(b=>b.addEventListener('click',()=>{ curLevel=b.dataset.lvl; applyLevel(); }));

/* ============ Papierbecher-Animation ============ */
const PAP = { t:0, playing:false, raf:null };
function papDraw(t){
  const svg = document.getElementById('papSvg'); if(!svg) return;
  const NS='http://www.w3.org/2000/svg';
  const r=3.2, h=4.4, d=0.5, L=2*Math.PI*r+d, S=17, e=38*Math.PI/180, cx=560, cy=190;
  const ce=Math.cos(e), se=Math.sin(e);
  const proj=(X,Y,Z)=>[cx+S*X, cy - S*Y*ce + S*Z*se];
  const depth=(X,Y,Z)=>Z*ce + Y*se;
  const ease=x=>x<0?0:x>1?1:(1-Math.cos(Math.PI*x))/2;
  const beta = ease(t/0.35)*Math.PI/2;
  const p = Math.max(ease((t-0.35)/0.65), 1e-4);
  const k = p/r, rho=1/k;
  const polys=[];
  // Boden
  const disc=[]; for(let i=0;i<60;i++){ const th=i/60*2*Math.PI; disc.push(proj(r*Math.sin(th),0,r*Math.cos(th))); }
  polys.push({dep:-1e9, pts:disc, fill:'#e6eefb', stroke:'#2f5fa6', sw:2});
  // Laschen
  const nT=20, gap=0.05;
  for(let i=0;i<nT;i++){
    const a0=i/nT*2*Math.PI+gap, a1=(i+1)/nT*2*Math.PI-gap;
    const P=[]; let dsum=0;
    [[a0,0],[a1,0],[a1,1],[a0,1]].forEach(([th,o])=>{
      const rad = o ? r + d*Math.cos(beta) : r; const Y = o ? d*Math.sin(beta) : 0;
      const X=rad*Math.sin(th), Z=rad*Math.cos(th); P.push(proj(X,Y,Z)); dsum+=depth(X,Y,Z);
    });
    polys.push({dep:dsum/4+0.01, pts:P, fill:'#fdf3d9', stroke:'#b8860b', sw:1.5});
  }
  // Mantel in Streifen
  const N=72;
  const pt=(u,Y)=>{ const phi=u*k; const rr=rho + 0.09*(u+L/2)/L; const X=rr*Math.sin(phi); const Z=-r+rho-rr*Math.cos(phi); return [X,Y,Z,phi]; };
  for(let i=0;i<N;i++){
    const u0=-L/2+i*L/N, u1=-L/2+(i+1)*L/N, um=(u0+u1)/2;
    const A=pt(u0,0), B=pt(u1,0), C=pt(u1,h), D=pt(u0,h), M=pt(um,h/2);
    const facing = -Math.cos(M[3])*ce + 0 > 0; // Außenseite zum Betrachter?
    const glue = um > L/2-d;
    const fill = glue ? '#fdf3d9' : (facing ? '#e6eefb' : '#dbe3ee');
    polys.push({dep:depth(M[0],M[1],M[2]), pts:[A,B,C,D].map(q=>proj(q[0],q[1],q[2])), fill, stroke:fill, sw:0.8,
      lines:[[proj(A[0],A[1],A[2]),proj(B[0],B[1],B[2])],[proj(D[0],D[1],D[2]),proj(C[0],C[1],C[2])]], lc: glue?'#b8860b':'#1f4680',
      side: i===0 ? [proj(A[0],A[1],A[2]),proj(D[0],D[1],D[2])] : (i===N-1 ? [proj(B[0],B[1],B[2]),proj(C[0],C[1],C[2])] : null)});
  }
  polys.sort((a,b)=>a.dep-b.dep);
  // Zeichnen
  const g3 = document.getElementById('pap3d'); g3.innerHTML='';
  polys.forEach(q=>{
    const pg=document.createElementNS(NS,'polygon');
    pg.setAttribute('points', q.pts.map(v=>v[0].toFixed(1)+','+v[1].toFixed(1)).join(' '));
    pg.setAttribute('fill', q.fill); pg.setAttribute('stroke', q.stroke); pg.setAttribute('stroke-width', q.sw); pg.setAttribute('stroke-linejoin','round');
    g3.appendChild(pg);
    (q.lines||[]).forEach(l=>{ const ln=document.createElementNS(NS,'line'); ln.setAttribute('x1',l[0][0]); ln.setAttribute('y1',l[0][1]); ln.setAttribute('x2',l[1][0]); ln.setAttribute('y2',l[1][1]); ln.setAttribute('stroke',q.lc); ln.setAttribute('stroke-width','2'); g3.appendChild(ln); });
    if(q.side){ const ln=document.createElementNS(NS,'line'); ln.setAttribute('x1',q.side[0][0]); ln.setAttribute('y1',q.side[0][1]); ln.setAttribute('x2',q.side[1][0]); ln.setAttribute('y2',q.side[1][1]); ln.setAttribute('stroke',q.lc); ln.setAttribute('stroke-width','2'); g3.appendChild(ln); }
  });
  const ph = document.getElementById('papPhase');
  ph.textContent = t<0.02 ? 'Netz flach' : t<0.35 ? 'Laschen hochklappen …' : t<0.99 ? 'Mantel herumrollen …' : 'Becher verklebt ✔';
}
function papInit(){
  const svg = document.getElementById('papSvg');
  const s=14, r=3.2, d=0.5, h=4.4, W=2*Math.PI*r*s, G=d*s, H=h*s, x0=24, y0=36;
  const ccx = x0+150, ccy = y0+H+40+(r+d)*s+8;
  let tabs=''; const nT=20;
  for(let i=0;i<nT;i++){ const a=i/nT*2*Math.PI; const x1=ccx+r*s*Math.cos(a), y1=ccy+r*s*Math.sin(a), x2=ccx+(r+d)*s*Math.cos(a), y2=ccy+(r+d)*s*Math.sin(a); tabs+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="#96690a" stroke-width="1.5"/>'; }
  svg.innerHTML =
   '<text x="'+x0+'" y="22" font-size="18" font-weight="700" fill="#1f4680">Netz</text>'+
   '<rect x="'+x0+'" y="'+y0+'" width="'+W.toFixed(1)+'" height="'+H+'" fill="#e6eefb" stroke="#1f4680" stroke-width="2.5"/>'+
   '<rect x="'+(x0+W).toFixed(1)+'" y="'+y0+'" width="'+G+'" height="'+H+'" fill="#fdf3d9" stroke="#b8860b" stroke-width="2.5"/>'+
   '<text x="'+(x0+W/2-20)+'" y="'+(y0+H+22)+'" font-size="18" fill="#22303f" font-style="italic">2πr</text>'+
   '<text x="'+(x0+W-10)+'" y="'+(y0-6)+'" font-size="17" fill="#96690a">+0,5</text>'+
   '<text x="'+(x0+W+G+6)+'" y="'+(y0+H/2+6)+'" font-size="18" fill="#22303f" font-style="italic">h</text>'+
   '<circle cx="'+ccx+'" cy="'+ccy.toFixed(1)+'" r="'+((r+d)*s).toFixed(1)+'" fill="#fdf3d9" stroke="#b8860b" stroke-width="2.5"/>'+
   tabs+
   '<circle cx="'+ccx+'" cy="'+ccy.toFixed(1)+'" r="'+(r*s).toFixed(1)+'" fill="#e6eefb" stroke="#1f4680" stroke-width="2" stroke-dasharray="6 4"/>'+
   '<line x1="'+ccx+'" y1="'+ccy.toFixed(1)+'" x2="'+(ccx+r*s)+'" y2="'+ccy.toFixed(1)+'" stroke="#c1272d" stroke-width="2.5"/>'+
   '<text x="'+(ccx+12)+'" y="'+(ccy-6).toFixed(1)+'" font-size="18" fill="#c1272d" font-style="italic">r</text>'+
   '<text x="'+(ccx+(r+d)*s+8)+'" y="'+(ccy+6).toFixed(1)+'" font-size="17" fill="#96690a">Laschen 0,5</text>'+
   '<line x1="345" y1="20" x2="345" y2="290" stroke="#dbe3ee" stroke-width="2"/>'+
   '<text x="370" y="22" font-size="18" font-weight="700" fill="#1f4680">Falten und Kleben</text>'+
   '<g id="pap3d"></g>';
  const rng=document.getElementById('papRange'), play=document.getElementById('papPlay');
  rng.addEventListener('input',()=>{ PAP.playing=false; play.textContent='▶ Animation abspielen'; cancelAnimationFrame(PAP.raf); PAP.t=rng.value/1000; papDraw(PAP.t); });
  play.addEventListener('click',()=>{
    if(PAP.playing){ PAP.playing=false; cancelAnimationFrame(PAP.raf); play.textContent='▶ Animation abspielen'; return; }
    if(PAP.t>=0.999) PAP.t=0;
    PAP.playing=true; play.textContent='⏸ Pause';
    let last=null;
    const step=ts=>{ if(!PAP.playing) return; if(last!==null){ PAP.t=Math.min(1, PAP.t+(ts-last)/5000); } last=ts; rng.value=Math.round(PAP.t*1000); papDraw(PAP.t);
      if(PAP.t<1) PAP.raf=requestAnimationFrame(step); else { PAP.playing=false; play.textContent='↺ Noch einmal'; } };
    PAP.raf=requestAnimationFrame(step);
  });
  papDraw(0);
}

/* ============ Start ============ */
applyLevel();
papInit();
showTab('dose');
const trex=document.getElementById('trex'); trex.addEventListener('click',()=>trex.classList.toggle('show'));
</script>
