// Brüche ausnahmslos div-basiert – auch in JS-Templates und innerHTML.
function F(n, d) {
  return '<span class="frac"><span class="num">' + n + '</span><span class="den">' + d + '</span></span>';
}
function L(i) { return String.fromCharCode(97 + i); }

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function norm(s) {
  return String(s == null ? '' : s).replace(/[\s\u00a0\u202f]/g, '').replace(/,/g, '.').toLowerCase();
}
function numEq(a, b) {
  const x = parseFloat(a), y = parseFloat(b);
  if (isNaN(x) || isNaN(y)) return false;
  return Math.abs(x - y) < 1e-9;
}
function textOk(value, ans) {
  const v = norm(value);
  if (v === '') return false;
  return v === norm(ans) || numEq(v, norm(ans));
}

const STUFEN = [
  { k: 'grund', n: 'Grundlagen' },
  { k: 'fort',  n: 'Fortgeschritten' },
  { k: 'profi', n: 'Profi' }
];

// ═════════════════════════════════════════
// Zustand (nur im JS-Speicher, kein localStorage)
// ═════════════════════════════════════════

const zustand = {};   // zustand['a1|grund'] = { geprueft, richtig, gesamt }
const aktiveStufe = {}; // aktiveStufe['a1'] = 'grund'
let aktiveKarte = 'a1';

function paneKey(cardId, level) { return cardId + '|' + level; }
function getStufe(karte, level) { return karte.stufen[level]; }

// ═════════════════════════════════════════
// Aufbau der Seite
// ═════════════════════════════════════════

function itemId(cardId, level, idx, teil) {
  return 'i_' + cardId + '_' + level + '_' + idx + (teil ? '_' + teil : '');
}

function renderItem(it, cardId, level, idx) {
  const label = '<span class="ex-label">' + L(idx) + ')</span>';
  const id = (teil) => itemId(cardId, level, idx, teil);

  if (it.t === 'num') {
    return '<li class="ex-item">' + label +
      '<span class="ex-task">' + it.frage + '</span>' +
      '<input class="ans-input' + (it.klasse ? ' ' + it.klasse : '') + '" id="' + id() +
      '" inputmode="' + (it.mode || 'decimal') + '" placeholder="?" autocomplete="off">' +
      (it.einheitText ? '<span class="ex-unit-text">' + it.einheitText + '</span>' : '') +
      '</li>';
  }
  if (it.t === 'unit') {
    const opts = ['<option value="">Einheit</option>']
      .concat(it.einheiten.map(e => '<option value="' + e + '">' + e + '</option>')).join('');
    return '<li class="ex-item">' + label +
      '<span class="ex-task">' + it.frage + '</span>' +
      '<input class="ans-input' + (it.klasse ? ' ' + it.klasse : '') + '" id="' + id() +
      '" inputmode="decimal" placeholder="?" autocomplete="off">' +
      '<select class="unit-select" id="' + id('u') + '">' + opts + '</select>' +
      '</li>';
  }
  if (it.t === 'frac') {
    return '<li class="ex-item">' + label +
      '<span class="ex-task">' + it.frage + '</span>' +
      '<span class="frac-input-wrap">' +
        '<input class="frac-input" id="' + id('n') + '" inputmode="numeric" placeholder="?" autocomplete="off">' +
        '<span class="frac-bar-line"></span>' +
        '<input class="frac-input" id="' + id('d') + '" inputmode="numeric" placeholder="?" autocomplete="off">' +
      '</span></li>';
  }
  if (it.t === 'mixed') {
    return '<li class="ex-item">' + label +
      '<span class="ex-task">' + it.frage + '</span>' +
      '<input class="ans-input small" id="' + id('g') + '" inputmode="numeric" placeholder="?" autocomplete="off">' +
      '<span class="ex-unit-text">+</span>' +
      '<span class="frac-input-wrap">' +
        '<input class="frac-input" id="' + id('n') + '" inputmode="numeric" placeholder="?" autocomplete="off">' +
        '<span class="frac-bar-line"></span>' +
        '<input class="frac-input" id="' + id('d') + '" inputmode="numeric" placeholder="?" autocomplete="off">' +
      '</span></li>';
  }
  if (it.t === 'cmp') {
    return '<li class="ex-item">' + label +
      '<span class="cmp-val">' + it.links + '</span>' +
      '<select class="cmp-select" id="' + id() + '">' +
        '<option value="">?</option>' +
        '<option value="&lt;">&lt;</option>' +
        '<option value="&gt;">&gt;</option>' +
        '<option value="=">=</option>' +
      '</select>' +
      '<span class="cmp-val">' + it.rechts + '</span></li>';
  }
  if (it.t === 'mc') {
    // Reihenfolge einmal beim Laden mischen – danach stabil.
    const gemischt = shuffle(it.opts.map((o, i) => ({ h: o.h, ok: !!o.ok, i: i })));
    const btns = gemischt.map(o =>
      '<button type="button" class="mc-btn" data-group="' + id() + '" data-ok="' + (o.ok ? '1' : '0') + '">' + o.h + '</button>'
    ).join('');
    return '<li class="ex-item">' + label +
      '<div class="mc-block">' +
        '<div class="mc-frage">' + it.frage + '</div>' +
        '<div class="mc-options" id="' + id() + '">' + btns + '</div>' +
      '</div></li>';
  }
  return '';
}

function renderPane(karte, stufe) {
  const def = getStufe(karte, stufe.k);
  const items = def.items.map((it, i) => renderItem(it, karte.id, stufe.k, i)).join('');
  return '<div class="pane" data-card="' + karte.id + '" data-level="' + stufe.k + '">' +
    (def.text ? '<div class="aufgabentext">' + def.text + '</div>' : '') +
    '<ul class="ex-list">' + items + '</ul>' +
    '<button class="btn js-check" data-card="' + karte.id + '" data-level="' + stufe.k + '">Prüfen ✓</button>' +
    '<div class="feedback" data-role="fb"></div>' +
    '<details class="hint" data-role="hilfe" hidden>' +
      '<summary>💡 Tipps und Musterlösung</summary>' +
      '<div class="hint-body">' +
        '<details class="sub"><summary>Tipp 1</summary><div class="sub-body">' + def.tipp1 + '</div></details>' +
        '<details class="sub"><summary>Tipp 2</summary><div class="sub-body">' + def.tipp2 + '</div></details>' +
        '<details class="sub"><summary>Musterlösung mit Lösungsweg</summary><div class="sub-body">' + def.loesung + '</div></details>' +
      '</div>' +
    '</details>' +
    '<button class="btn secondary js-clear" data-card="' + karte.id + '" data-level="' + stufe.k + '" hidden>🧹 Leeren</button>' +
    '</div>';
}

function buildSeite() {
  const nav = document.getElementById('taskNav');
  const main = document.getElementById('sections');
  let navHtml = '', mainHtml = '';

  KARTEN.forEach((karte, i) => {
    aktiveStufe[karte.id] = 'grund';
    navHtml += '<button class="js-nav' + (i === 0 ? ' active' : '') + '" data-card="' + karte.id + '">' + karte.nav + '</button>';

    const stufenBtns = STUFEN.map(s =>
      '<button type="button" class="level-btn js-level' + (s.k === 'grund' ? ' active' : '') +
      '" data-card="' + karte.id + '" data-level="' + s.k + '">' + s.n + '</button>'
    ).join('');
    const panes = STUFEN.map(s => renderPane(karte, s)).join('');

    mainHtml +=
      '<section class="section' + (i === 0 ? ' visible' : '') + '" id="sec_' + karte.id + '">' +
        '<h2 class="section-title"><span class="section-badge">' + karte.nr + '</span>' + karte.titel + '</h2>' +
        '<div class="card explain"><h2>📖 So geht’s</h2>' + karte.erklaerung + '</div>' +
        '<div class="card">' +
          '<h3>✏️ Übung – wähle deine Stufe</h3>' +
          '<div class="level-bar">' + stufenBtns + '</div>' +
          panes +
        '</div>' +
      '</section>';
  });

  // Auswertungskarte
  navHtml += '<button class="js-nav" data-card="ergebnis">🏁 Auswertung</button>';
  mainHtml +=
    '<section class="section" id="sec_ergebnis">' +
      '<h2 class="section-title"><span class="section-badge">🏁</span>Auswertung</h2>' +
      '<div class="card"><h3>Dein Überblick</h3><div id="resultList"></div>' +
      '<div class="feedback show" id="resultSummary" style="background:var(--blue-light);color:var(--ink)"></div></div>' +
    '</section>';

  nav.innerHTML = navHtml;
  main.innerHTML = mainHtml;

  // Erste Stufe jeder Karte sichtbar schalten
  document.querySelectorAll('.pane[data-level="grund"]').forEach(p => p.classList.add('visible'));
}

// ═════════════════════════════════════════
// Navigation
// ═════════════════════════════════════════

function zeigeKarte(cardId) {
  aktiveKarte = cardId;
  document.querySelectorAll('.section').forEach(s => s.classList.remove('visible'));
  document.getElementById('sec_' + cardId).classList.add('visible');
  document.querySelectorAll('.js-nav').forEach(b => b.classList.toggle('active', b.dataset.card === cardId));
  if (cardId === 'ergebnis') renderErgebnis();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function zeigeStufe(cardId, level) {
  aktiveStufe[cardId] = level;
  document.querySelectorAll('.js-level[data-card="' + cardId + '"]')
    .forEach(b => b.classList.toggle('active', b.dataset.level === level));
  document.querySelectorAll('.pane[data-card="' + cardId + '"]')
    .forEach(p => p.classList.toggle('visible', p.dataset.level === level));
}

function toggleTrex() {
  const n = document.getElementById('trexNote');
  n.hidden = !n.hidden;
}

// ═════════════════════════════════════════
// Prüfen und Leeren
// ═════════════════════════════════════════

function paneEl(cardId, level) {
  return document.querySelector('.pane[data-card="' + cardId + '"][data-level="' + level + '"]');
}

function mark(el, ok) {
  el.classList.remove('correct', 'wrong');
  el.classList.add(ok ? 'correct' : 'wrong');
}

function pruefe(cardId, level) {
  const karte = KARTEN.find(k => k.id === cardId);
  const def = getStufe(karte, level);
  const pane = paneEl(cardId, level);
  let richtig = 0, offen = 0;

  def.items.forEach((it, i) => {
    const id = (teil) => document.getElementById(itemId(cardId, level, i, teil));
    let ok = false;

    if (it.t === 'num') {
      const el = id();
      if (norm(el.value) === '') offen++;
      ok = textOk(el.value, it.ans);
      mark(el, ok);
      el.readOnly = true;
    } else if (it.t === 'unit') {
      const el = id(), sel = id('u');
      if (norm(el.value) === '' || sel.value === '') offen++;
      const zahlOk = textOk(el.value, it.ans);
      const einheitOk = sel.value === it.einheit;
      mark(el, zahlOk);
      mark(sel, einheitOk);
      el.readOnly = true;
      sel.disabled = true;
      ok = zahlOk && einheitOk;
    } else if (it.t === 'frac') {
      const n = id('n'), d = id('d');
      if (norm(n.value) === '' || norm(d.value) === '') offen++;
      const nOk = textOk(n.value, it.n), dOk = textOk(d.value, it.d);
      mark(n, nOk); mark(d, dOk);
      n.readOnly = true; d.readOnly = true;
      ok = nOk && dOk;
    } else if (it.t === 'mixed') {
      const g = id('g'), n = id('n'), d = id('d');
      if (norm(g.value) === '' || norm(n.value) === '' || norm(d.value) === '') offen++;
      const gOk = textOk(g.value, it.g), nOk = textOk(n.value, it.n), dOk = textOk(d.value, it.d);
      mark(g, gOk); mark(n, nOk); mark(d, dOk);
      g.readOnly = true; n.readOnly = true; d.readOnly = true;
      ok = gOk && nOk && dOk;
    } else if (it.t === 'cmp') {
      const sel = id();
      if (sel.value === '') offen++;
      ok = sel.value === it.ans;
      mark(sel, ok);
      sel.disabled = true;
    } else if (it.t === 'mc') {
      const group = id();
      const btns = group.querySelectorAll('.mc-btn');
      const gewaehlt = group.querySelector('.mc-btn.chosen');
      if (!gewaehlt) offen++;
      btns.forEach(b => {
        b.disabled = true;
        if (b === gewaehlt) mark(b, b.dataset.ok === '1');
        else if (b.dataset.ok === '1' && gewaehlt && gewaehlt.dataset.ok !== '1') b.classList.add('correct');
      });
      ok = !!gewaehlt && gewaehlt.dataset.ok === '1';
    }
    if (ok) richtig++;
  });

  const gesamt = def.items.length;
  zustand[paneKey(cardId, level)] = { geprueft: true, richtig: richtig, gesamt: gesamt };

  const fb = pane.querySelector('[data-role="fb"]');
  const hilfe = pane.querySelector('[data-role="hilfe"]');
  if (richtig === gesamt) {
    fb.className = 'feedback show ok';
    fb.innerHTML = '✅ Super! Alle ' + gesamt + ' Aufgaben richtig.';
    hilfe.hidden = true;
  } else {
    fb.className = 'feedback show no';
    fb.innerHTML = '❌ ' + richtig + ' von ' + gesamt + ' richtig' +
      (offen > 0 ? ' – es sind noch Felder leer.' : '.') +
      ' Die richtigen Antworten stehen in der Musterlösung.';
    hilfe.hidden = false;
  }

  pane.querySelector('.js-check').hidden = true;
  pane.querySelector('.js-clear').hidden = false;
  aktualisiereNav();
}

function leere(cardId, level) {
  const karte = KARTEN.find(k => k.id === cardId);
  const def = getStufe(karte, level);
  const pane = paneEl(cardId, level);

  def.items.forEach((it, i) => {
    const id = (teil) => document.getElementById(itemId(cardId, level, i, teil));
    const reset = (el) => { if (!el) return; el.classList.remove('correct', 'wrong'); el.readOnly = false; el.value = ''; };
    if (it.t === 'num') reset(id());
    else if (it.t === 'unit') { reset(id()); const s = id('u'); s.classList.remove('correct', 'wrong'); s.disabled = false; s.value = ''; }
    else if (it.t === 'frac') { reset(id('n')); reset(id('d')); }
    else if (it.t === 'mixed') { reset(id('g')); reset(id('n')); reset(id('d')); }
    else if (it.t === 'cmp') { const s = id(); s.classList.remove('correct', 'wrong'); s.disabled = false; s.value = ''; }
    else if (it.t === 'mc') {
      id().querySelectorAll('.mc-btn').forEach(b => {
        b.classList.remove('chosen', 'correct', 'wrong');
        b.disabled = false;
      });
    }
  });

  delete zustand[paneKey(cardId, level)];
  const fb = pane.querySelector('[data-role="fb"]');
  fb.className = 'feedback';
  fb.innerHTML = '';
  const hilfe = pane.querySelector('[data-role="hilfe"]');
  hilfe.hidden = true;
  hilfe.open = false;
  hilfe.querySelectorAll('details.sub').forEach(d => d.open = false);
  pane.querySelector('.js-check').hidden = false;
  pane.querySelector('.js-clear').hidden = true;
  aktualisiereNav();
}

function aktualisiereNav() {
  KARTEN.forEach(karte => {
    const fertig = STUFEN.some(s => {
      const z = zustand[paneKey(karte.id, s.k)];
      return z && z.geprueft && z.richtig === z.gesamt;
    });
    const btn = document.querySelector('.js-nav[data-card="' + karte.id + '"]');
    btn.classList.toggle('done', fertig);
  });
}

// ═════════════════════════════════════════
// Auswertungskarte
// ═════════════════════════════════════════

function renderErgebnis() {
  const liste = document.getElementById('resultList');
  let html = '', geloest = 0;
  KARTEN.forEach(karte => {
    const bearbeitet = STUFEN.filter(s => zustand[paneKey(karte.id, s.k)]);
    let badge, text;
    if (bearbeitet.length === 0) {
      badge = '<span class="result-badge open">noch offen</span>';
      text = '';
    } else {
      const beste = bearbeitet.map(s => zustand[paneKey(karte.id, s.k)])
        .reduce((a, b) => (b.richtig / b.gesamt > a.richtig / a.gesamt ? b : a));
      const voll = beste.richtig === beste.gesamt;
      if (voll) geloest++;
      badge = '<span class="result-badge ' + (voll ? 'ok' : 'no') + '">' + beste.richtig + ' von ' + beste.gesamt + ' richtig</span>';
      text = '<span>Stufen bearbeitet: ' + bearbeitet.map(s => s.n).join(', ') + '</span>';
    }
    html += '<div class="result-row"><span class="result-name">' + karte.nr + '. ' + karte.titel + '</span>' + badge + text + '</div>';
  });
  liste.innerHTML = html;
  const zus = document.getElementById('resultSummary');
  zus.innerHTML = geloest === KARTEN.length
    ? '🎉 Alle ' + KARTEN.length + ' Aufgabentypen vollständig gelöst. Viel Erfolg in der Klassenarbeit!'
    : 'Vollständig gelöst: <strong>' + geloest + ' von ' + KARTEN.length + '</strong> Aufgabentypen. Über die Registerkarten oben kommst du zu den offenen Aufgaben zurück.';
}

// ═════════════════════════════════════════
// Ereignisse
// ═════════════════════════════════════════

document.addEventListener('click', function (e) {
  const nav = e.target.closest('.js-nav');
  if (nav) { zeigeKarte(nav.dataset.card); return; }

  const lvl = e.target.closest('.js-level');
  if (lvl) { zeigeStufe(lvl.dataset.card, lvl.dataset.level); return; }

  const check = e.target.closest('.js-check');
  if (check) { pruefe(check.dataset.card, check.dataset.level); return; }

  const clear = e.target.closest('.js-clear');
  if (clear) { leere(clear.dataset.card, clear.dataset.level); return; }

  const mc = e.target.closest('.mc-btn');
  if (mc && !mc.disabled) {
    const group = document.getElementById(mc.dataset.group);
    group.querySelectorAll('.mc-btn').forEach(b => b.classList.remove('chosen'));
    mc.classList.add('chosen');
  }
});

// ═════════════════════════════════════════
// Start
// ═════════════════════════════════════════
buildSeite();
</script>
