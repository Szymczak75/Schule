/* ============================================================
   BAUSTEIN: Rückblick-KA-Schreibhilfen (v3, 10.11.2026) – unverändert übernehmen
   f(z,n)      Bruch als .frac-Konstrukt          f(3,4)  f('2 · 7','5 · 3')
   g(ganz,z,n) gemischte Zahl                       g(1,5,9)
   m('…')      Formel mit Dezimalzahlen: Komma wird {,}, · wird \cdot
   ============================================================ */
function f(z, n){ return '<span class="frac"><span>' + z + '</span><span>' + n + '</span></span>'; }
function g(ganz, z, n){ return '<span class="gem">' + ganz + ' ' + f(z, n) + '</span>'; }
function m(t){
  return '\\(' + String(t).replace(/(\d),(\d)/g, '$1{,}$2').replace(/·/g, '\\cdot ')
    .replace(/−/g, '-') + '\\)';
}
/* ============ ENDE BAUSTEIN Schreibhilfen ============ */

/* =============================================================================
   BAUSTEIN: MathJax-Notfall-Anzeige  (MATHJAX-FALLBACK)
   Gepflegt im Wartungs-Projekt. Unverändert ans ENDE des Seiten-Skripts kopieren
   (in die Seite hinein – nie per <script src> verlinken, TEIL 8.1).
   Voraussetzung auf der Seite: das .frac-CSS mit Kind-Selektoren (TEIL 7.2):
     .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;
           margin:0 .2em;line-height:1.15;}
     .frac > span{display:block;padding:0 .35em;}
     .frac > span:first-child{border-bottom:1.8px solid currentColor;padding-bottom:.1em;}
     .frac > span:last-child{padding-top:.1em;}
   ========================================================================== */
/* =============================================================================
   Notfall-Anzeige für Formeln (MATHJAX-FALLBACK)
   Lädt MathJax nicht (Schul-WLAN, Vorschau, Offline-Kopie), blieben sonst
   \( ... \) als Rohtext mit Backslashes stehen. Dann werden die TeX-Ausdrücke
   hier in lesbares HTML gewandelt: √ mit Klammer, Brüche als .frac-Konstrukt
   (kein Schrägstrich!), Hoch-/Tiefstellungen als sup/sub, Sonderzeichen direkt.
   Ist MathJax da, passiert nichts.
   ========================================================================== */
(function(){
  var AUF = '\u0001', ZU = '\u0002';   /* Platzhalter fuer { } aus \left\{ */

  function leseGruppe(t, i){
    if (t.charAt(i) !== '{') return null;
    var tiefe = 0;
    for (var j = i; j < t.length; j++){
      if (t.charAt(j) === '{') tiefe++;
      else if (t.charAt(j) === '}'){ tiefe--; if (tiefe === 0) return [t.slice(i+1, j), j+1]; }
    }
    return null;
  }

  function strukturen(t){
    var aus = '', i = 0;
    while (i < t.length){
      var m = /^\\(dfrac|tfrac|frac|sqrt)/.exec(t.slice(i));
      if (m){
        var a = leseGruppe(t, i + m[0].length);
        if (a){
          if (m[1] === 'sqrt'){
            var inn = strukturen(a[0]);
            aus += /^[0-9A-Za-z]+$/.test(a[0]) ? '√' + inn : '√(' + inn + ')';
            i = a[1]; continue;
          }
          var b = leseGruppe(t, a[1]);
          if (b){
            aus += '<span class="frac"><span>' + strukturen(a[0]) + '</span><span>'
                 + strukturen(b[0]) + '</span></span>';
            i = b[1]; continue;
          }
        }
      }
      aus += t.charAt(i); i++;
    }
    return aus;
  }

  function texHtml(t){
    t = t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    t = t.replace(/\\rightarrow/g, '→').replace(/\\leftarrow/g, '←')
         .replace(/\\Rightarrow/g, '⇒').replace(/\\Leftarrow/g, '⇐')
         .replace(/\\left\\\{/g, AUF).replace(/\\right\\\}/g, ZU)
         .replace(/\\left(?![a-zA-Z])/g, '').replace(/\\right(?![a-zA-Z])/g, '')
         .replace(/\\\{/g, AUF).replace(/\\\}/g, ZU);
    t = t.replace(/\\cdot/g, '·').replace(/\\times/g, '·')
         .replace(/\\approx/g, '≈').replace(/\\neq/g, '≠')
         .replace(/\\leq/g, '≤').replace(/\\le\b/g, '≤')
         .replace(/\\geq/g, '≥').replace(/\\ge\b/g, '≥')
         .replace(/\\pm/g, '±').replace(/\\mp/g, '∓')
         .replace(/\\ldots/g, '…').replace(/\\dots/g, '…')
         .replace(/\\to\b/g, '→')
         .replace(/\\infty/g, '∞')
         .replace(/\\pi/g, 'π').replace(/\\alpha/g, 'α')
         .replace(/\\beta/g, 'β').replace(/\\gamma/g, 'γ')
         .replace(/\\Delta/g, 'Δ').replace(/\\delta/g, 'δ')
         .replace(/\\min/g, 'min').replace(/\\max/g, 'max')
         .replace(/\\text\{([^{}]*)\}/g, '$1')
         .replace(/\\mathrm\{([^{}]*)\}/g, '$1');
    t = strukturen(t);
    t = t.replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>')
         .replace(/\^(-?[0-9A-Za-z])/g, '<sup>$1</sup>')
         .replace(/_\{([^{}]*)\}/g, '<sub>$1</sub>')
         .replace(/_(-?[0-9A-Za-z])/g, '<sub>$1</sub>');
    t = t.replace(/\{,\}/g, ',').replace(/\\,/g, ' ').replace(/\\;/g, ' ')
         .replace(/\\ /g, ' ').replace(/[{}]/g, '')
         .replace(new RegExp(AUF, 'g'), '{').replace(new RegExp(ZU, 'g'), '}');
    return t;
  }

  function mathNotfall(){
    if (window.MathJax && window.MathJax.typesetPromise) return;  /* MathJax ist da */
    var lauf = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){
        var tag = n.parentNode && n.parentNode.nodeName;
        if (tag === 'SCRIPT' || tag === 'STYLE') return NodeFilter.FILTER_REJECT;
        return n.nodeValue.indexOf('\\(') > -1 ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
      }
    });
    var treffer = [], n;
    while ((n = lauf.nextNode())) treffer.push(n);
    treffer.forEach(function(k){
      var teile = k.nodeValue.split(/\\\(([\s\S]+?)\\\)/);
      if (teile.length < 2) return;
      var html = '';
      for (var i = 0; i < teile.length; i++){
        html += (i % 2)
          ? '<span class="tex-ersatz">' + texHtml(teile[i]) + '</span>'
          : teile[i].replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      var huelle = document.createElement('span');
      huelle.innerHTML = html;
      var frag = document.createDocumentFragment();
      while (huelle.firstChild) frag.appendChild(huelle.firstChild);
      k.parentNode.replaceChild(frag, k);
    });
  }
  window.addEventListener('load', function(){ setTimeout(mathNotfall, 3500); });
})();

<script>
(function(){
  /* Empfänger – nur hier ändern */
  var FB_NAME = 'aszymczak', FB_DOMAIN = 'my-mcg.de';
  var START = 'https://szymczak75.github.io/Schule/dino_hub.html';

  /* Fach der Seite → Startseite öffnet zuerst diesen Reiter */
  var FAECHER = ['mathe', 'bio', 'kompass'];
  var mf = document.querySelector('meta[name="fach"]');
  var fach = mf ? (mf.getAttribute('content') || '').trim().toLowerCase() : '';
  if (FAECHER.indexOf(fach) < 0) {
    var teile = location.pathname.split('/');
    fach = '';
    for (var i = 0; i < teile.length; i++) {
      var t = teile[i].toLowerCase();
      if (FAECHER.indexOf(t) >= 0) { fach = t; break; }
    }
  }
  var startUrl = fach ? START + '?start=' + fach : START;
  var heim = document.querySelectorAll('.dino-home, .dino-nav-start');
  for (var j = 0; j < heim.length; j++) heim[j].href = startUrl;

  /* 📚 Alles für … */
  var m = document.querySelector('meta[name="klasse"]');
  var k = m ? (m.getAttribute('content') || '').trim() : '';
  var a = document.getElementById('dino-nav-klasse');
  if (k && a) {
    a.href = START + '?klasse=' + encodeURIComponent(k) + (fach ? '&start=' + fach : '');
    var name = /^\d+$/.test(k) ? 'Klasse ' + parseInt(k, 10) : 'die ' + k.replace('_', '/');
    a.textContent = '📚 Alles für ' + name;
    a.hidden = false;
  }

  /* ✉️ Feedback */
  var dlg = document.getElementById('dino-fb');
  var fbBtn = document.getElementById('dino-nav-fb');
  if (!dlg || !fbBtn) return;
  var adresse = FB_NAME + '@' + FB_DOMAIN;
  var titel = (document.title || '').trim() || location.pathname.split('/').pop();
  var url = location.href.split('#')[0];
  var text = document.getElementById('dino-fb-text');
  var meldung = document.getElementById('dino-fb-meldung');
  document.getElementById('dino-fb-seite').textContent = titel;
  document.getElementById('dino-fb-adresse').textContent = adresse;

  function art(){
    var r = dlg.querySelector('input[name="dino-fb-art"]:checked');
    return r ? r.value : 'Feedback';
  }
  function betreff(){ return '[Dino-Feedback] ' + art() + ': ' + titel; }
  function inhalt(){
    return 'Seite: ' + titel + '\nAdresse: ' + url + '\nArt: ' + art() +
           '\n\n' + text.value.trim() + '\n';
  }
  function melde(t, ok){ meldung.textContent = t; meldung.className = 'dino-fb-meldung ' + (ok ? 'ok' : 'nok'); }
  function leer(){
    if (text.value.trim()) return false;
    melde('Bitte schreib zuerst etwas in das Feld.', false);
    text.focus();
    return true;
  }

  fbBtn.addEventListener('click', function(){
    melde('', true);
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    text.focus();
  });
  document.getElementById('dino-fb-zu').addEventListener('click', function(){
    if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open');
  });
  document.getElementById('dino-fb-senden').addEventListener('click', function(){
    if (leer()) return;
    location.href = 'mailto:' + adresse + '?subject=' + encodeURIComponent(betreff()) +
                    '&body=' + encodeURIComponent(inhalt());
    melde('Das Mailprogramm öffnet sich. Danke! 🦖', true);
  });
  document.getElementById('dino-fb-kopieren').addEventListener('click', function(){
    if (leer()) return;
    var ganz = 'Betreff: ' + betreff() + '\n' + inhalt();
    function ersatz(){
      var t = document.createElement('textarea');
      t.value = ganz; document.body.appendChild(t); t.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(t);
      melde(ok ? 'Kopiert! Jetzt in eine Mail einfügen.' : 'Kopieren ging nicht – bitte Text markieren und kopieren.', ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ganz).then(function(){
        melde('Kopiert! Jetzt in eine Mail einfügen.', true);
      }, ersatz);
    } else ersatz();
  });
})();
</script>
