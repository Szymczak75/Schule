 tips:['Bei benachbarten Flächeneinheiten ist die Umrechnungszahl 100, bei benachbarten Volumeneinheiten 1000.','Von einer größeren in eine kleinere Einheit wird die Maßzahl größer – du multiplizierst. Umgekehrt dividierst du.','Liter kannst du wie Volumeneinheiten behandeln: 1 l = 1 dm³ und 1 ml = 1 cm³.'],
 sol:R`<b>Musterlösung</b><br>a) \(9 \cdot 100 = 900\), also 9 m² = 900 dm²<br>b) \(4 \cdot 100 = 400\), also 4 dm² = 400 cm²<br>c) \(6 \cdot 100 = 600\), also 6 a = 600 m²<br>d) \(5 \cdot 1000 = 5000\), also 5 dm³ = 5000 cm³<br>e) 3 l = 3 dm³ = 3000 cm³ = 3000 ml<br>f) \(24\,000 : 1000 = 24\), also 24&nbsp;000 cm³ = 24 dm³`},
{id:'e3', card:'einheiten', lv:'g', type:'mc', title:'Liter',
 q:'Welche Aussage ist richtig?',
 options:[{t:'1 l = 1 dm³',ok:1},{t:'1 l = 1 cm³'},{t:'1 l = 1 m³'},{t:'1 l = 10 dm³'}],

 sol:'<b>Lösung:</b> 1 l = 1 dm³. Ein Würfel mit 1 dm (= 10 cm) Kantenlänge fasst genau einen Liter. Außerdem gilt: 1 ml = 1 cm³.'},
{id:'e4', card:'einheiten', lv:'f', type:'input', title:'Umwandeln – auch über mehrere Stufen',
 q:'Wandle in die angegebene Einheit um.',
 fields:[F('a) 3 m² 12 dm² =',312,'dm²'),F('b) 70&nbsp;000 m² =',7,'ha'),F('c) 5 km² =',500,'ha'),F('d) 4 dm³ 300 cm³ =',4300,'cm³'),F('e) 2 m³ =',2000000,'cm³'),F('f) 9&nbsp;000 ml =',9,'l')],
 hint:'Gehe Stufe für Stufe durch die Einheitentreppe und zähle, wie oft du umrechnen musst.',
 tips:['Bei gemischten Angaben (wie 3 m² 12 dm²) wandelst du zuerst den großen Teil um und addierst dann den Rest.','Die Flächen-Treppe lautet: km² → ha → a → m² → dm² → cm² → mm² (jeweils Faktor 100). Die Volumen-Treppe lautet: m³ → dm³ → cm³ → mm³ (jeweils Faktor 1000).'],
 sol:R`<b>Musterlösung</b><br>a) 3 m² = 300 dm², dann \(300 + 12 = 312\) → 312 dm²<br>b) 70&nbsp;000 m² = 700 a = 7 ha (zweimal durch 100)<br>c) \(5 \cdot 100 = 500\) → 5 km² = 500 ha<br>d) 4 dm³ = 4000 cm³, dann \(4000 + 300 = 4300\) → 4300 cm³<br>e) 2 m³ = 2000 dm³ = 2&nbsp;000&nbsp;000 cm³ (zweimal mal 1000)<br>f) 9000 ml = 9000 cm³ = 9 dm³ = 9 l`},
{id:'e5', card:'einheiten', lv:'f', type:'mc', title:'Warum 100?',
 q:'Warum ist die Umrechnungszahl zwischen m² und dm² gleich 100?',

          {t:'1 m² ist ein Quadrat mit 100 dm Seitenlänge – es passen 100 Quadrate zu 1 dm² hinein.'},
          {t:'1 m² ist ein Quadrat mit 10 dm Seitenlänge – es passen 10 + 10 Quadrate zu 1 dm² hinein.'},
          {t:'1 m² ist ein Quadrat mit 1 dm Seitenlänge – es passen 100 Quadrate zu 1 dm² hinein.'}],
 hint:'Wie viele Dezimeter ist 1 Meter lang? Und wie füllt man damit ein Quadrat?',
 sol:R`<b>Lösung:</b> 1 m = 10 dm. Ein Quadrat mit 1 m Seitenlänge lässt sich in 10 Reihen zu je 10 kleinen Quadraten (je 1 dm²) zerlegen: \(10 \cdot 10 = 100\).`},
{id:'e6', card:'einheiten', lv:'f', type:'assign', mode:'pair', title:'Der Größe nach ordnen',
 q:'Ordne die Flächeninhalte der Größe nach. Tippe eine Größe an und dann den passenden Platz.',
 targets:[{id:'p1',label:'1. (kleinste)'},{id:'p2',label:'2.'},{id:'p3',label:'3.'},{id:'p4',label:'4. (größte)'}],

 hint:'Die Reihenfolge stimmt noch nicht.',
 tips:['Vergleichen kannst du nur, wenn alle Größen in derselben Einheit stehen.','Wandle alle Größen zum Beispiel in dm² um.'],

/* ---------- 2 Rechnen ---------- */
{id:'r1', card:'rechnen', lv:'g', type:'input', title:'Berechne',
 q:'Berechne. Gib das Ergebnis in der angegebenen Einheit an.',
 fields:[F('a) 5 m² + 30 dm² =',530,'dm²'),F('b) 3 dm³ − 400 cm³ =',2600,'cm³'),F('c) 6 · 500 ml =',3,'l'),F('d) 2 ha + 50 a =',250,'a')],
 hint:'Hast du vor dem Rechnen alles in dieselbe Einheit umgewandelt?',
 tips:['Erst umwandeln, dann rechnen: Beide Größen müssen in derselben Einheit stehen – am besten gleich in der Zieleinheit.','Bei c) rechnest du zuerst in ml und wandelst das Ergebnis am Ende in Liter um (1 l = 1000 ml).'],
 sol:R`<b>Musterlösung</b><br>a) 5 m² = 500 dm²; \(500 + 30 = 530\) → 530 dm²<br>b) 3 dm³ = 3000 cm³; \(3000 - 400 = 2600\) → 2600 cm³<br>c) \(6 \cdot 500 = 3000\) → 3000 ml = 3 l<br>d) 2 ha = 200 a; \(200 + 50 = 250\) → 250 a`},
{id:'r2', card:'rechnen', lv:'g', type:'mc', title:'Worauf kommt es an?',
 q:'Was musst du tun, bevor du 5 m² und 30 dm² addierst?',
 options:[{t:'Beide Größen in dieselbe Einheit umwandeln.',ok:1},{t:'Die Maßzahlen addieren und die größere Einheit nehmen.'},{t:'Die Maßzahlen addieren und die kleinere Einheit nehmen.'},{t:'Die Einheiten weglassen und nur die Zahlen addieren.'}],
 hint:'Was ergibt „5 Äpfel + 30 Birnen“? Und was „5 Äpfel + 30 Äpfel“?',
 sol:'<b>Lösung:</b> Man darf nur Größen mit derselben Einheit addieren oder subtrahieren. Also zuerst umwandeln: 5 m² = 500 dm².'},
{id:'r3', card:'rechnen', lv:'f', type:'input', title:'Berechne',
 q:'Berechne. Gib das Ergebnis in der angegebenen Einheit an.',
 fields:[F('a) 8 m³ : 2 =',4000,'l'),F('b) 1 l − 4 · 150 ml =',400,'ml'),F('c) 3 m² − 120 dm² =',180,'dm²'),F('d) 5 · 40 a =',2,'ha')],
 hint:'Prüfe die Reihenfolge beim Rechnen und die Umwandlung am Ende.',
 tips:['Bei b) gilt Punkt- vor Strichrechnung.','Bei a) hilft dir: 1 m³ = 1000 dm³ und 1 dm³ = 1 l.'],
 sol:R`<b>Musterlösung</b><br>a) \(8 : 2 = 4\) → 4 m³ = 4000 dm³ = 4000 l<br>b) \(4 \cdot 150 = 600\) → 600 ml; 1 l = 1000 ml; \(1000 - 600 = 400\) → 400 ml<br>c) 3 m² = 300 dm²; \(300 - 120 = 180\) → 180 dm²<br>d) \(5 \cdot 40 = 200\) → 200 a = 2 ha`},
{id:'r4', card:'rechnen', lv:'f', type:'input', title:'Gläser füllen',
 q:'Ein Wasserkanister fasst 12 l. Wie viele Gläser zu je 200 ml kann man damit vollständig füllen?',
 fields:[F('Anzahl:',60,'Gläser')],
 hint:'Beide Angaben müssen dieselbe Einheit haben, bevor du teilst.',
 tips:['Wandle 12 l in ml um.','Dann teilst du die gesamte Wassermenge durch die Menge eines Glases.'],
 sol:R`<b>Musterlösung</b><br>12 l = 12&nbsp;000 ml<br>\(12\,000 : 200 = 60\)<br><i>Antwortsatz:</i> Man kann 60 Gläser füllen.`},

/* ---------- 3 Rechtecke ---------- */
{id:'q1', card:'rechteck', lv:'g', type:'input', title:'Flächeninhalt und Umfang',
 q:'Ein Rechteck ist 9 cm lang und 5 cm breit. Berechne Flächeninhalt und Umfang. Wähle jeweils die passende Einheit.',
 fields:[FU('Flächeninhalt A =',45,UF,'cm²'),FU('Umfang u =',28,UF,'cm')],
 hint:'Verwechselst du vielleicht Flächeninhalt und Umfang?',
 tips:['Flächeninhalt: Wie viele Zentimeterquadrate passen hinein? Das sind „Länge mal Breite“.','Umfang: Einmal ganz außen herum gehen – also alle vier Seiten addieren.'],
 sol:R`<b>Musterlösung</b><br>\(A = 9\,\text{cm} \cdot 5\,\text{cm} = 45\,\text{cm}^2\)<br>\(u = 2 \cdot 9\,\text{cm} + 2 \cdot 5\,\text{cm} = 18\,\text{cm} + 10\,\text{cm} = 28\,\text{cm}\)`},
{id:'q2', card:'rechteck', lv:'g', type:'input', title:'Fehlende Seite',
 q:'Ein Rechteck hat den Flächeninhalt 48 cm². Es ist 8 cm lang. Wie breit ist es?',
 fields:[FU('Breite b =',6,UF,'cm')],
 hint:'Gesucht ist eine Seitenlänge, keine Fläche.',
 tips:['Es gilt: Länge · Breite = Flächeninhalt. Welche Zahl musst du mit 8 malnehmen, um 48 zu erhalten?'],
 sol:R`<b>Musterlösung</b><br>\(8 \cdot b = 48\), also \(b = 48 : 8 = 6\)<br>Das Rechteck ist 6 cm breit.`},
{id:'q3', card:'rechteck', lv:'g', type:'input', title:'Quadrat',
 q:'Ein Quadrat hat den Umfang 20 cm. Berechne seinen Flächeninhalt.',
 fields:[FU('A =',25,UF,'cm²')],
 hint:'Bestimme zuerst die Seitenlänge des Quadrats.',
 tips:['Ein Quadrat hat vier gleich lange Seiten. Der Umfang ist also viermal die Seitenlänge.','Mit der Seitenlänge rechnest du dann den Flächeninhalt wie beim Rechteck.'],
 sol:R`<b>Musterlösung</b><br>Seitenlänge: \(20 : 4 = 5\), also 5 cm<br>\(A = 5\,\text{cm} \cdot 5\,\text{cm} = 25\,\text{cm}^2\)`},
{id:'q4', card:'rechteck', lv:'f', type:'input', title:'Teppichläufer', fig:'laeufer',
 q:'Die Skizze zeigt einen rechteckigen Teppichläufer. Berechne seinen Flächeninhalt in dm².',
 fields:[F('A =',120,'dm²')],
 hint:'Die beiden Seiten stehen in verschiedenen Einheiten.',
 tips:['Wandle zuerst beide Seitenlängen in Dezimeter um – dann kommt das Ergebnis direkt in dm² heraus.','1 m = 10 dm und 10 cm = 1 dm.'],
 sol:R`<b>Musterlösung</b><br>3 m = 30 dm; 40 cm = 4 dm<br>\(A = 30\,\text{dm} \cdot 4\,\text{dm} = 120\,\text{dm}^2\)`},
{id:'q5', card:'rechteck', lv:'f', type:'mc', title:'Verdreifachen',
 q:'Man verdreifacht die Länge <b>und</b> die Breite eines Rechtecks. Was passiert mit dem Flächeninhalt?',
 options:[{t:'Er wird 9-mal so groß.',ok:1},{t:'Er wird 3-mal so groß.'},{t:'Er wird 6-mal so groß.'},{t:'Er bleibt gleich groß.'}],
 hint:'Probiere es mit einem Beispiel aus, z. B. mit einem Rechteck, das 2 cm lang und 1 cm breit ist.',
 sol:R`<b>Musterlösung mit Beispiel</b><br>Vorher: \(2\,\text{cm} \cdot 1\,\text{cm} = 2\,\text{cm}^2\)<br>Nachher: \(6\,\text{cm} \cdot 3\,\text{cm} = 18\,\text{cm}^2\)<br>\(18 : 2 = 9\) – der Flächeninhalt wird 9-mal so groß, weil \(3 \cdot 3 = 9\).`},
{id:'q6', card:'rechteck', lv:'f', type:'mc', title:'Halbieren und Verdoppeln',
 q:'Man halbiert die Länge eines Rechtecks und verdoppelt gleichzeitig seine Breite. Was passiert mit dem Flächeninhalt?',
 options:[{t:'Er bleibt gleich groß.',ok:1},{t:'Er wird doppelt so groß.'},{t:'Er wird halb so groß.'},{t:'Er wird 4-mal so groß.'}],
 hint:'Auch hier hilft ein Zahlenbeispiel – rechne vorher und nachher.',
 sol:R`<b>Musterlösung mit Beispiel</b><br>Vorher: \(8\,\text{cm} \cdot 3\,\text{cm} = 24\,\text{cm}^2\)<br>Nachher: \(4\,\text{cm} \cdot 6\,\text{cm} = 24\,\text{cm}^2\)<br>Halbieren und Verdoppeln heben sich auf – der Flächeninhalt bleibt gleich.`},

/* ---------- 4 Quader ---------- */
{id:'k1', card:'quader', lv:'g', type:'input', title:'Volumen eines Quaders',
 q:'Ein Quader ist 7 cm lang, 2 cm breit und 5 cm hoch. Berechne sein Volumen.',
 fields:[FU('V =',70,UF,'cm³')],
 hint:'Beim Volumen werden alle drei Kantenlängen gebraucht.',
 tips:['Volumen eines Quaders = Länge · Breite · Höhe.'],
 sol:R`<b>Musterlösung</b><br>\(V = 7\,\text{cm} \cdot 2\,\text{cm} \cdot 5\,\text{cm} = 70\,\text{cm}^3\)`},
{id:'k2', card:'quader', lv:'g', type:'input', title:'Würfel',
 q:'Ein Würfel hat die Kantenlänge 3 cm. Berechne sein Volumen und seinen Oberflächeninhalt.',
 fields:[FU('Volumen V =',27,UF,'cm³'),FU('Oberflächeninhalt O =',54,UF,'cm²')],
 hint:'Denke daran: Ein Würfel hat sechs gleich große quadratische Flächen.',
 tips:['Volumen: Kante · Kante · Kante.','Oberflächeninhalt: Berechne den Flächeninhalt einer Seitenfläche und nimm ihn so oft, wie der Würfel Flächen hat.'],
 sol:R`<b>Musterlösung</b><br>\(V = 3\,\text{cm} \cdot 3\,\text{cm} \cdot 3\,\text{cm} = 27\,\text{cm}^3\)<br>Eine Fläche: \(3\,\text{cm} \cdot 3\,\text{cm} = 9\,\text{cm}^2\)<br>\(O = 6 \cdot 9\,\text{cm}^2 = 54\,\text{cm}^2\)`},
{id:'k3', card:'quader', lv:'g', type:'input', title:'Oberflächeninhalt eines Quaders',
 q:'Ein Quader ist 5 cm lang, 3 cm breit und 2 cm hoch. Berechne seinen Oberflächeninhalt.',
 fields:[FU('O =',62,UF,'cm²')],
 hint:'Ein Quader hat sechs Flächen – immer zwei sind gleich groß.',
 tips:['Die drei verschiedenen Flächen sind: Boden (Länge · Breite), Vorderseite (Länge · Höhe), Seite (Breite · Höhe).','Jede dieser drei Flächen kommt zweimal vor.'],
 sol:R`<b>Musterlösung</b><br>Boden/Deckel: \(5 \cdot 3 = 15\) → 15 cm²<br>Vorder-/Rückseite: \(5 \cdot 2 = 10\) → 10 cm²<br>linke/rechte Seite: \(3 \cdot 2 = 6\) → 6 cm²<br>\(O = 2 \cdot (15 + 10 + 6) = 2 \cdot 31 = 62\), also 62 cm²`},
{id:'k4', card:'quader', lv:'f', type:'input', title:'Wassertank',
 q:'Ein quaderförmiger Wassertank ist innen 60 cm lang, 30 cm breit und 40 cm hoch. Er ist bis 15 cm unter den Rand mit Wasser gefüllt. Wie viele Liter Wasser sind im Tank?',
 fields:[F('Wassermenge:',45,'l')],
 hint:'Wie hoch steht das Wasser wirklich?',
 tips:['Berechne zuerst die Wasserhöhe: Das Wasser reicht nicht bis ganz nach oben.','Berechne dann das Volumen des „Wasserquaders“ in cm³ und wandle es in Liter um (1000 cm³ = 1 l).'],
 sol:R`<b>Musterlösung</b><br>Wasserhöhe: \(40 - 15 = 25\), also 25 cm<br>\(V = 60\,\text{cm} \cdot 30\,\text{cm} \cdot 25\,\text{cm} = 45\,000\,\text{cm}^3\)<br>45&nbsp;000 cm³ = 45 dm³ = 45 l<br><i>Antwortsatz:</i> Im Tank sind 45 Liter Wasser.`},
{id:'k5', card:'quader', lv:'f', type:'input', title:'Schachtel ohne Deckel',
 q:'Eine quaderförmige Schachtel ohne Deckel wird aus Pappe gefaltet. Sie ist 20 cm lang, 10 cm breit und 5 cm hoch. Wie viel Pappe wird benötigt (ohne Klebelaschen)?',
 fields:[FU('Pappe:',500,UF,'cm²')],
 hint:'Welche Flächen hat die Schachtel – und welche fehlt?',
 tips:['Zähle die Flächen: Boden, Vorder- und Rückseite, linke und rechte Seite. Der Deckel fehlt.','Berechne jede Fläche einzeln und addiere am Ende.'],
 sol:R`<b>Musterlösung</b><br>Boden: \(20 \cdot 10 = 200\) → 200 cm²<br>Vorder- und Rückseite: \(2 \cdot (20 \cdot 5) = 200\) → 200 cm²<br>linke und rechte Seite: \(2 \cdot (10 \cdot 5) = 100\) → 100 cm²<br>Summe: \(200 + 200 + 100 = 500\)<br><i>Antwortsatz:</i> Man benötigt 500 cm² Pappe.`},
{id:'k6', card:'quader', lv:'f', type:'input', title:'Würfel stapeln',
 q:'Eine Kiste ist innen 1 m lang, 50 cm breit und 20 cm hoch. Wie viele Würfel mit 1 dm Kantenlänge passen hinein?',
 fields:[F('Anzahl:',100,'Würfel')],
 hint:'Rechne alle Kantenlängen in dieselbe Einheit um.',
 tips:['Wandle alle Kantenlängen in dm um.','Überlege: Wie viele Würfel passen in eine Reihe, wie viele Reihen in eine Schicht, wie viele Schichten übereinander?'],
 sol:R`<b>Musterlösung</b><br>1 m = 10 dm; 50 cm = 5 dm; 20 cm = 2 dm<br>\(10 \cdot 5 \cdot 2 = 100\)<br><i>Antwortsatz:</i> Es passen 100 Würfel in die Kiste.`},

/* ---------- 5 Zusammengesetzte Figuren ---------- */
{id:'z1', card:'figuren', lv:'g', type:'input', title:'L-Figur', fig:'lfig',
 q:'Die Figur ist aus Rechtecken zusammengesetzt. Berechne Flächeninhalt und Umfang.',
 fields:[FU('Flächeninhalt A =',34,UF,'cm²'),FU('Umfang u =',26,UF,'cm')],
 hint:'Prüfe, ob du alle Teilflächen bzw. alle Randstrecken erfasst hast.',
 tips:['Flächeninhalt: Du kannst die Figur in zwei Rechtecke zerlegen – oder das große Rechteck nehmen und das fehlende Stück abziehen.','Umfang: Fahre den Rand einmal ganz ab und schreibe jede Strecke auf. Fehlende Längen bekommst du aus den gegebenen.'],
 sol:R`<b>Musterlösung</b><br>Ergänzen zum großen Rechteck: \(8 \cdot 5 = 40\) → 40 cm²<br>fehlendes Stück: \(3 \cdot 2 = 6\) → 6 cm²<br>\(A = 40 - 6 = 34\), also 34 cm²<br>Umfang (Randstrecken): oben 5 cm, 2 cm, 3 cm, rechts 3 cm, unten 8 cm, links 5 cm<br>\(u = 5 + 2 + 3 + 3 + 8 + 5 = 26\), also 26 cm<br>Bemerkung: Bei einer ausgeschnittenen <i>Ecke</i> bleibt der Umfang so groß wie beim ganzen Rechteck.`},
{id:'z2', card:'figuren', lv:'g', type:'input', title:'Rechteck halbiert', fig:'diag',
 q:'Ein Rechteck (6 cm lang, 4 cm breit) wird entlang einer Diagonale in zwei gleich große Dreiecke zerschnitten. Berechne den Flächeninhalt eines Dreiecks.',
 fields:[FU('A =',12,UF,'cm²')],
 hint:'Wie hängt das Dreieck mit dem Rechteck zusammen?',
 tips:['Die beiden Dreiecke sind gleich groß und bilden zusammen das ganze Rechteck.'],
 sol:R`<b>Musterlösung</b><br>Rechteck: \(6 \cdot 4 = 24\) → 24 cm²<br>Ein Dreieck ist die Hälfte: \(24 : 2 = 12\) → 12 cm²`},
{id:'z3', card:'figuren', lv:'f', type:'input', title:'T-Figur', fig:'tfig',
 q:'Die Figur ist aus zwei Rechtecken zusammengesetzt. Berechne Flächeninhalt und Umfang.',
 fields:[FU('Flächeninhalt A =',39,UF,'cm²'),FU('Umfang u =',32,UF,'cm')],
 hint:'Prüfe Teilflächen und Randstrecken noch einmal genau.',
 tips:['Zerlege die Figur in ein unteres und ein oberes Rechteck.','Beim Umfang zählen nur Strecken, die außen am Rand liegen. Gehe einmal rundherum – es sind acht Strecken.'],
 sol:R`<b>Musterlösung</b><br>unteres Rechteck: \(9 \cdot 3 = 27\) → 27 cm²<br>oberes Rechteck: \(3 \cdot 4 = 12\) → 12 cm²<br>\(A = 27 + 12 = 39\), also 39 cm²<br>Umfang: unten 9, rechts 3, Schulter rechts 3, hoch 4, oben 3, runter 4, Schulter links 3, links 3<br>\(u = 9 + 3 + 3 + 4 + 3 + 4 + 3 + 3 = 32\), also 32 cm`},
{id:'z4', card:'figuren', lv:'f', type:'input', title:'Ecke abgeschnitten', fig:'cut',
 q:'Von einem Rechteck (10 cm lang, 5 cm breit) wird links ein dreieckiges Stück abgeschnitten (schraffiert). Berechne, wie groß das abgeschnittene Stück ist und wie groß die übrige Figur ist.',
 fields:[FU('abgeschnitten:',10,UF,'cm²'),FU('übrige Figur:',40,UF,'cm²')],
 hint:'Das schraffierte Dreieck ist ein halbes Rechteck – aber welches?',
 tips:['Ergänze das schraffierte Dreieck in Gedanken zu einem kleinen Rechteck. Wie lang sind dessen Seiten?','Das Dreieck ist die Hälfte dieses kleinen Rechtecks. Die übrige Figur ist das große Rechteck minus das Dreieck.'],
 sol:R`<b>Musterlösung</b><br>kleines Rechteck um das Dreieck: \(4 \cdot 5 = 20\) → 20 cm²<br>Dreieck: \(20 : 2 = 10\) → 10 cm²<br>großes Rechteck: \(10 \cdot 5 = 50\) → 50 cm²<br>übrige Figur: \(50 - 10 = 40\) → 40 cm²`},

{id:'b2', card:'koerper', lv:'g', type:'mc', title:'Steckbrief',

{id:'b3', card:'koerper', lv:'f', type:'mc', multi:true, title:'Zusammengesetzter Körper', fig:'saeule',

/* =========================================================
   Zustand (nur JS-Speicher)
   ========================================================= */
const STATE = {};          // pro Aufgabe: {status:'open'|'right'|'wrong', tries:0, locked:false, tipIdx:0}
let level = 'g';
let currentCard = 'start';

/* =========================================================
   Aufbau
   ========================================================= */
function buildTabs(){
  const nav = document.getElementById('tabs');
  CARDS.forEach(c=>{
    const b = el('button', '', c.title); b.type='button'; b.dataset.card=c.id;
    b.addEventListener('click', ()=>showCard(c.id));
    nav.appendChild(b);
  });
}

function buildCards(){
  const main = document.getElementById('main');
  CARDS.forEach(c=>{
    const s = el('section','card'); s.id='card-'+c.id;
    s.appendChild(el('h2','',c.title.replace(/^\d\s/,'')));
    if(c.id==='start'){ buildStart(s); }
    else if(c.id==='auswertung'){ s.appendChild(el('div','', '')).id='evbody'; }
    else {
      if(c.id==='wdh') s.appendChild(el('p','note','Hier wiederholst du ein Thema aus Klasse 5. Die Umrechnungszahlen bei Längen, Massen und Zeit sind die Grundlage für Flächen- und Volumeneinheiten.'));
      const pg = el('div','pane pane-g'), pf = el('div','pane pane-f');
      TASKS.filter(t=>t.card===c.id).forEach(t=>{ (t.lv==='g'?pg:pf).appendChild(buildTask(t)); });
      s.appendChild(pg); s.appendChild(pf);
    }
    main.appendChild(s);
  });
}

  s.appendChild(el('div','note','<b>So gehst du vor:</b> Arbeite die Karten 1 bis 6 durch. Starte jeweils mit <b>Grundlagen</b>, wechsle dann zu <b>Fortgeschritten</b>. Am Ende zeigt dir die <b>Auswertung</b>, was du noch üben solltest.'));
  s.appendChild(el('p','', '<b>In der Arbeit wichtig:</b> Schreibe immer auf, was du rechnest. Schreibe bei Textaufgaben einen Antwortsatz. Achte auf die richtigen Einheiten und Schreibweisen.'));

  const list = el('div','check-list');
  ['Flächen- und Volumeneinheiten umwandeln (auch über mehrere Stufen)',
   'mit Größen rechnen – nach dem Umwandeln in dieselbe Einheit',
   'Flächeninhalt und Umfang von Rechtecken berechnen und unterscheiden',
   'eine fehlende Seitenlänge aus dem Flächeninhalt bestimmen',
   'Volumen und Oberflächeninhalt von Quadern und Würfeln berechnen',
   'Flächeninhalt und Umfang zusammengesetzter Figuren bestimmen',
   'Grundkörper erkennen und benennen',

   'meine Antwort begründen und einen Antwortsatz schreiben'].forEach(t=>{

    <p><b>Flächeneinheiten</b> (Umrechnungszahl 100):</p>
    <div class="tablewrap"><table><tr><td>km²</td><td>ha</td><td>a</td><td>m²</td><td>dm²</td><td>cm²</td><td>mm²</td></tr></table></div>
    <p><b>Volumeneinheiten</b> (Umrechnungszahl 1000):</p>
    <div class="tablewrap"><table><tr><td>m³</td><td>dm³</td><td>cm³</td><td>mm³</td></tr></table></div>
    <p>1 l = 1 dm³ &nbsp;und&nbsp; 1 ml = 1 cm³</p>
    <p><b>Rechteck</b> (Länge a, Breite b): \(A = a \cdot b\) und \(u = 2 \cdot a + 2 \cdot b\)</p>
    <p><b>Quader</b> (Länge a, Breite b, Höhe c): \(V = a \cdot b \cdot c\) und \(O = 2 \cdot (a \cdot b + a \cdot c + b \cdot c)\)</p>`);

/* ---------- Aufgabenrahmen ---------- */
function buildTask(t){
  STATE[t.id] = {status:'open', tries:0, locked:false, tipIdx:0};
  const box = el('div','task'); box.id='task-'+t.id;
  box.appendChild(el('h3','',t.title));
  box.appendChild(el('p','q',t.q));
  if(t.fig){ const f=el('div','figur',SVG[t.fig]); box.appendChild(f); }
  const area = el('div','answer'); box.appendChild(area);
  const br = el('div','btnrow');
  const bc = el('button','btn check','Prüfen'); bc.type='button';
  const bl = el('button','btn clear','Leeren'); bl.type='button'; bl.style.display='none';
  br.appendChild(bc); br.appendChild(bl); box.appendChild(br);
  const fb = el('div','fb'); box.appendChild(fb);
  const help = buildHelp(t); box.appendChild(help);
  t._dom = {box, area, bc, bl, fb, help};
  if(t.type==='input') buildInput(t);
  else if(t.type==='mc') buildMC(t);
  else if(t.type==='assign') buildAssign(t);
  bc.addEventListener('click',()=>check(t));
  bl.addEventListener('click',()=>clearTask(t));
  return box;
}

/* Hilfe: startet mit display:none, wird erst nach einem Fehler beim Prüfen sichtbar */
function buildHelp(t){
  const h = el('div','help'); h.style.display='none';
  const tipsWrap = el('div','tips');
  if(t.tips && t.tips.length){
    const tb = el('button','hbtn','Tipp 1 anzeigen'); tb.type='button';
    tb.addEventListener('click',()=>{
      const st = STATE[t.id];
      if(st.tipIdx >= t.tips.length) return;
      const d = el('div','tip'); d.innerHTML = '<b>Tipp '+(st.tipIdx+1)+':</b> '+t.tips[st.tipIdx];
      tipsWrap.appendChild(d); typeset(d);
      st.tipIdx++;
      if(st.tipIdx >= t.tips.length) tb.style.display='none';
      else tb.textContent = 'Tipp '+(st.tipIdx+1)+' anzeigen';
    });
    h.appendChild(tb);
  }
  if(t.sol){
    const sb = el('button','hbtn', t.type==='assign' ? 'Richtige Lösung anzeigen' : 'Musterlösung anzeigen'); sb.type='button';
    const sd = el('div','sol'); sd.style.display='none';
    sb.addEventListener('click',()=>{
      const open = sd.style.display==='block';
      if(!open && !sd.dataset.filled){ sd.innerHTML = t.sol; sd.dataset.filled='1'; }
      sd.style.display = open?'none':'block';
      sb.textContent = open ? (t.type==='assign' ? 'Richtige Lösung anzeigen' : 'Musterlösung anzeigen') : 'Lösung ausblenden';
      if(!open) typeset(sd);
    });
    h.appendChild(sb);
    h.appendChild(tipsWrap);
    h.appendChild(sd);
  } else h.appendChild(tipsWrap);
  return h;
}

/* ---------- Texteingabe ---------- */
function buildInput(t){
  const wrap = el('div','fields');
  t._fields = t.fields.map(f=>{
    const row = el('div','frow');
    row.appendChild(el('span','pre',f.pre));
    const inp = document.createElement('input');
    inp.type='text'; inp.setAttribute('inputmode','numeric'); inp.autocomplete='off';
    if(f.ans<100 && !f.units) inp.classList.add('short');
    row.appendChild(inp);
    let sel=null;
    if(f.units){
      sel = document.createElement('select');
      sel.appendChild(new Option('Einheit …',''));
      f.units.forEach(u=>sel.appendChild(new Option(u,u)));
      row.appendChild(sel);
    } else if(f.post){ row.appendChild(el('span','post',f.post)); }
    wrap.appendChild(row);
    return {f, inp, sel, ok:false};
  });
  t._dom.area.appendChild(wrap);
}

/* ---------- Multiple Choice ---------- */
function buildMC(t){
  const wrap = el('div','mc');
  if(t.multi) t._dom.area.appendChild(el('p','mcnote','Mehrere Antworten können richtig sein.'));
  // 1. einmal mischen  2. DOM erzeugen  3. erst dann Klick-Bindungen
  const opts = shuffle(t.options.slice());
  t._opts = opts.map(o=>{
    const b = el('button','mcopt',o.t); b.type='button';
    b.dataset.ok = o.ok ? '1' : '0';
    wrap.appendChild(b);
    return b;
  });
  t._opts.forEach(b=>{
    b.addEventListener('click',()=>{
      if(STATE[t.id].locked) return;
      if(t.multi){ b.classList.toggle('sel'); }
      else { t._opts.forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); }
    });
  });
  t._dom.area.appendChild(wrap);
}

/* ---------- Zuordnen (Antippen-Prinzip) ---------- */
function buildAssign(t){
  const wrap = el('div','assign');
  const pool = el('div','pool');
  const tg = el('div','targets');
  t._sel = null;
  t._zones = {};
  t.targets.forEach(g=>{
    const d = el('div','target');
    const head = el('div','thead', (g.svg ? SVG[g.svg] : '') + g.label);
    const z = el('div','zone'); z.dataset.target = g.id;
    d.appendChild(head); d.appendChild(z);
    d.addEventListener('click',()=>placeSel(t, z));
    t._zones[g.id] = z;
    tg.appendChild(d);
  });
  t._chips = shuffle(t.items.slice()).map(it=>{
    const c = el('button','chip',it.l); c.type='button';
    c.dataset.to = it.to===null ? '' : it.to;
    c.dataset.label = it.l;
    c.addEventListener('click',(ev)=>{
      ev.stopPropagation();
      if(STATE[t.id].locked) return;
      if(c.parentElement === pool){
        if(t._sel === c){ c.classList.remove('sel'); t._sel=null; }
        else { if(t._sel) t._sel.classList.remove('sel'); c.classList.add('sel'); t._sel=c; }
      } else if(t._sel){
        placeSel(t, c.parentElement);   // markiertes Element in dieses Feld legen
      } else {
        pool.appendChild(c);            // einsortiertes Element springt zurück
      }
    });
    pool.appendChild(c);
    return c;
  });
  t._pool = pool;
  wrap.appendChild(el('p','', '<b>Vorrat:</b>'));
  wrap.appendChild(pool);
  wrap.appendChild(tg);
  t._dom.area.appendChild(wrap);
}

function placeSel(t, z){
  if(STATE[t.id].locked || !t._sel) return;
  const cap = t.mode==='pair' ? 1 : Infinity;
  if(z.children.length >= cap){ t._pool.appendChild(z.firstElementChild); }
  z.appendChild(t._sel);
  t._sel.classList.remove('sel'); t._sel = null;
}

/* =========================================================
   Prüfen / Leeren
   ========================================================= */
function setFb(t, cls, html){
  const fb = t._dom.fb;
  fb.className = 'fb '+cls;
  fb.innerHTML = html;
  typeset(fb);
}

function check(t){
  const st = STATE[t.id];
  if(st.locked) return;
  let res;
  if(t.type==='input') res = checkInput(t);
  else if(t.type==='mc') res = checkMC(t);
  else res = checkAssign(t);
  if(res === null) return;            // unvollständig – nichts zählen
  st.tries++;
  st.locked = true;
  t._dom.bc.disabled = true;
  if(t.type==='assign') t._dom.area.classList.add('locked');
  if(res.ok){
    st.status = 'right';
    t._dom.bl.style.display = 'none';
    setFb(t,'ok','✓ Richtig! '+(st.tries>1?'Gut korrigiert.':'Stark gemacht.'));
  } else {
    st.status = 'wrong';
    t._dom.bl.style.display = 'inline-block';
    setFb(t,'bad','✗ '+res.msg);
    t._dom.help.style.display = 'block';
  }
}

function checkInput(t){
  for(const x of t._fields){
    if(x.ok) continue;
    if(x.inp.value.trim()==='' || (x.sel && x.sel.value==='')){
      setFb(t,'info','Bitte fülle alle Felder aus'+(t._fields.some(y=>y.sel)?' und wähle jede Einheit':'')+'.');
      return null;
    }
  }
  let numBad=0, unitBad=0, okCount=0;
  t._fields.forEach(x=>{
    const n = parseNum(x.inp.value);
    const nOk = !isNaN(n) && Math.abs(n - x.f.ans) < 1e-9;
    const uOk = !x.sel || x.sel.value === x.f.unit;
    x.inp.classList.remove('f-ok','f-bad'); if(x.sel) x.sel.classList.remove('f-ok','f-bad');
    x.inp.classList.add(nOk?'f-ok':'f-bad');
    if(x.sel) x.sel.classList.add(uOk?'f-ok':'f-bad');
    if(!nOk) numBad++;
    if(!uOk) unitBad++;
    x.ok = nOk && uOk;
    if(x.ok) okCount++;
    x.inp.disabled = true; if(x.sel) x.sel.disabled = true;
  });
  if(okCount === t._fields.length) return {ok:true};
  let msg = 'Noch nicht ganz. ';
  if(t._fields.length>1) msg += okCount+' von '+t._fields.length+' Feldern sind richtig. ';
  if(numBad>0 && unitBad===0 && t._fields.some(x=>x.sel)) msg += 'Die Einheiten stimmen, aber nicht alle Zahlen. ';
  if(numBad>0) msg += t.hint+' ';
  if(unitBad>0) msg += (numBad===0?'Die Zahlen stimmen. ':'')+UNIT_MSG;
  return {ok:false, msg:msg.trim()};
}

function checkMC(t){
  const sel = t._opts.filter(b=>b.classList.contains('sel'));
  if(sel.length===0){ setFb(t,'info','Bitte wähle zuerst eine Antwort aus.'); return null; }
  let allOk = true;
  t._opts.forEach(b=>{
    const isOk = b.dataset.ok==='1', isSel = b.classList.contains('sel');
    if(isSel){ b.classList.add(isOk?'ok':'bad'); }
    if(isOk !== isSel) allOk = false;
  });
  if(allOk) return {ok:true};
  let msg = 'Noch nicht richtig. ';
  if(t.multi && sel.every(b=>b.dataset.ok==='1')) msg = 'Deine Auswahl ist richtig, aber unvollständig. ';
  return {ok:false, msg: msg + t.hint};
}

function checkAssign(t){
  const complete = t.mode==='pair'
    ? Object.values(t._zones).every(z=>z.children.length===1)
    : t._pool.children.length===0;
  if(!complete){ setFb(t,'info', t.mode==='pair'?'Bitte belege zuerst jedes Feld.':'Bitte sortiere zuerst alle Elemente ein.'); return null; }
  if(t._sel){ t._sel.classList.remove('sel'); t._sel=null; }
  let bad = 0;
  Object.entries(t._zones).forEach(([id,z])=>{
    Array.from(z.children).forEach(c=>{
      const ok = c.dataset.to === id;
      c.classList.remove('ok','bad'); c.classList.add(ok?'ok':'bad');
      c.innerHTML = (ok?'✓ ':'✗ ') + c.dataset.label;
      if(!ok) bad++;
    });
  });
  if(bad===0) return {ok:true};
  return {ok:false, msg: t.hint+' Falsch platziert: '+bad+'.'};
}

/* Leeren: einziges absichtliches Zurücksetzen – nur fehlerhafte Teile, Aufgabe wird wieder bedienbar */
function clearTask(t){
  const st = STATE[t.id];
  if(t.type==='input'){
    t._fields.forEach(x=>{
      if(x.ok) return;               // richtige Felder bleiben stehen
      x.inp.value=''; x.inp.disabled=false; x.inp.classList.remove('f-ok','f-bad');
      if(x.sel){ x.sel.value=''; x.sel.disabled=false; x.sel.classList.remove('f-ok','f-bad'); }
    });
  } else if(t.type==='mc'){
    t._opts.forEach(b=>b.classList.remove('sel','ok','bad'));
  } else {
    t._dom.area.classList.remove('locked');
    Object.values(t._zones).forEach(z=>{
      Array.from(z.children).forEach(c=>{
        if(c.classList.contains('bad')) t._pool.appendChild(c);
        c.classList.remove('ok','bad');
        c.innerHTML = c.dataset.label;
      });
    });
  }
  st.locked = false;
  t._dom.bc.disabled = false;
  t._dom.bl.style.display = 'none';
  t._dom.fb.className = 'fb'; t._dom.fb.innerHTML='';
}

/* =========================================================
   Navigation
   ========================================================= */
function showCard(id){
  currentCard = id;
  document.querySelectorAll('section.card').forEach(s=>s.classList.toggle('show', s.id==='card-'+id));
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.card===id));
  const c = CARDS.find(x=>x.id===id);
  document.getElementById('levelbar').classList.toggle('hide', !c.levels);
  if(id==='auswertung') renderEval();
}
function setLevel(lv){
  level = lv;
  document.body.classList.remove('lv-g','lv-f');
  document.body.classList.add('lv-'+lv);
  document.querySelectorAll('#levelbar button').forEach(b=>b.classList.toggle('on', b.dataset.lv===lv));
}
document.querySelectorAll('#levelbar button').forEach(b=>b.addEventListener('click',()=>setLevel(b.dataset.lv)));

/* =========================================================
   Auswertung
   ========================================================= */
function renderEval(){
  const body = document.getElementById('evbody');
  const n = TASKS.length;
  const right = TASKS.filter(t=>STATE[t.id].status==='right').length;
  const first = TASKS.filter(t=>STATE[t.id].status==='right' && STATE[t.id].tries===1).length;
  const wrong = TASKS.filter(t=>STATE[t.id].status==='wrong').length;
  let html = '<p class="sumbox">'+right+' von '+n+' Aufgaben gelöst ('+first+' davon gleich beim ersten Versuch).</p>';
  const weak = CARDS.filter(c=>c.levels && TASKS.some(t=>t.card===c.id && STATE[t.id].status!=='right'));
  if(right===n) html += '<p class="note">Super! Du hast alles geschafft. Du bist gut vorbereitet. Schau dir zur Sicherheit noch einmal die Merkhilfe auf der Karte „Überblick“ an.</p>';
  else html += '<p class="note"><b>Noch üben:</b> '+weak.map(c=>c.title.replace(/^\d\s/,'')).join(', ')+'.'+(wrong>0?' Falsch beantwortete Aufgaben kannst du mit „Leeren“ neu versuchen.':'')+'</p>';
  body.innerHTML = html;
  CARDS.filter(c=>c.levels).forEach(c=>{
    const g = el('div','evgroup');
    g.appendChild(el('h3','',c.title));
    TASKS.filter(t=>t.card===c.id).forEach(t=>{
      const st = STATE[t.id];
      const row = el('div','evrow');
      row.appendChild(el('span','lvtag', t.lv==='g'?'Grundlagen':'Fortgeschritten'));
      row.appendChild(el('span','evname', t.title));
      let pill;
      if(st.status==='right') pill = el('span','pill r', st.tries===1?'✓ richtig':'✓ richtig ('+st.tries+'. Versuch)');
      else if(st.status==='wrong') pill = el('span','pill w','✗ noch falsch');
      else pill = el('span','pill o','offen');
      row.appendChild(pill);
      if(st.status!=='right'){
        const go = el('button','gobtn','zur Aufgabe'); go.type='button';
        go.addEventListener('click',()=>{
          setLevel(t.lv); showCard(t.card);
          document.getElementById('task-'+t.id).scrollIntoView({behavior:'smooth',block:'start'});
        });
        row.appendChild(go);
      }
      g.appendChild(row);
    });
    body.appendChild(g);
  });
}

/* =========================================================
   Start
   ========================================================= */
buildTabs();
buildCards();
showCard('start');
const rex = document.getElementById('rex');
rex.addEventListener('click',()=>rex.classList.toggle('open'));
</script>
