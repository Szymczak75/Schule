<!-- =============================================================================
     BAUSTEIN: EXAM-Seite  (v1.2, 20.11.2026 – Punkte je Aufgabe) – _wartung/exam/baustein_exam.html
     Anleitung: _wartung/exam/anweisung_exam.md
     Neue EXAM-Seite = Kopie dieser Datei. Geändert werden NUR
       - die Meta-Tags und <title> oben,
       - der Block  EXAM-INHALT  im Skript (Texte, Aufgaben, Abbildungen).
     Alles andere (Engine) bleibt unverändert.
     Engine:
       - Start nur über den Link aus intern/EXAM/vorbereitung.html (?l=<Hash des
         Freischaltcodes>). Code (Muster mit Prüfzeichen) + Initialen, erst dann
         erscheinen die Aufgaben; die Orientierungsuhr startet.
       - Flugmodus (Standard, EXAM.flugmodus !== false): Code-Eingabe erst offline;
         Netz während des Tests = Sperre; Entsperren nur offline.
       - Sperre beim Verlassen (Tab/App, Fokus, Neuladen); Entsperren mit dem
         Freischaltcode; jede Sperre steht im PDF.
       - Aufgabentypen: beschriften, sortieren (Antippen), auswahl, freitext.
       - Keine Lösungen im Quelltext, keine Bewertung auf der Seite.
       - Punkte je Aufgabe (aufgabe.punkte) stehen auf der Seite und im PDF als
         „___ von X Punkten" (zum Eintragen mit dem Stift).
       - Abgabe mit Rückfrage; danach PDF (Helvetica, Abbildungen als JPEG,
         Antworten zusätzlich als eingebettete Datei abgabe.json).
       - Zustand nur in sessionStorage (try/catch). Gesperrte Felder per
         readOnly + .zu (iPad), nie per disabled.
       - Bewusst ohne Navigationsleiste: jeder Link nach draußen würde sperren.
     ========================================================================== -->
<style>
:root{
  --ink:#22303f; --card:#ffffff; --green:#1e7d32; --red:#c1272d;
  --amber:#b8860b; --amber-light:#fdf3d9; --amber-dark:#96690a;
  --grey:#6b7686; --grey-light:#eef0f3; --border-blue:#1f4680;
  --bg:#f7f8fa; --line:#e2e6ec;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:1rem;line-height:1.5;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
input,textarea{-webkit-user-select:text;user-select:text;}
main{max-width:1024px;margin:0 auto;padding:1rem;}
.kopf{background:var(--grey-light);border:3px solid var(--border-blue);border-radius:1rem;
  padding:1rem 1.2rem;margin-bottom:1rem;}
.kopf h1{margin:0;font-size:1.5rem;}
.kopf p{margin:.3rem 0 0;font-size:1rem;color:var(--grey);}
.kopfzeile{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;}
.uhr{font-size:1.3rem;font-weight:800;color:var(--border-blue);font-variant-numeric:tabular-nums;}
.uhr-hinweis{font-size:1rem;color:var(--grey);}
.wer{font-weight:700;font-size:1rem;}
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1rem;}
.tab{min-height:44px;padding:.5rem 1rem;border:2px solid var(--border-blue);border-radius:.6rem;
  background:#fff;color:var(--border-blue);font:inherit;font-size:1rem;font-weight:700;cursor:pointer;}
.tab.aktiv{background:var(--border-blue);color:#fff;}
.karte{display:none;background:var(--card);border:2px solid var(--line);border-radius:1rem;
  padding:1.2rem;margin-bottom:1rem;}
.karte.aktiv{display:block;}
.karte h2{margin:0 0 .5rem;font-size:1.3rem;color:var(--border-blue);}
.karte h3{margin:1.1rem 0 .4rem;font-size:1.1rem;}
.auftrag{font-weight:700;}
.punkte{font-size:1rem;font-weight:700;color:var(--grey);white-space:nowrap;}
.hinweis{color:var(--grey);}
.figur{border:2px solid var(--line);border-radius:.8rem;background:#fff;padding:.4rem;margin:.6rem 0;}
.figur > svg{display:block;width:100%;height:auto;}
.beschriftung{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.6rem;margin-top:.6rem;}
.feld{display:flex;align-items:center;gap:.5rem;}
.nr{flex:0 0 auto;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--border-blue);color:#fff;
  font-weight:800;font-size:1rem;display:flex;align-items:center;justify-content:center;}
input[type=text],textarea{width:100%;min-height:44px;padding:.5rem .7rem;border:2px solid var(--line);
  border-radius:.6rem;font:inherit;font-size:1rem;color:var(--ink);background:#fff;}
textarea{min-height:9rem;resize:vertical;}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--border-blue);}
input.zu,textarea.zu{background:var(--grey-light);color:var(--ink);-webkit-text-fill-color:var(--ink);cursor:default;}
.knopf{min-height:44px;padding:.6rem 1.2rem;border:2px solid var(--border-blue);border-radius:.6rem;
  background:var(--border-blue);color:#fff;font:inherit;font-size:1rem;font-weight:700;cursor:pointer;}
.knopf.hell{background:#fff;color:var(--border-blue);}
.knopf:disabled{background:var(--grey-light);border-color:var(--line);color:var(--grey);cursor:default;}
.knopf:active:not(:disabled){transform:scale(.98);}
.zeile{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.8rem;}
.meldung{margin-top:.6rem;font-weight:700;}
.meldung:empty{display:none;}
.meldung.ok{background:var(--green);color:#fff;padding:.5rem .8rem;border-radius:.6rem;}
.meldung.falsch{background:var(--red);color:#fff;padding:.5rem .8rem;border-radius:.6rem;}
.meldung.info{background:var(--amber-light);border:2px solid var(--amber);color:var(--ink);padding:.5rem .8rem;border-radius:.6rem;}
/* Sortieren per Antippen */
.sort-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
@media (max-width:760px){.sort-grid{grid-template-columns:1fr;}}
.sort-spalte h3{margin-top:0;}
.vorrat,.plaetze,.optionen{display:flex;flex-direction:column;gap:.5rem;}
.karte-btn{min-height:44px;padding:.6rem .8rem;border:2px solid var(--line);border-radius:.6rem;
  background:#fff;color:var(--ink);font:inherit;font-size:1rem;text-align:left;cursor:pointer;width:100%;}
.karte-btn.gewaehlt{border-color:var(--border-blue);background:var(--grey-light);box-shadow:0 0 0 2px var(--border-blue);}
.karte-btn.fehlt{border-style:dashed;border-color:var(--amber);background:var(--amber-light);font-weight:700;}
.platz{display:flex;align-items:stretch;gap:.5rem;}
.platz .nr{align-self:center;}
.platz-feld{flex:1;min-height:52px;border:2px dashed var(--grey);border-radius:.6rem;background:var(--bg);
  font:inherit;font-size:1rem;color:var(--grey);text-align:left;padding:.5rem .8rem;cursor:pointer;}
.platz-feld.belegt{border-style:solid;border-color:var(--border-blue);background:#fff;color:var(--ink);}
.platz-feld.belegt.fehlt{border-color:var(--amber);background:var(--amber-light);font-weight:700;}
/* Auswahl */
.option{display:flex;align-items:center;gap:.7rem;}
.option .marke{flex:0 0 auto;width:1.6rem;height:1.6rem;border:2px solid var(--border-blue);background:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;}
.option.einzel .marke{border-radius:50%;}
.option.einzel.an .marke{background:var(--border-blue);box-shadow:inset 0 0 0 4px #fff;}
.option.mehr .marke{border-radius:.3rem;}
.option.an{border-color:var(--border-blue);background:var(--grey-light);}
.option.mehr.an .marke{background:var(--border-blue);}
.option.mehr.an .marke::after{content:'✓';}
/* Start & Abgabe */
.start-box{max-width:38rem;}
.start-felder{display:flex;flex-wrap:wrap;gap:1rem;}
.start-felder > div{flex:1 1 12rem;}
.start-felder label{display:block;font-weight:700;margin-bottom:.3rem;}
.gross{font-size:1.3rem !important;letter-spacing:.15em;text-transform:uppercase;}
.liste{margin:.4rem 0 0;padding-left:1.3rem;}
.liste li{margin:.3rem 0;}
.dateiname{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1rem;background:var(--grey-light);
  padding:.1rem .4rem;border-radius:.3rem;}
/* Sperre & Dialog */
.sperre{position:fixed;inset:0;z-index:1000;background:rgba(34,48,63,.92);display:none;
  align-items:center;justify-content:center;padding:1rem;}
.sperre.an{display:flex;}
body.gesperrt main{filter:blur(8px);}
.sperre-box{background:#fff;border:4px solid var(--red);border-radius:1rem;padding:1.4rem;max-width:30rem;width:100%;}
.sperre-box h2{margin:0 0 .5rem;color:var(--red);font-size:1.4rem;}
.sperre-box p{margin:.4rem 0;}
.geheim{-webkit-text-security:disc;}
.dialog{position:fixed;inset:0;z-index:900;background:rgba(34,48,63,.6);display:none;
  align-items:center;justify-content:center;padding:1rem;}
.dialog.an{display:flex;}
.dialog-box{background:#fff;border:3px solid var(--border-blue);border-radius:1rem;padding:1.3rem;max-width:30rem;width:100%;}
.dialog-box h2{margin:0 0 .5rem;font-size:1.3rem;}
/* Dino – baustein_dino.html */
  .trex{position:fixed;right:.7rem;bottom:.7rem;cursor:pointer;z-index:50;user-select:none;}
  .trex .dino-ikon{display:block;width:72px;height:72px;-webkit-user-drag:none;}
  .trex .bubble{
    position:absolute;right:calc(100% + 6px);bottom:26px;white-space:nowrap;
    background:var(--ink,#1f2937);color:#fff;padding:.3rem .6rem;border-radius:.5rem;
    font-size:1rem;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .trex:hover .bubble,.trex.zeig .bubble{opacity:1;}

</style>
</head>
<body>
<main>
  <div class="kopf">
    <div class="kopfzeile">
      <div>
        <h1 id="examTitel"></h1>
        <p id="examUntertitel"></p>
      </div>
      <div id="kopfRechts" hidden>
        <div class="wer" id="werAnzeige"></div>
        <div class="uhr" id="uhr">--:--</div>
        <div class="uhr-hinweis" id="uhrHinweis"></div>
      </div>
    </div>
  </div>

  <section class="karte aktiv" id="startKarte">
    <div class="start-box">
      <h2 id="startTitel"></h2>
      <ul class="liste" id="startRegeln"></ul>
      <div class="meldung falsch" id="linkFehlt" hidden></div>
      <div class="meldung info" id="flugHinweis" hidden></div>
      <h3 id="startFelderTitel"></h3>
      <div class="start-felder">
        <div>
          <label for="codeFeld" id="codeLabel"></label>
          <input type="text" id="codeFeld" class="gross" maxlength="7" autocomplete="off"
                 autocapitalize="characters" autocorrect="off" spellcheck="false">
        </div>
        <div>
          <label for="initFeld" id="initLabel"></label>
          <input type="text" id="initFeld" class="gross" maxlength="3" autocomplete="off"
                 autocapitalize="characters" autocorrect="off" spellcheck="false">
        </div>
      </div>
      <div class="meldung" id="startMeldung" aria-live="polite"></div>
      <div class="zeile"><button class="knopf" id="startKnopf" disabled></button></div>
    </div>
  </section>

  <div id="testBereich" hidden>
    <nav class="tabs" id="tabs" aria-label="Aufgaben"></nav>
    <div id="aufgabenKarten"></div>
    <section class="karte" id="ab">
      <h2>Abgabe</h2>
      <div id="abVorher">
        <p id="abVorherText"></p>
        <ul class="liste" id="standListe"></ul>
        <p id="abWarnung"></p>
        <div class="zeile"><button class="knopf" id="abgebenKnopf">Endgültig abgeben</button></div>
      </div>
      <div id="abNachher" hidden>
        <div class="meldung ok" id="abFertig"></div>
        <p><span id="abDateiText"></span> <span class="dateiname" id="dateiname"></span></p>
        <ol class="liste" id="abSchritte"></ol>
        <div class="zeile"><button class="knopf" id="pdfKnopf" disabled>📄 PDF herunterladen</button></div>
        <div class="meldung" id="pdfMeldung" aria-live="polite"></div>
      </div>
    </section>
  </div>
</main>

<div class="dialog" id="abgabeDialog" role="dialog" aria-modal="true" aria-labelledby="abgabeTitel">
  <div class="dialog-box">
    <h2 id="abgabeTitel"></h2>
    <p id="abgabeText"></p>
    <div class="zeile">
      <button class="knopf" id="abgabeJa"></button>
      <button class="knopf hell" id="abgabeNein"></button>
    </div>
  </div>
</div>

<div class="sperre" id="sperre" role="alertdialog" aria-modal="true" aria-labelledby="sperreTitel">
  <div class="sperre-box">
    <h2 id="sperreTitel">🔒 Test gesperrt</h2>
    <p id="sperreText1"></p>
    <p id="sperreText2"></p>
    <p><label for="freiFeld">Freischaltcode (Lehrkraft):</label></p>
    <input type="text" id="freiFeld" class="geheim" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false">
    <div class="zeile"><button class="knopf" id="entsperrKnopf">Entsperren</button></div>
    <div class="meldung" id="sperreMeldung" aria-live="polite"></div>
  </div>
</div>

/* ---------- Schüler-Code (identisch in intern/EXAM/vorbereitung.html) ---------- */
var CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ'; // 23 Buchstaben (Primzahl), ohne I, L, O – nur Buchstaben seit 20.11.2026
var CODE_SALT = 7;
function codeNorm(s){ return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function codePruefzeichen(k4){
  var s = CODE_SALT;
  for (var i = 0; i < 4; i++) s += (i + 1) * CODE_ALPHABET.indexOf(k4.charAt(i));
  return CODE_ALPHABET.charAt(s % CODE_ALPHABET.length);
}
function codeGueltig(s){
  var n = codeNorm(s);
  if (n.length !== 5) return false;
  for (var i = 0; i < 5; i++) if (CODE_ALPHABET.indexOf(n.charAt(i)) < 0) return false;
  return codePruefzeichen(n.slice(0, 4)) === n.charAt(4);
}
function codeFormat(s){ var n = codeNorm(s); return n.slice(0, 4) + '-' + n.slice(4); }
function hashText(s){
  s = String(s).toUpperCase().replace(/\s+/g, '');
  var h = 0x811c9dc5;
  for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return ('0000000' + h.toString(16)).slice(-8);
}
function initNorm(s){ return String(s || '').toUpperCase().replace(/[^A-ZÄÖÜ]/g, ''); }
var FLUG = EXAM.flugmodus !== false;
function online(){ return FLUG && navigator.onLine !== false; }
function linkHash(){
  var m = /[?&]l=([0-9a-f]{8})(?:&|$)/i.exec(location.search);
  return m ? m[1].toLowerCase() : '';
}

/* ---------- Teile ---------- */
var TEILE = [];
EXAM.aufgaben.forEach(function(a, ai){ a.teile.forEach(function(t){ t.aufgabe = ai; TEILE.push(t); }); });
function teil(id){ for (var i = 0; i < TEILE.length; i++) if (TEILE[i].id === id) return TEILE[i]; return null; }

/* ---------- Zustand (nur sessionStorage, immer try/catch) ---------- */
function neuerZustand(){
  return { phase:'start', code:'', init:'', lh:'', start:0, ende:0, gesperrt:false, log:[], karte:'a0', a:{} };
}
var S = (function(){
  try { var r = sessionStorage.getItem(EXAM.speicher); if (r){ var d = JSON.parse(r); if (d && d.phase) return d; } } catch (e) {}
  return neuerZustand();
})();
if (!S.a) S.a = {};
if (!S.log) S.log = [];
TEILE.forEach(function(t){
  if (t.typ === 'beschriften' && (typeof S.a[t.id] !== 'object' || !S.a[t.id])) S.a[t.id] = {};
  if (t.typ === 'sortieren' && !(S.a[t.id] instanceof Array && S.a[t.id].length === t.karten.length))
    S.a[t.id] = t.karten.map(function(){ return null; });
  if (t.typ === 'auswahl' && !(S.a[t.id] instanceof Array)) S.a[t.id] = [];
  if (t.typ === 'freitext' && typeof S.a[t.id] !== 'string') S.a[t.id] = '';
});
function speichern(){ try { sessionStorage.setItem(EXAM.speicher, JSON.stringify(S)); } catch (e) {} }

function $(id){ return document.getElementById(id); }
function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function zeit(ms){ var d = new Date(ms); return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2) + ' Uhr'; }
function datum(ms){ var d = new Date(ms); return ('0'+d.getDate()).slice(-2) + '.' + ('0'+(d.getMonth()+1)).slice(-2) + '.' + d.getFullYear(); }
function laeuft(){ return S.phase === 'laeuft'; }

/* ---------- Abbildung mit Nummern ---------- */
function figurSvg(t){
  var n = t.nummern.map(function(p){
    return '<line x1="'+p.x+'" y1="'+p.y+'" x2="'+p.zx+'" y2="'+p.zy+'" stroke="#6b7686" stroke-width="2"/>' +
           '<circle cx="'+p.zx+'" cy="'+p.zy+'" r="7" fill="none" stroke="#6b7686" stroke-width="2"/>' +
           '<circle cx="'+p.x+'" cy="'+p.y+'" r="17" fill="#1f4680"/>' +
           '<text x="'+p.x+'" y="'+(p.y+6)+'" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" font-family="Helvetica,Arial,sans-serif">'+p.nr+'</text>';
  }).join('');
  var i = t.svg.lastIndexOf('</svg>');
  return t.svg.slice(0, i) + n + '</svg>';
}

/* ---------- Aufbau der Karten ---------- */
function feldAttr(){ return 'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"'; }
function baueTeil(t){
  var h = '<h3 class="auftrag">' + esc(t.auftrag) + '</h3>';
  if (t.typ === 'beschriften'){
    h += '<div class="figur">' + figurSvg(t) + '</div><div class="beschriftung">';
    t.nummern.slice().sort(function(a,b){ return a.nr - b.nr; }).forEach(function(p){
      h += '<div class="feld"><span class="nr" aria-hidden="true">'+p.nr+'</span>' +
           '<input type="text" data-teil="'+t.id+'" data-nr="'+p.nr+'" aria-label="Bezeichnung für Nummer '+p.nr+'" '+feldAttr()+'></div>';
    });
    h += '</div>';
  } else if (t.typ === 'sortieren'){
    h += '<p class="hinweis">' + esc(T.sortHinweis) + '</p>' +
         '<div class="sort-grid"><div class="sort-spalte"><h3>Karten</h3><div class="vorrat" data-vorrat="'+t.id+'"></div></div>' +
         '<div class="sort-spalte"><h3>Reihenfolge</h3><div class="plaetze" data-plaetze="'+t.id+'"></div></div></div>';
  } else if (t.typ === 'auswahl'){
    h += '<div class="optionen" role="' + (t.mehrfach ? 'group' : 'radiogroup') + '">';
    t.optionen.forEach(function(o){
      h += '<button class="karte-btn option ' + (t.mehrfach ? 'mehr' : 'einzel') + '" data-teil="'+t.id+'" data-option="'+o.id+'" role="' +
           (t.mehrfach ? 'checkbox' : 'radio') + '" aria-checked="false"><span class="marke" aria-hidden="true"></span><span>' + esc(o.t) + '</span></button>';
    });
    h += '</div>';
  } else if (t.typ === 'freitext'){
    h += '<textarea data-teil="'+t.id+'" aria-label="' + esc(t.auftrag) + '" autocorrect="off" autocapitalize="sentences" spellcheck="false"></textarea>';
  }
  return h;
}
function baueAufgaben(){
  var tabs = '', karten = '';
  EXAM.aufgaben.forEach(function(a, i){
    tabs += '<button class="tab" data-ziel="a'+i+'">Aufgabe ' + (i+1) + ' · ' + esc(a.kurz) + '<span data-marke="a'+i+'"></span></button>';
    karten += '<section class="karte" id="a'+i+'"><h2>' + esc(a.titel) +
              (a.punkte ? ' <span class="punkte">(' + a.punkte + ' ' + (a.punkte === 1 ? 'Punkt' : 'Punkte') + ')</span>' : '') +
              '</h2>' + (a.einleitung || '') +
              a.teile.map(baueTeil).join('') + '</section>';
  });
  tabs += '<button class="tab" data-ziel="ab">✅ Abgabe</button>';
  $('tabs').innerHTML = tabs;
  $('aufgabenKarten').innerHTML = karten;
}

/* ---------- Sortieren ---------- */
var gewaehlt = {};
function karteVon(t, id){ for (var i = 0; i < t.karten.length; i++) if (t.karten[i].id === id) return t.karten[i]; return null; }
function zeichneSort(t){
  var plaetze = S.a[t.id], zu = !laeuft(), h = '';
  t.karten.forEach(function(k){
    if (plaetze.indexOf(k.id) >= 0) return;
    h += '<button class="karte-btn' + (k.fehlt ? ' fehlt' : '') + (gewaehlt[t.id] === k.id ? ' gewaehlt' : '') +
         '" data-teil="'+t.id+'" data-karte="'+k.id+'"' + (zu ? ' disabled' : '') + '>' + esc(k.t) + '</button>';
  });
  document.querySelector('[data-vorrat="'+t.id+'"]').innerHTML = h || '<p class="hinweis">Alle Karten liegen.</p>';
  document.querySelector('[data-plaetze="'+t.id+'"]').innerHTML = plaetze.map(function(id, i){
    var k = id ? karteVon(t, id) : null;
    return '<div class="platz"><span class="nr" aria-hidden="true">'+(i+1)+'</span>' +
      '<button class="platz-feld' + (k ? ' belegt' : '') + (k && k.fehlt ? ' fehlt' : '') + '" data-teil="'+t.id+'" data-platz="'+i+'"' +
      ' aria-label="Platz '+(i+1)+'"' + (zu ? ' disabled' : '') + '>' + (k ? esc(k.t) : 'frei') + '</button></div>';
  }).join('');
}
/* ---------- Auswahl ---------- */
function zeichneAuswahl(t){
  var an = S.a[t.id];
  document.querySelectorAll('[data-teil="'+t.id+'"][data-option]').forEach(function(b){
    var ist = an.indexOf(b.getAttribute('data-option')) >= 0;
    b.classList.toggle('an', ist); b.setAttribute('aria-checked', ist ? 'true' : 'false');
    b.disabled = !laeuft();
  });
}
function klick(e){
  if (!laeuft()) return;
  var b = e.target.closest('button[data-teil]'); if (!b) return;
  var t = teil(b.getAttribute('data-teil')); if (!t) return;
  if (t.typ === 'sortieren'){
    var p = S.a[t.id];
    if (b.hasAttribute('data-karte')){
      var id = b.getAttribute('data-karte'); gewaehlt[t.id] = (gewaehlt[t.id] === id) ? null : id;
    } else if (b.hasAttribute('data-platz')){
      var i = +b.getAttribute('data-platz');
      if (gewaehlt[t.id]){ p[i] = gewaehlt[t.id]; gewaehlt[t.id] = null; }   // alte Karte geht zurück
      else if (p[i]) p[i] = null;
      speichern();
    }
    zeichneSort(t); marken();
  } else if (t.typ === 'auswahl'){
    var o = b.getAttribute('data-option'), an = S.a[t.id], j = an.indexOf(o);
    if (t.mehrfach){ if (j >= 0) an.splice(j, 1); else an.push(o); }
    else S.a[t.id] = (j >= 0) ? [] : [o];
    speichern(); zeichneAuswahl(t); marken();
  }
}

/* ---------- Stand ---------- */
function teilFertig(t){
  var a = S.a[t.id];
  if (t.typ === 'beschriften') return t.nummern.every(function(p){ return (a[p.nr] || '').trim(); });
  if (t.typ === 'sortieren') return a.every(function(x){ return !!x; });
  if (t.typ === 'auswahl') return a.length > 0;
  return !!(a || '').trim();
}
function teilStand(t){
  var a = S.a[t.id];
  if (t.typ === 'beschriften'){
    var n = t.nummern.filter(function(p){ return (a[p.nr] || '').trim(); }).length;
    return n + ' von ' + t.nummern.length + ' Feldern ausgefüllt';
  }
  if (t.typ === 'sortieren') return a.filter(Boolean).length + ' von ' + a.length + ' Karten gelegt';
  if (t.typ === 'auswahl') return a.length ? 'ausgewählt' : 'noch nichts ausgewählt';
  return (a || '').trim() ? 'beantwortet' : 'noch leer';
}
function marken(){
  EXAM.aufgaben.forEach(function(a, i){
    var m = document.querySelector('[data-marke="a'+i+'"]');
    if (m) m.textContent = a.teile.every(teilFertig) ? ' ●' : '';
  });
}
function standListe(){
  $('standListe').innerHTML = TEILE.map(function(t){
    return '<li>' + (teilFertig(t) ? '✔ ' : '⚠️ ') + 'Teil ' + esc(t.id) + ': ' + teilStand(t) + '</li>';
  }).join('');
}

/* ---------- Karten wechseln ---------- */
function zeigeKarte(z){

  if (z === 'ab') standListe();
  window.scrollTo(0, 0);
  speichern();
}

/* ---------- Uhr ---------- */
function uhr(){
  if (S.phase === 'start') return;
  var bis = S.phase === 'abgegeben' ? S.ende : Date.now();
  var rest = Math.max(0, EXAM.zeit * 60 - Math.floor((bis - S.start) / 1000));
  $('uhr').textContent = '⏱ ' + Math.floor(rest / 60) + ':' + ('0' + (rest % 60)).slice(-2) + (rest === 0 ? ' – Richtzeit erreicht' : '');
}

/* ---------- Sperre ---------- */
function zeigeSperre(an){
  $('sperre').classList.toggle('an', !!an);
  document.body.classList.toggle('gesperrt', !!an);
  if (an){ $('freiFeld').value = ''; $('sperreMeldung').textContent = ''; $('sperreMeldung').className = 'meldung'; }
}
function sperren(anlass){
  if (!laeuft() || S.gesperrt) return;
  S.gesperrt = true;
  S.log.push({ t: Date.now(), art: anlass });
  speichern(); zeigeSperre(true);
}
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') sperren('Seite verlassen (Tab oder App gewechselt)'); });
window.addEventListener('blur', function(){ sperren('Fokus verloren (anderes Fenster oder App)'); });
window.addEventListener('pagehide', function(){ sperren('Seite neu geladen oder geschlossen'); });
function netzPruefen(){
  if (laeuft() && online()) sperren('Internetverbindung während des Tests (Flugmodus aus)');
  if (S.phase === 'start') startPruefen();
}
window.addEventListener('online', netzPruefen);
window.addEventListener('offline', netzPruefen);
function entsperren(){
  var f = $('freiFeld'), m = $('sperreMeldung');
  if (online()){ m.className = 'meldung info'; m.textContent = T.flugEntsperren; return; }
  if (S.lh && hashText(f.value) === S.lh){
    S.gesperrt = false; S.log.push({ t: Date.now(), art: 'entsperrt durch Lehrkraft' });
    speichern(); zeigeSperre(false);
  } else {
    S.log.push({ t: Date.now(), art: 'falscher Freischaltcode' }); speichern();
    f.value = ''; m.className = 'meldung falsch'; m.textContent = '✘ Freischaltcode falsch. Der Versuch wurde vermerkt.';
  }
}

/* ---------- Start ---------- */
function startPruefen(){
  var c = codeNorm($('codeFeld').value), i = initNorm($('initFeld').value), m = $('startMeldung');
  var codeOk = codeGueltig(c), initOk = i.length >= 2 && i.length <= 3, netz = online();
  if (FLUG && linkHash()){
    $('flugHinweis').hidden = false;
    $('flugHinweis').className = netz ? 'meldung info' : 'meldung ok';
    $('flugHinweis').innerHTML = netz ? T.flugAn : T.flugOk;
    ['codeFeld', 'initFeld'].forEach(function(id){ $(id).readOnly = netz; $(id).classList.toggle('zu', netz); });
  }
  $('startKnopf').disabled = !(codeOk && initOk && linkHash() && !netz);
  if (c.length >= 5 && !codeOk){ m.className = 'meldung falsch'; m.textContent = T.codeFalsch; }
  else if (codeOk && !initOk){ m.className = 'meldung info'; m.textContent = T.initFalsch; }
  else if (codeOk && initOk){ m.className = 'meldung ok'; m.textContent = '✔ ' + codeFormat(c) + ' · ' + i; }
  else { m.className = 'meldung'; m.textContent = ''; }
}
function starten(){
  if ($('startKnopf').disabled) return;
  S.code = codeFormat($('codeFeld').value); S.init = initNorm($('initFeld').value);
  S.lh = linkHash(); S.phase = 'laeuft'; S.start = Date.now(); S.gesperrt = false; S.karte = 'a0';
  S.log.push({ t: S.start, art: 'Test gestartet' });
  speichern(); ansicht();
}

}
