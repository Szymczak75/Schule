  return codePruefzeichen(n.slice(0, 4)) === n.charAt(4);

  function k(v){ v = f(v); return /^[\w,.]+$/.test(v) ? v : '(' + v + ')'; }
  return d.map(function(p){
    switch (p.t){
      case 'x': return p.v;
      case 'bruch': return k(p.z) + '/' + k(p.n);
      case 'gem': return f(p.g) + ' ' + k(p.z) + '/' + k(p.n);
      case 'hoch': return '^' + k(p.v);
      case 'tief': return '_' + f(p.v);
      case 'wurzel': return 'Wurzel(' + f(p.v) + ')';
      case 'nwurzel': return f(p.n) + '. Wurzel(' + f(p.v) + ')';
    }
    return '';
