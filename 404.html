re, Experten für Hoch-, Tief- und Wendepunkte, Gruppen-Check): die Spur eines Hochpunkts in GeoGebra beobachten, Ortskurven in vier Schritten berechnen, den Definitionsbereich bestimmen und eine Ortskurve zur Gewinnoptimierung nutzen.","k":"Ortskurve, Funktionenschar, Parameter, Extrempunkte, Wendepunkte, Gruppenpuzzle, Definitionsbereich, GeoGebra, Spur, Optimierung, Q1","y":"Lernseite","kl":"Q1_Q2","f":"mathe"},"mathe/klasseQ1_Q2/funktionsscharen/steckbrief_unterbestimmt_schanze_ue.html":{"t":"Steckbrief unterbestimmt: Schar und Sprungschanze – Übung","d":"Übung zu unterbestimmten Steckbriefaufgaben in drei Niveaustufen: Aus zu wenigen Bedingungen entsteht eine Funktionenschar, ein Parameter wird über eine Zusatzbedingung festgelegt; danach wird eine Sprungschanze mit der Höhe als Parameter modelliert und ihre größte zulässige Höhe bei begrenztem Gefälle bestimmt. Grundlagen und Fortgeschritten mit GTR, Profi (LK) hilfsmittelfrei mit Zusatzaufgabe.","k":"Steckbriefaufgabe, unterbestimmt, Funktionenschar, Parameter, Sprungschanze, maximale Steigung, Wendestelle, Q1","y":"Übung","kl":"Q1_Q2","f":"mathe"},"mathe/klasseQ1_Q2/funktionsscharen/ortskurven_ue.html":{"t":"Funktionenscharen – Ortskurven üben","d":"Übung zu Ortskurven in drei Niveaustufen: Ortskurven von Hoch-, Tief- und Wendepunkten, Definitionsbereich, den besten Parameter über die Ortskurve finden und (LK) die Wurzelfalle; mit Wiederholung zum Gleichungsumformen.","k":"Ortskurve, Funktionenschar, Parameter, Extrempunkte, Wendepunkte, Definitionsbereich, Optimierung, Q1","y":"Übung","kl":"Q1_Q2","f":"mathe"},"mathe/klasseQ1_Q2/funktionsscharen/funktionenscharen_sfs.html":{"t":"Funktionenscharen – Fallunterscheidung (SfS)","d":"Schritt für Schritt im Heft: Lage und Art der Extrempunkte zweier Funktionenscharen in Abhängigkeit vom Parameter untersuchen – mit Fallunterscheidung, Lösung aufdecken und Selbsteinschätzung.","k":"Funktionenschar, Fallunterscheidung, Parameter, Extrempunkte, Sattelpunkt, Schritt fü athe"},"mathe/klasseQ1_Q2/steckbriefaufgaben/steckbrief_gruppen_ls.html":{"t":"Steckbriefaufgaben: Gruppenpuzzle mit Präsentation","d":"Lernseite (Gruppenarbeit mit Präsentation, ca. 90 Minuten): Gruppen übersetzen je eine von sieben Steckbriefaufgaben mit fünf oder sechs Bedingungen aus ganz unterschiedlichen Sachzusammenhängen (u. a. Gewinn, Solaranlage, Pegelstand), legen den Definitionsbereich begründet fest, lösen sie mit dem CAS und stellen ihren Übersetzungsweg anhand einer angeleiteten Präsentation vor.","k":"Steckbriefaufgaben, Bedingungen übersetzen, Krümmung, knickfreier Übergang, Symmetrie, CAS, Gruppenarbeit, Präsentation","y":"Lernseite","kl":"Q1_Q2","f":"mathe"},"mathe/klasseQ1_Q2/steckbriefaufgaben/steckbrief_sachzusammenhang_test.html":{"t":"Wissenstest: Steckbriefaufgaben im Sachzusammenhang","d":"Wissenstest zu Steckbriefaufgaben in Sachzusammenhängen: Modelle mit dem CAS aufstellen, geforderte Extrempunkte überprüfen, Definitionsbereiche begründen und eine Funktionenschar mit Parameter untersuchen. Mit LK-Aufgabe zu ruckfreien Übergängen, Orientierungstimer und Auswertung mit Musterlösungen.","k":"Steckbriefaufgaben, Wissenstest, Modellierung, Überprüfung, Definitionsbereich, Parameter, CAS, GeoGebra","y":"Test","kl":"Q1_Q2","f":"mathe"},"mathe/klasseQ1_Q2/steckbriefaufgaben/steckbrief_sfs.html":{"t":"Steckbriefaufgaben – Schritt für Schritt","d":"Zwei Steckbriefaufgaben werden Schritt für Schritt im Heft gelöst: Bedingungen mit Begründung aufschreiben, Gleichungen aufstellen, LGS lösen, Probe machen. Nach jedem Schritt wird die Lösung aufgedeckt und das eigene Ergebnis eingeschätzt.","k":"Steckbriefaufgaben, Bedingungen, ganzrationale Funktionen, lineare Gleichungssysteme, Wendepunkt, Hochpunkt, Modellierung","y":"Schritt für Schritt","kl":"Q1_Q2","f":"mathe"},"mathe/klasseQ1_Q2/steckbriefaufgaben/steckbrief_ue.html":{"t":"Steckbriefaufgaben – Übung","d":"Übung zu Steckbriefaufgaben auf drei Niveaustufen: Bedingungen übersetzen, Funktionen von Hand und mit dem CAS bestimmen und ungewöhnliche Modelle wie Ferienlaune oder Hausaufgabenlust aufstellen. Mit Wiederholung zu linearen Gleichungssystemen und Auswertung.","k":"Steckbriefaufgaben, ganzrationale Funktionen, Bedingungen, lineare Gleichungssysteme, Modellierung, Symmetrie, CAS","y":"Übung","kl":"Q1_Q2","f":"mathe"},"mathe/klasseQ1_Q2/steckbriefaufgaben/steckbrief_sachzusammenhang_sfs.html":{"t":"Steckbriefaufgabe im Sachzusammenhang – Schritt für Schritt","d":"Schritt für Schritt eine Steckbriefaufgabe im Sachzusammenhang lösen: Aus vier Anforderungen an einen Radweg Bedingungen aufstellen, den Grad selbst festlegen und mit dem GeoGebra-CAS lösen. Danach überlegen, was sich durch eine weitere Bedingung (ruckfrei) ändert. Mit Selbsteinschätzung und Wiederholung.","k":"Steckbriefaufgaben, Sachzusammenhang, Bedingungen, knickfrei, ruckfrei, Grad festlegen, weitere Bedingung, GeoGebra CAS, Schritt für Schritt","y":"Schritt für Schritt","kl":"Q1_Q2","f":"mathe"},"mathe/klasseQ1_Q2/Optimierung/lebensfreude_optimierung_ue.html":{"t":"Lebensfreude optimieren – Übung (Mathe-LK Q1)","d":"Spaßige Übung zu Optimierungsaufgaben mit Parametern (Mathe-LK Q1): Nebenjob-Lebensfreude, Lernen vs. Eltern-Stress, die perfekte Kursfahrt und Finns Verspätungs-Laune. Mit Story, verstellbaren Parametern, Live-Graph und Musterlösung. Das Einsetzen zur Zielfunktion machen die SuS selbst.","k":"Optimierung, Extremwert, Zielfunktion, Parameter, Hauptbedingung, Nebenbedingung, Lebensfreude, Kursfahrt, Q1, Übung","y":"Übung","kl":"Q1_Q2","f":"mathe"},"mathe/klasseQ1_Q2/Optimierung/gewinnmaximierung_ue.html":{"t":"Gewinnmaximierung – Übung (Mathe Q1)","d":"Übung zur Einnahmen- und Gewinnmaximierung in vier Sachzusammenhängen (T-Shirts, Abiball, Smoothie-Stand, Kletterhalle). Grundlagen mit vorgegebener Hauptbedingung, Fortgeschritten mit eigenem Modellieren und Deuten, Profi (LK) mit nicht-linearer Nachfrage, Definitionsbereich und GeoGebra.","k":"Gewinnmaximierung, Einnahmen, Extremwertaufgabe, Zielfunktion, Hauptbedingung, Nebenbedingung, Definitionsbereich, Preissenkung","y":"Übung","kl":"Q1_Q2","f":"mathe"},"mathe/klasseQ1_Q2/Optimierung/optimierung_klausur_q1_lk_kavb.html":{"t":"Klausurvorbereitung Optimierung – Q1 LK","d":"Klausurvorbereitung für den Q1-Leistungskurs: Extremwertprobleme mit Nebenbedingungen (geometrisch 2D und 3D, Gewinnoptimierung) und Funktionsuntersuchungen, auch im Sachzusammenhang. Teil A ist hilfsmittelfrei (ca. 30 % der Bewertungseinheiten), Teil B wird mit GeoGebra bearbeitet; alle Anforderungsbereiche sind ausgewiesen.","k":"Extremwertprobleme, Optimierung, Nebenbedingung, Zielfunktion, Gewinnmaximierung, Funktionsuntersuchung, Kurvendiskussion, Klausurvorbereitung","y":"KA-Vorbereitung","kl":"Q1_Q2","f":"mathe"},"mathe/klasseQ1_Q2/Optimierung/optimierung_extremwertaufgaben_ls.html":{"t":"Optimierungsprobleme – Lernseite (Mathe-LK Q1)","d":"Lernseite zum Vorgehen bei Optimierungsaufgaben im Mathe-LK Q1: von der DIN-A4-Schachtel systematisch über Haupt- und Nebenbedingung zur Zielfunktion und zum Hochpunkt mit GeoGebra – plus Rechteck unter einer Parabel und eine Weide-Sachaufgabe.","k":"Optimierung, Extremwertaufgabe, Hauptbedingung, Nebenbedingung, Zielfunktion, GeoGebra, Hochpunkt, Q1, Leistungskurs","y":"Lernseite","kl":"Q1_Q2","f":"mathe"},"mathe/klasseQ1_Q2/Optimierung/extremwertaufgaben_vorgehen_ls.html":{"t":"Extremwertaufgaben mit Nebenbedingungen","d":"Interaktive Lernseite zum Vorgehen bei Extremwertaufgaben mit Nebenbedingungen: Zuerst werden die sechs Arbeitsschritte in die richtige Reihenfolge gebracht, danach wird das Vorgehen Schritt für Schritt an einem Rechteck an der Parabel f(x)=4-x² angewendet.","k":"Extremwertaufgaben, Nebenbedingung, Hauptbedingung, Zielfunktion, Optimierung, Randwertbetrachtung, Analysis, Grafikrechner","y":"Lernseite","kl":"Q1_Q2","f":"mathe"},"mathe/klasseQ1_Q2/Optimierung/pulliprint_erloes_gewinn_ls.html":{"t":"PulliPrint – Erlös und Gewinn optimieren","d":"Erarbeitung zur Erlösoptimierung der Lernendenfirma PulliPrint: Mengen- und Preisfunktion aufstellen, zur Erlösfunktion verknüpfen, Erlös- und Gewinnoptimum rechnerisch bestimmen und das Modell samt Variablenwahl reflektieren. Allein, zu zweit oder in der Gruppe bearbeitbar.","k":"Extremwertprobleme, Nebenbedingung, Erlösfunktion, Gewinnfunktion, Preisfunktion, Mengenfunktion, Definitionsbereich, Modellierung","y":"Lernseite","kl":"Q1_Q2","f":"mathe"},"mathe/klasseQ1_Q2/Optimierung/extremwert_rechteck_funktion_ue.html":{"t":"Extremwertproblem mit Nebenbedingung – Übung II","d":"Übung II zu Extremwertproblemen mit Nebenbedingung im Mathe-LK Q1: Rechteck mit fester Ecke A(0|2) und beweglicher Ecke P(x|f(x)) auf dem Graphen. Drei Niveaus (linear, quadratisch, ganzrational) mit interaktivem Graph, gestuften Hilfekarten und Musterlösung.","k":"Extremwertproblem, Nebenbedingung, Rechteck, Flächeninhalt, Zielfunktion, Ableitung, Niveaudifferenzierung, Q1, Übung","y":"Übung","kl":"Q1_Q2","f":"mathe"},"mathe/klasseQ1_Q2/Optimierung/extremwertprobleme_nb_ue.html":{"t":"Übung I – Extremwertprobleme mit Nebenbedingungen","d":"Übung I zu Extremwertproblemen mit Nebenbedingungen (Q1 LK) in drei Niveaus: Rechteck unter einem Funktionsgraphen maximieren, mit gestuften Hilfekarten zum Aufklappen.","k":"Extremwertprobleme, Nebenbedingung, Zielfunktion, Rechteck unter Graph, Ableitung, Q1 Leistungskurs","y":"Übung","kl":"Q1_Q2","f":"mathe"},"mathe/klasseQ1_Q2/Optimierung/optimierung extremwertaufgaben ue.html":{"t":"Optimierungsprobleme – Übung (Mathe-LK Q1)","d":"Übungsseite zu Optimierungsaufgaben im Mathe-LK Q1: drei einfachere GK-Aufgaben (Regenrinne, Feld, Schachtel) und zwei anspruchsvolle LK-Aufgaben (Norman-Fenster, kürzester Weg) mit Feedback, plus Wiederholung zu Ableitungsregeln und Nullstellen.","k":"Optimierung, Extremwertaufgabe, Hauptbedingung, Nebenbedingung, Zielfunktion, Ableitung, Nullstellen, Übung, Q1","y":"Übung","kl":"Q1_Q2","f":"mathe"},"mathe/klasseQ1_Q2/Optimierung/gewinnm // Basis der Website: auf GitHub Pages /Schule/, lokal beim Testen der Ordner.
const BASIS = (function(){
  const p = location.pathname;
  const i = p.toLowerCase().indexOf('/schule/');
  return location.origin + (i >= 0 ? p.slice(0, i + 8) : '/');
})();
const url = rel => BASIS + rel.split('/').map(encodeURIComponent).join('/');

// Dino-Bild: dino_404.png im Hauptordner; fehlt es, steht ein großer 🦖 da.
const bild = document.getElementById('dinoBild');
bild.onerror = () => { bild.hidden = true; document.getElementById('dinoErsatz').hidden = false; };
bild.src = BASIS + 'dino_404.png';

document.getElementById('startKnopf').href = BASIS + 'dino_hub.html';
document.getElementById('impressum').href = BASIS + 'impressum.html';

// ── Falsche Adresse zerlegen ────────────────────────────────────────────────
let pfad = location.pathname;
try { pfad = decodeURIComponent(pfad); } catch (e) {}
const ab = pfad.toLowerCase().indexOf('/schule/');
if (ab >= 0) pfad = pfad.slice(ab + 8);
pfad = pfad.replace(/^\/+/, '');
document.getElementById('falsch').textContent = '/' + pfad;

const norm = s => (s || '').toLowerCase()
  .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
  .normalize('NFD').replace(/[̀-ͯ]/g, '');
const FUELL = new Set(['html','htm','index','schule','www','http','https','seite','seiten',
  'ls','ue','sfs','rbka','kavb','lehrer','und','der','die','das','mit','von','fuer','zum','zur','im','in']);
const FAECHER = {mathe:'mathe', mathematik:'mathe', bio:'bio', biologie:'bio', kompass:'kompass'};

// Klasse erkennen: „klasse7", „7_klasse", „kl7", „ef", „q1" …
let klasse = '';
const roh = norm(pfad);
let m = roh.match(/(?:klasse|kl|jg|jahrgang)[\s_\-]*(\d{1,2})\b/) || roh.match(/\b(\d{1,2})[\s_\-]*(?:klasse|kl)\b/);
if (m) klasse = m[1];
else if ((m = roh.match(/\b(ef|q1|q2)\b/))) klasse = m[1].toUpperCase();

let fach = '';
const woerter = [];
norm(pfad).split(/[^a-z0-9]+/).forEach(w => {
  if (!w) return;
  if (FAECHER[w]) { fach = FAECHER[w]; return; }
  if (/^\d+$/.test(w) || /^(klasse|kl|jg|jahrgang|ef|q1|q2)\d*$/.test(w)) return;
  if (w.length < 3 || FUELL.has(w)) return;
  if (!woerter.includes(w)) woerter.push(w);
});

// ── Tippfehlertoleranter Vergleich ──────────────────────────────────────────
function abstand(a, b) {
  if (Math.abs(a.length - b.length) > 3) return 99;
  let vor = Array.from({length: b.length + 1}, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const neu = [i];
    for (let j = 1; j <= b.length; j++)
      neu[j] = Math.min(vor[j] + 1, neu[j - 1] + 1, vor[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    vor = neu;
  }
  return vor[b.length];
}
// Wie gut passt Suchwort w zu Seitenwort t? 0 … 1
function aehnlich(w, t) {
  if (w === t) return 1;
  if (t.length >= 4 && w.length >= 4 && (t.startsWith(w) || w.startsWith(t)))
    return .6 + .35 * Math.min(w.length, t.length) / Math.max(w.length, t.length);
  if (w.length >= 5 && t.includes(w)) return .85;
  if (t.length >= 6 && w.includes(t)) return .8;
  if (w.length < 4 || t.length < 4) return 0;
  const r = 1 - abstand(w, t) / Math.max(w.length, t.length);
  return r >= .75 ? r * .95 : 0;
}

const eintraege = Object.entries(SEITEN).map(([rel, s]) => {
  const teile = norm(rel + ' ' + s.t + ' ' + s.k + ' ' + s.d).split(/[^a-z0-9]+/).filter(w => w.length >= 3);
  return {rel, s, woerter: [...new Set(teile)], titel: new Set(norm(s.t + ' ' + s.k).split(/[^a-z0-9]+/))};
});

// Jedes Suchwort auf das passendste vorhandene Wort korrigieren (für die Startseiten-Suche).
// Nur Wörter aus Titel, Schlagwörtern und Beschreibung – genau die durchsucht die Startseite.
// Schlüssel: normalisiert (ae statt ä), Wert: Originalschreibweise für die Suche.
const wortschatz = new Map();
Object.values(SEITEN).forEach(s => (s.t + ' ' + s.k + ' ' + s.d).toLowerCase()
  .split(/[^a-z0-9äöüß]+/).forEach(o => { if (o.length >= 3) wortschatz.set(norm(o), o); }));
function korrigiere(w) {
  if (wortschatz.has(w)) return w;
  let best = '', bw = 0;
  wortschatz.forEach((_, t) => { const a = aehnlich(w, t); if (a > bw) { bw = a; best = t; } });
  return bw >= .7 ? best : '';
}
const original = w => wortschatz.get(w) || w;

const treffer = eintraege.map(e => {
  let punkte = 0, passend = 0;
  woerter.forEach(w => {
    let best = 0;
    e.woerter.forEach(t => { const a = aehnlich(w, t); if (a > best) best = a; });
    if (best > 0) { passend++; punkte += best * (e.titel.has(korrigiere(w)) ? 1.3 : 1); }
  });
  if (!passend) return {e, punkte: 0};
  if (fach && e.s.f === fach) punkte += .4;
  if (klasse && String(e.s.kl).toUpperCase() === klasse) punkte += .6;
  // Gleicher Dateiname in einem anderen Ordner (Seite umgezogen)?
  const dn = norm(pfad.split('/').pop()), en = norm(e.rel.split('/').pop());
  if (dn && dn === en) punkte += 3;
  return {e, punkte};
}).filter(t => t.punkte >= .7).sort((a, b) => b.punkte - a.punkte).slice(0, 5);

// ── Anzeigen ────────────────────────────────────────────────────────────────
const ICON = {mathe:'📐', bio:'🧬', kompass:'🧭'};
const box = document.getElementById('vorschlaege');
if (treffer.length) {
  treffer.forEach(({e}) => {
    const a = document.createElement('a');
    a.className = 'vorschlag';
    a.href = url(e.rel);
    const info = [e.s.y, e.s.kl ? 'Klasse ' + e.s.kl : ''].filter(Boolean).join(' · ');
    a.innerHTML = '<span class="v-icon"></span><span><span class="v-titel"></span><br><span class="v-info"></span></span>';
    a.querySelector('.v-icon').textContent = ICON[e.s.f] || '📄';
    a.querySelector('.v-titel').textContent = e.s.t;
    a.querySelector('.v-info').textContent = info;
    box.appendChild(a);
  });
} else {
  box.innerHTML = '<p class="leer">Leider kein passender Vorschlag. Die Suche auf der Startseite hilft weiter.</p>';
}

const suchbegriffe = [...new Set(woerter.map(korrigiere).filter(Boolean))].slice(0, 3).map(original);
const params = new URLSearchParams();
if (suchbegriffe.length) params.set('suche', suchbegriffe.join(' '));
document.getElementById('suchKnopf').href = BASIS + 'dino_hub.html' + (suchbegriffe.length ? '?' + params : '?suche=');
</script>
