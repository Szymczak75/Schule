      var b = document.createElement('button');
      b.type = 'button'; b.className = 'ft-taste'; b.innerHTML = d.html;
      b.title = d.titel; b.setAttribute('aria-label', d.titel);
      /* Fokus im Kästchen lassen (iPad-Tastatur bleibt offen) */
      b.addEventListener('pointerdown', function(e){ e.preventDefault(); });
      b.addEventListener('mousedown', function(e){ e.preventDefault(); });
      b.addEventListener('click', function(){
        if (fd.zu) return;
        if (k === 'loeschen') fd.loesche();
        else if (d.zeichen) fd.tippe(d.zeichen);
        else fd.fuegeEin(k);
      });
      fd.leiste.appendChild(b);
    });
    this.box.appendChild(this.leiste);
  }
  this.zeile = document.createElement('div');
  this.zeile.className = 'ft-zeile';
  this.zeile.setAttribute('role', 'group');
  this.zeile.setAttribute('aria-label', opt.label || 'Eingabe');
  this.box.appendChild(this.zeile);
  el.appendChild(this.box);

  this.zeile.addEventListener('input', function(e){
    var inp = e.target; if (!inp.__ft) return;
    fd.teile[inp.__ft.i][inp.__ft.s] = inp.value;
    ftBreite(inp); fd.melde();
  });
  this.zeile.addEventListener('focusin', function(e){
    if (e.target.__ft) { fd.fokus = e.target; fd.zeile.classList.add('ft-fokus'); }
  });
  this.zeile.addEventListener('focusout', function(){ fd.zeile.classList.remove('ft-fokus'); });
  this.zeile.addEventListener('keydown', function(e){ fd.taste(e); });
  this.zeile.addEventListener('click', function(e){
    if (e.target === fd.zeile && !fd.zu) { var a = fd.eingaben(); var l = a[a.length - 1]; if (l) ftSetze(l, l.value.length); }
  });

}
function ftBreite(inp){
  var n = Math.max(inp.value.length, inp.classList.contains('ft-s') ? 1 : 0);
  inp.style.width = (n + 1) + 'ch';
  if (inp.classList.contains('ft-s')) inp.classList.toggle('ft-voll', inp.value.trim() !== '');
}
function ftSetze(inp, pos){
  try { inp.focus(); inp.setSelectionRange(pos, pos); } catch (e) { try { inp.focus(); } catch (x) {} }
}
ftFeld.prototype.eingaben = function(){ return Array.prototype.slice.call(this.zeile.querySelectorAll('input')); };
ftFeld.prototype.zeichne = function(ziel){
  var fd = this, z = this.zeile, tm = this.opt.tastatur === 'zahl' ? 'decimal' : 'text';
  z.innerHTML = ''; this.fokus = null;
  function inp(i, s, cls, name){
    var e = document.createElement('input');
    e.type = 'text'; e.className = cls; e.value = fd.teile[i][s];
    e.setAttribute('inputmode', tm); e.setAttribute('autocomplete', 'off');
    e.setAttribute('autocapitalize', 'off'); e.setAttribute('autocorrect', 'off'); e.setAttribute('spellcheck', 'false');
    e.setAttribute('aria-label', name);
    e.__ft = { i:i, s:s };
    if (fd.zu) { e.readOnly = true; e.classList.add('zu'); }
    ftBreite(e);
    return e;
  }
  function span(cls){ var s = document.createElement('span'); s.className = cls; return s; }
  this.teile.forEach(function(p, i){
    var w;
    switch (p.t) {
      case 'x':
        z.appendChild(inp(i, 'v', 'ft-x', fd.opt.label || 'Eingabe')); break;
      case 'bruch':
        w = span('ft-bruch');
        var o = span('ft-oben'); o.appendChild(inp(i, 'z', 'ft-s', 'Zähler'));
        var u = span('ft-unten'); u.appendChild(inp(i, 'n', 'ft-s', 'Nenner'));
        w.appendChild(o); w.appendChild(u); z.appendChild(w); break;
      case 'gem':
        w = span('ft-gem'); w.appendChild(inp(i, 'g', 'ft-s', 'Ganze'));
        var b = span('ft-bruch');
        var o2 = span('ft-oben'); o2.appendChild(inp(i, 'z', 'ft-s', 'Zähler'));
        var u2 = span('ft-unten'); u2.appendChild(inp(i, 'n', 'ft-s', 'Nenner'));
        b.appendChild(o2); b.appendChild(u2); w.appendChild(b); z.appendChild(w); break;
      case 'hoch':
        w = span('ft-hoch'); w.appendChild(inp(i, 'v', 'ft-s', 'Hochzahl')); z.appendChild(w); break;
      case 'tief':
        w = span('ft-tief'); w.appendChild(inp(i, 'v', 'ft-s', 'Index')); z.appendChild(w); break;
      case 'wurzel':
        w = span('ft-wurzel'); var wz = span('ft-wz'); wz.textContent = '√'; w.appendChild(wz);
        var r = span('ft-rad'); r.appendChild(inp(i, 'v', 'ft-s', 'unter der Wurzel')); w.appendChild(r);
        z.appendChild(w); break;
      case 'nwurzel':
        var nw = span('ft-nw'); nw.appendChild(inp(i, 'n', 'ft-s', 'Wurzelexponent')); z.appendChild(nw);
        w = span('ft-wurzel'); var wz2 = span('ft-wz'); wz2.textContent = '√'; w.appendChild(wz2);
        var r2 = span('ft-rad'); r2.appendChild(inp(i, 'v', 'ft-s', 'unter der Wurzel')); w.appendChild(r2);
        z.appendChild(w); break;
    }
  });
  this.zeile.classList.toggle('ft-zu', this.zu);
  if (this.leiste) Array.prototype.forEach.call(this.leiste.children, function(b){ b.disabled = fd.zu; });
  if (ziel) {
    var ziel_el = this.eingaben().filter(function(e){ return e.__ft.i === ziel.i && e.__ft.s === ziel.s; })[0];
    if (ziel_el) ftSetze(ziel_el, ziel.pos == null ? ziel_el.value.length : ziel.pos);
  }
};
ftFeld.prototype.melde = function(){ if (typeof this.opt.aendern === 'function') this.opt.aendern(this); };
/* Wo steht die Schreibmarke? → { i, s, pos } */
ftFeld.prototype.marke = function(){
  var f = this.fokus;
  if (!f || !f.__ft) { var l = this.teile.length - 1; return { i:l, s:SLOTS[this.teile[l].t][0], pos:String(this.teile[l][SLOTS[this.teile[l].t][0]]).length }; }
  var pos = f.value.length;
  try { if (typeof f.selectionStart === 'number') pos = f.selectionStart; } catch (e) {}
  return { i:f.__ft.i, s:f.__ft.s, pos:pos };
};
ftFeld.prototype.fuegeEin = function(typ){
  if (this.art !== 'frei' || !SLOTS[typ] || typ === 'x') return;
  var m = this.marke(), t = this.teile, neu = ftLeeresTeil(typ), stelle;
  if (t[m.i].t === 'x') {
    var v = t[m.i].v;
    t.splice(m.i, 1, { t:'x', v:v.slice(0, m.pos) }, neu, { t:'x', v:v.slice(m.pos) });
    stelle = m.i + 1;
  } else {
    t.splice(m.i + 1, 0, { t:'x', v:'' }, neu);
    stelle = m.i + 2;
  }
  this.teile = ftOrdne(t);
  stelle = this.teile.indexOf(neu);
  this.zeichne({ i:stelle, s:SLOTS[typ][0], pos:0 });
  this.melde();
};
ftFeld.prototype.tippe = function(zeichen){
  var m = this.marke(), p = this.teile[m.i], alt = String(p[m.s]);
  p[m.s] = alt.slice(0, m.pos) + zeichen + alt.slice(m.pos);
  this.zeichne({ i:m.i, s:m.s, pos:m.pos + zeichen.length });
  this.melde();
};
/* Baustein an der Schreibmarke (oder direkt davor) entfernen; Text links und rechts bleibt */
ftFeld.prototype.loesche = function(){
  if (this.art !== 'frei') return;
  var m = this.marke(), t = this.teile, i = m.i;
  if (t[i].t === 'x') { if (m.pos > 0 || i === 0) return; i = i - 1; }
  var links = t[i - 1], rechts = t[i + 1], pos = links ? links.v.length : 0;
  t.splice(i, 1);
  this.teile = ftOrdne(t);
  this.zeichne({ i:Math.max(0, i - 1), s:'v', pos:pos });
  this.melde();
};
ftFeld.prototype.taste = function(e){
  var inp = e.target; if (!inp.__ft || this.zu) return;
  var a = this.eingaben(), k = a.indexOf(inp), pos = inp.selectionStart, bis = inp.selectionEnd;
  var p = this.teile[inp.__ft.i];
  if (e.key === 'ArrowLeft' && pos === 0 && bis === 0 && k > 0) { e.preventDefault(); ftSetze(a[k - 1], a[k - 1].value.length); }
  else if (e.key === 'ArrowRight' && pos === inp.value.length && k < a.length - 1) { e.preventDefault(); ftSetze(a[k + 1], 0); }
  else if (e.key === 'Backspace' && pos === 0 && bis === 0 && this.art === 'frei') {
    var leer = function(q){ return SLOTS[q.t].every(function(s){ return !String(q[s]).trim(); }); };
    if (p.t !== 'x' && leer(p)) { e.preventDefault(); this.loesche(); }
    else if (p.t === 'x' && inp.__ft.i > 0) {
      e.preventDefault();
      if (leer(this.teile[inp.__ft.i - 1])) this.loesche();
      else ftSetze(a[k - 1], a[k - 1].value.length);
    }
    else if (k > 0) { e.preventDefault(); ftSetze(a[k - 1], a[k - 1].value.length); }
  }

};
ftFeld.prototype.zustand = function(){ return ftKopie(this.teile); };
ftFeld.prototype.setze = function(daten){
  if (!ftGueltig(daten)) return;
  var t = ftKopie(daten);
  if (this.art === 'frei') t = ftOrdne(t);
  else if (t.length !== 1 || t[0].t !== this.art) return;
  this.teile = t; this.zeichne();
};
ftFeld.prototype.leeren = function(){ this.teile = this.art === 'frei' ? [{ t:'x', v:'' }] : [ftLeeresTeil(this.art)]; this.zeichne(); this.melde(); };
ftFeld.prototype.sperre = function(an){ this.zu = !!an; this.zeichne(); };
ftFeld.prototype.leer = function(){ return this.teile.every(function(p){ return SLOTS[p.t].every(function(s){ return !String(p[s]).trim(); }); }); };
ftFeld.prototype.zahl = function(){ return ftZahl(this.teile); };
ftFeld.prototype.linear = function(){ return ftLinear(this.teile); };
ftFeld.prototype.tex = function(){ return ftTex(this.teile); };
ftFeld.prototype.hat = function(typ){ return this.teile.some(function(p){ return p.t === typ; }); };

return {
  version: VERSION,
  feld: function(el, opt){ return new ftFeld(el, opt); },
  zahl: ftZahl, linear: ftLinear, tex: ftTex, leseZahl: ftLeseZahl,
  rechne: ftRechne, gleichwertig: ftGleichwertig, variablen: ftVariablen, gueltig: ftGueltig
};
})();
