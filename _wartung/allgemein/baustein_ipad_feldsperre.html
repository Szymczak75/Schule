<!-- =============================================================================
     BAUSTEIN: iPad-Feldsperre  (v1, 18.11.2026)
     Einfügen: UNVERÄNDERT als letztes Element in den <head> jeder Seite, deren Skript
     Texteingaben per  feld.disabled = …  sperrt.
     Hintergrund: Safari (iPad) zeichnet gesperrte (disabled) Eingabefelder nach dem
     Wieder-Einblenden einer Karte fast durchsichtig – die Zahlen scheinen weg.
     Der Baustein lenkt  .disabled  bei Texteingaben (text, number, search, tel, email,
     url) auf  readOnly  + Klasse  .zu  um. Das Feld bleibt unveränderbar, wird aber
     normal gezeichnet. Lesen von  .disabled  liefert weiter den Sperrzustand.
     Nicht betroffen: Buttons, Checkboxen, Radios, Selects.
     Neue Seiten sperren Felder direkt per readOnly + .zu; dann ist der Baustein unnötig.
     ========================================================================== -->
<script>
(function(){
  try{
    var P=HTMLInputElement.prototype, d=Object.getOwnPropertyDescriptor(P,'disabled');
    if(!d||!d.set||P.__dinoSperre) return;
    var TXT={text:1,number:1,search:1,tel:1,email:1,url:1};
    Object.defineProperty(P,'disabled',{configurable:true,enumerable:d.enumerable,
      get:function(){ return TXT[this.type] ? (d.get.call(this)||this.classList.contains('zu')) : d.get.call(this); },
      set:function(v){
        if(!TXT[this.type]){ d.set.call(this,v); return; }
        d.set.call(this,false);
        if(v){ if(!this.readOnly){ this.readOnly=true; this.__zuRO=true; } this.classList.add('zu'); }
        else { if(this.__zuRO){ this.readOnly=false; this.__zuRO=false; } this.classList.remove('zu'); }
      }});
    P.__dinoSperre=true;
  }catch(e){}
})();
</script>
<style>input.zu{cursor:default}</style>
<!-- ===== ENDE BAUSTEIN iPad-Feldsperre ===== -->
