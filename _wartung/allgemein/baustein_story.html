<!-- =====================================================================
     BAUSTEIN: Story (_story)  v8, 27.11.2026
     Escape Room, Adventskalender, Detektivgeschichte oder freie Story: eine Geschichte
     in mehreren Karten, jede Karte endet mit einem Rätsel.
     Richtig → weiter zur nächsten Karte (mit Codewort zum späteren Wiedereinstieg).
     Falsch  → das Rätsel verschwindet, ein Umweg-Rätsel führt zurück in die Geschichte.
               Nach zwei Umwegen zeigt die Seite den Lösungsweg – niemand bleibt hängen.
     Gepflegt im Wartungs-Projekt. Anleitung (anweisung_lernseiten.txt, TEIL 2.11):
     1. Datei kopieren, Name: thema_story.html (Suffix _story).
     2. Meta-Tags ausfüllen: typ="Story", klasse, fach, oberthema, thema, description,
        keywords, kernkompetenzen (alle kk-Kürzel aus dem Datenblock).
     3. <body data-anrede="du"> (Sek I) bzw. "sie" (Oberstufe).
     4. NUR den Block  ANPASSEN: Daten der Story  ersetzen – eine Karte = ein Eintrag in
        karten[] mit Geschichte, Rätsel, genau zwei Umwegen und einem Codewort.
     5. BAUSTEIN-CSS, Formeltool, Schreibhilfen, Story-Engine, MathJax-Notfall und
        Navigationsleiste UNVERÄNDERT lassen. Bei geändertem Aufbau einer veröffentlichten
        Seite data-version am <body> erhöhen.
     6. Alle soll-Werte nachrechnen (Python fractions / Termprobe), pruefe.py laufen lassen,
        mit dem Freischaltcode (Codewort-Feld der Startkarte) jede Karte einmal richtig und
        einmal falsch durchspielen.
     v2: zweiter Code STORY.testcode für Testgruppen von SuS (Datumssperre aus, Reihenfolge
        bleibt); der Lehrercode STORY.vorschau öffnet jetzt wirklich alle Karten.
     v3: Rätselgeräte als neue Antwortarten – 'uhr' (Bruch-Uhr: langer Zeiger Zähler, kurzer
        Zeiger Nenner), 'schloss' (Zahlenschloss mit Rädern: Bruch, gemischte Zahl oder Zahl),
        'steck' (Diamanten an den Zahlenstrahl stecken), 'felder' (Teile einer Figur einfärben),
        'schalter' (Kippschalter: alle passenden umlegen). Dazu STORY.erwischt / karte.erwischt
        (Erzähltext vor dem Lösungsweg) und STORY.wegTitel (Überschrift des Lösungswegs).
        Abwärtskompatibel: v2-Datenblöcke laufen unverändert.
     v4 (Fantasie-Paket): Edelsteine, die beim Antippen aufleuchten (Felder-Form 'steine', Diamanten,
        Hebel-Knauf, Zeigerspitzen, Schlossbügel); gelöste Geräte leuchten grün. Bruch-Uhr mit
        Stunden (1–12, kurzer Zeiger) und Minuten (1–60, langer Zeiger) – das Kind legt selbst fest,
        welcher Zeiger Zähler und welcher Nenner ist. Gezeichnete Hebel statt Kippschalter.
        Diamanten und Hebel: nach dem ersten falschen Prüfen einmal korrigieren (Diamanten:
        richtige leuchten grün und bleiben stecken; Hebel: nur die Anzahl richtiger wird genannt).
     v5 (Spielzeug-Paket): acht weitere Rätselgeräte – 'wuerfel' (Würfel drehen), 'karten'
        (verdeckter Kartenfächer), 'abakus' (Perlen auf Stellenwert-Stangen), 'thermo' (Skala /
        Thermometer, auch negativ und mit Dezimalschritten), 'zeit' (echte Uhr mit ☀️/🌙),
        'gitter' (Schatzkarte: Gitterpunkt setzen, optional mit Graphen), 'kompass'
        (Himmelsrichtung oder Winkel einstellen), 'regler' (Sternbild: Gerade/Parabel per
        Schieberegler durch Sterne legen). Abwärtskompatibel.
     v6 (Fantasy-Stil): alle Rätselgeräte aus Messing, Holz, Pergament und geschliffenen Edelsteinen.
     v7 (Wegwahl): 'kurs' für Rätsel mit genau einer richtigen Antwort – Fahrzeug mit nummerierten
        Kurslinien und Steuerrad (optional steigt die Gruppe ein), Personen der Gruppe oder Wesen, die
        verschiedene Wege vorschlagen. Abwärtskompatibel.
     v8 (Symbolwand): 'wand' zum Sortieren – jedes Zeichen (Graph, Term, Situation …) trägt eine Rune,
        die Rune kommt in die passende Nische einer Steinwand (Tafel antippen, dann Nische).
        Graphen zeichnet die Engine selbst (zeichen.graph). Korrekturrunde wie bei den Diamanten.
        Abwärtskompatibel.
     ===================================================================== -->

}
function ftBetrag(s){

    return { w: ftKurz(+r[1] * +r[3] + +r[2], +r[3]), gek: ftGgt(+r[2], +r[3]) === 1, dez: false };

/* Eingabe aus dem Formeltool als Zahl: Text allein, oder [Vorzeichen] Bruch / gemischte Zahl */

  var t = daten.filter(function(p){ return !(p.t === 'x' && !String(p.v).trim()); });
  if (t.length === 1 && t[0].t === 'x') return ftLeseZahl(t[0].v);

  if (t.length === 2 && t[0].t === 'x') {

    w = ftKurz(vz * z.w[0] * n.w[1], z.w[1] * n.w[0]);
    var ganz = z.w[1] === 1 && n.w[1] === 1;
    return { w: w, gek: ganz && ftGgt(z.w[0], n.w[0]) === 1 && n.w[0] > 0, dez: false, vz: mitVz || z.vz || n.vz };

/* ---------- Rechentext und Darstellung ---------- */
function ftLinear(daten){

      case 'gem':     return '((' + p.g + ')+(' + p.z + ')/(' + p.n + '))';
      case 'hoch':    return '^(' + p.v + ')';
      case 'tief':    return '_' + String(p.v).replace(/\s+/g, '');

    var s = '';

      case 'bruch':   s = '\\frac{' + ftFeldTex(p.z) + '}{' + ftFeldTex(p.n) + '}'; break;
      case 'gem':     s = ftFeldTex(p.g) + '\\frac{' + ftFeldTex(p.z) + '}{' + ftFeldTex(p.n) + '}'; break;
      case 'hoch':    s = '^{' + ftFeldTex(p.v) + '}'; break;
      case 'tief':    s = '_{' + ftFeldTex(p.v) + '}'; break;
      case 'wurzel':  s = '\\sqrt{' + ftFeldTex(p.v) + '}'; break;
      case 'nwurzel': s = '\\sqrt[' + ftFeldTex(p.n) + ']{' + ftFeldTex(p.v) + '}'; break;

    /* Hochzahl direkt hinter einem Bruch/einer Wurzel: Klammer zeigen, wie gerechnet wird */
    var nach = daten[i + 1];
    if (p.t !== 'x' && p.t !== 'hoch' && p.t !== 'tief' && nach && nach.t === 'x' && !String(nach.v).trim()) nach = daten[i + 2];
    if ((p.t === 'bruch' || p.t === 'gem') && nach && nach.t === 'hoch') s = '\\left(' + s + '\\right)';

    out.push(s);
  });

}

/* ---------- Rechnen: Tokenizer und Parser ---------- */

      feld.appendChild(zeile); bars[p] = inp; werte[p] = wt;
    });
    var anz = neu('p', 'anzeige', '');
    el.appendChild(huelle); el.appendChild(feld); el.appendChild(anz);
    function kopieRegler(){ var o = {}; par.forEach(function(p){ o[p] = stufe[p]; }); return o; }
    function zahlRegler(v){ return String(v).replace('.', ',').replace('-', '−'); }
    function zeichneRegler(){
      var d = '';
      for (var k = 0; k <= 240; k++) {
        var xx = X0 + (X1 - X0) * k / 240, yy = fxRegler(xx);
        if (yy < Y0 - 0.5 || yy > Y1 + 0.5) { d += ' '; continue; }
        d += (d === '' || d.slice(-1) === ' ' ? 'M' : 'L') + sxRegler(xx).toFixed(1) + ',' + syRegler(yy).toFixed(1);
      }
      kurve.setAttribute('d', d.replace(/ +/g, ' ').trim());
      while (schicht.firstChild) schicht.removeChild(schicht.firstChild);
      var treffer = 0;
      r.sterne.forEach(function(s){
        var hit = Math.abs(fxRegler(s[0]) - s[1]) < 1e-9; if (hit) treffer++;
        schicht.appendChild(svgEl('polygon', { points:sternRegler(sxRegler(s[0]), syRegler(s[1]), 11, 5), fill:hit ? '#7ee08a' : '#ffffff',
          filter:svg.leucht, stroke:hit ? '#1e7d32' : '#ffd34d', 'stroke-width':1.5 }));
      });
      par.forEach(function(p){ werte[p].textContent = zahlRegler(wertVonRegler(p)); });
      var w = {}; (r.typ === 'gerade' ? ['m', 'b'] : ['a', 'd', 'e']).forEach(function(p){ w[p] = wertVonRegler(p); });
      var faktor = w.a === 1 ? '' : w.a === -1 ? '−' : zahlRegler(w.a);
      var term = r.typ === 'gerade' ? 'y = ' + zahlRegler(w.m) + 'x ' + (w.b < 0 ? '− ' + zahlRegler(-w.b) : '+ ' + zahlRegler(w.b))
        : 'y = ' + faktor + '(x ' + (w.d < 0 ? '+ ' + zahlRegler(-w.d) : '− ' + zahlRegler(w.d)) + ')² ' + (w.e < 0 ? '− ' + zahlRegler(-w.e) : '+ ' + zahlRegler(w.e));
      anz.innerHTML = term + ' · getroffene Sterne: <b>' + treffer + ' von ' + r.sterne.length + '</b>';
    }
    function sternRegler(cx, cy, ro, n){ var p = []; for (var i = 0; i < 2 * n; i++) { var rr = i % 2 ? ro * 0.45 : ro, a = i * Math.PI / n - Math.PI / 2;
      p.push((cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1)); } return p.join(' '); }
    zeichneRegler();
    return { el:el,
      hol: function(){ return par.some(function(p){ return stufe[p] != null; }) ? { regler: kopieRegler() } : null; },
      leere: function(){ par.forEach(function(p){ stufe[p] = null; bars[p].value = Math.round((0 - rg[p][0]) / rg[p][2]); }); zeichneRegler(); } };
  },

  /* ===== v8: Symbolwand (sortieren) =====================================================
     Jedes Zeichen (Graph, Term, Situation, Tabelle …) trägt eine Rune. Die Rune wird in die
     passende Nische einer Steinwand gesetzt: Steintafel antippen, dann die Nische antippen.
     Eine Rune an der Wand antippen wählt sie zum Umsetzen (dann neue Nische antippen).
     nischen: ['proportional', 'anti&shy;proportional', 'weder noch']     (2 bis 4 Nischen; &shy; = Trennstelle
                                                                           für schmale Bildschirme)
     zeichen: [{ rune:'sonne', t:'$y = 3x$', n:0 },                       (3 bis 12 Zeichen)
               { rune:'mond', graph:{ f:function(x){ return 12 / x; }, von:1, bis:12, xmax:12, ymax:12 }, n:1 },
               { rune:'blatt', t:'Ein Taxi kostet 4 € Grundgebühr und 2 € je km.', n:2 }, …]
       n = Index der richtigen Nische; rune aus WAND_RUNEN (fehlt sie, wird nach Reihenfolge vergeben);
       graph (optional): Mini-Koordinatensystem 0…xmax / 0…ymax, Kurve f von 'von' bis 'bis',
       punkte: true zeichnet nur einzelne Punkte (x = von, von+1, …); t steht dann darunter.
     Antwort: { wand:[Nische|null je Zeichen] }. Wie bei den Diamanten: nach dem ersten falschen
     Prüfen leuchten richtig gesetzte Runen grün und sind fest, die anderen dürfen einmal umziehen. */
  wand: function(r, alt, merke, aktiv, z, s){
    if (!z.mix[s]) { z.mix[s] = mische(r.zeichen.length); sichern(); }
    var nz = r.zeichen.length, nn = r.nischen.length;
    var pos = alt && alt.wand ? alt.wand.slice() : r.zeichen.map(function(){ return null; });
    var fest = r.zeichen.map(function(){ return false; }), sel = null, neuR = null;
    var rune = r.zeichen.map(function(o, i){ return o.rune || WAND_RUNEN[i % WAND_RUNEN.length]; });
    var el = neu('div', 'geraet'), wand = neu('div', 'wand'), nk = [], plaetze = [];
    wand.style.gridTemplateColumns = 'repeat(' + nn + ',minmax(0,1fr))';
    r.nischen.forEach(function(name, k){
      var ni = neu('div', 'nische', '');
      ni.setAttribute('role', 'button'); ni.tabIndex = aktiv ? 0 : -1;
      ni.setAttribute('aria-label', 'Nische ' + (k + 1) + ': ' + name.replace(/<[^>]*>|&shy;/g, ''));
      ni.appendChild(neu('span', 'nische-name', name));
      var platz = neu('div', 'nische-platz', '');
      ni.appendChild(platz); wand.appendChild(ni); nk.push(ni); plaetze.push(platz);
      if (aktiv) {
        ni.addEventListener('click', function(){ setze(k); });
        ni.addEventListener('keydown', function(ev){ if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); setze(k); } });
      }
    });
    var tafeln = neu('div', 'wand-tafeln'), kn = [];
    z.mix[s].forEach(function(o){
      var b = neu('button', 'wand-tafel', ''); b.type = 'button'; b.disabled = !aktiv;
      b.setAttribute('data-nische', r.zeichen[o].n);
      var kopf = neu('span', 'wand-rune', ''); kopf.appendChild(runenStein(rune[o], 'aus'));
      b.appendChild(kopf);
      var inhalt = neu('span', 'wand-inhalt', '');
      if (r.zeichen[o].graph) inhalt.appendChild(wandGraph(r.zeichen[o].graph));
      if (r.zeichen[o].t) inhalt.appendChild(neu('span', 'wand-text', r.zeichen[o].t));
      b.appendChild(inhalt);
      b.appendChild(neu('span', 'wand-ort', ''));
      b.addEventListener('click', function(){ if (fest[o]) return; sel = sel === o ? null : o; zeichneWand(); });
      tafeln.appendChild(b); kn[o] = b;
    });
    var anz = neu('p', 'anzeige', '');
    el.appendChild(wand); el.appendChild(anz); el.appendChild(tafeln);
    function setze(k){
      if (sel == null) return;
      pos[sel] = k; neuR = sel; sel = null;
      zeichneWand(); merke({ wand: pos.slice() });
    }
    function zeichneWand(){
      plaetze.forEach(function(p){ p.innerHTML = ''; });
      for (var o = 0; o < nz; o++) (function(o){
        if (pos[o] == null) return;
        var b = neu('button', 'wand-stein', ''); b.type = 'button'; b.disabled = !aktiv;   /* feste Runen nicht sperren: Tippen setzt die gewählte Tafel in diese Nische */
        if (fest[o]) b.setAttribute('aria-disabled', 'true');
        b.setAttribute('aria-label', 'Rune ' + RUNEN_NAME[rune[o]] + (fest[o] ? ' – sitzt richtig' : ' – antippen zum Abheben'));
        var svg = runenStein(rune[o], fest[o] ? 'ok' : sel === o ? 'an' : 'aus');
        if (o === neuR) svg.classList.add('funkeln');
        b.appendChild(svg);
        b.addEventListener('click', function(ev){
          ev.stopPropagation();
          if (sel != null && sel !== o) { setze(pos[o]); return; }   /* Tafel gewählt: in diese Nische setzen */
          if (fest[o]) return; sel = sel === o ? null : o; zeichneWand(); });
        plaetze[pos[o]].appendChild(b);
      })(o);
      neuR = null;
      nk.forEach(function(ni){ ni.classList.toggle('bereit', sel != null); });
      kn.forEach(function(b, o){
        b.classList.toggle('an', sel === o); b.classList.toggle('gesetzt', pos[o] != null); b.classList.toggle('fest', fest[o]);
        var kopf = b.querySelector('.wand-rune'); kopf.innerHTML = '';
        kopf.appendChild(runenStein(rune[o], fest[o] ? 'ok' : sel === o ? 'an' : pos[o] != null ? 'matt' : 'aus'));
        b.querySelector('.wand-ort').innerHTML = pos[o] == null ? '' : '▸ ' + r.nischen[pos[o]];
        b.setAttribute('aria-label', 'Tafel mit Rune ' + RUNEN_NAME[rune[o]] + (pos[o] == null ? '' : ', steckt in Nische ' + (pos[o] + 1)));
        if (fest[o]) b.disabled = true;
      });
      var n = pos.filter(function(x){ return x != null; }).length;
      anz.textContent = sel != null
        ? T('Rune ' + RUNEN_NAME[rune[sel]] + ' ist ausgewählt – tippe die passende Nische an.',
            'Rune ' + RUNEN_NAME[rune[sel]] + ' ist ausgewählt – tippen Sie die passende Nische an.')
        : n === 0 ? T('Tippe eine Tafel an und dann die Nische, in die ihre Rune gehört.',
                      'Tippen Sie eine Tafel an und dann die Nische, in die ihre Rune gehört.')
        : 'An der Wand: ' + n + ' von ' + nz + ' Runen.';
    }
    zeichneWand();

    return { el:el,
      hol: function(){ return { wand: pos.slice() }; },
      leere: function(){ pos = pos.map(function(x, o){ return fest[o] ? x : null; }); sel = null; zeichneWand(); },
      korrektur: function(a){
        fest = r.zeichen.map(function(o, i){ return a.wand[i] === o.n; });
        var n = fest.filter(Boolean).length; zeichneWand();
        return '✨ ' + n + ' von ' + nz + T(' Runen leuchten grün – sie sitzen richtig. Die anderen darfst du jetzt einmal umsetzen. Dann prüfe noch einmal.',
                                            ' Runen leuchten grün – sie sitzen richtig. Die anderen dürfen Sie jetzt einmal umsetzen. Dann prüfen Sie noch einmal.');
      } };
  }
};

/* =============================================================================
   BAUSTEIN: MathJax-Notfall-Anzeige  (MATHJAX-FALLBACK)
   Gepflegt im Wartungs-Projekt. Unverändert ans ENDE des Seiten-Skripts kopieren
   (in die Seite hinein – nie per <script src> verlinken, TEIL 8.1).
   Voraussetzung auf der Seite: das .frac-CSS mit Kind-Selektoren (TEIL 7.2):
     .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;
           margin:0 .2em;line-height:1.15;}
     .frac > span{display:block;padding:0 .35em;}
     .frac > span:first-child{border-bottom:1.8px solid currentColor;padding-bottom:.1em;}
     .frac > span:last-child{padding-top:.1em;}
   ========================================================================== */
/* =============================================================================
   Notfall-Anzeige für Formeln (MATHJAX-FALLBACK)
   Lädt MathJax nicht (Schul-WLAN, Vorschau, Offline-Kopie), blieben sonst
   \( ... \) als Rohtext mit Backslashes stehen. Dann werden die TeX-Ausdrücke
   hier in lesbares HTML gewandelt: √ mit Klammer, Brüche als .frac-Konstrukt
   (kein Schrägstrich!), Hoch-/Tiefstellungen als sup/sub, Sonderzeichen direkt.
   Ist MathJax da, passiert nichts.
   ========================================================================== */
(function(){
  var AUF = '\u0001', ZU = '\u0002';   /* Platzhalter fuer { } aus \left\{ */

  function leseGruppe(t, i){
    if (t.charAt(i) !== '{') return null;
    var tiefe = 0;
    for (var j = i; j < t.length; j++){
      if (t.charAt(j) === '{') tiefe++;
      else if (t.charAt(j) === '}'){ tiefe--; if (tiefe === 0) return [t.slice(i+1, j), j+1]; }
    }
    return null;
  }

  function strukturen(t){
    var aus = '', i = 0;
    while (i < t.length){
      var m = /^\\(dfrac|tfrac|frac|sqrt)/.exec(t.slice(i));
      if (m){
        var a = leseGruppe(t, i + m[0].length);
        if (a){
          if (m[1] === 'sqrt'){
            var inn = strukturen(a[0]);
            aus += /^[0-9A-Za-z]+$/.test(a[0]) ? '√' + inn : '√(' + inn + ')';
            i = a[1]; continue;
          }
          var b = leseGruppe(t, a[1]);
          if (b){
            aus += '<span class="frac"><span>' + strukturen(a[0]) + '</span><span>'
                 + strukturen(b[0]) + '</span></span>';
            i = b[1]; continue;
          }
        }
      }
      aus += t.charAt(i); i++;
    }
    return aus;
  }

  function texHtml(t){
    t = t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    t = t.replace(/\\rightarrow/g, '→').replace(/\\leftarrow/g, '←')
         .replace(/\\Rightarrow/g, '⇒').replace(/\\Leftarrow/g, '⇐')
         .replace(/\\left\\\{/g, AUF).replace(/\\right\\\}/g, ZU)
         .replace(/\\left(?![a-zA-Z])/g, '').replace(/\\right(?![a-zA-Z])/g, '')
         .replace(/\\\{/g, AUF).replace(/\\\}/g, ZU);
    t = t.replace(/\\cdot/g, '·').replace(/\\times/g, '·')
         .replace(/\\approx/g, '≈').replace(/\\neq/g, '≠')
         .replace(/\\leq/g, '≤').replace(/\\le\b/g, '≤')
         .replace(/\\geq/g, '≥').replace(/\\ge\b/g, '≥')
         .replace(/\\pm/g, '±').replace(/\\mp/g, '∓')
         .replace(/\\ldots/g, '…').replace(/\\dots/g, '…')
         .replace(/\\to\b/g, '→')
         .replace(/\\infty/g, '∞')
         .replace(/\\pi/g, 'π').replace(/\\alpha/g, 'α')
         .replace(/\\beta/g, 'β').replace(/\\gamma/g, 'γ')
         .replace(/\\Delta/g, 'Δ').replace(/\\delta/g, 'δ')
         .replace(/\\min/g, 'min').replace(/\\max/g, 'max')
         .replace(/\\text\{([^{}]*)\}/g, '$1')
         .replace(/\\mathrm\{([^{}]*)\}/g, '$1');
    t = strukturen(t);
    t = t.replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>')
         .replace(/\^(-?[0-9A-Za-z])/g, '<sup>$1</sup>')
         .replace(/_\{([^{}]*)\}/g, '<sub>$1</sub>')
         .replace(/_(-?[0-9A-Za-z])/g, '<sub>$1</sub>');
    t = t.replace(/\{,\}/g, ',').replace(/\\,/g, ' ').replace(/\\;/g, ' ')
         .replace(/\\ /g, ' ').replace(/[{}]/g, '')
         .replace(new RegExp(AUF, 'g'), '{').replace(new RegExp(ZU, 'g'), '}');
    return t;
  }

  function mathNotfall(){
    if (window.MathJax && window.MathJax.typesetPromise) return;  /* MathJax ist da */
    var lauf = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){
        var tag = n.parentNode && n.parentNode.nodeName;
        if (tag === 'SCRIPT' || tag === 'STYLE') return NodeFilter.FILTER_REJECT;
        return n.nodeValue.indexOf('\\(') > -1 ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
      }
    });
    var treffer = [], n;
    while ((n = lauf.nextNode())) treffer.push(n);
    treffer.forEach(function(k){
      var teile = k.nodeValue.split(/\\\(([\s\S]+?)\\\)/);
      if (teile.length < 2) return;
      var html = '';
      for (var i = 0; i < teile.length; i++){
        html += (i % 2)
          ? '<span class="tex-ersatz">' + texHtml(teile[i]) + '</span>'
          : teile[i].replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      var huelle = document.createElement('span');
      huelle.innerHTML = html;
      var frag = document.createDocumentFragment();
      while (huelle.firstChild) frag.appendChild(huelle.firstChild);
      k.parentNode.replaceChild(frag, k);
    });
  }
  window.addEventListener('load', function(){ setTimeout(mathNotfall, 3500); });
})();

<script>
(function(){
  /* Empfänger – nur hier ändern */
  var FB_NAME = 'aszymczak', FB_DOMAIN = 'my-mcg.de';
  var START = 'https://szymczak75.github.io/Schule/dino_hub.html';

  /* Fach der Seite → Startseite öffnet zuerst diesen Reiter */
  var FAECHER = ['mathe', 'bio', 'kompass'];
  var mf = document.querySelector('meta[name="fach"]');
  var fach = mf ? (mf.getAttribute('content') || '').trim().toLowerCase() : '';
  if (FAECHER.indexOf(fach) < 0) {
    var teile = location.pathname.split('/');
    fach = '';
    for (var i = 0; i < teile.length; i++) {
      var t = teile[i].toLowerCase();
      if (FAECHER.indexOf(t) >= 0) { fach = t; break; }
    }
  }
  var startUrl = fach ? START + '?start=' + fach : START;
  var heim = document.querySelectorAll('.dino-home, .dino-nav-start');
  for (var j = 0; j < heim.length; j++) heim[j].href = startUrl;

  /* 📚 Alles für … */
  var m = document.querySelector('meta[name="klasse"]');
  var k = m ? (m.getAttribute('content') || '').trim() : '';
  var a = document.getElementById('dino-nav-klasse');
  if (k && a) {
    a.href = START + '?klasse=' + encodeURIComponent(k) + (fach ? '&start=' + fach : '');
    var name = /^\d+$/.test(k) ? 'Klasse ' + parseInt(k, 10) : 'die ' + k.replace('_', '/');
    a.textContent = '📚 Alles für ' + name;
    a.hidden = false;
  }

  /* 📱 QR-Code dieser Seite – eigener Encoder (Byte-Modus, Fehlerkorrektur M),
     keine Bibliothek, kein fremder Dienst. Aufbau nach ISO/IEC 18004. */
  function dinoQr(text){
    var ECC = [0,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
    var BLK = [0,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
    var daten = [], i, j, v;
    var u = unescape(encodeURIComponent(text));                     // UTF-8-Bytes
    for (i = 0; i < u.length; i++) daten.push(u.charCodeAt(i));
    function roh(v){ var r = (16*v + 128)*v + 64;
      if (v >= 2){ var n = Math.floor(v/7) + 2; r -= (25*n - 10)*n - 55; if (v >= 7) r -= 36; } return r; }
    function nutz(v){ return Math.floor(roh(v)/8) - ECC[v]*BLK[v]; }
    for (v = 1; v <= 40; v++) if (4 + (v < 10 ? 8 : 16) + 8*daten.length <= nutz(v)*8) break;
    if (v > 40) return null;
    // Bitstrom
    var bits = [];
    function put(w, n){ for (var k = n - 1; k >= 0; k--) bits.push((w >>> k) & 1); }
    put(4, 4); put(daten.length, v < 10 ? 8 : 16);
    daten.forEach(function(b){ put(b, 8); });
    var kap = nutz(v)*8;
    put(0, Math.min(4, kap - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    for (var pad = 0xEC; bits.length < kap; pad ^= 0xEC ^ 0x11) put(pad, 8);
    var cw = [];
    for (i = 0; i < bits.length; i += 8){ var b = 0; for (j = 0; j < 8; j++) b = (b << 1) | bits[i+j]; cw.push(b); }
    // Reed-Solomon
    function mul(x, y){ var z = 0; for (var k = 7; k >= 0; k--){ z = (z << 1) ^ ((z >>> 7)*0x11D); z ^= ((y >>> k) & 1)*x; } return z; }
    var grad = ECC[v], div = [], wurzel = 1;
    for (i = 0; i < grad - 1; i++) div.push(0); div.push(1);
    for (i = 0; i < grad; i++){
      for (j = 0; j < grad; j++){ div[j] = mul(div[j], wurzel); if (j + 1 < grad) div[j] ^= div[j+1]; }
      wurzel = mul(wurzel, 2);
    }
    function rest(d){ var r = div.map(function(){ return 0; });
      d.forEach(function(b){ var f = b ^ r.shift(); r.push(0); div.forEach(function(c, k){ r[k] ^= mul(c, f); }); });
      return r; }
    var nb = BLK[v], rohCw = Math.floor(roh(v)/8), kurz = nb - rohCw % nb, kl = Math.floor(rohCw/nb), bloecke = [], pos = 0;
    for (i = 0; i < nb; i++){
      var d = cw.slice(pos, pos + kl - grad + (i < kurz ? 0 : 1)); pos += d.length;
      var e = rest(d); if (i < kurz) d.push(0); bloecke.push(d.concat(e));
    }
    var folge = [];
    for (i = 0; i < bloecke[0].length; i++)
      for (j = 0; j < nb; j++) if (i !== kl - grad || j >= kurz) folge.push(bloecke[j][i]);
    // Matrix
    var n = 4*v + 17, M = [], F = [];
    for (i = 0; i < n; i++){ M.push([]); F.push([]); for (j = 0; j < n; j++){ M[i].push(false); F[i].push(false); } }
    function setz(x, y, d){ M[y][x] = d; F[y][x] = true; }
    for (i = 0; i < n; i++){ setz(6, i, i % 2 === 0); setz(i, 6, i % 2 === 0); }
    [[3,3],[n-4,3],[3,n-4]].forEach(function(p){
      for (var dy = -4; dy <= 4; dy++) for (var dx = -4; dx <= 4; dx++){
        var x = p[0]+dx, y = p[1]+dy, dist = Math.max(Math.abs(dx), Math.abs(dy));
        if (x >= 0 && x < n && y >= 0 && y < n) setz(x, y, dist !== 2 && dist !== 4);
      }
    });
    var ap = [];
    if (v > 1){
      var na = Math.floor(v/7) + 2, schritt = v === 32 ? 26 : Math.ceil((4*v + 4)/(2*na - 2))*2;
      ap = [6]; for (var p2 = n - 7; ap.length < na; p2 -= schritt) ap.splice(1, 0, p2);
    }
    ap.forEach(function(ax, ia){ ap.forEach(function(ay, ib){
      var letzt = ap.length - 1;
      if ((ia === 0 && ib === 0) || (ia === 0 && ib === letzt) || (ia === letzt && ib === 0)) return;
      for (var dy = -2; dy <= 2; dy++) for (var dx = -2; dx <= 2; dx++)
        setz(ax+dx, ay+dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }); });
    function format(maske){
      var dat = maske, r = dat;                                    // Stufe M = 00
      for (var k = 0; k < 10; k++) r = (r << 1) ^ ((r >>> 9)*0x537);
      var fb = ((dat << 10) | r) ^ 0x5412;
      function bit(k){ return ((fb >>> k) & 1) !== 0; }
      for (k = 0; k <= 5; k++) setz(8, k, bit(k));
      setz(8, 7, bit(6)); setz(8, 8, bit(7)); setz(7, 8, bit(8));
      for (k = 9; k < 15; k++) setz(14 - k, 8, bit(k));
      for (k = 0; k < 8; k++) setz(n - 1 - k, 8, bit(k));
      for (k = 8; k < 15; k++) setz(8, n - 15 + k, bit(k));
      setz(8, n - 8, true);
    }
    format(0);
    if (v >= 7){
      var r = v;
      for (i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11)*0x1F25);
      var vb = (v << 12) | r;
      for (i = 0; i < 18; i++){
        var bt = ((vb >>> i) & 1) !== 0, a = n - 11 + i % 3, bb = Math.floor(i/3);
        setz(a, bb, bt); setz(bb, a, bt);
      }
    }
    var z = 0;
    for (var rechts = n - 1; rechts >= 1; rechts -= 2){
      if (rechts === 6) rechts = 5;
      for (var vert = 0; vert < n; vert++) for (j = 0; j < 2; j++){
        var x = rechts - j, hoch = ((rechts + 1) & 2) === 0, y = hoch ? n - 1 - vert : vert;
        if (!F[y][x] && z < folge.length*8){ M[y][x] = ((folge[z >>> 3] >>> (7 - (z & 7))) & 1) !== 0; z++; }
      }
    }
    function maskiere(m){
      for (var y = 0; y < n; y++) for (var x = 0; x < n; x++){
        if (F[y][x]) continue;
        var t;
        switch (m){
          case 0: t = (x + y) % 2 === 0; break;
          case 1: t = y % 2 === 0; break;
          case 2: t = x % 3 === 0; break;
          case 3: t = (x + y) % 3 === 0; break;
          case 4: t = (Math.floor(x/3) + Math.floor(y/2)) % 2 === 0; break;
          case 5: t = x*y % 2 + x*y % 3 === 0; break;
          case 6: t = (x*y % 2 + x*y % 3) % 2 === 0; break;
          default: t = ((x + y) % 2 + x*y % 3) % 2 === 0;
        }
        if (t) M[y][x] = !M[y][x];
      }
    }
    function strafe(){
      var s = 0, dunkel = 0, x, y, k;
      function zeile(get){
        var lauf = 1;
        for (k = 1; k <= n; k++){
          if (k < n && get(k) === get(k-1)) lauf++;
          else { if (lauf >= 5) s += lauf - 2; lauf = 1; }
        }
        for (k = 0; k + 7 <= n; k++){
          if (get(k) && !get(k+1) && get(k+2) && get(k+3) && get(k+4) && !get(k+5) && get(k+6)){
            var vor = true, nach = true;
            for (var q = 1; q <= 4; q++){ if (k - q >= 0 && get(k - q)) vor = false; if (k + 6 + q < n && get(k + 6 + q)) nach = false; }
            if (vor || nach) s += 40;
          }
        }
      }
      for (y = 0; y < n; y++) zeile(function(k){ return M[y][k]; });
      for (x = 0; x < n; x++) zeile(function(k){ return M[k][x]; });
      for (y = 0; y < n - 1; y++) for (x = 0; x < n - 1; x++)
        if (M[y][x] === M[y][x+1] && M[y][x] === M[y+1][x] && M[y][x] === M[y+1][x+1]) s += 3;
      for (y = 0; y < n; y++) for (x = 0; x < n; x++) if (M[y][x]) dunkel++;
      s += Math.floor(Math.abs(dunkel*20 - n*n*10) / (n*n)) * 10;
      return s;
    }
    var beste = 0, min = Infinity;
    for (var m = 0; m < 8; m++){
      maskiere(m); format(m); var st = strafe();
      if (st < min){ min = st; beste = m; }
      maskiere(m);
    }
    maskiere(beste); format(beste);
    var pfad = '';
    for (var yy = 0; yy < n; yy++) for (var xx = 0; xx < n; xx++)
      if (M[yy][xx]) pfad += 'M' + (xx + 4) + ' ' + (yy + 4) + 'h1v1h-1z';
    return '<svg viewBox="0 0 ' + (n + 8) + ' ' + (n + 8) + '" role="img" aria-label="QR-Code mit der Adresse dieser Seite" shape-rendering="crispEdges">' +
           '<rect width="100%" height="100%" fill="#fff"/><path d="' + pfad + '" fill="#22303f"/></svg>';
  }

  var qrKnopf = document.getElementById('dino-qr');
  var qrFenster = document.getElementById('dino-qrfenster');
  if (qrKnopf && qrFenster) {
    var qrFertig = false;
    qrKnopf.addEventListener('click', function(){
      if (!qrFertig) {
        var ziel = location.href.split('#')[0];
        var svg = null;
        try { svg = dinoQr(ziel); } catch (e) {}
        document.getElementById('dino-qr-bild').innerHTML = svg || '<p>Adresse zu lang für einen QR-Code.</p>';
        document.getElementById('dino-qr-titel').textContent =
          (document.title || '').trim() || location.pathname.split('/').pop();
        document.getElementById('dino-qr-adresse').textContent = ziel;
        qrFertig = true;
      }
      if (typeof qrFenster.showModal === 'function') qrFenster.showModal(); else qrFenster.setAttribute('open', '');
    });
    qrFenster.addEventListener('click', function(){
      if (typeof qrFenster.close === 'function') qrFenster.close(); else qrFenster.removeAttribute('open');
    });
  }

  /* ✉️ Feedback */
  var dlg = document.getElementById('dino-fb');
  var fbBtn = document.getElementById('dino-nav-fb');
  if (!dlg || !fbBtn) return;
  var adresse = FB_NAME + '@' + FB_DOMAIN;
  var titel = (document.title || '').trim() || location.pathname.split('/').pop();
  var url = location.href.split('#')[0];
  var text = document.getElementById('dino-fb-text');
  var meldung = document.getElementById('dino-fb-meldung');
  document.getElementById('dino-fb-seite').textContent = titel;
  document.getElementById('dino-fb-adresse').textContent = adresse;

  function art(){
    var r = dlg.querySelector('input[name="dino-fb-art"]:checked');
    return r ? r.value : 'Feedback';
  }
  function betreff(){ return '[Dino-Feedback] ' + art() + ': ' + titel; }
  function inhalt(){
    return 'Seite: ' + titel + '\nAdresse: ' + url + '\nArt: ' + art() +
           '\n\n' + text.value.trim() + '\n';
  }
  function melde(t, ok){ meldung.textContent = t; meldung.className = 'dino-fb-meldung ' + (ok ? 'ok' : 'nok'); }
  function leer(){
    if (text.value.trim()) return false;
    melde('Bitte schreib zuerst etwas in das Feld.', false);
    text.focus();
    return true;
  }

  fbBtn.addEventListener('click', function(){
    melde('', true);
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    text.focus();
  });
  document.getElementById('dino-fb-zu').addEventListener('click', function(){
    if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open');
  });
  document.getElementById('dino-fb-senden').addEventListener('click', function(){
    if (leer()) return;
    location.href = 'mailto:' + adresse + '?subject=' + encodeURIComponent(betreff()) +
                    '&body=' + encodeURIComponent(inhalt());
    melde('Das Mailprogramm öffnet sich. Danke! 🦖', true);
  });
  document.getElementById('dino-fb-kopieren').addEventListener('click', function(){
    if (leer()) return;
    var ganz = 'Betreff: ' + betreff() + '\n' + inhalt();
    function ersatz(){
      var t = document.createElement('textarea');
      t.value = ganz; document.body.appendChild(t); t.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(t);
      melde(ok ? 'Kopiert! Jetzt in eine Mail einfügen.' : 'Kopieren ging nicht – bitte Text markieren und kopieren.', ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ganz).then(function(){
        melde('Kopiert! Jetzt in eine Mail einfügen.', true);
      }, ersatz);
    } else ersatz();
  });
})();
